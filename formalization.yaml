    4d. WHOLE-NET FLOAT BRIDGES DO NOT NAME THEIR FLOAT MAP (disclosed
       2026-09-02, audit). `FloatBridges f := forall A, 0 <= A -> exists B L fF,
       0 <= B /\ FloatClose A B f fF L` existentially binds `fF` -- the float
       implementation -- not just the `B`/`L` bookkeeping its docstring says it
       drops. So `FloatBridges f` is provable for ANY `f` bounded on input boxes
       by taking `fF := f` and the constant modulus `2B`: no FloatModel, no unit
       roundoff, 3-axiom clean. The leaf lemmas (`floatClose_flatConv`,
       `dense_close_mixed`, ...) are honest -- they conclude in `FloatClose`
       with an explicit `fF` -- but the ~134 `FloatBridges` conclusions,
       including every whole-net capstone (r34_floatBridges,
       mnv2Forward_floatBridges, convnext{,Ch}_floatBridges, vit_floatBridges,
       r34_grad_floatBridges), state strictly less than their docstrings claim
       ("the deployed float forward ... within an explicit budget"): neither the
       deployed map nor any budget survives the existential. `FloatBridgesTo f fF`
       keeps the map and composes it; `toFloatBridges` weakens back, so migration is
       incremental. MIGRATED (9 of 11 whole-net bridges, each with a named float
       skeleton -- r34ForwardF / r34InputGradF / mnv2ForwardF / mnv2InputGradF /
       convnextForwardF / convnextInputGradF / vitForwardFlatF / vitGradFlatF /
       efficientnetInputGradBF): both r34, both mnv2, both convnext (skeleton),
       both vit, both efficientnet (its FORWARD needed the whole 11-bridge layered
       cone migrated first -- stemBF / cbsBF / dwbsBF / dwbsSBF / seBF / projBF and
       the four block peers -- because unlike every other whole-net theorem it
       derives its block bridges from leaf data rather than taking them as
       hypotheses), and both convnextCh (the SHIPPED ConvNeXt-T at its real channel
       LayerNorm), whose cone -- chanLNTensor3F / layerNormVecF / rowLNVecFlatF /
       cnxBodyWithF / cnxBlockChWF / convNextStageChKF / cnxDownChWF and the backward
       chanLNTensor3BackF / rowLNVecFlatBackF -- is migrated with it. That is all
       TWELVE whole-net bridges. The legacy FloatBridges statements remain (derivable
       via toFloatBridges); nothing downstream broke.

       ⚠ The same existential-float-map defect was ALSO found one tier down, in the
       `floatClose_*` layer this entry had called clean: `floatClose_seGate` and
       `floatClose_seBlockFull` conclude `exists B L gF, FloatClose A B f gF L`,
       hiding the float map rather than only the B/L bookkeeping. Those are the only
       two (`FloatComposeBridge`'s two `exists B L` lemmas write their float map out
       explicitly, which was taken to be enough -- it is not, see the next entry).
       Both now have named peers -- `floatClose_seGateF` /
       `floatClose_seBlockFullF` over `seGateF` / `seBlockFullF` -- which is what
       unblocked the EfficientNet forward.

       ⚠⚠ THE SAME DEFECT SURVIVES ONE BINDER OVER (2026-09-02, audit).
       `FloatBridgesTo f fF := forall A, 0 <= A -> exists B L, 0 <= B /\
       FloatClose A B f fF L` names the map but still closes the MODULUS `L`
       existentially, and an unconstrained modulus is discharged by the triangle
       inequality from the magnitude clause alone: take `L := fun _ => 2*B`, then
       `|fF vt i - f va i| <= |fF vt i| + |f va i| <= 2*B`. So `FloatBridgesTo f fF`
       holds for ANY pair bounded on boxes -- `FloatBridgesTo (relu n) (fun _ _ => 0)`
       and `FloatBridgesTo (dense W b) (fun _ _ => 0)` are theorems, 3-axiom clean,
       with no FloatModel in sight; it is falsified only by an UNBOUNDED float map.
       Every `*_floatBridgesTo` conclusion listed above, and every `FloatBridgesTo`
       hypothesis the whole-net theorems take, is therefore a boundedness statement,
       and the "explicit budget" sentence in their docstrings is not carried by the
       statement (the proof terms do fold real per-op moduli, but a theorem is its
       statement). The `exists B L, FloatClose` lemmas (`floatClose_seGateF` /
       `floatClose_seBlockFullF`, and the older `floatClose_cifarStage` /
       `floatClose_resBlock`) have the same hole at fixed `A`. The fix is not a
       predicate that rejects degenerate maps -- `2B` is always a valid modulus --
       but one whose modulus is VISIBLE, so that its value is a claim: a Type-valued
       bridge carrying `mag`/`mod` fields, the whole-net bridges as defs, and the
       budget stated as a bound on `.mod`.

       ✅ FIXED (2026-09-02): `FloatBridgesTo f fF` is now a Type-valued STRUCTURE
       with `mag : R -> R` (input window -> output window), `mod : R -> R -> R`
       (input window -> error modulus) and
       `close : forall A, 0 <= A -> 0 <= mag A /\ FloatClose A (mag A) f fF (mod A)`.
       Every combinator composes the bookkeeping explicitly (`comp`: `mag_g ∘ mag_f`
       and `mod_g (mag_f A) ∘ mod_f A`; `residual`, `reluResidual`, `seScale`,
       `perRow`, `batchMap`, and the `FloatBridgesToList` tower fold), every leaf
       writes its `mag`/`mod` out (`floatBridgesTo_flatConv`: `layerAct +
       layerBudget(0)` / `layerBudget` at the receptive-field fan-in, ...), and the
       twelve whole-net bridges are `noncomputable def`s whose `.mod A e` is a closed
       term over the per-op budgets. `FloatBridgesTo.fresh_le` states the fresh
       budget as a bound on the deployed map: `|fF v i - f v i| <= b.fresh A` on the
       window. The `2B` witness is still constructible -- nothing can prevent that --
       but its `.mod` is visibly `2B`, and a numeric bound on a whole-net `.mod` is
       now a statement the kernel checks rather than one the proof term hides. The
       `exists B L` lemmas (`floatClose_seGateF` / `floatClose_seBlockFullF`) are kept
       as shadows of `floatBridgesTo_seGate` / `floatBridgesTo_seBlockFull`, and the
       older `floatClose_cifarStage` / `floatClose_resBlock` gained bridge peers
       `floatBridgesTo_cifarStage` / `floatBridgesTo_resBlock`.
       `FloatBridgesTo.toFloatBridges` still weakens to the legacy Prop, so nothing
       downstream broke.

