    prior_work: ""                         # radius + the Gaussian Neyman-Pearson core formalized end-to-end (SmoothingGaussian.lean)
  - title: "Efficient and Accurate Estimation of Lipschitz Constants for Deep Neural Networks (LipSDP)"
    authors: ["Mahyar Fazlyab", "Alexander Robey", "Hamed Hassani", "Manfred Morari", "George J. Pappas"]
    id: "arXiv:1906.04893"                 # NeurIPS 2019
    type: "paper"
    license: ""
    author_contacted: "no"
