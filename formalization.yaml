version: "v0.4"

project:
  name: "Verified Deep Learning with Lean 4"
  description: >-
    Backward-pass (vector-Jacobian product) correctness for the layer primitives of ten
    neural-network architectures, from an MLP to ResNet-50, EfficientNet-B0, ConvNeXt-T and
    ViT-Tiny, proved against Mathlib's Frechet derivative and composed into whole-network
    VJPs. On top of that: the batched training step of each ImageNet-scale net tied to the
    backward it runs, a binary32 rounding model with per-operator float closeness, three
    robustness certificates (Lipschitz margin, LipSDP, randomized smoothing) and the
    optimizer-as-steepest-descent ladder.
  authors: ["Brett Koonce (github brettkoonce, ORCID 0009-0001-1381-1705)"]
  responsible_maintainers: ["Brett Koonce (github brettkoonce, ORCID 0009-0001-1381-1705)"]
  license: "BSD-3-Clause"

