automation:
  methods:
    - method: "agent"
      models: ["Qwen3+", "Opus 4.6+"]
      framework: "OpenCode + Claude Code"
      tool_setup: >-
        Lean 4 + Lake + Mathlib for the proofs; an independent kernel re-check via
        leanprover/comparator with the nanoda kernel; IREE for StableHLO->binary
        compilation; a parallel JAX (Lean->Python codegen) pipeline for empirical
        cross-checking on GPU/CPU. The audit report (tests/AUDIT_REPORT*.md) and
        mutation tests were themselves agent-assisted.
      cost:
        wall_time: ""        # not precisely tracked; project developed over months
        spend_usd: ""        # not tracked
        hardware: "three GPU workstations for training + codegen validation across both vendor stacks -- 4x RTX 4060 Ti and 4x RTX 3060 (NVIDIA/CUDA), 2x Radeon RX 7900 XTX (AMD/ROCm, gfx1100); API for proof work"
      prompting_notes: >-
        Mixed interactive + agentic. Proof development, codegen, the audit, and
        the empirical training runs were all done with AI assistance.
  spend_usd: ""              # not tracked
  notes: >-
    Heavily AI-assisted throughout -- proof authoring, MLIR/JAX codegen, the
    self-audit, and training. Not an unattended autonomous run; the author
    drove and reviewed the work.

fidelity:
  divergences: |
    The proved theorems form tiers; not everything the prose/abstract describes
    is a theorem. Stated plainly:

    1. STRONGEST -- layer VJP correctness. The per-layer backward formulas
       (dense, conv, batch-norm, layer-norm, softmax-CE, attention/MHSA, GELU,
       etc.) are derived from Mathlib's `fderiv` and machine-checked. These are
       the core results and are the bulk of the 52 comparator-rechecked theorems.

    2. CODEGEN TRUST BOUNDARY (disclosed gap). The canonical backward is the
       `fderiv`/`pdiv` expression, which at NON-smooth points (a ReLU input
       exactly 0, a pooling argmax tie) returns Mathlib's junk default of 0,
       whereas the emitted codegen uses the standard subgradient/argmax
       convention (`if x>0 then dy else 0`, select-and-scatter). They agree only
       at smooth points. This is documented in LeanMlir/Proofs/README.md
       ("Codegen trust boundary"); smooth-point bridge theorems were added
       (`relu_codegen_matches_canonical`, `maxPool2_codegen_matches_canonical`).

    3. SMOOTH-INPUT CONDITIONING. The global instances `relu_has_vjp`,
       `mlp_has_vjp`, `maxPool2_has_vjp3` define `backward` as the pdiv-sum RHS
       and close `correct` by `rfl` -- codegen-shaped witnesses whose formal
       content is the pdiv expression (which fully characterizes backprop only at
       smooth points). The earlier limitation (global composition needing
       `Differentiable R f`, which blocked ReLU-containing chains) has since been
       addressed: a pointwise `HasVJPAt` API with `vjp_comp_at` (Tensor.lean) plus
       `relu_has_vjp_at` / `mlp_has_vjp_at` (MLP.lean) give real chain-rule proofs
       -- no rfl escape -- under an explicit smooth-input hypothesis
       (`forall k, preact k != 0`, i.e. no ReLU kink / no pooling tie). The residual
       honest caveat is therefore that the strongest backprop-correctness results
       are conditioned on smooth inputs; the measure-zero non-smooth points are
       the disclosed codegen trust boundary of (2).

    4. FULL-NET RESULTS are "the network composes and has a VJP at a witness
       point". To rule out a vacuous (e.g. all-zero-weight) witness, separate
       non-degeneracy proofs exist, now at the strongest level for both deep
       kinked nets: `Mnv2Live` and the 2-channel live ResNet-34
       `ResNet34LivePC.liveFwd2` each prove a non-constant forward
       (`*_nonconstant`, level 2) AND a nonzero whole-net Jacobian at a witness
       point (`Mnv2Live.mnv2Live_jacobian_nonzero`,
       `ResNet34LiveSeal.liveFwd2_jacobian_nonzero`, level 3) -- so the rendered
       backward is genuinely not the zero map there. All audited 3-axiom-clean.
       The ResNet witness is also carried to the real `[3,4,6,3]` (16-block)
       depth (`ResNet34LiveFull.liveFwd2Full_jacobian_nonzero` /
       `liveFwd2Full_backward_nontrivial`, level 3), and BOTH nets are sealed at
       the realistic 224x224 input geometry (ResNet via weight-independent
       beta-positivity, MobileNetV2 via gamma-scaling into the ReLU6 window).
       Beyond synthetic witnesses, TRAINED-weight results exist: whole-net VJP
       witnesses + level-3 Jacobian seals at real trained checkpoints and real
       test inputs for the MLP and CNN rungs (TrainedMlpWitness,
       TrainedCnnWitness/TrainedCnnSeal), and a provable strict CE-descent step
       at trained weights (TrainedLinearDescent). A BN-CNN live witness remains
       the last follow-up.

    4b. CERTIFICATE-LAYER CONDITIONING (disclosed hypotheses, all in-statement):
       the smoothing radius theorems require class probabilities in the OPEN
       interval (0,1) (`hp` -- the true quantile is undefined at the endpoints;
       Monte-Carlo estimates always satisfy it), and the theorems speak about
       TRUE smoothed probabilities while the reporting driver uses
       Clopper-Pearson ESTIMATES -- that estimation gap is not formalized. The
       adjoint-chain float bounds use a per-op Higham model; the balanced-tree
       reduction refinement carries an explicit (quarantined) order-balanced
       hypothesis. The LipSDP scorecards certify a FIXED 100-image subset at a
       FIXED epsilon -- an honest lower bound, not a dataset-wide claim.

    4c. THE ADJOINT-CHAIN TIER IS NOT BITING (disclosed 2026-09-02, audit).
       `chain_adjointClose` / `chain_argmaxSafe` (AdjointChainBridge.lean) are
       correct depth-generic theorems. Their first form could not be instantiated
       at any committed net: `LayerCert m A` carried ONE window that every layer
       had to map into itself, which forces `m*w' <= 1`, while the committed
       cifar8Verified profile runs 24..114; its `hfit` binder was discharged
       nowhere and `cifar8_chain_argmaxSafe` had no CIFAR-8 referent. FIXED:
       `AdjointChainBridgeHet.lean` indexes the chain by (dimension, window) per
       layer, and `Cifar8ChainCert.cifar8ChainH` is the committed cifar8Verified
       layer list op for op, tied by rfl (`cifar8ChainH_chainRH_eq`) to
       `cifarCnn8Forward`, the def `StableHLO.cifar8FwdGraph_faithful` certifies
       the emitted graph denotes; `cifar8_chain_cert_committed` restates the
       certificate on it. Writing that tie caught a real error (the chain's dense
       head had three bare denses where the committed layers interleave relu).
       NOT BITING: the v2 certificate is correct but its budget takes each stage
       at its WORST-CASE propagated window, which at He magnitudes (w' = 0.39,
       beta = 0.01, A = 1) grows 1 -> 10.5 -> 592 -> ... -> 4.6e18, so
       `chainBudgetH >= 1.8e13` against logits of ~10 and `hmargin` is satisfiable
       there only at u = 0 or for contracting weights (m*w' <~ 1). The
       "chainBudget ~ 2.6" of scripts/adjoint_chain_probe.py is the same formula
       with each stage at its MEASURED activation magnitude, which no
       instantiation of the theorem can supply (`LayerCertH.window` must hold on
       the whole box). scripts/adjoint_chain_ibp_probe.py measured the sound
       routes: even an exact tail gain leaves the propagated budget ~1.2e6x above
       the true drift, so the looseness is `layerBudget` at worst-case windows,
       not the tail gains. `TailGainsH` has no proven discharge at heterogeneous
       dimensions (`tailGains_suffixProd` is uniform-dim only), so every v2 `hH`
       in the repo is supplied by measurement. What v2 adds is the committed
       SHAPE and the rfl tie, not a certificate that bites at trained weights.

    4d. WHOLE-NET FLOAT BUDGETS (disclosed 2026-09-02; thread closed 2026-09-05).
       The standing reference is planning/float_budget_numbers.md; the working
       record with every ablation is planning/archive/float_budget_numbers_log.md.

       THE DEFECT THAT STARTED IT. `FloatBridges f := forall A, 0 <= A -> exists
       B L fF, 0 <= B /\ FloatClose A B f fF L` bound the float implementation
       `fF` existentially, so it was provable for ANY `f` bounded on boxes by
       taking `fF := f` and the constant modulus `2B` -- no FloatModel, no unit
       roundoff, 3-axiom clean. The ~134 FloatBridges conclusions, every
       whole-net capstone included, therefore stated only boundedness while their
       docstrings claimed "the deployed float forward within an explicit budget".
       The first repair, `FloatBridgesTo f fF`, named the map but still bound the
       modulus `L` existentially, and an unconstrained modulus is discharged by
       the triangle inequality from the magnitude clause alone
       (`FloatBridgesTo (relu n) (fun _ _ => 0)` was a 3-axiom-clean theorem).
       Both are FIXED: `FloatBridgesTo f fF` is a Type-valued structure with
       `mag : R -> R` (input window -> output window), `mod : R -> R -> R` (input
       window, inherited error -> error modulus) and `close : forall A, 0 <= A ->
       0 <= mag A /\ FloatClose A (mag A) f fF (mod A)`; every combinator composes
       the bookkeeping explicitly; the thirteen whole-net bridges are noncomputable
       defs whose `.mod` is a closed term over the per-op budgets; and a numeric
       bound on a whole-net `.mod` is a statement the kernel checks. The `2B`
       witness is still constructible, but its `.mod` is visibly `2B`. The legacy
       FloatBridges statements remain (derivable via `toFloatBridges`) and
       constrain no float implementation; do not cite them as budgets.

       THE NUMBERS. Each is a theorem closed over the real leaves (no bridge
       hypothesis left), tied to the committed net by rfl and, for the forwards,
       to the rendered graph by the `*_faithful` theorems -- with no exceptions
       left: the two paper nets' eval twins (MobileNetV2FullPaperEval.lean,
       EfficientNetFullB0Eval.lean) were built in the same session so that their
       numbers end at a typed graph rather than at a block-by-block rfl. Every numeral is
       generated in the leaves' own exact-rational arithmetic and re-asserted by
       scripts/float_budget_envelope.py before the kernel checks it. Window =
       certified output magnitude; budget = |float - real| per logit (forwards) or
       per input pixel (backwards, on loss cotangents of magnitude <= 1); unit
       input box; a per-parameter-kind profile measured on the trained checkpoint;
       eps >= 1e-5; u <= 2^-24.

           CIFAR-8 forward                       6.37e14   / 6.121e18   fold   cifar8_float_logits_le
           ResNet-34 forward, inference BN       1.548e209 / 3.152e211  fold   r34_float_logits_le
           ResNet-34 forward, training BN        1.752e81  / 8.748e80   CAP    r34_train_float_logits_le  (per example)
           MobileNetV2 forward, inference BN     1.444e96  / 2.154e3    fold   mnv2_float_logits_le
           MobileNetV2 forward, 17-block paper   8.176e16  / 2.152e4    CAP    mnv2Paper_float_logits_le  (52 BN sites, all capped; any class count)
           EfficientNet-B0 forward, inference BN 8.408e210 / 2.580e55   fold   b0_float_logits_le         (any batch size)
           EfficientNet-B0 forward, 16-block paper 2.416e287 / 1.886e279 CAP    b0Full_float_logits_le     (16 SE sigmoids capped; the window is honest; tied to the eval graph)
           ConvNeXt-T forward                    9.738e130 / 4.871e130  CAP    cnx_float_logits_le
           ViT-Tiny forward                      4.794e108 / 2.397e108  CAP    vit_float_logits_le
           ResNet-34 backward, training BN       6.894e244 / 8.857e245  fold   r34_grad_float_le          (|istd| <= 16)
           MobileNetV2 backward, training BN     1.076e152 / 4.750e153  fold   mnv2_grad_float_le
           ConvNeXt-T backward                   1.563e250 / 1.023e251  fold   cnx_grad_float_le          (|istd| <= 16)
           EfficientNet-B0 backward, training BN 1.578e182 / 7.104e182  fold   b0_grad_float_le           (batch size 1)

       WHAT KIND OF STATEMENT EACH IS. A "fold" is the interval fold of the
       per-op rounding moduli: the rounding error composes to the budget. A "CAP"
       goes through `FloatBridgesTo.capped`, whose modulus is `min(mod, 2*mag)`,
       and the `2*mag` branch is what closes at every normalisation site, so it
       states only that the float and the real output both lie in the certified
       window -- the triangle inequality; budget/window = 2.00 is the tell, and a
       cap must never be tabled beside a fold without the label. Read the tell
       carefully on the 17-block MobileNetV2 forward: it caps at every BatchNorm
       and then runs three more stages (relu6, GAP, the classifier) which collapse
       the window and carry the error forward, so its ratio is 3.8e12 and the
       label has to be read off the file rather than off the ratio; and on the
       16-block EfficientNet-B0 forward, which caps only the SIGMOID of each of
       its sixteen squeeze-excite gates (the one stage whose window is a constant,
       1 + esig) and folds everything else, so its ratio is 1.3e8 -- sixteen gate
       caps compounding as E -> 2A + 3E -- and its window is honest and uncapped.
       That number is also the first past 1e253: norm_num's "ceiling" is Lean's
       `exponentiation.threshold` option (default 256), not a wall, and the file
       raises it. The first
       three caps are caps because a normalisation that reduces its statistics out of its
       own input has a modulus QUADRATIC in the window (training-mode BatchNorm,
       LayerNorm; squeeze-excite likewise; attention exponentially), so the
       uncapped fold runs past what `norm_num` will evaluate (~1e253 for a nested
       tree) at the eps-floor, and where it exists at an operating point it is 80
       orders WORSE than the cap (ConvNeXt-T, measured). Inference BatchNorm
       freezes its statistics and is affine in x, which is why four forwards are
       folds. Every backward is a fold: a VJP is linear at a fixed point and
       reads its statistics off the saved activations, which the cotangent does
       not perturb. Two numbers carry a batch qualifier: B0's backward is at
       batch size 1 because `bnBatchLA` reduces across examples (2.880e194 at
       N = 256), and ResNet-34's training forward is per example for the same
       reason; the seven inference forwards hold at any batch size.

       WHAT IS SUPPLIED. Device kernels with no IEEE specification carry an
       accuracy hypothesis of 1e-2, quantified over any device at least that
       accurate: `rsqrt` on every BatchNorm net (DeviceRsqrt), sigmoid on B0
       (DeviceSigmoid), GELU on ConvNeXt and ViT (DeviceGelu), `exp` on ViT
       (DeviceExp, relative, with the softmax side condition `smRho u eexp 197 <
       1`). The device MEAN is derived rather than supplied:
       `FloatModel.bnMean_close_of` is parameterised by the reduction's forward
       error spec so any summation order qualifies, and `r34TrainBn_emr_committed`
       / `deviceLN_emr_committed` witness the committed numerals. The backwards
       additionally take the saved activations' accuracies (`es`, `exh`; B0 also
       `esav`) at 1e-2. NO FORWARD STATEMENT DISCHARGES THOSE: the inference
       forwards are about a different program, the training-mode forward is a cap
       and supplies only `2*window`, and LayerNorm has no mode in which a fold
       exists. So no forward-then-backward composition is claimed anywhere; each
       backward number is an honest fold of the backward kernel's rounding given
       saved-activation accuracies its own forward cannot supply.

       WHAT IS NOT CLAIMED. Numerical accuracy. The budgets are 1e80 to 1e251
       against logits of order 10. They are interval folds at worst-case windows
       through 30 or more layers and cannot be made to bite by more work of this
       kind: on ResNet-34 the conv fan-in face `m*w'` is 14 to 95 times loose
       per layer against the measured row-L1 norm, and even at that measured
       face the training forward would land at 1e19 (scripts/param_row_l1.py;
       priced and not taken). A bound that bites needs the on-trajectory
       Jacobian, which is 4c's MEASURED tier and not a static hypothesis. The one
       non-vacuous number is MobileNetV2's WINDOW, 2154, because relu6 clamps at
       6 whatever its input; its budget is still 1e96. What the numbers DO
       certify is the float program's shape: every stage present, at the right
       fan-in, in the right composition, at the right normalisation mode,
       kernel-checked; a dropped stage, a misread fan-in or a stale slot fails to
       compile.

