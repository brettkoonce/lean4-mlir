    - {declaration: "Proofs.Cifar8TieG.cifar8_net_lossGrad", file: "LeanMlir/Proofs/Nets/Small/Cifar8ParamGrad.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
