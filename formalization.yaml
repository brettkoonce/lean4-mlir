status:
  scope: >-
    Machine-checked vector-Jacobian-product (backward-pass) correctness for the layer
    primitives of ten architectures and their whole-network compositions -- MLP, 2D CNN,
    BatchNorm-CNN, ResNet-34, ResNet-50, MobileNetV2, MobileNetV4-Conv-M, EfficientNet-B0,
    ConvNeXt-T and ViT-Tiny. On top of the VJP layer: (1) TRAIN-STEP TIES -- for each of the
    seven ImageNet-scale nets, every parameter gradient node of the batched train step is tied
    to the cotangent the emitted backward chain delivers, at the un-fused gradient node every
    optimizer tail consumes and the label-smoothed loss at a general target, with the batch
    size a binder and the data-parallel mean an AST node (fidelity 5, 6); the SGD-inline
    steps of the ten nets that ship one are tied too. (2) FLOAT ERROR -- a binary32 rounding
    model constructed from scratch, per-operator and per-block float closeness (a magnitude
    window and an error modulus that compose), and every net's hand-written backward chain
    proven to BE the certified whole-net VJP (fidelity 7). (3) ROBUSTNESS CERTIFICATES as theorems: the Tsuzuku
    Lipschitz-margin radius, per-class-pair LipSDP at trained weights, the Cohen smoothing
    radius end to end. (4) OPTIMIZER GEOMETRY: SGD/sign/Muon as steepest descent under a norm,
    Shampoo = single-step Muon. The StableHLO codegen and the training runs are engineered and
    empirically validated, not theorems (fidelity 2, 10).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: &core ["propext", "Quot.sound", "Classical.choice"]   # Lean/mathlib core only; no project axioms
  main_results:
    # A REPRESENTATIVE set, one row per kind of claim. The full audit is tests/AuditAxioms.lean
    # (`#print axioms` on every declaration that says something, run in CI); 110 are
    # independently kernel-rechecked by the comparator, and that set covers every row below
    # (`comparator_config` names the file each one is checked in). Every row: 0 sorries, the
    # three core axioms. The float tier is fidelity 7.
    #
    # --- VJP layer ---
    # the chain rule for pdiv: composition, additive and multiplicative fan-in, finset sums
    - {declaration: "Proofs.pdiv_comp", file: "LeanMlir/Proofs/Foundation/Tensor.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config.json", literature_dependencies: []}
    # 2D convolution (the strided, depthwise and stride-4 forms are its siblings)
    - {declaration: "Proofs.conv2dHasVJP3_correct", file: "LeanMlir/Proofs/Architectures/CNN.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-arch.json", literature_dependencies: []}
    # batch-norm's three-term backward (layer-norm is the same lemma at one row)
    - {declaration: "Proofs.bn_input_grad_correct", file: "LeanMlir/Proofs/Architectures/BatchNorm.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    - {declaration: "Proofs.LinFoldB.lin_train_step_tiedB", file: "LeanMlir/Proofs/Nets/Small/LinearFoldB.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    - {declaration: "Proofs.MlpFoldB.mlp_train_step_tiedB", file: "LeanMlir/Proofs/Nets/Small/MlpFoldB.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    - {declaration: "Proofs.CnnFoldB.cnn_train_step_tiedB", file: "LeanMlir/Proofs/Nets/Small/CnnFoldB.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # softmax cross-entropy
    - {declaration: "Proofs.softmaxCE_grad", file: "LeanMlir/Proofs/Architectures/Softmax.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-arch.json", literature_dependencies: []}
    # multi-head self-attention
    - {declaration: "Proofs.mhsaHasVJPMat_correct", file: "LeanMlir/Proofs/Architectures/Attention.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-arch.json", literature_dependencies: []}
    # the pair tile (the structure demo's stem, two dense maps outer-summed): the Jacobian of the pair map in each weight, with K host planes appended
    - {declaration: "Proofs.PairTile.pdiv_tileWPair", file: "LeanMlir/Proofs/Foundation/PairTile.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    #
    # --- Whole nets: forward + VJP at the net the artifact runs (T1), the typed graph (T2) ---
    # a kinked net at batch BN: ResNet-50's [3,4,6,3] bottlenecks, 48 relu clauses, q a binder (224 and 160 px)
    - {declaration: "Proofs.resnet50ForwardBFullHasVJPAt_correct", file: "LeanMlir/Proofs/Nets/ResNet/ResNet50FullBVJP.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # a smooth net: ViT-Tiny at its real dimensions -- depth 12 with distinct per-block parameters, 3 heads, vector LayerNorm; the hand-written input gradient is the Jacobian at every input (0 < eps)
    - {declaration: "Proofs.vitTinyHasVJP_correct", file: "LeanMlir/Proofs/Nets/ViT/ViTWholeBackCertifiedTie.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # a typed SHlo graph at the render's own tokens denotes the whole-net forward (MobileNetV4, 26 stages, at either precision; every net has one)
    - {declaration: "Proofs.StableHLO.mnv4FwdGraphBFull_faithful", file: "LeanMlir/Proofs/Nets/MobileNet/MobileNetV4FullB.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # non-degeneracy: a non-constant forward and a nonzero whole-net Jacobian at a witness (fidelity 4)
    - {declaration: "Proofs.Mnv2FullBSeal.sealX_nonconstant", file: "LeanMlir/Proofs/Nets/MobileNet/MobileNetV2FullBSeal.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # the same on MobileNetV4-Conv-M at timm's mobilenetv4_conv_medium: 38 relu clauses, all weight-only
    - {declaration: "Proofs.Mnv4FullBSeal.sealX_backward_nontrivial", file: "LeanMlir/Proofs/Nets/MobileNet/MobileNetV4FullBSeal.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    #
    # --- Train-step ties (T3): the fold at every gradient node, then the cotangent pinned ---
    # the fold, stated per op kind at the un-fused *GradB node all optimizer tails consume (r34's file is the template)
    - {declaration: "Proofs.GradNodeB.convStridedWGradB_den", file: "LeanMlir/Proofs/Foundation/GradNodesB.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # the emitted six-op cotangent IS the label-smoothed loss's gradient at a general target (mixup/cutmix)
    - {declaration: "Proofs.smoothedCE_grad", file: "LeanMlir/Proofs/Foundation/SmoothedLossCot.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # a batched capstone: ResNet-50's 161 nodes at their chain cotangent; N, q, the LOSS (CE or BCE) and the precision (bf16) binders; one replica
    - {declaration: "Proofs.ResNet50TieB.r50_net_tiedB", file: "LeanMlir/Proofs/Nets/ResNet/ResNet50StepTieB.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # an SGD-inline capstone: ViT-Tiny's 200 parameters at the fused theta - lr*g ops (the family covers ten nets)
    - {declaration: "Proofs.ViTTie.vit_net_tied", file: "LeanMlir/Proofs/Nets/ViT/ViTStepTie.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # the batched capstone at the un-fused gradient nodes and the smoothed loss, N and nC binders: ConvNeXt-T's 182 parameters, every shipped ConvNeXt artifact, at either precision and at its drop-path sites (ViT-Tiny's twin, also at either precision and at its drop-path sites, is Proofs.ViTTieGB.vit_net_tiedGB)
    - {declaration: "Proofs.CnxTieGB.cnx_net_tiedGB", file: "LeanMlir/Proofs/Nets/ConvNeXt/ConvNeXtStepTieGB.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # the loss-gradient capstones: at the tie's chain cotangent every node IS the gradient (HasGradAt) of any loss L with gradient g at the logits, one replica; ResNet-34/50, MobileNetV2, MobileNetV4, EfficientNet-B0, ConvNeXt-T and ViT-Tiny, every one at either precision (bf16 binder); MobileNetV2's also at its classifier-dropout site (cd binder: none the drop-free artifacts, some the do ones, the loss read at mobilenetv2ForwardBFullDoOpt) and EfficientNet-B0's at both its mask sites (sd, the nine stochastic-depth blocks, and cd; the loss read at efficientnetForwardBFullDrop, a skip block's branch at dropPathOpt s dy); ViT-Tiny's at its 24 stochastic-depth sites and ConvNeXt-T's at its 18 (sd, through the indexed lift batchMapIdx; the loss read at vitNetB sd / cnxNetB sd)
    - {declaration: "Proofs.ResNet34TieB.r34_net_lossGrad", file: "LeanMlir/Proofs/Nets/ResNet/ResNet34ParamGrad.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    - {declaration: "Proofs.ResNet50TieB.r50_net_lossGrad", file: "LeanMlir/Proofs/Nets/ResNet/ResNet50ParamGrad.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    - {declaration: "Proofs.MobileNetV2TieB.mnv2_net_lossGrad", file: "LeanMlir/Proofs/Nets/MobileNet/MobileNetV2ParamGrad.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    - {declaration: "Proofs.Mnv4TieB.mnv4_net_lossGrad", file: "LeanMlir/Proofs/Nets/MobileNet/MobileNetV4ParamGrad.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    - {declaration: "Proofs.EnetTieG.enet_net_lossGrad", file: "LeanMlir/Proofs/Nets/EfficientNet/EfficientNetParamGrad.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    - {declaration: "Proofs.CnxTieGB.cnx_net_lossGrad", file: "LeanMlir/Proofs/Nets/ConvNeXt/ConvNeXtParamGrad.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    - {declaration: "Proofs.ViTTieGB.vit_net_lossGrad", file: "LeanMlir/Proofs/Nets/ViT/ViTParamGrad.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # the chapter nets, one example each; a pool window may tie between cells equal at every upstream weight
    - {declaration: "Proofs.LinFold.linear_net_lossGrad", file: "LeanMlir/Proofs/Nets/Small/LinearParamGrad.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
