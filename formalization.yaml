       WHAT IS NEW is the WINDOW. ResNet-34's is 3.152e211 against logits of a few;
       this one is 2154. The whole difference is one lemma: `relu6 x i =
       min (max (x i) 0) 6` is bounded by 6 WHATEVER its input, so `floatClose_relu6`
