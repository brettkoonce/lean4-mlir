       `relu` has no upper clamp and `FloatClose A A` is the best it can do. ⚠ AND THE
       BUDGET BARELY MOVES: 3.072e97 -> 1.444e96, one order. Error gain per stage does
       not care how small the window is; it is `G*S` per BN site with `S = 1/sqrt eps
       <= 317` at the eps-floor, and sweeping S over the same fold gives
       1e96/1e77/1e60/1e48 at S = 317/32/4/1, ~19 orders per decade across the 20 BN
       sites. So WINDOW AND BUDGET ARE SEPARATE LEVERS: the clamp is worth 97 orders of
       window and one of budget, and only an operating-point variance floor moves the
       budget. The adjoint chain's proven-H figure for this net is 2.7e60, so this fold
       sits ~36 orders above it rather than r34's 157 -- the clamped window removes the
       window looseness and leaves only the gain looseness. The number is still the
       interval fold and still vacuous as a certificate; the window half of it is not.

