  - title: "Certified Adversarial Robustness via Randomized Smoothing"
    authors: ["Jeremy Cohen", "Elan Rosenfeld", "J. Zico Kolter"]
    id: "arXiv:1902.02918"                 # ICML 2019
    type: "paper"
    license: ""
