       restated on it by `cnx_float_logits_le_committed`. Three modelled hypotheses, all named:
       `DeviceLN` (the deployed LayerNorm's mean, relative accuracy `emr`, and its inverse-stddev,
       absolute accuracy `ei`) and `DeviceGelu` (`egelu`), all at 1e-2.

       ⛔ IT IS NOT A FOLD. `budget / window = 2.00`, and that ratio is the whole caveat: every
       one of the 23 LayerNorm sites is discharged by `FloatBridgesTo.capped`, whose modulus is
       `min(fold, 2*mag)`, and the right branch is what closes. So this number says THE FLOAT AND
       THE REAL FORWARD BOTH LAND IN THE CERTIFIED WINDOW -- the triangle inequality -- where
       r34's 1.548e209, mnv2's 1.444e96 and B0's 8.408e210 say the rounding error folds to that
       value. It must not be tabled beside them without the label. It is still worth having: it
       is a kernel-checked whole-net statement about a LayerNorm net, which nothing else in the
       repo is, and its WINDOW half is the honest fold.

       ⭐⭐ AND THE CAP IS NOT OPTIONAL. LayerNorm reduces its mean and variance out of its own
       input, so `bnReluBudget`'s mean-and-variance shift term applies and its modulus is
       quadratic in the window -- the same structure that makes training-mode BatchNorm
       unstatable (above). BatchNorm escapes by freezing the statistics, which is exactly why the
       other three numbers are stated at inference BN. LayerNorm has NO running statistics to
       freeze: there is no eval-mode variant, no second render to build, and no version of this
       net whose fold exists. Uncapped, the same chain is 1e11631; `norm_num` refuses numerals
       past ~1e300. Measured ablation at the committed profile (`cnx_eval_chain`'s three flags):
       leaves as they stood 1e233/1e11631; saturation-GELU only 1e233/1e5390; LN cap only
       1e233/1e233; both 1e233/1e233.

       ⭐ TWO THINGS HAD TO BE RIGHT BESIDES THE CAP, and neither was about the architecture.
         (a) THE PROFILE DOES NOT SPLIT UNIFORMLY. On the 300-epoch checkpoint the conv and dense
             kernels max at 0.5962 over 28,524,000 entries, the biases and LN beta at 2.9499, the
             LN gamma at 4.7700 and the layer scale at 8.3766. A single uniform bound is therefore
             8.4 -- 14x loose on exactly the entries the conv fan-in multiplies -- and that fold
             lands at 1e301, unstatable. `CnxBlockChBounded` now carries FOUR bounds and the split
             one lands at 1e227. This is the r34/mnv2/B0 leaf lesson one level up: the looseness
             was in the INPUT, not in a lemma.
         (b) THE HEAD LAYERNORM SLOT WAS STALE. `convnextCh_floatBridges{,To}` held `id` there
             while `convNextForwardTCh_eq_skeleton` had carried `rowLNVecFlat 1 768` since the
             head LN was restored on 2026-08-30 -- so the whole-net bridges described a net with
             no head LayerNorm and their docstrings' claim to tie through that lemma was false for
             four days. Both now take the real head LN and its bridge. Fixing it is also what made
             the cap sufficient on its own: with `id` in the slot the last block's GELU is never
             capped again and the fold needs the saturation constant too (1e896 vs 1e230).

       ⭐ GELU'S MODULUS, tightened on the way (`Architectures/GeluSaturation.lean`, moved out of
       `Certificates/GeluLipschitz.lean`): `floatClose_gelu` now states the MIN of its magnitude
       polynomial `(1 + sqrt(2/pi)/2*A*(1+3*0.044715*A^2))*e` -- CUBIC in the window, ~400 at
       ConvNeXt's magnitudes -- and the global saturation constant `(3/2)*e`, which was already
       proved in this repo for the adjoint chain and sat one import ABOVE the float bridge that
       needed it. Same shape as swish's fix, and the same lesson: the bound was already there.

       ⛔⛔ A FIFTH, AND THE CAP AGAIN -- MORE THOROUGHLY (2026-09-03): `ViTFloatBudget.lean`.
       `vitBridge` is the committed depth-12 vector-LN `vitForwardKV` at 224² -- 16x16/s16 patch
       embed with CLS token and learned positions, twelve pre-norm blocks of
       LN / 3-head attention / skip / LN / fc1 / GELU / fc2 / skip, a final per-token LayerNorm,
       the CLS slice and the classifier -- as a CLOSED bridge, and `vitBridge_maps` pushes the
       envelope through its 162 numeric stages (324 rational inequalities, generated AND
       re-asserted by `scripts/float_budget_envelope.py`'s `vit_chain` / `verify_vit`). At the
       profile measured per parameter KIND on the trained checkpoint, `eps >= 1e-5`, unit input
       window and `u <= 2^-24`:
           output window  <= 3.612e218      (vitBridge_mag_le)
           fresh budget   <= 7.222e218      (vitBridge_fresh_le)
       and per logit `|float - real| <= 7.222e218` (`vit_float_logits_le`), restated on the
       committed spec's denotation by `vit_float_logits_le_committed` (`vitVerified_denote_eq`
       is `rfl`; `vitVerified_fwd_faithful` says the emitted depth-12 multi-head vector-LN graph
       denotes the same function). FOUR modelled hypotheses, all named: `DeviceLN` (`emr`
       relative, `ei` absolute), `DeviceGelu` (`egelu`), `DeviceExp` (`eexp` -- ⚠ RELATIVE,
       because `softmaxF_close` divides one exponential sum by another and only a relative error
       survives the quotient), all at 1e-2, plus the softmax side condition
       `smRho u eexp 197 < 1` (= 0.010012, `vit_smRho_lt_one`).

       ⛔ IT IS NOT A FOLD EITHER, and less of one than ConvNeXt-T. `budget / window = 2.00`
       again, and here BOTH families of site are capped: all 25 LayerNorm sites and all 12
       attention sites, so there is no stage inside a ViT block at which the fold survives and
       the two skips per block carry that forward. The ONE honest stage is the patch embed
       (window 232.3 from a unit image, rounding 5.633e-4): it does not reduce, its modulus is
       linear in the inherited error, and at the net's input that error is 0.

       ⭐⭐ AND THE SECOND CAP IS A DIFFERENT KIND OF NECESSITY -- REPRESENTABILITY, NOT SIZE.
       LayerNorm uncapped is the ConvNeXt story at 1e3239 (a magnitude failure). Attention is
       not: `floatBridges_mhProjAttnFull`'s WINDOW is derived as `|real| + |float - real|`, so it
       carries `smErr`'s `Real.exp (2*delta)` at `delta ≈ 3.6e10` by block 0 -- an argument with
       no rational bound -- and 36 stage numerals CANNOT BE WRITTEN AT ALL, at a magnitude
       SMALLER than the shipped one (8.257e190 vs 3.612e218). Capping does not reach it, because
       `capped` replaces the modulus and never the window. `floatClose_mhProjAttnFullCap` does:
       `FloatClose`'s magnitude clause bounds the FLOAT output directly, and the float output is
       a rounded dot of float softmax weights (<= 1 + smCap, exp-free) against float V. That is
       `floatClose_seScale`'s fix one net later, and the same sentence closes both: the error
       never needed to enter the window. ⚠ A Python fold HIDES this failure mode -- `math.expm1`
       overflows to a finite float and the chain sails on -- so `vit_chain` returns an
       `exp_tainted` tag list and "statable" means small enough AND writable.

       ⭐ ATTENTION IS ONE LEAF, AND SO IS THE PATCH EMBED. `FloatBridgesTo` composes
       single-input maps; attention fans out (X -> Q,K,V) before it rejoins, and
       `patchEmbed_flat` is a single definition with an `if n.val = 0` branch selecting the CLS
       token. Neither is the composition the emitted GRAPH spells, and an earlier probe that
       decomposed both at graph granularity produced a number (1.065e191) for a chain that
       cannot be written. The graph says what the kernel does; the definition says what the
       theorem is about, and only the second constrains a `Maps` chain.

       ⚠ THREE THINGS THE PLAN BUDGETED FOR TURNED OUT NOT TO BE LOAD-BEARING, and they are the
       inverse of ConvNeXt's lessons. (a) The per-kind profile split buys 18 vacuous orders here,
       not statability: ViT-Tiny's kinds are 2.5x apart where ConvNeXt's are 14x, because
       ConvNeXt's outlier is the LAYER SCALE (inside every block) and ViT's is the FINAL
       LayerNorm gamma (after everything, multiplying only the head) -- the uniform bound is
       statable at 1e237. (b) GELU's saturation constant gives an IDENTICAL number, because the
       next capped LN resets the error anyway; `Maps.gelu` stays on the 3/2 branch for a
       RATIONALITY reason (the polynomial carries sqrt(2/pi)), not a size one. (c) The convex
       attention-times-V bound would buy 27 orders and is NOT proved and NOT needed.

       ⭐⭐ PHASE 2 OPENS, AND IT REVERSES THE PLAN'S OWN PREMISE (2026-09-03):
       `Resnet34BackFloatBudget.lean`. `r34_grad_float_le` -- the deployed ResNet-34 whole-net
       INPUT-GRADIENT VJP is within 6.894e244 of the certified one, per input pixel, on loss
       cotangents of magnitude <= 1 (which is what softmax cross-entropy gives), certified window
       8.857e245. 91 numeric stages, 254 rational inequalities, generated AND re-asserted by
       `scripts/float_budget_envelope.py`'s `r34_back_chain` / `verify_r34_back`.

       ⭐ IT IS THE INTERVAL FOLD -- budget/window = 0.078, not the 2.00 cap ConvNeXt-T's and
       ViT-Tiny's forwards carry -- AND IT IS AT TRAINING-MODE BATCHNORM, the mode this same
       net's FORWARD has no statable number for at all (1e7417 above). The plan had recorded
       "a backward's BN-back modulus inherits the same reduction structure"; it does not. §0.1's
       quadratic came from the statistics MOVING with the input, and a VJP reads its statistics
       off the SAVED forward activations, which the cotangent does not perturb. So
       `floatClose_bnBack`'s modulus is `bnGradInputBudget(A) + bnGradInputReMag(e)` with
       `bnGradInputReMag n G e S Xh = (1/n)*S*G*e*(2 + Xh^2)` -- LINEAR in the inherited error,
       because a VJP at a fixed point is a linear map and this is its Lipschitz constant.

       ⛔⛔ THE WALL DOES NOT VANISH, IT RELOCATES -- and this statement quarantines it in three
       named hypotheses. Two are the saved float activations' accuracies (`es` on the
       inverse-stddev, `exh` on the normalised x-hat, both 1e-2, as `DeviceRsqrt`'s and
       `DeviceGelu`'s are elsewhere in this cone) -- ⚠ but unlike those, they are quantities the
       repo's own forward fold speaks about, and at training-mode BN it says 1e7417, not 1e-2.
       The third is the OPERATING POINT: `R34BnBack.hS` requires |istd| <= 16 at every site, i.e.
       sigma >= 1/16 at the saved activations. So the theorem is an honest fold GIVEN a
       forward-accuracy hypothesis its own forward cannot discharge, AND at an operating point.

       ⭐⭐ THE LOAD-BEARING LEMMA WAS ALREADY IN THE REPO. `bnXhat_sq_le` (|x-hat| <= sqrt(n), the
       standardisation bound, `Foundation/ResNet34.lean`, written for the realistic-seal work),
       turned into a rational numeral by `bnXhat_abs_le_num`: `Xh` enters the fold as Xh^2, and
       deriving it from the FORWARD's certified window (2*A*S) instead gives 1e7271, unstatable.
       Every place the activations enter an input-gradient they enter NORMALISED or through
       `istd`, so the backward's fold does not inherit the forward's window at all.

       ⭐ AND THE BUDGET IS HOMOGENEOUS OF DEGREE 1 in the cotangent window -- the same linearity
       -- which is what makes the numerals checkable: factored as `Cdy * budget(1)`, a site is
       `A*(Kr+Kb) <= A'` against ONE constant per feature-map size, five for a ResNet-34 instead
       of sixty-eight forty-node trees. The full chain went from 39 minutes / 41 GB (not
       finishing) to 84 s / 3.8 GB. ⚠ The FORWARD budgets are NOT homogeneous -- a bias breaks
       it -- which is why the five forward nets never needed this.

       ⚠ AND A CORRECTION TO AN INFRASTRUCTURE FACT: `norm_num` refuses around 1e253 for a nested
       arithmetic tree, NOT the ~1e300 recorded elsewhere, and the ceiling depends on the
       operation TREE rather than the value (the same number closes in a flatter shape).
       ConvNeXt-T's 1e227 and ViT-Tiny's 1e218 sit under it, which is why five nets landed
       without meeting it. That is why the operating-point S is needed: it is worth ~43 orders
       across 33 BatchNorm sites.

       ⭐⭐ THE WHOLE-NET CERTIFIED TIE IS CLOSED (2026-09-03):
       `r34InputGrad_eq_resnet34_vjp` (`Resnet34BackCertifiedTie.lean`) assembles the per-op ties
       into `r34InputGrad = (resnet34_has_vjp_at ...).backward` at the full 3x224x224 dims, so
       the reading is no longer "every piece of this chain is the certified gradient" but "the
       chain IS the certified whole-net gradient". The blocker recorded here previously --
       "`resnet34_has_vjp_at` is only concretely instantiated at toy dims" -- was a misreading:
       that theorem is dimension-generic and parametric in its component maps, and every
       component witness existed except the stem's (`cbrStridedPC_has_vjp_at`, the strided peer
       of `convBnReluPC_has_vjp_at`). ⚠ It remains a SMOOTH-POINT statement: the pool's
       MaxPool3s2Smooth, the stem's post-BN no-zero and the per-block ChainData bundles are
       hypotheses, as every HasVJPAt in this cone is.

       ⛔⛔ AND CLOSING IT FOUND A DRIFT THAT MOVED THE NUMBER. `r34InputGrad` pooled with
       `maxPoolFlatBack` -- the 2x2 pool's backward -- while the committed forward
       `resnet34Forward_full_pc` pools with `maxPool3s2Flat`, He et al.'s 3x3/s2 stem pool
       (restored 2026-08-03). `MaxPool3s2.lean`'s header warns the two share a TYPE and are
       different functions; nothing forced the statements to unify until a theorem needed them to
       be about ONE net. The missing leaf is `MaxPool3s2BackFloatBridge.lean`: 3x3/s2 windows
       OVERLAP, so an input can be the argmax of up to FOUR outputs and the backward ACCUMULATES
       -- window 4A where the 2x2 peer is envelope-preserving, plus a rounding term. The number
       moved 1.458e244 -> 6.894e244. ⚠ The 4 is PROVED from `win3Row_mem_le_two`
       (`maxPool3s2Back_mask_sum_abs_le`), not assumed: the trivial c*h*w fibre bound puts the
       fold at 1e251, four orders under the ~1e253 shape-dependent norm_num wall above.

       ⭐⭐ THE SECOND WHOLE-NET BACKWARD NUMBER, AND IT NEEDS NO OPERATING POINT (2026-09-04):
       `MobileNetV2BackFloatBudget.lean`. `mnv2_grad_float_le` -- the deployed MobileNetV2
       whole-net INPUT-GRADIENT VJP is within 1.076e152 of the certified one, per input pixel, on
       loss cotangents of magnitude <= 1, certified window 4.750e153, budget/window = 0.023 (the
       interval FOLD again, no cap anywhere, at TRAINING-mode BatchNorm). 48 numeric stages, 136
       rational inequalities, generated AND re-asserted by `mnv2_back_chain` / `verify_mnv2_back`.

       ⭐⭐ WHAT IS NEW IS THE HYPOTHESIS THAT IS ABSENT. r34's third hypothesis -- the operating
       point |istd| <= 16 -- is not here: `MnvBnBack` has NO inverse-stddev field, and
       `MnvBnBack.hS` DERIVES |istd| <= 317 from eps >= 1e-5 alone (`bnIstd_abs_le_of`, the
       rational form of `bnIstd_abs_le`'s 1/sqrt(eps)). It is affordable because the fold lands at
       1e153 where r34's at the same eps-floor is 1e288, past the ~1e253 norm_num wall. Two
       structural reasons, both measured: 20 BatchNorm sites against 33, and the inverted
       residual's backward fan-ins are the 1x1s (24..256) and the DEPTHWISE's 9, where r34's are
       512*9. So this is the first whole-net backward statement in the repo with nothing supplied
       but `es`/`exh` -- which ARE still supplied at 1e-2, and are still what the forward's own
       training-mode fold cannot discharge. §0.1's wall is a fact about COMPOSING a backward with
       the forward that feeds it, not about backwards.

       ⭐ The only new machinery is two `Maps` leaves, both compositions of existing ones
       (`FloatBudgetEnvBackMBConv.lean`): `Maps.depthwiseBack` is `Maps.depthwise` at the
       spatially-reversed kernel and zero bias -- fan-in kH*kW = 9, the kernel window ALONE,
       because a depthwise conv mixes no channels -- and `Maps.depthwiseStride2Back` is that
       composed with `Maps.decimateBack`. ⭐ And relu6's clamp, the FORWARD's headline lever here
       (97 orders of window, `min A 6` at 13 sites), buys the backward NOTHING: its backward is
       `reluMaskBack`, a 0/1 select, exact in float and envelope-preserving. Window and budget are
       separate levers on a forward; on a backward the clamp is not a lever at all.

    5. The suite works over its own `Proofs.Mat m n := Fin m -> Fin n -> R`
       (definitionally Mathlib's `Matrix (Fin m) (Fin n) R`) with its own
       `mulVec/transpose/outer/mul`. This IS bridged to Mathlib's `Matrix`
       namespace by `LeanMlir/Proofs/Codegen/MatBridge.lean` (`Mat.mulVec_eq`,
       `Mat.transpose_eq`, `Mat.outer_eq`, `Mat.mul_eq`), so a downstream
       consumer can apply Mathlib's matrix algebra to the suite's outputs. The
       bridge is opt-in by design — the core suite does not import it, keeping
       its import surface Matrix-free unless interop is wanted.

    6. NOT PROVED — empirically validated only: that the nets train to good
       ImageNet accuracy, that StableHLO/IREE compilation is faithful, that the
       JAX pipeline agrees numerically, and that bf16 doesn't change results.
       These are engineering claims backed by runs and cross-checks, not
       theorems. The fp8-E4M3 "trainers" are host-side quantization emulation on
       fp32 kernels (the theorems are about the E4M3 value grid, the hardware
       has no fp8 units). Note the hardware-model direction has since STRENGTHENED:
       the binary32/E4M3 rounding models are now constructed (`rndP`, standard
       model proved) rather than axiomatized — the earlier TrustedBridge
       named-axiom quarantine was retired, keeping the project at zero
       non-core axioms.

review:
  status: "agent-reviewed"   # also self-assessed; NOT externally peer-reviewed
  reviewers: []
  notes: >-
    Three independent checks beyond `lake build`: (1) an agent self-audit
    (tests/AUDIT_REPORT*.md) that found no axioms/sorries and surfaced the
    fidelity caveats above, plus a full `#print axioms` sweep of 1393
    declarations (tests/AuditAxioms.lean) run in CI; (2) mutation testing
    (corrupting a backward formula breaks the build at every mutation tried);
    (3) leanprover/comparator re-running Lean's kernel typechecker on 52
    theorems with a hard-coded permitted-axiom allowlist of exactly
    {propext, Quot.sound, Classical.choice} (the nanoda second-kernel pass is
    currently disabled in config pending a lean4export rebuild after a
    toolchain bump). External agent-driven review rounds (2026-07) drove the
    scorecard mechanization and the LipSDP tightening; no external HUMAN peer
    review.

alignment:
  namespace: "Proofs"
  statements:
    - source: "Dense layer backward (weight + bias gradients)"
      lean: "dense_weight_grad_correct / dense_bias_grad_correct"
      module: "LeanMlir/Proofs/Foundation/MLP.lean"
      status: "proved"
      note: ""
    - source: "2D convolution backward"
      lean: "conv2d_has_vjp3_correct"
      module: "LeanMlir/Proofs/Architectures/CNN.lean"
      status: "proved"
      note: ""
    - source: "Batch normalization three-term backward"
      lean: "bn_input_grad_correct"
      module: "LeanMlir/Proofs/Architectures/BatchNorm.lean"
      status: "proved"
      note: ""
    - source: "Multi-head self-attention backward (Q/K/V) + full ViT body"
      lean: "mhsa_has_vjp_mat_correct / vit_full_has_vjp_correct"
      module: "LeanMlir/Proofs/Architectures/Attention.lean"
      status: "proved"
      note: ""
    - source: "ReLU / max-pool backward at non-smooth points"
      lean: "relu_codegen_matches_canonical / maxPool2_codegen_matches_canonical"
      module: "LeanMlir/Proofs/Foundation/MLP.lean, LeanMlir/Proofs/Architectures/CNN.lean"
      status: "proved"
      note: "smooth-point bridge only; non-smooth points are a disclosed trust boundary"
    - source: "Live-network non-degeneracy + nonzero-Jacobian seal (ResNet-34, incl. full [3,4,6,3] depth)"
      lean: "liveFwd2_nonconstant / liveFwd2_jacobian_nonzero (empty chains); liveFwd2Full_nonconstant / liveFwd2Full_jacobian_nonzero + liveFwd2Full_backward_nontrivial (full 16-block depth)"
      module: "LeanMlir/Proofs/Foundation/ResNet34LivePC.lean, LeanMlir/Proofs/Training/ResNet34LiveSeal.lean, LeanMlir/Proofs/Foundation/ResNet34LiveFull.lean"
      status: "proved"
      note: "2-channel live ResNet-34, real [3,4,6,3] depth; sealed at a channel-symmetric base Y (maxpool no-tie + carrier vanishes; identity blocks wash out through BN)"
    - source: "Committed train step = real loss-driven backward (per-net ties, all 12 nets)"
      lean: "<net>_net_tied_certified family (e.g. vit_net_tied_certified, all 200 ViT params)"
      module: "LeanMlir/Proofs/*TiePoC.lean"
      status: "proved"
      note: "genuine backward cotangent, not a free ∀-cotangent; committed-spec ties for all 5 ImageNet nets in SpecVJP"
    - source: "Binary32 rounding model + whole-net float-error composition"
      lean: "rndP_err; <net>_floatBridges / <net>_grad_floatBridges; chain_adjointClose; cifar8_chain_argmaxSafe"
      module: "LeanMlir/Proofs/Float/Binary32Instance.lean, LeanMlir/Proofs/*FloatBridge*.lean, LeanMlir/Proofs/AdjointChain*.lean, LeanMlir/Proofs/Architectures/Cifar8ChainCert.lean"
      status: "proved"
      note: "rounding model CONSTRUCTED (former hardware axioms discharged); capstone: binary32 rounding cannot flip the cifar8 prediction"
    - source: "Tsuzuku 2018 Lipschitz-margin certified radius + LipSDP scorecards at trained weights"
      lean: "lipschitz_margin_certified_radius; scorecard; scorecard_sdp / scorecard_sdp_uncon"
      module: "LeanMlir/Proofs/Certificates/LipschitzCert.lean, LeanMlir/Proofs/LipschitzCertScorecard*.lean"
      status: "proved"
      note: "fixed 100-image subset at fixed ε — honest lower bound (69/100 vs 72/100 PGD bracket)"
    - source: "Cohen 2019 randomized-smoothing certified radius (incl. the Gaussian Neyman–Pearson core)"
      lean: "smoothing_certified_radius_classifier via smoothing_probit_lipschitz / stdGaussian_np_shift"
      module: "LeanMlir/Proofs/Certificates/SmoothingGaussian.lean"
      status: "proved"
      note: "end-to-end: quantile inversion, Cameron–Martin shift, rotation-invariance dimension reduction all proved; requires class probabilities in (0,1); the driver's Monte-Carlo estimation gap is not formalized"
    - source: "Optimizer-as-steepest-descent ladder (SGD / sign / Muon / Shampoo, Newton–Schulz)"
      lean: "muon_polar_steepest, shampoo_eq_muon, muon_polar_nearest_orthogonal + spectral-step lemma"
      module: "LeanMlir/Proofs/Foundation/MuonGeometry.lean, LeanMlir/Proofs/Foundation/MuonNewtonSchulz.lean"
      status: "proved"
      note: "14 theorems; singular-G SVD completion + Newton–Schulz convergence dynamics left open"
    - source: "StableHLO/IREE codegen faithfulness, JAX numeric agreement, training accuracy"
      lean: "(none — empirical)"
      module: ""
      status: "not-formalized"
      note: "validated by runs + cross-checks, not by theorems"

acknowledgements: >-
  Built on Mathlib (foundation: fderiv / Differentiable). Independent kernel
  re-checking via leanprover/comparator and the nanoda kernel. StableHLO/IREE
  for compilation; JAX for cross-checking. Architectural coverage follows
  "Convolutional Neural Networks with Swift for TensorFlow" (Apress, 2021).
