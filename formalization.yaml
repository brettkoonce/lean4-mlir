       THREE MORE AXES THE SAME REVIEW FOUND (2026-09-06, later that day),
       recorded here because "the certified net and the net that produced the
       headline number are different functions" is true for more reasons than
       BatchNorm. (i) OPTIMIZER FORM -- FOLD DONE 2026-09-06, see 4f. All five
       *_net_tied_certified capstones are at the fused `theta - lr * g` ops,
       which only the SGD-inline `<net>_train_step.mlir` emits; every other
       train step, the ImageNet ones included, emits the raw gradient and hands
       it to an optimizer tail. The decision was to re-state every fold at the
       gradient node -- the `*Sgd_eq_grad` family is `rfl` and
       ResNet34FaithfulPoCB was the template -- which covers every tail at once;
       that is now done for all five nets, and the capstones are not yet
       re-pointed. The tails are certified
       (adamW_triple_faithful, mom_pair_faithful, rmsProp_triple_faithful,
       clipGrad_faithful, dropPathB_faithful; EMA and accumulation reuse
       adamMNextF / momVNextF) except LAMB, which has no faithfulness theorem,
       and BCE-with-logits has no cotangent den; both are ResNet-50-A3's.
       (ii) RENDERER. ResNet-34, MobileNetV2, ConvNeXt-T and ViT-Tiny each have
       a per-example renderer (the tied one, batch sum in the emitter) and a
       batched one (the ImageNet one, batch sum inside den). The decision is one
       chain per net, the batched one, with the Imagenette numbers re-run.
       (iii) DATA PARALLELISM. Every `*dp*` artifact's `all_reduce(add)/R` is
       emitted text outside the AST (a declared carve-out in ViTRender.lean)
       that no den lemma sees; BatchNorm statistics are per replica. A tie
       against such an artifact is at the per-replica gradient node. The mean
       of per-replica gradients is the gradient of the mean of per-replica
       losses (linearity; for a net without batch coupling that is the
       global-batch step), which is a lemma to write; the host-side sharding
       and lockstep are driver logic and get a page, not a theorem. Batch size
       stays a binder in every tier without a numeral. Work packages: the same
       document, sections 4b, 4c, 4d.

    4f. THE OPTIMIZER FORM, CLOSED AT THE FOLD (2026-09-06). Every parameter
       GRADIENT node of all five ImageNet-scale nets' non-SGD-inline train steps
       now has a machine-checked `den(op) = certified gradient`, for every
       cotangent. Five files: `Foundation/ResNet34FaithfulPoCB.lean` (8 op
       kinds), `Architectures/EfficientNetFaithfulPoCG.lean` (8),
       `ConvNeXtFaithfulPoCG.lean` (14), `ViTFaithfulPoCG.lean` (10),
       `MobileNetV2FaithfulPoCPaperG.lean` (4 new op kinds plus five
       per-block-profile capstones). 41 declarations, all 3-axiom clean.

       WHAT IT BUYS AND WHAT IT DOES NOT. One lemma per op kind certifies every
       optimizer tail at once, because AdamW, RMSProp, heavy-ball, EMA, the
       clipped and weight-decayed variants, gradient accumulation, plain SGD and
       the bf16 twins all consume the same node. So the artifacts the book names
       (`<net>_adam_train_step.mlir`) and the ImageNet ones whose accuracies are
       quoted are now covered at the fold, where before only the SGD-inline file
       was.

       THE CAPSTONES ARE BEING RE-POINTED, THREE OF FIVE DONE (2026-09-06).
       ResNet-34 and MobileNetV2 got theirs as batched ties (4g, 4j).
       EfficientNet-B0's is `Architectures/EfficientNetTiePoCG.lean`: all 262
       parameters at the RAW gradient node AND at the shared smoothed-target loss
       cotangent, where the fused `EfficientNetTiePoC` pins `g` to
       `softmax - oneHot` -- the gradient of plain cross-entropy at a hard label,
       which no ImageNet artifact computes. No new mathematics: every cotangent
       chain, activation and Jacobian witness is the fused file's, and each
       conjunct is its proof with the `theta - lr *` peeling dropped, since the
       fusion is `rfl`. The `lr`/`wN`/`bN`/`gN`/`lrStr` binders go with the
       wrapper. The head takes `g` as a BINDER where the fused one computes it
       internally, and that is the whole of the loss axis -- the per-block ties
       are `forall cot` statements and were already loss-agnostic.

       ⚠ CONVNEXT-T AND VIT-TINY ARE NOT THE "CHEAP TWO" THE PLAN ASSUMED. Their
       Adam artifacts come from the PER-EXAMPLE renderers, where the six-op loss
       chain is emitted at `N := 1` with the batch in `pretty`'s argument rather
       than inside `den` (`SmoothedLossCot`'s statement is at the batched index).
       A capstone written for them today would be about a chain 4c legs 3 and 4
       will retire, so it would have to be written twice. Their legs come first.

       NO NEW MATHEMATICS, AND OP KINDS ARE SHARED MORE THAN THE FILE NAMES
       SUGGEST. The fusion is `rfl` -- the 29 `*Sgd_eq_grad` / `*SgdB_eq_grad`
       theorems say the fused op IS `theta - lr *` applied to the un-fused one --
       so each proof is the fused lemma's minus the wrapper peeling. And the
       folds are statements about OP KINDS, not about nets: five of
       EfficientNet-B0's eight kinds and eight of MobileNetV2's twelve were
       already proven in ResNet-34's file at exactly the generality needed, so
       those conjuncts are delegations. ConvNeXt's patchify-stem weight
       (`convStride4WeightGrad`) never had a fused peer at all -- a declared
       carve-out, because its SGD path wraps the gradient in hand-written text --
       and 4b makes that shape the norm rather than the exception.

       TWO CORRECTIONS THE PACKAGE FOUND. (a) MobileNetV2's two renderers do not
