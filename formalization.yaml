  - title: "Old Optimizer, New Norm: An Anthology"
    authors: ["Jeremy Bernstein", "Laker Newhouse"]
    id: "arXiv:2409.20325"
    type: "paper"
    license: ""
    author_contacted: "no"
    prior_work: ""                         # optimizer-as-steepest-descent-under-a-norm ladder formalized (MuonGeometry.lean)

status:
  scope: >-
    Machine-checked vector-Jacobian-product (backward-pass) correctness for the layer
    primitives of ten architectures and their whole-network compositions -- MLP, 2D CNN,
    BatchNorm-CNN, ResNet-34, ResNet-50, MobileNetV2, MobileNetV4-Conv-M, EfficientNet-B0,
    ConvNeXt-T and ViT-Tiny. On top of the VJP layer: (1) TRAIN-STEP TIES -- for each of the
    seven ImageNet-scale nets, every parameter gradient node of the batched train step is tied
    to the cotangent the emitted backward chain delivers, at the un-fused gradient node every
    optimizer tail consumes and the label-smoothed loss at a general target, with the batch
    size a binder and the data-parallel mean an AST node (fidelity 4e-4g); the SGD-inline
    steps of the ten nets that ship one are tied too. (2) FLOAT ERROR -- a binary32 rounding
    model constructed from scratch, per-operator and per-block float closeness (a magnitude
    window and an error modulus that compose), and every net's hand-written backward chain
    proven to BE the certified whole-net VJP (fidelity 4d). (3) ROBUSTNESS CERTIFICATES as theorems: the Tsuzuku
    Lipschitz-margin radius, per-class-pair LipSDP at trained weights, the Cohen smoothing
    radius end to end. (4) OPTIMIZER GEOMETRY: SGD/sign/Muon as steepest descent under a norm,
    Shampoo = single-step Muon. The StableHLO codegen and the training runs are engineered and
    empirically validated, not theorems (fidelity 2, 6).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: &core ["propext", "Quot.sound", "Classical.choice"]   # Lean/mathlib core only; no project axioms
  main_results:
    # A REPRESENTATIVE set, one row per kind of claim. The full audit is tests/AuditAxioms.lean
    # (`#print axioms` on every declaration that says something, run in CI); 73 are
    # independently kernel-rechecked by the comparator, and that set covers every row below
    # (`comparator_config` names the file each one is checked in). Every row: 0 sorries, the
    # three core axioms. The per-net numbers table is fidelity 4d.
    #
    # --- VJP layer ---
    # the chain rule for pdiv: composition, additive and multiplicative fan-in, finset sums
    - {declaration: "Proofs.pdiv_comp", file: "LeanMlir/Proofs/Foundation/Tensor.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config.json", literature_dependencies: []}
    # 2D convolution (the strided, depthwise and stride-4 forms are its siblings)
    - {declaration: "Proofs.conv2d_has_vjp3_correct", file: "LeanMlir/Proofs/Architectures/CNN.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-arch.json", literature_dependencies: []}
    # batch-norm's three-term backward (layer-norm is the same lemma at one row)
    - {declaration: "Proofs.bn_input_grad_correct", file: "LeanMlir/Proofs/Architectures/BatchNorm.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # softmax cross-entropy
    - {declaration: "Proofs.softmaxCE_grad", file: "LeanMlir/Proofs/Architectures/Attention.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-arch.json", literature_dependencies: []}
    # multi-head self-attention
    - {declaration: "Proofs.mhsa_has_vjp_mat_correct", file: "LeanMlir/Proofs/Architectures/Attention.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-arch.json", literature_dependencies: []}
    #
    # --- Whole nets: forward + VJP at the net the artifact runs (T1), the typed graph (T2) ---
    # a kinked net at batch BN: ResNet-50's [3,4,6,3] bottlenecks, 48 relu clauses, q a binder (224 and 160 px)
    - {declaration: "Proofs.resnet50ForwardB_full_has_vjp_at_correct", file: "LeanMlir/Proofs/Nets/ResNet/ResNet50FullBVJP.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # a smooth net: ViT-Tiny at its real dimensions -- depth 12 with distinct per-block parameters, 3 heads, vector LayerNorm; HasVJP at every input (0 < eps)
    - {declaration: "Proofs.vitTiny_has_vjp_correct", file: "LeanMlir/Proofs/Nets/ViT/ViTDepthK.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # a typed SHlo graph at the render's own tokens denotes the whole-net forward (MobileNetV4, 26 stages; every net has one)
    - {declaration: "Proofs.StableHLO.mnv4FwdGraphB_full_faithful", file: "LeanMlir/Proofs/Nets/MobileNet/MobileNetV4FullB.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # non-degeneracy: a non-constant forward and a nonzero whole-net Jacobian at a witness (fidelity 4)
    - {declaration: "Proofs.Mnv2FullBSeal.sealX_nonconstant", file: "LeanMlir/Proofs/Nets/MobileNet/MobileNetV2FullBSeal.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # the same, on the one net whose fused stage is swish -- so the carrier crosses a non-affine activation
    - {declaration: "Proofs.Mnv4FullBSeal.sealX_backward_nontrivial", file: "LeanMlir/Proofs/Nets/MobileNet/MobileNetV4FullBSeal.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    #
    # --- Train-step ties (T3): the fold at every gradient node, then the cotangent pinned ---
    # the fold, stated per op kind at the un-fused *GradB node all optimizer tails consume (r34's file is the template)
    - {declaration: "Proofs.ResNet34PoCB.convStridedWGradB_den", file: "LeanMlir/Proofs/Foundation/GradNodesB.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # the emitted six-op cotangent IS the label-smoothed loss's gradient at a general target (mixup/cutmix)
    - {declaration: "Proofs.smoothedCE_grad", file: "LeanMlir/Proofs/Foundation/SmoothedLossCot.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # a batched capstone: ResNet-50's 161 nodes at their chain cotangent; N, q and the LOSS (CE or BCE) binders; one replica
    - {declaration: "Proofs.ResNet50TieB.r50_net_tiedB", file: "LeanMlir/Proofs/Nets/ResNet/ResNet50StepTieB.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # an SGD-inline capstone: ViT-Tiny's 200 parameters at the fused theta - lr*g ops (the family covers ten nets)
    - {declaration: "Proofs.ViTTiePoC.vit_net_tied_certified", file: "LeanMlir/Proofs/Nets/ViT/ViTStepTie.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # the batched capstone at the un-fused gradient nodes and the smoothed loss, N and nC binders: ConvNeXt-T's 182 parameters, every shipped ConvNeXt artifact (ViT-Tiny's twin is Proofs.ViTTiePoCGB.vit_net_tiedGB)
    - {declaration: "Proofs.CnxTiePoCGB.cnx_net_tiedGB", file: "LeanMlir/Proofs/Nets/ConvNeXt/ConvNeXtStepTieGB.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    #
    # --- Data parallelism ---
    # with batch coupling (training-mode BN) the DP mean gradient is NOT the global-batch gradient: the two-replica witness
    - {declaration: "Proofs.dpMeanGrad_ne_globalBatchGrad", file: "LeanMlir/Proofs/Foundation/DataParallel.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # ...and with SYNCHRONISED statistics it IS: the positive twin (replica r sums ITS examples' terms of the global gradient)
    - {declaration: "Proofs.dpSyncGrad_eq_globalBatchGrad", file: "LeanMlir/Proofs/Foundation/DataParallel.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
    # the sync-BN backward subgraph a DP render emits denotes the shard-r block of the batch-R*N input-VJP, at any R
    - {declaration: "Proofs.den_bnSyncBack_allReduce", file: "LeanMlir/Proofs/Foundation/DataParallelSync.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
