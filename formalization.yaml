    # MobileNetV2's sync-BN DP forward graph on replica r denotes shard r of the single-device forward at batch R*N
    - {declaration: "Proofs.StableHLO.mobilenetv2FwdGraphSync_full_shard", file: "LeanMlir/Proofs/Nets/MobileNet/MobileNetV2SyncB.lean", sorry_count: 0, axioms: *core, comparator_config: "tests/comparator/config-tier.json", literature_dependencies: []}
