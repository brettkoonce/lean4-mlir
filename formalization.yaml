       `bnBatchLA`, with `den graph = forward` chained over six per-block-kind
       lemmas; `MobileNetV2FullBVJP.lean` gives that forward a certified
       `HasVJPAt` over 19 hypothesis bundles. Both ~2 s to elaborate, all
       sixteen declarations 3-axiom clean.

       WHY IT IS NOT A FLAG. This net's two renderers do not overlap:
       `MobileNetV2Render` is SGD-inline and per-example only,
       `MobileNetV2RenderB` is AdamW-only and batch-BN, and every artifact whose
       accuracy the book quotes -- `mobilenetv2in_rmsdp64` among them -- is on the
       second. `MobileNetV2FullPaper.lean`'s per-example ladder stays where it is;
       this is its peer in the other world, not a replacement.

       ⭐ IT IS AN ENUMERATION, AND CHEAPER THAN RESNET-34's WAS.
       `MobileNetV2BackB0.lean` already carried the batched relu6 stages (`cbrB`,
       `dwbrB`, `dwbrBstrided`) and `projB` with their `_at` VJPs and backward
       graphs at `bnBatchLA`; `mnv2BodyB_has_vjp_at` and
       `mnv2DownBodyB_has_vjp_at` ARE the two body shapes, and
       `residual_has_vjp_at` wraps the first for the ten skip blocks. Where
       ResNet-34 needed a new Foundation lemma -- `batchMap_has_vjp_at`, because
       its stem ends in a max-pool with no derivative at a tie -- MobileNetV2
       needs none: it has no stem pool, and its GAP and dense are smooth. The
       only composition written from scratch is b1's `projB . dwbrB`, the `t = 1`
       block, which has no body lemma to delegate to.

       ⭐ THE WEIGHT AND POSITIVITY BUNDLES ARE REUSED, NOT RE-DECLARED. `IVW`,
       `IVWNoExp`, `IVPos` and `IVNoExpPos` hold kernels and epsilons and know
       nothing about which axis the norm reduces, so the batched net binds the
       records the per-example one does. Only the top-level weights record is new
       (generic in the class count, where `MNV2PaperWeights` is pinned at 10) and
       only the smoothness bundles need batched peers, because a kink condition
       names its activation and `bnBatchLA` is a different activation from
       `bnPerChannelTensor3`.

       ⚠ ONE EXISTING LEMMA FAMILY WAS GENERALISED. `mnv2BodyB_has_vjp_at`,
       its differentiability peer and its backward graph pinned input and output
       channels equal, because they were written for the residual block. Blocks
       b11 (64 to 96) and b17 (160 to 320) are stride-1 bodies with `ic != oc`, so
       the family now takes both; `mnv2DownBodyB` already had that shape, every
       existing call site is at `ic = oc`, and no proof changed.

       ⛔ TWO KINK CLAUSES PER BOTTLENECK, AND THEY ARE NOT RESNET-34's. The two
       relu6 sites are the EXPAND and the DEPTHWISE, both inside the body: the
       linear bottleneck has no activation after `project`, so the residual add IS
       the block output. ResNet-34's second clause is a post-residual OUTER relu.
       35 relu6 sites in all, bundled into 19 binders, and relu6 is kinked on BOTH
       sides so each carries `!= 0 and != 6`. ⚠ Unlike ResNet-34's, the head is
       not hypothesis-free -- MobileNetV2 puts a relu6 in front of the pool.

       ⚠ XLA-`SAME` AT ALL FIVE STRIDE-2 SITES, and the census is 158. The stem
       conv and the four strided depthwises are `flatConvStride2Xla` /
       `depthwiseStride2FlatXla`, not r34's symmetric peers -- identical types,
       identical emitted shapes, different certificates. The graph's bias operands
       are the render's default `convBias := false` names (`%zb{c}`, the shared
       zero constant), which is why the shipped parameter count is 158 and not
       210; every graph is quantified over the bias value, so both flags are
       covered.

       `N` is a variable throughout: T1 and T2 carry no numerals.

    4j. MOBILENETV2'S TRAIN-STEP TIE AT THE NET THAT TRAINS (2026-09-06). 4i
       gave this net T1 and T2 at `bnBatchLA`; 4f's fold already covered its
       parameter gradient nodes for an arbitrary cotangent. This pins the
       cotangent: `Foundation/MobileNetV2TiePoCB.lean` (1037 lines, ~2.7 s)
       states every parameter gradient node of the batched, batch-BatchNorm train
       step at the cotangent the emitted backward chain delivers, threaded from
       the label-smoothed loss through the head's own four nodes and the seventeen
       certified block backwards over `mobilenetv2ForwardB_full`'s own forward
       prefixes. That is MobileNetV2's T3 complete, and it makes this the SECOND
       net whose train-step tie is about the artifact whose accuracy the book
       quotes.

       ⭐ THE BLOCK COTANGENTS ARE NOT DERIVED, as ResNet-34's were not. 4i's
       `mnv2{ExpOnly,Resid,Strided,NoExp}B_has_vjp_at` ARE the certified block
       backwards, and `MobileNetV2BackB0.lean`'s `*BackBatchedGraph_faithful`
       family already proves the emitted subgraphs denote them, so three of the
       four `*CotIn_eq_vjp` lemmas close by `rfl`. The fourth, the residual one,
       needs `Eq.trans` instead of `rw`: `mnv2ResidB_has_vjp_at` unfolds to
       `residual_has_vjp_at` at the abbreviation `mnv2ExpOnlyB`, where the graph
       lemma states it at that abbreviation's own unfolding -- definitionally
       equal, not syntactically. No `add_comm` is needed anywhere, unlike
       ResNet-34's downsample block: the render emits `addVB(body, %dy)` and
       `residualBackGraph` builds the fan-in in the same order.

       ⭐ ONE TIE BUNDLE COVERS TWELVE OF THE SEVENTEEN BLOCKS. A skip block and a
       stride-1 widening have the SAME parameter cotangents -- the identity skip
       changes only the `dx` handed to the previous block -- which is why
       `MobileNetV2RenderB`'s `irBackStride1GradB` is one function with a `skip`
       flag rather than two near-copies, and why `mnv2Stride1TiedB` is stated once
       and instantiated at b3, b5, b6, b8-b13, b15, b16 and at the widenings b11
       and b17.

       ⭐ TWO HELPERS ARE RESNET-34's, IMPORTED RATHER THAN COPIED. `bnInB` is the
       batched BatchNorm input-cotangent written as the `den` of the emitted
       backward op, and `bnInB_eq_bnBackB` is its identity with the certified
       `bnBatchLA` VJP; both are net-agnostic and happen to live in the file that
       first needed them. What MobileNetV2 adds is the TWO-SIDED relu6 mask
       (`relu6MaskB`, where ResNet-34 threads the one-sided `reluMaskB`) and the
       XLA-`SAME` strided depthwise input-VJP. ⚠ That last one is NOT
       `EnetTiePoC.dStridedInB`: EfficientNet-B0's strided depthwise is the
       SYMMETRIC op and MobileNetV2's is the XLA-`SAME` one, identical types and
       different certificates, and this is the one place that distinction is
       recorded on the backward side.

       ⭐ THE TIE HAS TWO HALVES WITH DIFFERENT HYPOTHESES, as ResNet-34's does.
       The capstone `mnv2_net_tiedB` carries NO smoothness hypothesis and no
       `0 < eps`: the folds are `forall cot` statements instantiated at explicitly
       constructed cotangents. The relu6-kink and positivity conditions enter only
       in the four `*CotIn_eq_vjp` lemmas, which say those cotangents ARE the
       certified whole-net backward. `N` is a binder throughout.

       ⭐ THE LOSS COTANGENT IS SHARED. `Foundation/SmoothedLossCot.lean`, written
       for ResNet-34 at a general target, applies verbatim: `MobileNetV2RenderB`
       composes the same six kit ops with the target arriving as the graph input.
       `mnv2_lossCot_is_smoothedCE_grad` reads the result row by row.

       ⛔ THE CENSUS IS 158 AGAINST 210 SLOTS, AND ONE REPLICA. `MobileNetV2RenderB`
       runs `convBias := false`, so the 52 conv, depthwise and project bias nodes
       are not emitted -- each bias is folded into the BatchNorm after it and bound
       to `zeroBiasPrelude`'s zero constant. The bias conjuncts are kept (one
       delegation each) and cover the flag; nothing weakens a theorem, since every
       fold is quantified over op instances. And every gradient node in
       `mobilenetv2in_rmsdp64` is followed by `all_reduce(add)/4` as emitted text
       outside the AST, so the tie is at the per-replica node (4k).

    4k. DATA PARALLELISM -- WHAT FUNCTION A *dp* RUN MINIMISED (2026-09-06).
       Every `*dp*` artifact is ONE program run on `R` replicas. Per parameter,
       between the gradient node and the optimizer tail, `emitGradAllReduce`
       writes `stablehlo.all_reduce(add)` over `replica_groups = [[0..R-1]]` and
       then a divide by `R` -- as emitted TEXT outside the `SHlo` AST, a declared
       trusted carve-out. So every train-step tie in this repo (`r34_net_tiedB`,
       `mnv2_net_tiedB`, `efficientnet_net_tiedG` and the SGD-inline capstones) is
       stated at the PER-REPLICA gradient node and disclaims the collective in its
       own header, while the ImageNet accuracies the book quotes all come from
       four-replica runs. `Foundation/DataParallel.lean` (~340 lines, ~2 s, 15
       declarations) is the R-level half of closing that.

       ⭐⭐ THE COLLECTIVE IS NAMED AS A GRADIENT. `dpMeanGrad_eq_grad_meanLoss`:
       `(1/R) sum_r g_r` IS the gradient of `(1/R) sum_r L_r`, with no hypothesis
       on the losses beyond differentiability -- so it holds for a training-mode
       BatchNorm net, where each `L_r` genuinely depends on the whole of replica
       `r`'s slice. That is the point. It says what a data-parallel run minimised
       without claiming that function is the global-batch loss.

       ⭐⭐ AND IT SPLITS THE TWO WORLDS, WHICH NO TIE CAN DO. `meanLoss_shard`:
       when the replica loss is the MEAN OVER ITS OWN SLICE of a per-example loss
       -- no batch coupling, which is ConvNeXt-T, ViT-Tiny and every inference-BN
       forward -- the mean of the `R` replica losses IS the mean over the global
       `R*N` batch, as FUNCTIONS, before any derivative is taken. So for those nets
       the data-parallel step is exactly the single-device step at batch `R*N`
       (`dpMeanGrad_eq_globalBatchGrad_of_perExample`). ⭐ It is stated at an
       ARBITRARY shard `e : Fin R x Fin N ~= Fin (R*N)`, so which examples land on
       which replica does not enter: the contiguous cut the DP path makes and the
       interleave the sharded producers make give the same theorem. The contiguous
       one is `dpMeanGrad_eq_globalBatchGrad_contiguous`.

       ⛔⛔ WITH BATCH COUPLING THAT IS FALSE, AND THERE IS A WITNESS.
       `dpMeanGrad_ne_globalBatchGrad`: two replicas, one example each, slices
       {0} and {2} whose union is the global batch {0,2} (`dpToyShard_eq_batch`,
       without which the witness would be comparing two unrelated datasets). The
       data-parallel mean gradient is 2; the gradient of the global-batch loss is
       1. `bnToyLoss` is the smallest loss that reads a NONLINEAR function of its
       own slice's statistic, which is exactly what a training-mode BatchNorm does,
       and no all-reduce repairs it because nothing all-reduces mu/var. So
       ResNet-34, MobileNetV2, EfficientNet-B0, ResNet-50 and MobileNetV4 trained
       data-parallel did NOT descend the batch-`R*N` loss at any learning rate;
       what they descended is the mean of the `R` per-replica batch-BN losses. This
       is also why `N` in the batch-BN tiers (4e, 4g, 4i, 4j) is the PER-CARD batch.

       ⭐⭐ THE LOCKSTEP INDUCTION. `dpIterate_lockstep` and
       `dpIterate_eq_meanLossTrain`: identical initial states and an identical
       (all-reduced) update keep the `R` state copies equal at every step, so `n`
       steps of the `R`-replica system ARE `n` steps of ordinary single-device
       training on the mean loss. That is the property `VerifiedTrain.lean` relies
       on when it checkpoints from replica 0 -- the checkpoint is not replica 0's
       answer, it is every replica's. ⚠ The shared start is a HYPOTHESIS; that the
       driver broadcasts it and that `replica_groups` names all `R` devices is
       calling logic, and the `*-dp-check` gates are its empirical evidence.

       ⚠ NOTHING HERE IS ABOUT THE EMITTED `all_reduce`. An `SHlo` constructor
       `allReduceMeanF R` with `den (allReduceMeanF R g) = (1/R) sum_r den (g r)`,
       plus its `pretty` and parser cases, is the next piece and it waits on the
       renderer convergence. Until it lands, a train-step tie composes with these
       lemmas only through the reader, and every tie still says so.

    4l. RESNET-50's TWO PREREQUISITES: LAMB's TAIL AND BCE's COTANGENT
       (2026-09-06). ResNet-50 is the largest remaining hole in the Proofs tier
       (no whole-net forward, no graph, no tie), and its quoted run
       `resnet50in160_lambaccdp8x64bce` is LAMB over 8 accumulated micro-batches
       with BCE-with-logits at 160 px. Two of its pieces had no theorem at all;
       both now do, and both are LEAF files for the reason 4k's is -- their
       natural homes (`Lamb.lean`, `StableHLO.lean`) carry 315+ downstream
       modules apiece and a declaration added to either rebuilds the corpus.

       ⛔ THE EARLIER "LAMB HAS NO FAITHFULNESS THEOREM" NAMED THE WRONG CAUSE,
       and this section corrects it. `lambDirF_faithful` and `lambScaleF_faithful`
       have said the emitted ops denote `Proofs.lambDir` and `Proofs.lambScale`
       since LAMB landed, both by `rfl` and both at `adamWParamF_faithful`'s bar.
       What was missing is the level above: the `(theta', m', v')` triple a train
       step returns, i.e. `adamW_triple_faithful`'s peer. `lamb_triple_faithful`
       is that, also by `rfl`, over the four ops the `.lamb` arm emits --
       `lambDirF`, `gradSumSqAccF`, `lambScaleF`, `sgdParamF` -- plus Adam's two
       moment recurrences, which LAMB reuses unchanged.

       ⭐ THE SCALAR CHILD IS A BINDER, and the two shapes the render emits are
       corollaries. `lamb_triple_faithful_committed` is at the shipped seed:
       `gradSumSqAccF` from `%lzero` over THETA ALONE, one leaf deep, so the
       scalar is `gradSumSq theta`. That single-leaf fold is the entire structural
       difference from the global-norm clip, whose whole content is that ONE
       scalar is shared across every parameter (`clipFactor_shared` against
       `lambScale_not_shared`); the two features emit nearly the same lines and
       differ only in the quantifier.

       ⭐⭐ `lamb_triple_faithful_excluded` IS THE ONE THAT SAYS SOMETHING NEW.
       timm reads `if weight_decay != 0 or group['always_adapt']:` before
       computing the trust ratio, so the `no_weight_decay` group is NOT
       layer-adapted; the render implements that by SKIPPING the norm op and
       passing `%lzero` straight in, and this says the emitted step is then
       exactly `theta - lr*r` with the ratio at 1. ⚠ The pre-existing
       `lambTrust_zero_weight` does not already give this at the artifact: it
       fires at `||theta|| = 0` exactly, i.e. step one, where every BatchNorm beta
       and dense bias starts, and from step two the parameter is
       small-but-nonzero and `||theta||/||r||` collapses to ~0.01-0.1 against
       timm's 1.0. That lemma could hold while the render was still wrong.
       Both corollaries were read off the committed bytes
       (`resnet50in160_lambaccdp8x64bce_train_step.mlir` and its `wx` twin).

       ⭐⭐ BCE-WITH-LOGITS, AND THE LEMMA THAT KEEPS IT FROM BEING CIRCULAR.
       `ResNet50RenderB`'s `bce := true` path emits THREE ops --
       `sigmoidB -> subB -> divConstB`, i.e. `(sigma(z) - t)/(B*K)` -- where
       softmax-CE emits five, and nothing said that chain was any loss's gradient.
       `Foundation/BceLossCot.lean` is `SmoothedLossCot.lean`'s twin at this loss.
       The load-bearing lemma is `bceLogits_eq_logSigmoid`: `softplus(z) - t*z`
       IS `-[t*log sigma(z) + (1-t)*log(1 - sigma(z))]`, class by class. Without
       it, `bceLogits_grad` would define the loss as whatever has the derivative
       the render emits and then prove it has it. The stable `softplus` spelling
       is the renderer's own `%loss` form, `max(z,0) + log(1 + exp(-|z|))`.

       ⭐ `bceLogits_grad` TAKES NO HYPOTHESIS ON THE TARGET, where `softCE_grad`
       needs `sum t = 1` to collapse `(sum t)*softmax - t`. BCE is per-class and
       separable, which is the point under mixup -- the a3 recipe's only source of
       soft labels, since its arg string is `ls0.0` and there is no label
       smoothing on this path at all.

       ⚠⚠ THE DIVISOR IS `B*K`, NOT `B`, and `bceLossCotGraph_row_committed` pins
       it rather than leaving it a binder nobody instantiated. timm's
       `BinaryCrossEntropy` is `reduction='mean'` over `B x C`, not the mean of
       the per-example SUM over classes; at `K = 1000` the two differ by 1000x on
       the effective step, and RSB-A2's `lr 5e-3` is tuned to this form. The
       committed artifact divides by `dense<64000.0>` = 64 x 1000.

       ⚠ WHAT THIS IS NOT. Faithfulness and well-definedness only, `Lamb.lean`'s
       ceiling verbatim -- never that LAMB converges or beats AdamW. `%loss`
       itself stays a report-only hand-written block (the §5 carve-out); what is
       proved is about the COTANGENT chain, which is on the gradient path. And
       ResNet-50 still has no whole-net forward, graph or tie: these are the two
       pieces §3.5 said to budget INSIDE that package, now paid for in advance.

    4m. RESNET-50's FIRST NET-LEVEL TIERS, T1 AND T2 (2026-09-06). The audit of 2026-09-05
       recorded ResNet-50 as the largest hole in the Proofs tier: "none;
       `r50Trunk_3463` is a backward fold", with T1 through T7 all missing.
       `Architectures/ResNet50FullB.lean` and `ResNet50FullBVJP.lean` are T1 and
       T2 -- an ℝ forward at the [3,4,6,3] bottleneck ladder, a certified
       whole-net `HasVJPAt` over it, and the typed `SHlo` graph that denotes that
       forward. ~3 s to elaborate, fifteen declarations.

       ⭐ THIS IS THE ONE NET WHERE T1 MATCHES THE TRAINED WORLD FROM THE START.
       ResNet-34's and MobileNetV2's Proofs tiers were written at per-example
       BatchNorm and had to be ported (4e, 4g, 4i, 4j). `ResNet50RenderB` has
       always been this net's only renderer, so `bnBatchLA` is the world of
       `resnet50_fwd` AND of every train step, and there is no BatchNorm-world
       port to do later. Nor does 4f's optimizer axis or 4h's renderer axis apply:
       this net is batched-chain-only.

       ⭐⭐ PURE ENUMERATION, AND NOTHING NEW ONE TIER DOWN.
       `Foundation/ResNet50BackB0.lean` already carries all three batched
       bottleneck forms with their pointwise VJPs and backward graphs at
       `bnBatchLA`. And the STEM AND HEAD ARE RESNET-34's -- `r34StemB` is generic
       in its channel counts and `r34HeadB` in its class count, so
       `r34StemB_has_vjp_at` and `r34HeadB_has_vjp` apply verbatim at ResNet-50's
       widths. That is why this file needed no new `Foundation` lemma where
       ResNet-34's own T1 needed `batchMap_has_vjp_at` (4e) for exactly that stem
       pool: the lemma is spent, not re-derived.

       ⭐ ONE weight record serves BOTH projection forms. The stride-1 projection
       (stage 1 block 0, `64 -> 256` -- the block with no ResNet-34 analogue,
       since R34's stage 1 runs at `ic = oc`) and the strided one (stages 2/3/4
       block 0) have identical parameter shapes and differ only in which
       convolutions are strided, which is a property of the forward.

       ⭐⭐ THE SPATIAL SIZE IS A BINDER, AND THAT IS NOT STYLISTIC. ResNet-50 ships
       at TWO resolutions: `resnet50in_fwd` at 224 = 32x7 and `resnet50in160_fwd`
       at 160 = 32x5, the second being where the quoted 76.66% comes from. One
       statement covers both, and the file CHECKS it -- two `example`s at the
       literal input types, plus `#guard`s on the ladder arithmetic. ⚠ Every
       resolution is written as an explicit nest of `2 * (...)` rather than as
       `8 * q`: those are equal naturals and NOT definitionally equal terms at a
       variable `q`, and each block signature demands its operand at exactly the
       spelling it names.

       ⛔ THREE kink clauses per bottleneck -- the two interior relus and the
       post-residual OUTER relu -- where ResNet-34's basic block has two and
       EfficientNet's MBConv has none. 48 clauses, bundled into 16.
       ⛔ `0 < q` is a real hypothesis, where ResNet-34 needed none: R34's ladder
       is at literals so `0 < 56` closes by computation, and ResNet-50's stem pool
       needs its output grid nonempty at a variable `q`.

       ⚠⚠ v1.5 STRIDE PLACEMENT, invisible to the types: the stride is on the 3x3,
       not the leading 1x1, so that convolution and its BatchNorm and relu run at
       the INPUT resolution. The v1 placement compiles, trains and descends and is
       a different net worth about 0.5 pt of top-1. ⚠ Symmetric padding at all
       five stride-2 sites.

       ⭐ The census is 161 updated parameters, which is `ResNet50RenderB`'s own
       docstring: stem 3 + 12 identity blocks x 9 + 4 projection blocks x 12 +
       head 2. The records' conv-bias slots are the `convBias := true` census and
       are quantified over, as ResNet-34's and MobileNetV2's are.

       ⭐ T2 IS FOUR PER-BLOCK-KIND GRAPHS AND ONE `rw` EACH, at
       `ResNet50RenderB`'s own tokens. ⚠ It uses `.addVB`, the batched add the
       render emits, where `ResNet34FullB.lean` uses `.addV` (`den` identical,
       `skel` not -- recorded in 4i and left alone there). ⚠ THE RESIDUAL OPERAND
       ORDER IS THE RENDER'S, AND THAT COSTS ONE `add_comm`: both projection
       blocks emit `addVB(body, projection)` while `residualProj proj body` adds
       `proj + body`, so those two faithfulness proofs close with a commutation
       step rather than by `simp` alone. Writing the graph in `residualProj`'s
       order would make `den` close by `rfl` and the emitted operand order wrong.
       The identity block needs nothing: `addVB(body, x)` IS `residual`'s order.
       ⚠ The bias operands call `biasName false "" c`, the render's own function,
       rather than a literal -- `ResNet50RenderB` has no `convBias` flag at all,
       so `%zb{c}` is the only name this net emits. ⛔ `ResNet34FullB.lean` writes
       the `convBias := true` names its render does not emit by default: the
       graph-operand form of the census trap, cosmetic, worth fixing when that
       file is next touched.

       ✅ CHECKED AGAINST THE COMMITTED BYTES, not asserted:
       `verified_mlir/resnet50_fwd.mlir`'s signature is 162 arguments = `%x` plus
       161 parameters with 12 projection slots, exactly the record's census, and
       every SSA name this file writes appears there.

       ⚠ WHAT IS STILL MISSING FOR THIS NET: T3, the two float budgets and the
       certified backward tie. T1 and T2 are two of seven tiers.

    5. The suite works over its own `Proofs.Mat m n := Fin m -> Fin n -> R`
       (definitionally Mathlib's `Matrix (Fin m) (Fin n) R`) with its own
       `mulVec/transpose/outer/mul`. This IS bridged to Mathlib's `Matrix`
       namespace by `LeanMlir/Proofs/Codegen/MatBridge.lean` (`Mat.mulVec_eq`,
       `Mat.transpose_eq`, `Mat.outer_eq`, `Mat.mul_eq`), so a downstream
       consumer can apply Mathlib's matrix algebra to the suite's outputs. The
       bridge is opt-in by design -- the core suite does not import it, keeping
       its import surface Matrix-free unless interop is wanted.

    6. NOT PROVED -- empirically validated only: that the nets train to good
       ImageNet accuracy, that StableHLO/IREE compilation is faithful, that the
       JAX pipeline agrees numerically, and that bf16 doesn't change results.
       These are engineering claims backed by runs and cross-checks, not
       theorems. The fp8-E4M3 "trainers" are host-side quantization emulation on
       fp32 kernels (the theorems are about the E4M3 value grid, the hardware
       has no fp8 units). Note the hardware-model direction has since STRENGTHENED:
       the binary32/E4M3 rounding models are now constructed (`rndP`, standard
       model proved) rather than axiomatized -- the earlier TrustedBridge
       named-axiom quarantine was retired, keeping the project at zero
       non-core axioms.

review:
  status: "agent-reviewed"   # also self-assessed; NOT externally peer-reviewed
  reviewers: []
  notes: >-
    Three independent checks beyond `lake build`: (1) an agent self-audit
    (tests/AUDIT_REPORT*.md) that found no axioms/sorries and surfaced the
    fidelity caveats above, plus a full `#print axioms` sweep of 2296
    declarations (tests/AuditAxioms.lean) run in CI; (2) mutation testing
    (corrupting a backward formula breaks the build at every mutation tried);
    (3) leanprover/comparator re-running Lean's kernel typechecker on 52
    theorems with a hard-coded permitted-axiom allowlist of exactly
    {propext, Quot.sound, Classical.choice} (the nanoda second-kernel pass is
    currently disabled in config pending a lean4export rebuild after a
    toolchain bump). External agent-driven review rounds (2026-07) drove the
    scorecard mechanization and the LipSDP tightening; no external HUMAN peer
    review.

