       were bounds proved one lemma down and discarded by a generic combinator -- the same shape
       as MobileNetV2's unused relu6 clamp:
         (a) `floatClose_swish`'s modulus was `mulErr + (1 + A/4)*e`, multiplying the inherited
             error by the WINDOW at each of nine swish sites. Bounding |sigma a - sigma b| by the
             gate's own range (<= 1) instead of by (1/4)|a-b| gives `A + |a-b|`, additive in the
             window (`swishScalar_lipschitz_abs'`); the modulus is now the min of the two.
         (b) `floatClose_seScale`'s window was derived as |float - real| + |real|, charging
             `A * Lg 0` -- the block window times the GATE'S error -- to the magnitude.
             `FloatClose`'s magnitude clause bounds the float gate too, so it is `A*Bg*(1+u)`.
       Ablated at the measured profile: both as they stood 1e1717/1e4179 (not statable), swish
       fixed only 1e211/1e212, seScale fixed only 1e55/1e799 (not statable), both fixed
       1e55/1e211. The lesson generalises past this net: when a whole-net fold overshoots, ablate
       the LEAVES in the generator before concluding anything about the architecture.

       ⭐ AND (a)'s PARENTHESIS WAS THE NEXT BLOCKER (2026-09-04). The note beside it said the
       true global Lipschitz constant of x*sigma(x) is ~1.1 and "getting THAT needs the decay of
       sigma', i.e. calculus" -- true of the SHARP constant, and it stopped anyone deriving a
       CRUDE one for a month. `swishScalarDeriv_abs_le` (Architectures/SwishSaturation.lean)
       proves |swish'| <= 2 globally in three elementary steps: sigma <= 1, sigma'(x) <=
       exp(-|x|) by a case split on the sign of x, and |x|exp(-|x|) <= 1 off
       Real.add_one_le_exp. It is the bound B0's BACKWARD diagBack slots take as their Ssw
       (the only prior one being (a)'s `1 + A/4` at the forward's certified window, 1.216e51 at
       the head alone), and it moves efficientnetInputGradB's fold from 1e431 -- past norm_num's
       ceiling, no theorem statable -- to 7.640e169. ⛔ Its mean-value corollary
       `swishScalar_lipschitz` (swish is globally 2-Lipschitz) beats BOTH of (a)'s branches and is
       worth 8 orders on this FORWARD (8.408e210 -> 3.679e202); it is deliberately NOT wired into
       `floatClose_swish`, because that moves `b0_float_logits_le` and is its own commit.

       ⚠ AND A THIRD QUADRATIC SITE. Squeeze-excite's modulus `mulErr q A Cg E Eg` carries
       `A * Eg` -- the block window times the gate error -- and the gate grows that error out of
       the same window through the squeeze's `GAP -> dense`. So SE is quadratic in the window for
       the same structural reason training-mode BatchNorm and LayerNorm are, and each of B0's
       three SE sites roughly DOUBLES the budget's exponent (1e25 -> 1e83 -> 1e199). B0 survives
       three; twenty would end it the way r34's 33 training-BN sites end its training-mode fold.
       The question to ask of a new architecture is therefore not "does it normalise" but "does
       any op consume a reduction of its own input and then multiply by that input".

