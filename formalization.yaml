status:
  scope: >-
    Machine-checked vector-Jacobian-product (backward-pass) correctness for the layer
    primitives of ten architectures and their whole-network compositions -- MLP, 2D CNN,
    BatchNorm-CNN, ResNet-34, ResNet-50, MobileNetV2, MobileNetV4-Conv-M, EfficientNet-B0,
    ConvNeXt-T and ViT-Tiny. On top of the VJP layer: (1) TRAIN-STEP TIES -- for each of the
    seven ImageNet-scale nets, every parameter gradient node of the batched train step is tied
    to the cotangent the emitted backward chain delivers, at the un-fused gradient node every
    optimizer tail consumes and the label-smoothed loss at a general target, with the batch
    size a binder and the data-parallel mean an AST node (fidelity 4e-4g); the SGD-inline
    steps of the ten nets that ship one are tied too. (2) FLOAT ERROR -- a binary32 rounding
    model constructed from scratch, whole-net float bridges carrying window and modulus as
    data, kernel-checked budgets for nine forwards and four backwards (interval folds, vacuous
    as numerical certificates, fidelity 4d), and every net's hand-written backward chain proven
    to BE the certified whole-net VJP. (3) ROBUSTNESS CERTIFICATES as theorems: the Tsuzuku
    Lipschitz-margin radius, per-class-pair LipSDP at trained weights, the Cohen smoothing
    radius end to end. (4) OPTIMIZER GEOMETRY: SGD/sign/Muon as steepest descent under a norm,
    Shampoo = single-step Muon. The StableHLO codegen and the training runs are engineered and
    empirically validated, not theorems (fidelity 2, 6).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: &core ["propext", "Quot.sound", "Classical.choice"]   # Lean/mathlib core only; no project axioms
  main_results:
    # A REPRESENTATIVE set, one row per kind of claim. The full audit is tests/AuditAxioms.lean
    # (`#print axioms` on every declaration that says something, run in CI); 52 are
    # independently kernel-rechecked by the comparator (tests/comparator/config.json). Every
    # row: 0 sorries, the three core axioms. The per-net numbers table is fidelity 4d.
    #
    # --- VJP layer ---
    # the chain rule for pdiv: composition, additive and multiplicative fan-in, finset sums
    - {declaration: "Proofs.pdiv_comp", file: "LeanMlir/Proofs/Foundation/Tensor.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # 2D convolution (the strided, depthwise and stride-4 forms are its siblings)
    - {declaration: "Proofs.conv2d_has_vjp3_correct", file: "LeanMlir/Proofs/Architectures/CNN.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # batch-norm's three-term backward (layer-norm is the same lemma at one row)
    - {declaration: "Proofs.bn_input_grad_correct", file: "LeanMlir/Proofs/Architectures/BatchNorm.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # softmax cross-entropy
    - {declaration: "Proofs.softmaxCE_grad", file: "LeanMlir/Proofs/Architectures/Attention.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # multi-head self-attention
    - {declaration: "Proofs.mhsa_has_vjp_mat_correct", file: "LeanMlir/Proofs/Architectures/Attention.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    #
    # --- Whole nets: forward + VJP at the net the artifact runs (T1), the typed graph (T2) ---
    # a kinked net at batch BN: ResNet-50's [3,4,6,3] bottlenecks, 48 relu clauses, q a binder (224 and 160 px)
    - {declaration: "Proofs.resnet50ForwardB_full_has_vjp_at_correct", file: "LeanMlir/Proofs/Architectures/ResNet50FullBVJP.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # a smooth net: ViT-Tiny's full body at depth 12, 3 heads, vector LayerNorm -- HasVJP everywhere
    - {declaration: "Proofs.vit_full_has_vjp_correct", file: "LeanMlir/Proofs/Architectures/Attention.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # a typed SHlo graph at the render's own tokens denotes the whole-net forward (MobileNetV4, 26 stages; every net has one)
    - {declaration: "Proofs.StableHLO.mnv4FwdGraphB_full_faithful", file: "LeanMlir/Proofs/Architectures/MobileNetV4FullB.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # non-degeneracy: a non-constant forward and a nonzero whole-net Jacobian at a witness (fidelity 4)
    - {declaration: "Mnv2Live.mnv2Live_forward_nonconstant", file: "LeanMlir/Proofs/Architectures/MobileNetV2.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    #
    # --- Train-step ties (T3): the fold at every gradient node, then the cotangent pinned ---
    # the fold, stated per op kind at the un-fused *GradB node all optimizer tails consume (r34's file is the template)
    - {declaration: "Proofs.ResNet34PoCB.convStridedWGradB_den", file: "LeanMlir/Proofs/Foundation/ResNet34FaithfulPoCB.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # the emitted six-op cotangent IS the label-smoothed loss's gradient at a general target (mixup/cutmix)
    - {declaration: "Proofs.smoothedCE_grad", file: "LeanMlir/Proofs/Foundation/SmoothedLossCot.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # a batched capstone: ResNet-50's 161 nodes at their chain cotangent; N, q and the LOSS (CE or BCE) binders; one replica
    - {declaration: "Proofs.ResNet50TieB.r50_net_tiedB", file: "LeanMlir/Proofs/Foundation/ResNet50TiePoCB.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # an SGD-inline capstone: ViT-Tiny's 200 parameters at the fused theta - lr*g ops (the family covers ten nets)
    - {declaration: "Proofs.ViTTiePoC.vit_net_tied_certified", file: "LeanMlir/Proofs/Architectures/ViTTiePoC.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    #
    # --- Data parallelism ---
    # with batch coupling (training-mode BN) the DP mean gradient is NOT the global-batch gradient: the two-replica witness
    - {declaration: "Proofs.dpMeanGrad_ne_globalBatchGrad", file: "LeanMlir/Proofs/Foundation/DataParallel.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # the collective as an AST node: den (adamW tail (allReduceMeanF R g)) = adamWStep at the replica mean
    - {declaration: "Proofs.adamW_at_allReduceMeanF", file: "LeanMlir/Proofs/Foundation/DataParallelNode.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    #
    # --- Certified backward ties (T6): the float tier's hand-written backward chain IS the
    #     certified whole-net VJP (fidelity 4d) ---
    # a kinked net: blocks opaque plus the shape check resnet34ForwardB_full_eq_slots
    - {declaration: "Proofs.r34InputGradB_eq_r34B_full_vjp", file: "LeanMlir/Proofs/Foundation/Resnet34BackCertifiedTieB.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # a smooth net one step further: the chain IS the pdiv-contracted Jacobian of the committed forward, via backward_unique
    - {declaration: "efficientnetInputGradB_full_correct", file: "LeanMlir/Proofs/Foundation/EfficientNetFullWholeBackCertifiedTie.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    #
    # --- Whole-net float budgets (fidelity 4d has the full table) ---
    # a fold: MobileNetV2 inference-BN forward, 1.444e96 / window 2154 -- the one non-vacuous window (relu6 clamps)
    - {declaration: "mnv2_float_logits_le", file: "LeanMlir/Proofs/Float/MobileNetV2FloatBudget.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # a CAP: EfficientNet-B0 16-block paper net, 2.416e287 / 1.886e279 at the 16 SE sigmoids, past norm_num's default threshold
    - {declaration: "b0Full_float_logits_le", file: "LeanMlir/Proofs/Float/EfficientNetFullFloatBudget.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # a backward: ResNet-34 training BN, 6.894e244 / 8.857e245, operating point |istd| <= 16
    - {declaration: "r34_grad_float_le", file: "LeanMlir/Proofs/Float/Resnet34BackFloatBudget.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    #
    # --- Other float-tier results ---
    # adjoint-chain capstone at the committed CIFAR-8 shape; does not bite at He magnitudes (fidelity 4c)
    - {declaration: "cifar8_chain_argmaxSafeH", file: "LeanMlir/Proofs/Architectures/Cifar8ChainCert.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # fp8-E4M3 quantization argmax preservation
    - {declaration: "FloatModel.linear_e4m3_argmax_preserved", file: "LeanMlir/Proofs/Float/FloatBridge.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    # a binary32 SGD step provably decreases CE at TRAINED weights
    - {declaration: "Proofs.TrainedLinearDescent.trained_linear_sgd_strictly_descends", file: "LeanMlir/Proofs/Training/TrainedLinearDescent.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: []}
    #
    # --- Certificates and optimizer geometry ---
    # Tsuzuku 2018 certified radius
    - {declaration: "Proofs.lipschitz_margin_certified_radius", file: "LeanMlir/Proofs/Certificates/LipschitzCert.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: [{statement: "Lipschitz-margin certified radius", source: "Tsuzuku, Sato, Sugiyama 2018 (arXiv:1802.04034)"}]}
    # mechanized 100-image LipSDP scorecard at trained weights (69/100)
    - {declaration: "Proofs.LipschitzCertDemo.scorecard_sdp", file: "LeanMlir/Proofs/Certificates/LipschitzCertScorecardSDP.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: [{statement: "LipSDP-Neuron one-hidden-layer SDP bound", source: "Fazlyab et al. 2019 (arXiv:1906.04893)"}]}
    # Cohen 2019 smoothing radius END-TO-END (the Gaussian Neyman-Pearson core is proved)
    - {declaration: "Proofs.smoothing_certified_radius_classifier", file: "LeanMlir/Proofs/Certificates/SmoothingGaussian.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: [{statement: "randomized-smoothing certified radius incl. the (1/sigma)-Lipschitz Gaussian probit (Neyman-Pearson core)", source: "Cohen, Rosenfeld, Kolter 2019 (arXiv:1902.02918); Salman et al. 2019 Lemma 2"}]}
    # optimizer geometry: Shampoo's single-step preconditioner = Muon's polar factor
    - {declaration: "Proofs.MuonGeometry.shampoo_eq_muon", file: "LeanMlir/Proofs/Foundation/MuonGeometry.lean", sorry_count: 0, axioms: *core, comparator_config: "", literature_dependencies: [{statement: "optimizer = steepest descent under a norm; Muon polar factor realizes the nuclear-norm dual", source: "Bernstein, Newhouse 2024 (arXiv:2409.20325)"}]}

automation:
  methods:
    - method: "agent"
      models: ["Qwen3+", "Opus 4.6+"]
      framework: "OpenCode + Claude Code"
      tool_setup: >-
        Lean 4 + Lake + Mathlib for the proofs; an independent kernel re-check via
        leanprover/comparator with the nanoda kernel; XLA/PJRT for StableHLO->binary
        compilation (IREE as the differential compiler); a parallel JAX (Lean->Python
        codegen) pipeline for empirical cross-checking on GPU/CPU. The audit report
        (tests/AUDIT_REPORT*.md) and mutation tests were themselves agent-assisted.
      cost:
        wall_time: ""        # not precisely tracked; project developed over months
        spend_usd: ""        # not tracked
        hardware: "three GPU workstations for training + codegen validation across both vendor stacks -- 4x RTX 4060 Ti and 4x RTX 3060 (NVIDIA/CUDA), 2x Radeon RX 7900 XTX (AMD/ROCm, gfx1100); API for proof work"
      prompting_notes: >-
        Mixed interactive + agentic. Proof development, codegen, the audit, and
        the empirical training runs were all done with AI assistance.
  spend_usd: ""              # not tracked
  notes: >-
    Heavily AI-assisted throughout -- proof authoring, MLIR/JAX codegen, the
    self-audit, and training. Not an unattended autonomous run; the author
    drove and reviewed the work.

fidelity:
  divergences: |
    The proved theorems form tiers; not everything the prose describes is a theorem. Sections
    1-6 are the standing disclosures, 4b-4f the axes the 2026-09 audits added, and 4g the label
    table for the per-package records that used to be written out here (their write-ups are
    planning/proofs_tier_to_paper_nets.md, planning/renderer_convergence.md and
    planning/mnv4_proofs_tier.md).

    1. STRONGEST -- layer VJP correctness. The per-layer backward formulas (dense, conv,
       batch-norm, layer-norm, softmax-CE, attention/MHSA, GELU, ...) are derived from Mathlib's
       `fderiv` and machine-checked; they are the bulk of the 52 comparator-rechecked theorems.

    2. CODEGEN TRUST BOUNDARY (disclosed gap). The canonical backward is the `fderiv`/`pdiv`
       expression, which at NON-smooth points (a ReLU input exactly 0, a pooling argmax tie)
       returns Mathlib's junk default of 0, where the emitted code uses the subgradient/argmax
       convention. They agree only at smooth points (`relu_codegen_matches_canonical`,
       `maxPool2_codegen_matches_canonical`); see LeanMlir/Proofs/README.md.

    3. SMOOTH-INPUT CONDITIONING. The strongest backprop-correctness results are pointwise
       (`HasVJPAt`, `vjp_comp_at`) under an explicit smooth-input hypothesis -- no ReLU kink, no
       pooling tie -- so every kinked net's whole-net VJP carries those clauses in its statement
       (32 for ResNet-34, 48 for ResNet-50, 35 relu6 for MobileNetV2, ~60 for MobileNetV4). The
       global instances (`relu_has_vjp`, `mlp_has_vjp`, `maxPool2_has_vjp3`) are codegen-shaped
       witnesses whose `correct` closes by `rfl`; the measure-zero non-smooth points are (2).

    4. FULL-NET RESULTS are "the network composes and has a VJP at a witness point". Separate
       non-degeneracy proofs rule out a vacuous witness: a non-constant forward and a nonzero
       whole-net Jacobian for MobileNetV2 (`Mnv2Live`) and the 2-channel live ResNet-34 at the
       real [3,4,6,3] depth (`ResNet34LiveSeal`, `ResNet34LiveFull`), both sealed at 224x224, plus
       trained-weight witnesses and a provable strict CE-descent step for the MLP/CNN/linear
       rungs (`TrainedMlpWitness`, `TrainedCnnSeal`, `TrainedLinearDescent`).

    4b. CERTIFICATE-LAYER CONDITIONING (disclosed hypotheses, all in-statement): the smoothing
       radius theorems require class probabilities in the OPEN interval (0,1) and speak about TRUE
       smoothed probabilities where the driver uses Clopper-Pearson ESTIMATES -- that gap is not
       formalized. The adjoint-chain float bounds use a per-op Higham model with a quarantined
       order-balanced reduction hypothesis. The LipSDP scorecards certify a FIXED 100-image subset
       at a FIXED epsilon -- an honest lower bound, not a dataset-wide claim.

    4c. THE ADJOINT-CHAIN TIER IS NOT BITING (disclosed 2026-09-02). `chain_adjointClose` /
       `chain_argmaxSafe` are correct depth-generic theorems, and `Cifar8ChainCert.cifar8ChainH` is
       the committed cifar8Verified layer list op for op, tied by rfl to the forward the emitted
       graph denotes. NOT BITING: the certificate's budget takes each stage at its WORST-CASE
       propagated window, which at He magnitudes grows 1 -> 10.5 -> 592 -> ... -> 4.6e18, so
       `chainBudgetH >= 1.8e13` against logits of ~10; the "chainBudget ~ 2.6" of
       scripts/adjoint_chain_probe.py is the same formula at MEASURED activation magnitudes, which
       no instantiation of the theorem can supply. What the tier adds is the committed SHAPE and
       the rfl tie, not a certificate that bites at trained weights.

    4d. WHOLE-NET FLOAT BUDGETS (disclosed 2026-09-02; thread closed 2026-09-05 as vacuous).
       Standing reference planning/float_budget_numbers.md; the ablation log is
       planning/archive/float_budget_numbers_log.md.

       THE DEFECT THAT STARTED IT. `FloatBridges f` bound the float implementation and its
       modulus existentially, so it was provable for ANY bounded `f` with the constant modulus
       `2B` and stated only boundedness while docstrings claimed a budget. FIXED:
       `FloatBridgesTo f fF` is a Type-valued structure carrying `mag` (output window) and `mod`
       (error modulus) as data, every combinator composes them explicitly, and a numeric bound on
       a whole-net `.mod` is a statement the kernel checks. The legacy `FloatBridges` statements
       remain and constrain no float implementation; do not cite them as budgets.

       THE NUMBERS. Each is closed over the real leaves, tied to the committed net by rfl and, for
       the forwards, to the rendered graph by the `*_faithful` theorems; every numeral is generated
       by scripts/float_budget_envelope.py and re-asserted by the kernel. Window = certified output
       magnitude; budget = |float - real| per logit (forwards) or per input pixel (backwards, on
       loss cotangents <= 1); unit input box; a profile measured on the trained checkpoint;
       eps >= 1e-5; u <= 2^-24.

           CIFAR-8 forward                         6.37e14   / 6.121e18   fold   cifar8_float_logits_le
           ResNet-34 forward, inference BN         1.548e209 / 3.152e211  fold   r34_float_logits_le
           ResNet-34 forward, training BN          1.752e81  / 8.748e80   CAP    r34_train_float_logits_le  (per example)
           MobileNetV2 forward, inference BN       1.444e96  / 2.154e3    fold   mnv2_float_logits_le
           MobileNetV2 forward, 17-block paper     8.176e16  / 2.152e4    CAP    mnv2Paper_float_logits_le  (52 BN sites capped; any class count)
           EfficientNet-B0 forward, inference BN   8.408e210 / 2.580e55   fold   b0_float_logits_le         (any batch size)
           EfficientNet-B0 forward, 16-block paper 2.416e287 / 1.886e279  CAP    b0Full_float_logits_le     (16 SE sigmoids capped; the window is honest)
           ConvNeXt-T forward                      9.738e130 / 4.871e130  CAP    cnx_float_logits_le
           ViT-Tiny forward                        4.794e108 / 2.397e108  CAP    vit_float_logits_le
           ResNet-34 backward, training BN         6.894e244 / 8.857e245  fold   r34_grad_float_le          (|istd| <= 16)
           MobileNetV2 backward, training BN       1.076e152 / 4.750e153  fold   mnv2_grad_float_le
           ConvNeXt-T backward                     1.563e250 / 1.023e251  fold   cnx_grad_float_le          (|istd| <= 16)
           EfficientNet-B0 backward, training BN   1.578e182 / 7.104e182  fold   b0_grad_float_le           (batch size 1)

       WHAT KIND OF STATEMENT EACH IS. A "fold" composes the per-op rounding moduli. A "CAP" goes
       through `FloatBridgesTo.capped`, whose modulus is `min(mod, 2*mag)`, and the `2*mag` branch
       closes at every normalisation site: it states only that the float and the real output both
       lie in the certified window (the triangle inequality; budget/window = 2.00 is the tell,
       except where later stages collapse the window). A normalisation that reduces its statistics
       out of its own input has a modulus QUADRATIC in the window (training-mode BatchNorm,
       LayerNorm, squeeze-excite; attention exponentially), which is why those forwards are caps;
       inference BatchNorm is affine in x, so those are folds; every backward is a fold (a VJP is
       linear at a fixed point). The two batch qualifiers are structural: `bnGradInputReMag`'s
       gain carries N*h*w, so a batch-BN number is one theorem per N. The `norm_num` "ceiling" at
       ~1e253 is Lean's `exponentiation.threshold` option (default 256), not a wall.

       WHAT IS SUPPLIED. Device kernels with no IEEE specification carry an accuracy hypothesis of
       1e-2 (`DeviceRsqrt`, `DeviceSigmoid`, `DeviceGelu`, `DeviceExp` with the softmax side
       condition); the device MEAN is derived (`FloatModel.bnMean_close_of`). The backwards also
       take saved-activation accuracies at 1e-2 which NO forward statement discharges, so no
       forward-then-backward composition is claimed anywhere.

       WHAT IS NOT CLAIMED. Numerical accuracy. The budgets are 1e16 to 1e287 against logits of
       order 10 -- interval folds at worst-case windows through 30 or more layers, which cannot be
       made to bite by more work of this kind (on ResNet-34 the conv fan-in face is 14 to 95 times
       loose per layer, and even at the measured face the training forward lands at 1e19). The one
       non-vacuous number is MobileNetV2's WINDOW, 2154, because relu6 clamps at 6. What the
       numbers DO certify is the float program's shape: every stage present, at the right fan-in,
       in the right composition, at the right normalisation mode, kernel-checked.

       THE PADDING CONVENTION, CLOSED (2026-09-05). EfficientNet-B0's stem and MobileNetV2's five
       stride-2 sites are XLA-SAME in every shipped artifact (TF-origin references); the Proofs
       tier was re-spelled to `flatConvStride2Xla` / `depthwiseStride2FlatXla` and all four numbers
       reproduced to the digit (a decimation picks coordinates). ResNet-34/50, ConvNeXt, ViT,
       MobileNetV4's UIB bodies and B0's own strided depthwises are symmetric, correctly.

       THE TIES. Every net's hand-written backward chain is proven to BE the certified whole-net
       VJP, with a shape check that the opaque-block chain IS the committed forward: the
       per-example `r34InputGrad_eq_resnet34_vjp`, `mnv2InputGrad_eq_mobilenetv2_vjp`,
       `convnextInputGrad_eq_convNextForwardTCh_vjp`, `efficientnetInputGradB_full_correct` (16
       blocks, through `HasVJP.backward_unique`) and `vitInputGradK_eq_vitForwardKV_vjp` (depth 12,
       3 heads, vector LN), and the batched `*InputGradB_eq_*_vjp` family of 4g. Closing them
       found drift no review had: a reversed 2x2 pool where the forward pools 3x3/s2, `id` in
       ConvNeXt's head-LN slot, ViT's float cone at scalar affines, an even-kernel adjoint that
       was not one, and a dozen wrong docstring counts. Nothing trained was affected; in every
       case the emitted program was right and a hand-written spelling of the same map had drifted.
       A `den` stated as the certified VJP cannot drift; only a theorem naming both catches it.

    4e. THE BATCHNORM WORLD (disclosed 2026-09-06; port complete 2026-09-07). Training-mode
       BatchNorm reduces mu/var out of the activation, and PER-EXAMPLE (`[2,3]`,
       `bnPerChannelTensor3`) and BATCH (`[0,2,3]`, `bnBatchTensor4` / `StableHLO.bnBatchLA`) are
       different functions of the same architecture -- the one op that couples examples. ResNet-34
       and MobileNetV2 shipped both: the per-example SGD trainers, and the batch-BN Adam/momentum
       artifacts every quoted ImageNet accuracy comes from. Every Proofs tier for those two nets
       was at PER-EXAMPLE BN, so the certified net and the net behind the headline number were
       different functions; that was undisclosed until 2026-09-06. THE DECISION: port both nets'
       tiers to batch BN. DONE for every statement that says something -- T1, T2, T3 and T6 at
       `bnBatchLA` for both (4g rows 4g-4j, 4n); ResNet-50 and MobileNetV4 were batched from the
       start. T4/T5 (the float budgets) are declined by 4d. `N` is the PER-REPLICA batch
       throughout: nothing all-reduces BatchNorm statistics.

    4f. THE OPTIMIZER FORM, CLOSED (2026-09-06/07). Every non-SGD-inline train step -- the Adam,
       momentum, RMSProp, LAMB, EMA, clipped, accumulated, data-parallel and bf16 families, every
       ImageNet artifact -- emits the RAW gradient (`*Grad` / `*GradB`) and hands it to an
       optimizer tail; only the SGD-inline `<net>_train_step.mlir` emits the fused `theta - lr*g`.
       Every fold is now stated at the gradient node (the fusion is `rfl`, `*Sgd_eq_grad`), so one
       lemma per op kind covers every tail, and every tail is certified (`adamW_triple_faithful`,
       `mom_pair_faithful`, `rmsProp_triple_faithful`, `lamb_triple_faithful`,
       `clipGrad_faithful`, `dropPathB_faithful`; EMA and accumulation are `adamMNextF` /
       `momVNextF` at their other reading). The five capstones are re-pointed at that node, the
       smoothed loss at a general target (`SmoothedLossCot`, `BceLossCot`) and the batched index
       (4g rows 4g, 4j, 4m, 4r, 4s; B0's `efficientnet_net_tiedG`). The bf16 twins are NOT the
       same node: a bf16 render emits `*GradBBf16` constructors whose `den` rounds the operands
       and the result once outside the batch sum, and those carry their own lemmas.

    4g. THE PROOFS-TIER PORT (2026-09-06 to 09-07), the record the labels 4g-4t used to carry
       here in full; the write-ups are planning/proofs_tier_to_paper_nets.md,
       planning/renderer_convergence.md and planning/mnv4_proofs_tier.md. What landed: every
       ImageNet-scale net is ONE batched chain (the per-example renderers of ResNet-34 and
       MobileNetV2 retired, ConvNeXt's thirteen train steps moved 78 conv-VJP lines by
       decision, ViT's nineteen artifacts byte-identical); T1/T2/T3/T6 at that chain for all
       seven nets, ResNet-50 and MobileNetV4-Conv-M from nothing; data parallelism as a theorem
       (the all-reduced mean is the gradient of the mean loss, provably NOT the global-batch
       loss under batch BN) and as the AST node `allReduceMeanF`. STILL OPEN, and disclosed:
       T4/T5 beyond 4d's table (declined, vacuous); no accuracy is quoted for MobileNetV4-Conv-M;
       ConvNeXt's and ViT's SGD-inline `*_train_step.mlir` stay per-example and their `*TiePoC`
       ties are at those bytes; `convBack` and `convBackBatched` -- two emitters for one VJP --
       are not tied to each other in Lean; the host-side sharding and lockstep (DP piece 3) are
       driver logic checked by the `*-dp-check` gates, not theorems.

    5. The suite works over its own `Proofs.Mat m n := Fin m -> Fin n -> R` (definitionally
       Mathlib's `Matrix (Fin m) (Fin n) R`), bridged opt-in to Mathlib's `Matrix` namespace by
       `LeanMlir/Proofs/Codegen/MatBridge.lean`.

    6. NOT PROVED -- empirically validated only: that the nets train to good ImageNet accuracy,
       that StableHLO/XLA compilation is faithful, that the JAX pipeline agrees numerically, and
       that bf16 doesn't change results. The fp8-E4M3 "trainers" are host-side quantization
       emulation on fp32 kernels. The binary32/E4M3 rounding models are constructed (`rndP`,
       standard model proved) rather than axiomatized; the project carries zero non-core axioms.

       THE ENGINE IS MID-REWRITE. Everything since v0.6.3 (2026-08-03, the PJRT backend) has been
       rebuilding the execution side in place -- XLA/PJRT replacing IREE as the training engine,
       bf16 through the emitters, every net onto one batched chain, and the Proofs tier ported
       to the artifacts that actually train (4e-4g) -- under a deliberate licence to break and
       rethink rather than preserve. `main` is the integration branch for that work; the next
       tag collects all of it, and nothing in this file should be read as describing v0.6.3.

review:
  status: "agent-reviewed"   # also self-assessed; NOT externally peer-reviewed
  reviewers: []
  notes: >-
    Three independent checks beyond `lake build`: (1) an agent self-audit
    (tests/AUDIT_REPORT*.md) that found no axioms/sorries and surfaced the
    fidelity caveats above, plus a `#print axioms` sweep of every audited
    declaration (tests/AuditAxioms.lean) run in CI; (2) mutation testing
    (corrupting a backward formula breaks the build at every mutation tried);
    (3) leanprover/comparator re-running Lean's kernel typechecker on 52
    theorems with a hard-coded permitted-axiom allowlist of exactly
    {propext, Quot.sound, Classical.choice} (the nanoda second-kernel pass is
    currently disabled in config pending a lean4export rebuild after a
    toolchain bump). External agent-driven review rounds (2026-07) drove the
    scorecard mechanization and the LipSDP tightening; no external HUMAN peer
    review.

alignment:
  namespace: "Proofs"
  statements:
    - source: "Dense layer backward (weight + bias gradients)"
      lean: "dense_weight_grad_correct / dense_bias_grad_correct"
      module: "LeanMlir/Proofs/Foundation/MLP.lean"
      status: "proved"
      note: ""
    - source: "2D convolution backward"
      lean: "conv2d_has_vjp3_correct"
      module: "LeanMlir/Proofs/Architectures/CNN.lean"
      status: "proved"
      note: ""
    - source: "Batch normalization three-term backward"
      lean: "bn_input_grad_correct"
      module: "LeanMlir/Proofs/Architectures/BatchNorm.lean"
      status: "proved"
      note: ""
    - source: "Multi-head self-attention backward (Q/K/V) + full ViT body"
      lean: "mhsa_has_vjp_mat_correct / vit_full_has_vjp_correct"
      module: "LeanMlir/Proofs/Architectures/Attention.lean"
      status: "proved"
      note: ""
    - source: "ReLU / max-pool backward at non-smooth points"
      lean: "relu_codegen_matches_canonical / maxPool2_codegen_matches_canonical"
      module: "LeanMlir/Proofs/Foundation/MLP.lean, LeanMlir/Proofs/Architectures/CNN.lean"
      status: "proved"
      note: "smooth-point bridge only; non-smooth points are a disclosed trust boundary"
    - source: "Live-network non-degeneracy + nonzero-Jacobian seal (ResNet-34, incl. full [3,4,6,3] depth)"
      lean: "liveFwd2_nonconstant / liveFwd2_jacobian_nonzero (empty chains); liveFwd2Full_nonconstant / liveFwd2Full_jacobian_nonzero + liveFwd2Full_backward_nontrivial (full 16-block depth)"
      module: "LeanMlir/Proofs/Foundation/ResNet34LivePC.lean, LeanMlir/Proofs/Training/ResNet34LiveSeal.lean, LeanMlir/Proofs/Foundation/ResNet34LiveFull.lean"
      status: "proved"
      note: "2-channel live ResNet-34, real [3,4,6,3] depth; sealed at a channel-symmetric base Y (maxpool no-tie + carrier vanishes; identity blocks wash out through BN)"
    - source: "Committed train step = real loss-driven backward (per-net ties: the seven ImageNet-scale nets at their batched steps, the ten SGD-inline steps)"
      lean: "<net>_net_tiedB / _tiedG / _tiedGB (batched, un-fused gradient node, smoothed loss, N a binder); the <net>_net_tied_certified family (SGD-inline)"
      module: "LeanMlir/Proofs/Foundation/*TiePoCB.lean, LeanMlir/Proofs/Architectures/*TiePoCG*.lean, LeanMlir/Proofs/Architectures/*TiePoC.lean"
      status: "proved"
      note: "genuine backward cotangent, not a free forall-cotangent; one replica, composing with allReduceMeanF (fidelity 4g); committed-spec ties for the 5 ImageNet nets in SpecVJP"
    - source: "Binary32 rounding model + whole-net float-error budgets + certified backward ties"
      lean: "rndP_err; <net>_float_logits_le (9 forwards) and <net>_grad_float_le (4 backwards); the *InputGrad_eq_*_vjp / *InputGradB_eq_*_vjp ties with their *_eq_slots shape checks; chain_adjointClose; cifar8_chain_argmaxSafeH"
      module: "LeanMlir/Proofs/Float/Binary32Instance.lean, LeanMlir/Proofs/Float/*FloatBudget.lean, LeanMlir/Proofs/Foundation/*CertifiedTie*.lean, LeanMlir/Proofs/AdjointChain*.lean, LeanMlir/Proofs/Architectures/Cifar8ChainCert.lean"
      status: "proved"
      note: "rounding model CONSTRUCTED (former hardware axioms discharged); the budgets are interval folds, vacuous as numerical certificates, five of them caps (fidelity 4d); the CIFAR-8 argmax certificate does not bite at trained magnitudes (fidelity 4c)"
    - source: "Tsuzuku 2018 Lipschitz-margin certified radius + LipSDP scorecards at trained weights"
      lean: "lipschitz_margin_certified_radius; scorecard; scorecard_sdp / scorecard_sdp_uncon"
      module: "LeanMlir/Proofs/Certificates/LipschitzCert.lean, LeanMlir/Proofs/LipschitzCertScorecard*.lean"
      status: "proved"
      note: "fixed 100-image subset at fixed epsilon -- honest lower bound (69/100 vs 72/100 PGD bracket)"
    - source: "Cohen 2019 randomized-smoothing certified radius (incl. the Gaussian Neyman-Pearson core)"
      lean: "smoothing_certified_radius_classifier via smoothing_probit_lipschitz / stdGaussian_np_shift"
      module: "LeanMlir/Proofs/Certificates/SmoothingGaussian.lean"
      status: "proved"
      note: "end-to-end: quantile inversion, Cameron-Martin shift, rotation-invariance dimension reduction all proved; requires class probabilities in (0,1); the driver's Monte-Carlo estimation gap is not formalized"
    - source: "Optimizer-as-steepest-descent ladder (SGD / sign / Muon / Shampoo, Newton-Schulz)"
      lean: "muon_polar_steepest, shampoo_eq_muon, muon_polar_nearest_orthogonal + spectral-step lemma"
      module: "LeanMlir/Proofs/Foundation/MuonGeometry.lean, LeanMlir/Proofs/Foundation/MuonNewtonSchulz.lean"
      status: "proved"
      note: "14 theorems; singular-G SVD completion + Newton-Schulz convergence dynamics left open"
    - source: "StableHLO/XLA codegen faithfulness, JAX numeric agreement, training accuracy"
      lean: "(none -- empirical)"
      module: ""
      status: "not-formalized"
      note: "validated by runs + cross-checks, not by theorems"

acknowledgements: >-
  Built on Mathlib (foundation: fderiv / Differentiable). Independent kernel
  re-checking via leanprover/comparator and the nanoda kernel. StableHLO/XLA
  for compilation, IREE as the differential compiler; JAX for cross-checking.
  Architectural coverage follows "Convolutional Neural Networks with Swift for
  TensorFlow" (Apress, 2021).
