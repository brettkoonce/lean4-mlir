    4g. RESNET-34's TRAIN-STEP TIE AT THE NET THAT TRAINS (2026-09-06). 4f
       closed the optimizer form at the FOLD, where the cotangent is still a free
       variable. For ResNet-34 the cotangent is now pinned:
       `Foundation/ResNet34TiePoCB.lean` (763 lines, ~2 s) states every parameter
       gradient node of the batched, batch-BatchNorm train step at the cotangent
       the emitted backward chain delivers, threaded from the loss down through
       the certified head backward and the sixteen certified block backwards over
       `resnet34ForwardB_full`'s own forward prefixes. With 4.1b-4.1e that is
       ResNet-34's T3 complete at batch BatchNorm.

       ⭐ THE BLOCK COTANGENTS ARE NOT DERIVED. The per-example tie
       (`ResNet34ChainClose.lean`) spells per-block cotangent vectors out by hand,
       because no whole-block VJP existed when it was written. 4.1d's
       `r34IdB_has_vjp_at` / `r34DownB_has_vjp_at` ARE the certified block
       backwards, and `r34{BasicBlock,DownBlock}BackBatchedGraph_faithful` already
       proves the emitted seven-node fan-in denotes them, so `r34IdCotIn_eq_vjp`
       closes by `rfl` and `r34DownCotIn_eq_vjp` by one `add_comm`. The cross-block
       chain is a composition of certified VJPs, not a re-derivation.

       ⭐ THE TIE HAS TWO HALVES WITH DIFFERENT HYPOTHESES, AND THEY ARE KEPT
       APART. The capstone `r34_net_tiedB` carries NO smoothness hypothesis and no
       `0 < eps`: the folds are `forall cot` statements instantiated at explicitly
       constructed cotangents. The kink and positivity conditions enter only in the
       two `_eq_vjp` lemmas, which say those constructed cotangents ARE the
       certified whole-net backward. `N` is a binder throughout.

       ⭐ THE LOSS COTANGENT IS THE LABEL-SMOOTHED ONE, AT A GENERAL TARGET.
       Every previous tie pinned its top-of-chain cotangent to
       `softmax(logits) - oneHot label`. The batched renders compose
       `(softmax(z) - t + alpha*t - alpha/K)/B` from six kit ops, with `t` the
       graph input `%onehot` -- a soft vector under mixup or cutmix.
       `Foundation/SmoothedLossCot.lean` gives cross-entropy against a target
       DISTRIBUTION (`softCE`), its gradient with no hypothesis on `t` at all, and
       `smoothedCE_grad`: the emitted expression IS the smoothed loss's gradient,
       exactly, not an approximation of it. Shared, and what 4f's capstone
       re-pointing will need for the other four nets.

