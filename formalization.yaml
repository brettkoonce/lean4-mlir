fidelity:
  divergences: |
    The proved theorems form tiers; not everything the prose describes is a theorem. This is
    the standing state at v0.8.0 (2026-11-09). How each tier was reached is in planning/archive/
    (proofs_tier_to_paper_nets.md, renderer_convergence.md, mnv4_proofs_tier.md,
    float_budget_numbers.md, audit_reports/); the reader-facing statement is the book's
    Appendix B ("On Verification", blueprint/src/content.tex), and the per-chapter theorem
    budget is its Table B-1.

    1. LAYER VJP CORRECTNESS (strongest). Every per-layer backward (dense, conv, batch norm,
       layer norm, softmax-CE, attention/MHSA, GELU, ...) is derived from Mathlib's `fderiv`
       and machine-checked; these are the floor of the 110 comparator-rechecked theorems.

    2. CODEGEN TRUST BOUNDARY. The canonical backward is the `fderiv`/`pdiv` expression; at a
       non-smooth point (a ReLU input exactly 0, a max-pool window whose max is attained at
       more than one cell) it is Mathlib's junk value 0 where the emitted code uses the
       subgradient/argmax convention. They agree at smooth points only
       (`relu_codegen_matches_canonical`, `maxPool2_codegen_matches_canonical`;
       LeanMlir/Proofs/README.md).

    3. SMOOTH-INPUT HYPOTHESES. The whole-net VJPs are pointwise (`HasVJPAt`, `vjpCompAt`)
       under explicit smooth-input clauses carried in the statement: 32 for ResNet-34, 48 for
       ResNet-50, 35 relu6 for MobileNetV2 and 38 for MobileNetV4-Conv-M, the last two
       weight-only because each relu sits on a BatchNorm output. The ResNet stem certifies ReLU
       and pool as one layer (`stemReluPoolLayer`), where an all-zero window is locally
       constant; the CNN descent rungs state the pool margin up to twins
       (`MaxPool2MarginQUpTo`). The global instances (`reluHasVJP`, `mlpHasVJP`,
       `maxPool2HasVJP3`) are the canonical `pdiv` backward by definition and say nothing
       about the emitted code; the emitted backward meets them only through the bridges of 2.

    4. WHOLE-NET RESULTS are "the net composes and has a VJP", stated on the forward its
       artifacts run, with a non-degeneracy seal (non-constant forward, nonzero Jacobian) at a
       witness so the result is not vacuous: ResNet-34 (`ResNet34FullBSeal`: 64-512 channels,
       [3,4,6,3], 7x7/s2 stem, batch BN, 224x224, N = 2), ResNet-50 with the resolution a
       binder covering 224 and 160 px (`ResNet50FullBSeal`), MobileNetV2 (`MobileNetV2FullBSeal`,
       all seventeen bottlenecks), MobileNetV4-Conv-M at timm's `mobilenetv4_conv_medium`
       (`MobileNetV4FullBSeal`, all 21 UIB blocks). The small nets add trained-weight witnesses
       and strict CE-descent steps (`Training/Trained/*`, `TrainedLinearDescent`,
       `TrainedCnnDescent*`).

    5. BATCHNORM. Per-example (`bnPerChannelTensor3`) and batch (`bnBatchTensor4`,
       `StableHLO.bnBatchLA`) BatchNorm are different functions of one architecture, the one op
       that couples examples. Every ImageNet-scale tier (T1 forward + VJP, T2 typed graph, T3
       step tie, T6 backward tie) is stated at batch BN, `N` the per-replica batch. The sync-BN
       data-parallel renders of ResNet-34/50, MobileNetV2/V4 and EfficientNet-B0 all-reduce the
       statistics and are tied at batch R*N (the sync rows of main_results); the all-reduced
       mean gradient is the gradient of the mean loss and provably not the global-batch
       gradient under unsynchronised batch BN (`dpMeanGrad_ne_globalBatchGrad`).

    6. TRAIN-STEP TIES (T3). Every non-SGD-inline step emits the raw gradient node and hands it
       to an optimizer tail; only the SGD-inline `<net>_train_step.mlir` fuses `theta - lr*g`.
       Every fold is stated at that node, and every tail is certified (`adamW_triple_faithful`,
       `mom_pair_faithful`, `rmsProp_triple_faithful`, `lamb_triple_faithful`,
       `clipGrad_faithful`, `dropPathB_faithful`; EMA and accumulation as `adamMNextF` /
       `momVNextF`). The ties take the renderers' `bf16` flag through one switch
       (`PrecisionSwitch`; a bf16 render read at the identity rounding is its f32 peer,
       `Bf16Erasure`) and every training-mask site of the seven ImageNet jobs, dropout and
       drop-path, as binders (`Foundation/DropSites`, the per-net `*DropBlock.lean`), so each
       shipped artifact is reached at its gradient nodes with only its optimizer tail outside.
       The loss-gradient capstones (`*_net_lossGrad`) make each node the loss's derivative in
       its parameter.

    7. THE FLOAT TIER. `FloatModel` is a rounding operator with relative error `u`; binary32
       and fp8-E4M3 are constructed as round-to-nearest with the standard model proved
       (`rndP_err`, `RndP.lean`), no hardware axiom. `FloatClose` is the one per-operator
       closeness form, composing through blocks and the additive skip; every net's hand-written
       backward chain is proved to be the certified whole-net VJP (`*InputGradB_eq_*_vjp`, the
       seven nets; `Foundation/BackwardMaps.lean` and `Nets/*/*BackChains.lean` hold the
       chains). No whole-net numeric error budget and no adjoint-chain tier are stated
       (planning/archive/float_budget_numbers.md). Padding is XLA-SAME at EfficientNet-B0's stem
       and MobileNetV2's five stride-2 sites and symmetric everywhere else, in artifacts and
       statements alike.

    8. CERTIFICATES. The smoothing radius theorem speaks about true smoothed class
       probabilities in (0,1); the driver's Clopper-Pearson estimate is tied to it
       (`smoothing_cp_certified`, `smoothing_cp_certified_net`, instantiated at the trained
       `mlpT`), and the 784-dim driver checkpoints are not themselves tied. LipSDP: 8
       per-image certificates proved at a fixed epsilon; the count over a 100-image subset is
       an exact-rational measurement (generated headers), not a theorem.

    9. OPEN, AND DISCLOSED. ConvNeXt's and ViT's SGD-inline `*_train_step.mlir` are per-example
       and their `*StepTie` ties are at those bytes; `convBack` and `convBackBatched`, two
       emitters for one VJP, are not tied to each other in Lean; the host-side sharding and
       lockstep of data parallelism are driver logic checked by the `*-dp-check` gates, not
       theorems; the step ties are at the Imagenette specs (SpecVJP), not the ImageNet specs.

    10. NOT PROVED, EMPIRICAL ONLY: that the nets train to the reported accuracies, that
       StableHLO/XLA compilation is faithful, that the JAX pipeline agrees numerically, that
       bf16 does not change results. The fp8-E4M3 "trainers" are host-side quantization
       emulation on fp32 kernels. The project carries zero non-core axioms (`#audit_axioms`,
       tests/AuditAxioms.lean, run in CI).

    11. `Proofs.Mat m n := Fin m -> Fin n -> R` is definitionally Mathlib's `Matrix (Fin m)
       (Fin n) R`, bridged opt-in by `LeanMlir/Proofs/Foundation/MatBridge.lean`.

review:
  status: "agent-reviewed"   # also self-assessed; NOT externally peer-reviewed
  reviewers: []
  notes: >-
    Three independent checks beyond `lake build`: (1) an agent self-audit
    (planning/archive/audit_reports/) that found no axioms/sorries and surfaced the
    fidelity caveats above, plus a `#print axioms` sweep of every audited
    declaration (tests/AuditAxioms.lean) run in CI; (2) mutation testing
    (corrupting a backward formula breaks the build at every mutation tried);
    (3) comparator (`lake comparator --paranoid`) re-running Lean's kernel and
    five independent checkers (leanchecker-paranoid, lean4lean, nanoda,
    con-leche, con-ron) on 110
    theorems -- the layer-VJP floor plus every declaration listed under
    main_results above -- with a permitted-axiom allowlist of exactly
    {propext, Quot.sound, Classical.choice}. External agent-driven review rounds (2026-07) drove the
    scorecard mechanization and the LipSDP tightening; no external HUMAN peer
    review.

alignment:
  namespace: "Proofs"
  statements:
    - source: "Dense layer backward (weight + bias gradients)"
      lean: "denseWeightGrad_correct / denseBiasGrad_correct"
      module: "LeanMlir/Proofs/Foundation/MLP.lean"
      status: "proved"
      note: ""
    - source: "2D convolution backward"
      lean: "conv2dHasVJP3_correct"
      module: "LeanMlir/Proofs/Architectures/CNN.lean"
      status: "proved"
      note: ""
    - source: "Batch normalization three-term backward"
      lean: "bn_input_grad_correct"
      module: "LeanMlir/Proofs/Architectures/BatchNorm.lean"
      status: "proved"
      note: ""
    - source: "Pair tile (two dense maps outer-summed into an L x L map) backward: the two weight gradients"
      lean: "PairTile.tileWHasVJP / PairTile.tileWjHasVJP, and PairTile.tileWPairHasVJP / PairTile.tileWjPairHasVJP with host pair planes appended"
      module: "LeanMlir/Proofs/Foundation/PairTile.lean"
      status: "proved"
      note: "no input gradient: the residue blocks are the host's (a frozen language model's output)"
    - source: "Multi-head self-attention backward (Q/K/V) + full ViT body"
      lean: "mhsaHasVJPMat_correct / vitFullHasVJP_correct (the weight-shared scalar-LN tower) / vitTinyHasVJP_correct (depth 12, distinct blocks, vector LN)"
      module: "LeanMlir/Proofs/Architectures/Attention.lean, LeanMlir/Proofs/Nets/ViT/ViTWholeBackCertifiedTie.lean"
      status: "proved"
      note: ""
    - source: "ReLU / max-pool backward at non-smooth points"
      lean: "relu_codegen_matches_canonical / maxPool2_codegen_matches_canonical"
      module: "LeanMlir/Proofs/Foundation/MLP.lean, LeanMlir/Proofs/Architectures/CNN.lean"
      status: "proved"
      note: "smooth-point bridge only; non-smooth points are a disclosed trust boundary"
    - source: "Whole-net non-degeneracy + nonzero-Jacobian seal (ResNet-34, full width, batch BN, 224x224)"
      lean: "sealX_nonconstant / sealX_jacobian_nonzero + sealX_backward_nontrivial"
      module: "LeanMlir/Proofs/Nets/ResNet/ResNet34FullBSeal.lean, LeanMlir/Proofs/Training/BatchSealKit.lean"
      status: "proved"
      note: "on resnet34ForwardBFull itself (64-512 channels, [3,4,6,3], batch BN, N=2, structural weights); the carrier is the difference between the two examples, the only kink left is the stem pool, and it shifts with the carrier"
    - source: "Whole-net non-degeneracy + nonzero-Jacobian seal (ResNet-50, full width, batch BN, both shipped resolutions)"
      lean: "sealX_nonconstant / sealX_jacobian_nonzero + sealX_backward_nontrivial"
      module: "LeanMlir/Proofs/Nets/ResNet/ResNet50FullBSeal.lean, LeanMlir/Proofs/Training/BatchSealKit.lean"
      status: "proved"
      note: "on resnet50ForwardBFull itself (the [3,4,6,3] bottleneck ladder, batch BN, N=2, structural weights), q a binder with 0 < q and q <= 7 so 224 px and 160 px are instances; 48 relu clauses discharged, five carrier BNs (stem + one projection per stage)"
    - source: "Committed train step = real loss-driven backward (per-net ties: the seven ImageNet-scale nets at their batched steps, the ten SGD-inline steps)"
      lean: "<net>_net_tiedB / _tiedG / _tiedGB (batched, un-fused gradient node, smoothed loss, N a binder); the <net>_net_tied family (SGD-inline)"
      module: "LeanMlir/Proofs/Nets/*/*StepTieB.lean, LeanMlir/Proofs/Nets/*/*StepTieG*.lean, LeanMlir/Proofs/Nets/*/*StepTie.lean"
      status: "proved"
      note: "genuine backward cotangent, not a free forall-cotangent; one replica, composing with allReduceMeanF (fidelity 5); Imagenette-spec ties in SpecVJP; the ImageNet specs are not tied"
    - source: "Binary32 rounding model + certified backward ties"
      lean: "rndP_err; the *InputGrad_eq_*_vjp / *InputGradB_eq_*_vjp ties with their *_eq_slots shape checks"
      module: "LeanMlir/Proofs/Float/Binary32Instance.lean, LeanMlir/Proofs/{Architectures,Nets/*}/*CertifiedTie*.lean"
      status: "proved"
      note: "rounding model CONSTRUCTED (former hardware axioms discharged); no whole-net numeric budget and no adjoint-chain tier are stated (fidelity 7)"
    - source: "Tsuzuku 2018 Lipschitz-margin certified radius + LipSDP scorecards at trained weights"
      lean: "lipschitz_margin_certified_radius; scorecard; scorecard_sdp / scorecard_sdp_uncon"
      module: "LeanMlir/Proofs/Certificates/LipschitzCert/Basic.lean, LeanMlir/Proofs/Certificates/LipschitzCert/Scorecard*.lean"
      status: "proved"
      note: "8 proved per-image certificates at fixed epsilon; the count over a fixed 100-image subset is measured by exact rational arithmetic (generated headers), not proved"
    - source: "Cohen 2019 randomized-smoothing certified radius (incl. the Gaussian Neyman-Pearson core)"
      lean: "smoothing_certified_radius_classifier via smoothing_probit_lipschitz / stdGaussian_np_shift; smoothing_cp_certified; smoothing_cp_certified_net"
      module: "LeanMlir/Proofs/Certificates/Smoothing/Gaussian.lean, LeanMlir/Proofs/Certificates/Smoothing/CP.lean, LeanMlir/Proofs/Certificates/Smoothing/NetSemantics.lean"
      status: "proved"
      note: "end-to-end: quantile inversion, Cameron-Martin shift, rotation-invariance dimension reduction all proved; the Monte-Carlo gap is closed (Hoeffding, then exact Clopper-Pearson at the driver's tail polynomial) and the (0,1) hypothesis is discharged for a net's argmax; the 784-dim driver checkpoints are not themselves tied (fidelity 8)"
    - source: "Optimizer-as-steepest-descent ladder (SGD / sign / Muon / Shampoo, Newton-Schulz)"
      lean: "steepest_l2_bound / steepest_l2_attained (SGD), steepest_linf_bound / steepest_linf_attained (sign), muon_polar_steepest, shampoo_eq_muon, muon_polar_nearest_orthogonal + spectral-step lemma"
      module: "LeanMlir/Proofs/Foundation/Muon/Geometry.lean, LeanMlir/Proofs/Foundation/Muon/NewtonSchulz.lean"
      status: "proved"
      note: "14 theorems; singular-G SVD completion + Newton-Schulz convergence dynamics left open"
    - source: "StableHLO/XLA codegen faithfulness, JAX numeric agreement, training accuracy"
      lean: "(none -- empirical)"
      module: ""
      status: "not-formalized"
      note: "validated by runs + cross-checks, not by theorems"

