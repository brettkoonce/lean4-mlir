name: IREE

# IREE is no longer the training engine (PJRT/XLA is), but it is still the second compiler: the
# checks that lower a hand-written or rendered graph through IREE are how a render is tested against
# something other than the compiler that trains it. Run only by hand, those checks rotted — a
# hardcoded `--device=hip` after the ROCm box left, and smokes that printed FAILED and exited 0.
# This job is the loop that keeps them honest: IREE from PyPI, CPU only (`IREE_BACKEND=llvm-cpu`,
# run on `local-task`), no GPU, no FFI build.
#
# Today it runs the four adjoint/finite-difference gradchecks of the ViT chapter's hand-written
# fragments (single-head SDPA, MHSA, one pre-norm ViT block, a tiny whole ViT), each gated on its
# `✅ PASS` line, plus a control that must go red; then the `iree-compile` smokes of
# scripts/regen_verified_mlir.sh (26 committed verified_mlir/ artifacts, ~2 min on CPU). A second job
# runs the forward ties: the MNv4 and MNv2 renders against their JAX references on shared weights. A
# third runs the VJP oracle whole: the hand-derived VJPs through IREE (a CPU build of
# libiree_ffi.so) against JAX autodiff, 14 layer families. Grow it here rather than by hand: see
# planning/iree_ci.md.

on:
  push:
    branches: [main]
    paths:
      - 'tests/ViTRender.lean'
      - 'tests/TestSDPA.lean'
      - 'tests/TestMHSA.lean'
      - 'tests/TestViTBlock.lean'
      - 'tests/TestViTTiny.lean'
      - 'tests/TestMobilenetV2Fwd.lean'
      - 'tests/TestMobilenetV2TrainPC.lean'
      - 'tests/TestEfficientNetFwd.lean'
      - 'tests/TestEfficientNetTrain.lean'
      - 'tests/TestConvNeXtFwd.lean'
      - 'tests/TestConvNeXtTrain.lean'
      - 'tests/TestViTFwd.lean'
      - 'tests/TestViTTrain.lean'
      - 'tests/TestCifar8AdamTrain.lean'
      - 'verified_mlir/**'
      - 'scripts/regen_verified_mlir.sh'
      # the forward ties: the scripts, their IREE resolver, and the JAX references they run
      - 'scripts/parity/mnv2_forward_tie.py'
      - 'scripts/parity/mnv4_forward_tie.py'
      - 'scripts/lib/_iree.py'
      - 'scripts/regen_jax_generated.sh'
      - 'jax/**'
      # the VJP oracle: its runner, the FFI it drives, and the Lean side it lowers
      - 'tests/vjp_oracle/**'
      - 'ffi/iree_ffi.c'
      - 'ffi/iree_ffi.h'
      - 'ffi/lowerer.c'
      - 'ffi/lowerer.h'
      - 'LeanMlir/VjpOracleNets.lean'
      - 'LeanMlir/MlirCodegen.lean'
      - 'LeanMlir/Train.lean'
      - 'LeanMlir/IreeRuntime.lean'
      - 'LeanMlir/F32Array.lean'
      - 'LeanMlir/Spec.lean'
      - 'LeanMlir/SpecHelpers.lean'
      - 'LeanMlir/GradcheckHelpers.lean'
      - 'LeanMlir/Types.lean'          # ireeCompileArgs / compileCheckB
      - 'LeanMlir/Proofs/Codegen/StableHLO/Pretty.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/iree.yml'
  schedule:
    - cron: '30 7 * * *'   # nightly: catches IREE / toolchain drift the path filter cannot see
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradcheck:
    name: IREE gradchecks (llvm-cpu)
    runs-on: ubuntu-latest
    # Warm (certs cache restored) this is minutes; cold, the Pretty import chain builds from scratch.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Restore .lake (certs build, read-only)
        # Restore-only: this job builds a small slice of what certs.yml caches and must not save a
        # narrower entry under its prefix. ⚠ The path block must stay BYTE-IDENTICAL to certs.yml's
        # or the restore never matches (see the note there).
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            !.lake/build/doc
            !.lake/build/doc-data
          key: lake-certs-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lake-certs-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            lake-certs-

      - name: Build the test modules
        run: |
          lake exe cache get || true
          lake build TestSupport LeanMlir.GradcheckHelpers LeanMlir.Types
          # the smokes' imports (regen_verified_mlir.sh's tests/ files)
          lake build LeanMlir.Verified.Train LeanMlir.Proofs.Codegen.ChapterGraphs \
            LeanMlir.Proofs.Codegen.ViTRender LeanMlir.Proofs.Nets.MobileNet.MobileNetV2StagesPC

      - name: IREE (PyPI)
        run: python3 -m pip install --quiet iree-base-compiler==3.11.0 iree-base-runtime==3.11.0

      - name: Gradchecks
        run: |
          set -o pipefail
          export IREE_BACKEND=llvm-cpu
          {
            echo "## IREE gradchecks"
            echo ""
            echo "Hand-written StableHLO fragments (tests/TestSDPA.lean, tests/ViTRender.lean), compiled by IREE and run on the CPU."
            echo "Each backward is checked against finite differences of its own forward:"
            echo "⟨back(dOut), v⟩ ≈ (Φ(+ε) − Φ(−ε)) / 2ε, over every input it checks at once. Passes at rel err < 1e-2."
            echo ""
            echo "| | check | what it covers | rel err |"
            echo "|---|---|---|---|"
          } >> $GITHUB_STEP_SUMMARY
          rc=0
          for row in "TestSDPA|single-head scaled dot-product attention: dQ, dK, dV through the row-softmax VJP" \
                     "TestMHSA|multi-head self-attention (Q/K/V/O projections, softmax, head split/merge)" \
                     "TestViTBlock|one pre-norm transformer block (LayerNorm, MHSA, GELU MLP, two residuals)" \
                     "TestViTTiny|a whole tiny ViT, every parameter: patch embed, CLS + position, two blocks, final LN, head"; do
            t=${row%%|*}; what=${row#*|}
            lake env lean tests/$t.lean 2>&1 | tee /tmp/$t.log
            # The tests print their verdict and exit 0 either way, so the verdict line is the gate.
            err=$(grep -m1 -oP 'rel err = \K[0-9.e+-]+' /tmp/$t.log || echo "—")
            if grep -q "✅ PASS" /tmp/$t.log; then
              echo "| ✅ | \`$t\` | $what | $err |" >> $GITHUB_STEP_SUMMARY
            else
              echo "::error::$t did not PASS"
              echo "| ❌ | \`$t\` | $what | $err |" >> $GITHUB_STEP_SUMMARY
              rc=1
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "IREE $(pip show iree-base-compiler 2>/dev/null | sed -n 's/^Version: //p') from PyPI · \`IREE_BACKEND=llvm-cpu\` on \`local-task\` · no GPU" >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: Control (a device the runner lacks must go red)
        run: |
          # IREE_BACKEND=rocm compiles for gfx1100 and runs on `hip`; a CPU runner has neither, so
          # no PASS line can appear. If it does, the gate above is not reading the tests' verdict.
          IREE_BACKEND=rocm lake env lean tests/TestMHSA.lean > /tmp/control.log 2>&1 || true
          if grep -q "✅ PASS" /tmp/control.log; then
            echo "::error::control came out GREEN — the PASS gate cannot fail"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Control came out green** — the gate above cannot fail." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          {
            echo ""
            echo "✅ **Control is red, as it must be:** TestMHSA pointed at \`hip\`, a device this runner doesn't have, produced no PASS line. So a green row above is the test's own verdict."
          } >> $GITHUB_STEP_SUMMARY

      - name: iree-compile smokes (regen_verified_mlir.sh tests)
        run: |
          # Nine tests/ files iree-compile the committed verified_mlir/ artifacts (TestCifar8AdamTrain
          # also re-renders its own). The script fails on a missing compiler or a FAILED/skipped verdict.
          export IREE_BACKEND=llvm-cpu
          set -o pipefail
          scripts/regen_verified_mlir.sh tests 2>&1 | tee /tmp/smokes.log
          n=$(grep -c 'compile OK → verified_mlir/' /tmp/smokes.log)
          {
            echo ""
            echo "## iree-compile smokes"
            echo ""
            echo "✅ $n committed \`verified_mlir/\` artifacts compile on llvm-cpu (\`scripts/regen_verified_mlir.sh tests\`)."
          } >> $GITHUB_STEP_SUMMARY
          # A re-rendered artifact that differs from the committed bytes means two writers disagree.
          git diff --exit-code --stat verified_mlir/

  forward-ties:
    name: IREE forward ties (render ↔ JAX reference)
    # The verified render and its JAX reference on one set of weights, the render through IREE. The
    # references are pinned to timm by jax.yml's timm-parity job; these carry that to the renders.
    #   MNv4  verified_mlir/mnv4_fwd.mlir at batch 32 against the Imagenette reference the jax/ exe
    #         emits. ~2.4e-4 of scale (float accumulation through 77 batch-BN layers); a structural
    #         error, a swapped pre/post-DW, lands near 1e-1.
    #   MNv2  the ImageNet eval render against the committed ImageNet reference, in its eval mode;
    #         control: the ε-1e-5 eval graph against the ε-1e-3 reference must fail.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Restore .lake (jax build, read-only)
        # Restore-only, like the certs restore above: jax.yml owns this entry. ⚠ The path block
        # must stay BYTE-IDENTICAL to jax.yml's or the restore never matches.
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            jax/.lake/build
          key: lake-jax-${{ hashFiles('lean-toolchain', 'jax/lean-toolchain', 'jax/lakefile.lean', 'jax/lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lake-jax-${{ hashFiles('lean-toolchain', 'jax/lean-toolchain', 'jax/lakefile.lean', 'jax/lake-manifest.json') }}-
            lake-jax-

      - name: Python (jax CPU + TensorFlow at the lockfile's versions, IREE)
        # IREE 3.11.0 is PyPI's release; the 4060 Ti box runs a 3.12 nightly, and both ties pass on
        # both (checked 2026-09-25: MNv4 4.1e-5, MNv2 ImageNet 2.1e-6 of scale).
        # ⚠ TensorFlow is NOT optional: an ImageNet reference carries its tf.data pipeline at module
        # level, so exec'ing the prefix up to `loss_fn` imports it.
        run: |
          set -e
          lock() { sed -n "s/^$1==//p" jax/requirements-cuda-lock.txt; }
          python3 -m pip install --quiet "jax[cpu]==$(lock jax)" "tensorflow==$(lock tensorflow)" \
              "tensorflow-datasets==$(lock tensorflow-datasets)" pillow \
              iree-base-compiler==3.11.0 iree-base-runtime==3.11.0

      - name: Emit the MNv4 reference
        # The MNv4 tie reads the Imagenette reference the exe writes before it would train (the
        # `|| true` + existence check is jax.yml's emit pattern); the MNv2 tie reads the committed
        # ImageNet file, which `regen_jax_generated.sh sync` copies in.
        working-directory: jax
        run: |
          set -e
          lake exe cache get || true
          lake build mobilenet-v4
          lake exe mobilenet-v4 /nonexistent-so-training-cannot-start >/dev/null 2>&1 || true
          [ -s .lake/build/generated_mobilenet_v4.py ] || { echo "::error::generated_mobilenet_v4.py was not emitted"; exit 1; }

      - name: Forward ties
        run: |
          set -eo pipefail
          export JAX_PLATFORMS=cpu
          scripts/regen_jax_generated.sh sync
          # The COMMITTED render (drift-checked by proofs.yml), not the batch-2 copy the script
          # defaults to, which `mnv4-fwd-smoke` writes.
          python3 scripts/parity/mnv4_forward_tie.py --mlir verified_mlir/mnv4_fwd.mlir --batch 32 --tol 1e-3 \
              2>&1 | tee -a /tmp/ties.log
          python3 scripts/parity/mnv2_forward_tie.py --imagenet 2>&1 | tee -a /tmp/ties.log
          # CONTROL: the ε-1e-5 eval graph against the ε-1e-3 reference must FAIL.
          if python3 scripts/parity/mnv2_forward_tie.py --imagenet --mlir verified_mlir/mobilenetv2in_fwd_eval.mlir \
              2>&1 | tee -a /tmp/ties.log; then
            echo "::error::mnv2 forward-tie control came out GREEN — the tie cannot see BN ε"; exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## IREE forward ties"
            echo ""
            echo '```'
            grep -E '^\[|max\|Δ\|/max|CONTROL|FORWARD TIE|⛔' /tmp/ties.log || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

  vjp-oracle:
    name: VJP oracle (phase 3 through IREE vs phase 2 JAX)
    # tests/vjp_oracle/run.sh, whole: each of the 14 layer-family nets trains in phase 3 (Lean → MLIR →
    # IREE, the hand-derived VJPs) and in phase 2 (Lean → JAX, autodiff) from one init, and step 2's
    # loss — the first that depends on the backward — must agree. jax.yml's oracle job runs phase 2
    # alone; this is the half that checks the VJPs. Phase 3 drives IREE through libiree_ffi.so, which
    # pip does not ship: it is built here, CPU-only, from the IREE release the compiler comes from.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IREE_VERSION: '3.11.0'
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Restore .lake (certs build, read-only)
        # ⚠ The path block must stay BYTE-IDENTICAL to certs.yml's (see the gradcheck job).
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            !.lake/build/doc
            !.lake/build/doc-data
          key: lake-certs-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lake-certs-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            lake-certs-

      - name: Cache libiree_ffi.so (CPU)
        id: ffi
        uses: actions/cache@v4
        with:
          path: ffi/libiree_ffi.so
          key: iree-ffi-cpu-${{ env.IREE_VERSION }}-${{ hashFiles('ffi/iree_ffi.c', 'ffi/iree_ffi.h') }}

      - name: Build libiree_ffi.so (IREE runtime from source, CPU only)
        if: steps.ffi.outputs.cache-hit != 'true'
        # Runtime-only: the runtime submodules (~220 MB, not the LLVM chain), four static archives,
        # local-task/local-sync drivers. `-DUSE_CPU` compiles the wrapper without a GPU driver.
        # `--no-undefined`: a missing archive fails here, not at the first session create.
        run: |
          set -e
          python3 -m pip install --quiet cmake ninja
          git clone -q --depth 1 --branch v$IREE_VERSION https://github.com/iree-org/iree.git /tmp/iree
          (cd /tmp/iree && xargs -a build_tools/scripts/git/runtime_submodules.txt git submodule update -q --init --depth 1)
          cmake -S /tmp/iree -B /tmp/iree-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DIREE_BUILD_COMPILER=OFF -DIREE_BUILD_TESTS=OFF -DIREE_BUILD_SAMPLES=OFF \
            -DIREE_HAL_DRIVER_DEFAULTS=OFF -DIREE_HAL_DRIVER_LOCAL_SYNC=ON -DIREE_HAL_DRIVER_LOCAL_TASK=ON \
            -DBUILD_SHARED_LIBS=OFF > /tmp/cmake.log
          B=/tmp/iree-build
          ninja -C $B runtime/src/iree/runtime/libiree_runtime_unified.a \
            build_tools/third_party/flatcc/libflatcc_runtime.a build_tools/third_party/flatcc/libflatcc_parsing.a \
            build_tools/third_party/printf/libprintf_printf.a
          gcc -fPIC -O2 -c ffi/iree_ffi.c -o /tmp/iree_ffi.o -I/tmp/iree/runtime/src -I$B/runtime/src \
            -DIREE_ALLOCATOR_SYSTEM_CTL=iree_allocator_libc_ctl -DUSE_CPU
          gcc -shared -o ffi/libiree_ffi.so /tmp/iree_ffi.o \
            -Wl,--whole-archive $B/runtime/src/iree/runtime/libiree_runtime_unified.a -Wl,--no-whole-archive \
            -Wl,--start-group $B/build_tools/third_party/flatcc/libflatcc_runtime.a \
              $B/build_tools/third_party/flatcc/libflatcc_parsing.a $B/build_tools/third_party/printf/libprintf_printf.a \
            -Wl,--end-group -lm -lpthread -ldl -Wl,--no-undefined

      - name: Python (IREE compiler; .venv with jax CPU at the lockfile's version, for phase 2)
        run: |
          set -e
          python3 -m pip install --quiet iree-base-compiler==$IREE_VERSION
          python3 -m venv .venv
          .venv/bin/pip install --quiet "jax[cpu]==$(sed -n 's/^jax==//p' jax/requirements-cuda-lock.txt)"

      - name: Build the oracle exes (phase 3 at the root, phase 2 in jax/)
        run: |
          set -e
          lake exe cache get || true
          oracles() { grep -oP '^lean_exe\s+«?\K[^»\s]+' lakefile.lean | sed 's/»$//' | grep '^vjp-oracle-' | tr '\n' ' '; }
          lake build $(oracles)
          (cd jax && lake build $(oracles))

      - name: VJP oracle (14 layer families)
        run: |
          set -o pipefail
          .venv/bin/python3 jax/tests/vjp_oracle/make_tiny_mnist.py /tmp/tiny 64 512
          export LEAN_MLIR_LOWERER=iree IREE_BACKEND=llvm-cpu JAX_PLATFORMS=cpu VJP_ORACLE_DATA=/tmp/tiny
          rc=0
          tests/vjp_oracle/run.sh 2>&1 | tee /tmp/oracle.log || rc=1
          {
            echo "## VJP oracle"
            echo ""
            echo "Each layer family trains one step in phase 3 (Lean → MLIR → IREE on the CPU, the hand-derived VJPs) and in phase 2 (Lean → JAX, autodiff) from the same init. Step 2 is the first loss that depends on the backward, so |Δ step 2| below the tolerance means the VJPs agree with autodiff. Synthetic MNIST (64 / 512); IREE $IREE_VERSION."
            echo ""
            echo "| | case | Δ step 1 | Δ step 2 | tol |"
            echo "|---|---|---|---|---|"
            sed -nE 's/^(PASS|FAIL) +([a-z-]+) +step1 Δ=([^ ]+) +step2 Δ=([^ ]+) +\(tol=([^)]+)\).*/\1 \2 \3 \4 \5/p' /tmp/oracle.log |
              while read v c d1 d2 t; do
                [ "$v" = PASS ] && m=✅ || m=❌
                echo "| $m | \`$c\` | $d1 | $d2 | $t |"
              done
            grep -E '^FAIL +[a-z-]+ +phase' /tmp/oracle.log | sed -E 's/^FAIL +([a-z-]+) +(.*)/| ❌ | `\1` | \2 | | |/' || true
          } >> $GITHUB_STEP_SUMMARY
          n=$(grep -c '^PASS' /tmp/oracle.log)
          [ "$n" = 14 ] || { echo "::error::$n of 14 oracle cases passed"; rc=1; }
          exit $rc

      - name: Control (mismatched traces must go red)
        run: |
          # dense's phase-3 trace against dense-relu's phase-2 trace: two different nets. If the differ
          # passes that, a green row above says nothing.
          if .venv/bin/python3 tests/vjp_oracle/diff_step.py /tmp/vo_p3_dense.jsonl /tmp/vo_p2_dense-relu.jsonl control 1e-5; then
            echo "::error::control came out GREEN — the differ cannot fail"
            echo "" >> $GITHUB_STEP_SUMMARY; echo "❌ **Control came out green.**" >> $GITHUB_STEP_SUMMARY; exit 1
          fi
          {
            echo ""
            echo "✅ **Control is red, as it must be:** dense's phase-3 trace against dense-relu's phase-2 trace fails the differ."
          } >> $GITHUB_STEP_SUMMARY
