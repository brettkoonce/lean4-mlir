name: Certify Heavy Corpus

# The GENERATED full-input certificate instances (`lake build CertsHeavy`:
# 784-dim scorecard + per-pair LipSDP + IBP L∞ — ~90k lines of weight/image
# data across 8 files) + their three-axiom audit (tests/AuditAxiomsHeavy.lean).
#
# Split out of certs.yml 2026-07-12: these are long-running, data-heavy tails
# (the linarith PSD goals carry ~230-digit LDLᵀ fractions; peak elaboration
# memory took down the shared 4-core/16GB runners, and blueprint.yml builds
# `Certs` too, so ONE heavy module broke three workflows). Long-running corpus
# work gets its own workflow so it can never break the core: this runs on
# pushes that actually touch the heavy files, weekly (drift), and on demand.
# LEAN_NUM_THREADS is capped to bound per-module peak memory on 16GB runners.

# RE-ENABLED 2026-07-26, after the scorecard trim + the conv-module split.
# It was manual-only from 2026-07-12 because measured peaks (ImgsA 39.5 GB,
# IBP 20.2 GB, conv ~38 GB) fit no free 16 GB runner in any configuration —
# 5 failed attempts, documented in planning/certs_heavy_psd_memory.md.
# Every module in CertsHeavy now fits. Verified by running THIS loop cold at
# LEAN_NUM_THREADS=1 on mars: 1260 s wall, max peak 10.91 GB, and the closing
# `lake build CertsHeavy` a 2.9 s no-op — per-module numbers in the build step
# below. The two per-pair LipSDP modules remain OUT of the lib roots (~16 GB
# for a single hS* goal, which no per-image cap reduces) — they were never
# what blocked this workflow.
#
# `paths` is written against the CURRENT layout. The pre-2026-07 filters
# (LeanMlir/Proofs/LipschitzCertScorecard*.lean, Proofs/ListDot.lean, …)
# were left behind by the Proofs/ bucket refactor and matched NOTHING, so a
# push trigger restored verbatim would silently never fire.
on:
  push:
    branches: [main]
    paths:
      - 'LeanMlir/Proofs/Certificates/LipschitzCertScorecard*.lean'
      - 'LeanMlir/Proofs/Certificates/IbpConvScorecard*.lean'
      - 'LeanMlir/Proofs/Foundation/ListDot.lean'
      - 'LeanMlir/Proofs/Foundation/IntervalBound.lean'
      - 'LeanMlir/Proofs/Foundation/IntervalBoundConv.lean'
      - 'LeanMlir/Proofs/Foundation/CrownBound.lean'
      - 'tests/AuditAxiomsHeavy.lean'
      - 'lakefile.lean'
      - '.github/workflows/certs-heavy.yml'
  schedule:
    - cron: '47 9 * * 0'   # weekly, Sunday 09:47 UTC — drift guard
  workflow_dispatch:

jobs:
  certify-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # ONE elaboration thread. The per-module peaks that justify re-enabling
      # this workflow were all measured at LEAN_NUM_THREADS=1 (max 11.42 GB);
      # at 2 threads two goals are in flight and the peak is an UNMEASURED
      # multiple of that — which is how the 39.5 GB ImgsA measurement that
      # took the runners down was produced in the first place. ~21 min at 1
      # thread on mars against a 350-min budget, so there is no reason to
      # spend the headroom. Re-measure before raising it.
      # The swapfile experiment from the SDP era is gone: 10G fallocate
      # doesn't fit the runner's root partition (failed in 7 s) — use /mnt.
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Audit coverage check (both audits ⊆ their lib roots)
        run: python3 scripts/check_audit_coverage.py

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake/build
          # shares the `lake-certs-` namespace with certs.yml/comparator.yml —
          # CertsHeavy's imports subsume the Certs roots, so restoring their
          # build products is exactly the warm start this job wants.
          key: lake-certs-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-heavy-${{ github.run_id }}
          restore-keys: |
            lake-certs-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            lake-certs-

      - name: Build heavy certificate corpus
        run: |
          lake exe cache get || true
          free -h
          # ONE heavy module at a time: Lake 5.0 has no --jobs flag, and its
          # default scheduler elaborates several big modules concurrently, so
          # the runner sees the SUM of their peaks. Sequential per-module
          # invocations serialize them (each call's heavy deps are already
          # built by the previous ones); the final CertsHeavy call is a no-op
          # verification. This loop must list EVERY CertsHeavy module, or the
          # unlisted ones get elaborated together by that final call.
          #
          # Measured per-module peaks after the 2026-07 scorecard trim
          # (LEAN_NUM_THREADS=1, olean deleted, /usr/bin/time -v on mars):
          #   FullImgsA 11.42 GB   FullNets 10.14 GB   IBP 9.19 GB
          #   ConvImgsB  8.63 GB   ConvImgsA 8.43 GB   IBPUncon 8.28 GB
          #   FullImgsB  4.39 GB   Full 3.47 GB  ConvNet 3.10 GB  Conv 2.65 GB
          # — max 11.42 GB, ~21 min total, versus ImgsA 39.5 / IBP 20.2 / conv
          # ~38 GB before the trim. IbpConvScorecard was split into
          # Net/ImgsA/ImgsB/aggregate precisely to get it from 14.68 GB (over
          # what a 16 GB runner carries) to 8.6 — peak tracks images per
          # MODULE, since Lean does not reclaim between declarations.
          #
          # NB the per-pair LipSDP modules are still DISABLED (removed from
          # CertsHeavy): their PSD witnesses are ~16 GB for a SINGLE `hS*`
          # goal, which no per-image cap can reduce — see
          # planning/certs_heavy_psd_memory.md. They stay kernel-verified locally.
          for m in LipschitzCertScorecardFullNets \
                   LipschitzCertScorecardFullImgsA \
                   LipschitzCertScorecardFullImgsB \
                   LipschitzCertScorecardFull \
                   LipschitzCertScorecardIBP \
                   LipschitzCertScorecardIBPUncon \
                   IbpConvScorecardNet \
                   IbpConvScorecardImgsA \
                   IbpConvScorecardImgsB \
                   IbpConvScorecard; do
            echo "=== building $m ==="
            free -m | head -2
            lake build LeanMlir.Proofs.Certificates.$m
          done
          lake build CertsHeavy

      - name: Three-axiom closure check (heavy corpus)
        run: |
          set -e
          out=$(lake env lean tests/AuditAxiomsHeavy.lean 2>&1 | sed ':a;N;$!ba;s/,\n /, /g')
          # Subset of the three, any order — see certs.yml (Lean 4.32 shrank some lists).
          AX3='(propext|Classical\.choice|Quot\.sound)'
          OK_RE="depends on axioms: \[$AX3(, $AX3)*\]\$"
          total=$(echo "$out" | grep -c "depends on axioms:" || true)
          ok=$(echo "$out" | grep -cE "$OK_RE" || true)

          echo "Total #print axioms lines:        $total"
          echo "Lines matching {propext, Classical.choice, Quot.sound}: $ok"

          if [ "$total" -eq 0 ]; then
            echo "::error::tests/AuditAxiomsHeavy.lean produced no #print axioms output"
            echo "$out"
            exit 1
          fi

          if [ "$total" -ne "$ok" ]; then
            echo "::error::Some heavy-corpus theorems depend on axioms outside [propext, Classical.choice, Quot.sound]:"
            echo "$out" | grep "depends on axioms:" \
              | grep -vE "$OK_RE" || true
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Three-Axiom Closure — heavy corpus" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All ${total} heavy-corpus theorems closed under [\`propext\`, \`Classical.choice\`, \`Quot.sound\`]**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full-input scorecard (L2 Tsuzuku + IBP L∞): capped σ≤2 92/100 @ L2 ε=0.1; IBP 92/88/69/24 per 100 @ L∞ ε=1/2/4/8 per 255. (Per-pair LipSDP instances kernel-verified locally but CI-disabled — memory; see planning/certs_heavy_psd_memory.md.)" >> $GITHUB_STEP_SUMMARY
