name: Certify Corpus

# The certificate corpus (`lake build Certs`: FloatBridges, ties, seals,
# descent, Lipschitz/LipSDP, Muon — 155 files / ~87k lines) + the three-axiom
# closure audit, split out of the per-push proofs workflow
# (planning/archive/repo_shape_deletion_audit.md §4). Runs when a push actually
# touches proof surface, plus nightly (catches toolchain/Mathlib drift and
# anything the path filter misses) and on demand. Everything else — demo,
# book, engine, docs pushes — no longer pays the corpus tail; they get the
# fast `Verify Proofs` workflow (IR/render slice + drift guard) instead.

on:
  push:
    branches: [main]
    paths:
      - 'LeanMlir/Proofs/**'
      - 'LeanMlir.lean'   # the root module: every lib imports it, `LeanMlir/**` does not match it
      - 'tests/AuditAxioms.lean'
      - 'tests/AxiomAudit.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/certs.yml'
      - 'scripts/stats/**'
      # SpecVJP's rfl ties break when a spec's layer list drifts — the exact
      # failure the corpus must catch on the push that causes it, not nightly
      # (mnv2 6→17-block promotion rotted the orphaned SpecVJP for weeks).
      - 'LeanMlir/Verified/NetsCore.lean'
      - 'LeanMlir/Verified/Spec.lean'
      # Every apps/ and demos/ entry point calls into VerifiedTrain, and `lake build Apps`
      # below is the only thing that elaborates them. Added 2026-09-20 with that step.
      - 'LeanMlir/Verified/Train.lean'
      # The gates this job runs and what they read: a change to any of these flips the verdict
      # and, until 2026-09-09, triggered nothing. check_render_coverage.py reads proofs.yml's
      # diff list as its data source, so that workflow file is an input to THIS one.
      - 'scripts/gates/check_audit_coverage.py'
      - 'scripts/gates/import_audit.py'
      - 'scripts/lib/lean_graph.py'
      - 'scripts/gates/check_render_coverage.py'
      - 'scripts/gates/render_guard_baseline.txt'
      - '.github/workflows/proofs.yml'
      - 'tests/bestiary_params.yml'
      - 'tests/test_bestiary_params.py'
      # What the Bestiary drift guard measures: the specs, and the layer kit's
      # Layer.paramSlots / NetSpec.totalParams that count them.
      - 'Bestiary/**'
      - 'LeanMlir/Spec.lean'
      # The `#guard` scripts step below runs these by `lake env lean`.
      - 'tests/TestAxiomAudit.lean'
      - 'tests/TestVariantPredicates.lean'
      - 'tests/TestDropPathRamp.lean'
      - 'tests/TestBatchedEmitTie.lean'
      - 'tests/TestSmallNetsBatchedEmit.lean'
      - 'tests/TestR50Contract.lean'
      - 'tests/TestXlaPadOps.lean'
  pull_request:
    paths:
      - 'LeanMlir/Proofs/**'
      - 'LeanMlir.lean'   # the root module: every lib imports it, `LeanMlir/**` does not match it
      - 'tests/AuditAxioms.lean'
      - 'tests/AxiomAudit.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/certs.yml'
      - 'scripts/stats/**'
      - 'LeanMlir/Verified/NetsCore.lean'
      - 'LeanMlir/Verified/Spec.lean'
      # Every apps/ and demos/ entry point calls into VerifiedTrain, and `lake build Apps`
      # below is the only thing that elaborates them. Added 2026-09-20 with that step.
      - 'LeanMlir/Verified/Train.lean'
      # The gates this job runs and what they read: a change to any of these flips the verdict
      # and, until 2026-09-09, triggered nothing. check_render_coverage.py reads proofs.yml's
      # diff list as its data source, so that workflow file is an input to THIS one.
      - 'scripts/gates/check_audit_coverage.py'
      - 'scripts/gates/import_audit.py'
      - 'scripts/lib/lean_graph.py'
      - 'scripts/gates/check_render_coverage.py'
      - 'scripts/gates/render_guard_baseline.txt'
      - '.github/workflows/proofs.yml'
      - 'tests/bestiary_params.yml'
      - 'tests/test_bestiary_params.py'
      # What the Bestiary drift guard measures: the specs, and the layer kit's
      # Layer.paramSlots / NetSpec.totalParams that count them.
      - 'Bestiary/**'
      - 'LeanMlir/Spec.lean'
      # The `#guard` scripts step below runs these by `lake env lean`.
      - 'tests/TestAxiomAudit.lean'
      - 'tests/TestVariantPredicates.lean'
      - 'tests/TestDropPathRamp.lean'
      - 'tests/TestBatchedEmitTie.lean'
      - 'tests/TestSmallNetsBatchedEmit.lean'
      - 'tests/TestR50Contract.lean'
      - 'tests/TestXlaPadOps.lean'
  schedule:
    - cron: '7 8 * * *'    # nightly, 3:07 am US Central (CDT; 2:07 am CST), off the top-of-hour rush
  workflow_dispatch:

concurrency:
  # A superseded run of the same ref is cancelled; a push burst builds the last commit only.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Audit coverage check (AuditAxioms imports ⊆ Proofs+Certs roots)
        # Fail fast (no Lean needed) if the audit imports a module that
        # `lake build Certs` won't build — see scripts/gates/check_audit_coverage.py.
        run: python3 scripts/gates/check_audit_coverage.py

      - name: Render coverage check (artifact renderers built + drift-guarded)
        # This job is the one that actually broke: `lake build Certs` does not
        # build a leaf renderer nothing imports, so ResNet34RenderB's .olean
        # was absent on a fresh runner. Pure text analysis, no Lean — runs
        # before elan so a root gap fails in seconds, not after the build.
        run: python3 scripts/gates/check_render_coverage.py

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            !.lake/build/doc
            !.lake/build/doc-data
          # ⚠ This path block must stay BYTE-IDENTICAL across certs.yml, comparator.yml,
          # certs-heavy.yml and blueprint.yml's rolling step: actions/cache hashes the path list
          # into a cache "version", and restore only ever matches entries of the same version.
          # blueprint.yml needs the two exclusions (its doc-gen4 output lives in those dirs);
          # they are no-ops here, and carrying them is what lets blueprint restore `lake-certs-`.
          # Learned 2026-09-09: blueprint run 34384974391 missed BOTH its restores for this
          # reason and built 242 modules cold.
          # Cache ONLY the project build (Certs oleans/traces), NOT .lake/packages
          # — Mathlib comes from `lake exe cache get` below. Same rolling key as
          # proofs.yml/comparator.yml, but the entry is now a few hundred MB
          # instead of ~3 GB, so the workflows stop blowing GitHub's ~10 GB cache
          # budget (which was evicting everything → ~30-min cold rebuilds). The
          # `lake-certs-` namespace is shared with comparator.yml (both run
          # `lake build Certs`); proofs.yml uses a separate `lake-proofs-` so the
          # two never restore each other's build and rebuild the wrong corpus cold.
          # ⚠ certs-heavy.yml used to save into THIS prefix as `lake-certs-<hash>-heavy-<id>`.
          # Being the newest match, it was what this job restored — and its module set is
          # different, so the corpus rebuilt every run (288 modules, zero replays, on an UNCHANGED
          # commit, 2026-09-09 12:57 nightly). It saves under `lake-heavy-` now.
          key: lake-certs-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lake-certs-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            lake-certs-

      - name: Build certificate corpus
        run: |
          # `Certs` roots subsume the `Proofs` slice, so this builds everything
          # the axiom-closure audit below elaborates against.
          lake exe cache get || true
          lake build Certs

      - name: Three-axiom closure check
        run: |
          set -e
          # `#audit_axioms` (tests/AxiomAudit.lean) is `#print axioms` that ERRORS outside
          # {propext, Classical.choice, Quot.sound} and on a name that does not resolve, so the exit
          # code of `lake env lean` is the whole gate. (Before it, this step grepped `#print axioms`
          # output, and a pipeline that dropped the exit code reported `Proofs.dw_sum_pair`, a
          # constant that never existed, green for eight days from 2026-08-24.)
          # The sed join collapses Lean's wrapped axiom lists to one line, for the counts below
          # and the scorecard's `faithful` lookups.
          lake build tests.AxiomAudit
          set -o pipefail
          if ! out=$(lake env lean tests/AuditAxioms.lean 2>&1 | sed ':a;N;$!ba;s/,\n /, /g'); then
            echo "::error::tests/AuditAxioms.lean failed — a decl leaves the three-axiom closure, or an #audit_axioms names a constant that does not exist:"
            echo "$out" | grep -E "error" | head -20
            exit 1
          fi
          AX3='(propext|Classical\.choice|Quot\.sound)'
          total=$(echo "$out" | grep -cE "^'.*' (depends on axioms:|does not depend on any axioms)" || true)
          echo "#audit_axioms verdicts: $total"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Three-Axiom Closure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All ${total} headline theorems closed under [\`propext\`, \`Classical.choice\`, \`Quot.sound\`]**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verified by \`tests/AuditAxioms.lean\` (no \`sorryAx\`, no project axioms)." >> $GITHUB_STEP_SUMMARY

          # ── Verified-faithful train-step scorecard ──────────────────────────
          # Durable per-run log of which chapters' committed
          # verified_mlir/<net>_train_step.mlir is render(provenGraph) with every
          # output's den proven = the certified fderiv-derived SGD step. A ✅ is
          # data-driven: it only prints if the net's train-step capstone is in the
          # 3-axiom closure above (so this table can't drift from what's proven).
          # ⛔ A HERE-STRING, NOT `echo "$out" | grep -q`. This step runs under `pipefail` (above).
          # `grep -q` exits at its first match, and `echo` is still writing ~1 MB of audit output
          # into the closed pipe. It gets SIGPIPE, pipefail fails the pipeline, and a theorem that
          # IS in the closure prints ⚠️. Until 2026-09-18 that was 34 of the 36 cells (the log's
          # 34 "echo: write error: Broken pipe" lines). Only names printed near the END of the
          # audit came out ✅. A name that is genuinely absent still prints ⚠️.
          faithful() { grep -qE "'Proofs.$1' depends on axioms: \[$AX3(, $AX3)*\]\$" <<< "$out" && printf '✅' || printf '⚠️'; }
          {
            echo ""
            echo "## Verified-faithful train steps"
            echo ""
            echo "✅ = the committed \`verified_mlir/<net>_train_step.mlir\` is \`pretty(provenGraph)\`, every parameter-update node's \`den\` — the fused SGD op, or the gradient node the optimizer tails consume — is proven equal to the certified \`fderiv\`-derived loss-descent step (or its gradient), AND the **§1a whole-net tie** holds — every param op is fed the genuine loss-driven backward-chain cotangent threaded through the REAL forward (not a free ∀cotangent) — all within the 3-axiom closure above. **All 12 chapter nets are now ✅ §1a-tied.** Residual: per-op \`pretty\` lexing + ℝ→Float32."
            echo ""
            echo "| Chapter / net | render(provenGraph) | den = certified | §1a tied (whole-net) | capstone |"
            echo "|---|---|---|---|---|"
            echo "| mnist-linear   | $(faithful LinFold.poc_fwd_is_render) | $(faithful LinFold.poc_train_step_tail_certified) | $(faithful LinFold.poc_train_step_tail_certified) | \`poc_train_step_tail_certified\` |"
            echo "| mnist-mlp (1d) | $(faithful MlpFold.W0_den_certified) | $(faithful MlpFold.b0_den_certified) | $(faithful MlpFold.mlp_train_step_tied) | \`mlp_train_step_tied\` |"
            echo "| mnist-cnn (2d) | $(faithful CnnFold.cW1_den) | $(faithful CnnFold.cb1_den) | $(faithful CnnFold.cnn_train_step_tied) | \`cnn_train_step_tied\` |"
            echo "| cifar (ch5, no-BN) | $(faithful SgdNode.convW_den) | $(faithful SgdNode.convB_den) | $(faithful CifarFold.cifar_train_step_tied) | \`cifar_train_step_tied\` |"
            echo "| cifar8 (8-conv, no-BN) | $(faithful SgdNode.convW_den) | $(faithful SgdNode.denseB_den) | $(faithful Cifar8Tie.cifar8_train_step_tied) | \`cifar8_train_step_tied\` |"
            echo "| cifar8-bn (8-conv) | $(faithful SgdNode.bnGamma_den) | $(faithful SgdNode.denseB_den) | $(faithful Cifar8BnTie.cifar8Bn_train_step_tied) | \`cifar8Bn_train_step_tied\` |"
            echo "| r34 (ch6)          | $(faithful GradNodeB.convStridedWGradB_den) | $(faithful GradNodeB.convStridedBGradB_den) | $(faithful ResNet34TieB.r34_net_tiedB) | \`r34_net_tiedB\` (full [3,4,6,3], 110 params) |"
            echo "| mobilenetv2 (ch7)  | $(faithful GradNodeB.depthwiseStridedXlaWGradB_den) | $(faithful GradNodeB.depthwiseStridedXlaBGradB_den) | $(faithful MobileNetV2TieB.mnv2_net_tiedB) | \`mnv2_net_tiedB\` (full 17-block paper, 158 params) |"
            echo "| efficientnet (ch8) | $(faithful EnetFold.convWB_den) | $(faithful EnetFold.bnGammaB_den) | $(faithful EnetTie.efficientnet_net_tied) | \`efficientnet_net_tied\` (full 16-MBConv B0, 262 params; batched true-BN + SE) |"
            echo "| convnext (ch9)     | $(faithful CnxFoldGB.chanLnGammaGradB_den) | $(faithful CnxFoldGB.chanLnBetaGradB_den) | $(faithful CnxTieGB.cnx_net_tiedGB) | \`cnx_net_tiedGB\` (full [3,3,9,3], 182 params, batched at the gradient nodes and the smoothed loss — every shipped ConvNeXt artifact, the ImageNet AdamW ones included; \`cnx_net_tied\` is its SGD-inline per-example form) |"
            echo "| vit (ch10)         | $(faithful ViTFoldGB.rowDenseWeightGradB_den) | $(faithful GradNodeB.veclnGammaGradB_den) | $(faithful ViTTieGB.vit_net_tiedGB) | \`vit_net_tiedGB\` (ViT-Tiny depth-12 multi-head, 200 params, batched at the gradient nodes and the smoothed loss — every shipped ViT artifact; \`vit_net_tied\` is its SGD-inline per-example form) |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Entry points elaborate (lake build Apps)
        # ⭐ Until 2026-09-20 NOTHING in CI elaborated an apps/ or demos/ entry point.
        # `lake build` builds `Proofs` alone and the exes are built on demand, so a
        # trainer could keep calling a driver that had been renamed out from under it
        # and only a human running that one binary would find out.
        #
        # `Apps` is a lean_lib over the same sources, so this type-checks every entry
        # point WITHOUT linking a ~149 MB binary per exe. It reaches LeanMlir modules
        # `Proofs` does not (the Float bridges, the ViT and MobileNet full-net chains,
        # LipschitzCert, SmoothingGaussian, the codegen half) plus the entry-point
        # modules themselves. That delta is why it lives HERE and not in the
        # per-push proofs workflow, whose whole point is to skip the corpus tail.
        #
        # ⚠ KNOWN GAP, named rather than papered over: this workflow does not trigger on
        # `apps/**` or `demos/**`, because an app-only edit is not worth the corpus tail.
        # Such an edit is caught by the nightly cron (within 24 h) and, for the common
        # case of a name that no longer resolves, immediately by the unfiltered
        # `.github/workflows/targets.yml`.
        run: |
          set -e
          lake build Apps
          echo "✅ **All apps/ + demos/ entry points elaborate** (\`lake build Apps\`)" >> $GITHUB_STEP_SUMMARY

      - name: "#guard scripts (lake test)"
        # tests/ files that are `#guard` / `#guard_msgs` / `#eval` gates rather than lake exes, each
        # named as the authority by a docstring, the lakefile or a gate script: the `#audit_axioms`
        # negative control, the variant-predicate table (gen_mlir_manifest.py reads it), the
        # drop-path ramp, the batched-emit text tie, R50's layout contract, and the XLA-SAME pad
        # known answers. The list is `guardScripts` in lakefile.lean; `lake test` builds what they
        # import, runs each by `lake env lean`, and exits 1 if any fails to elaborate.
        # TestXlaPadOps also writes probe modules under .lake/build for the manual IREE check
        # (scripts/gates/xla_pad_op_check.py); only its guards are gated here.
        run: |
          set -o pipefail
          rc=0
          lake test 2>&1 | tee /tmp/lake-test.log || rc=$?
          {
            echo ""
            echo "## \`#guard\` scripts"
            echo ""
            sed -n 's/^✓ lake env lean \(tests\/[^ ]*\).*/✅ `\1`/p; s/^✗ lake env lean \(tests\/[^ ]*\).*/❌ `\1`/p' /tmp/lake-test.log
          } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: No implied imports (import_audit.py implied)
        # An import another import of the same file already reaches: removing it changes no
        # closure, so the check is exact and reads only sources (Mathlib's from .lake/packages,
        # present after the build above). LeanMlir/, apps/ and demos/ are at zero since the
        # 2026-09-26 placement/imports cleanup; this keeps them there. The constants-based
        # UNUSED-import pass (`import_audit.py unused --verify`) is local-only: it needs a compile
        # per candidate. planning/placement_imports_cleanup.md §9.
        run: python3 scripts/gates/import_audit.py implied

      - name: Bestiary param-count drift guard
        # tests/test_bestiary_params.py pins NetSpec.totalParams for every
        # bestiary variant against tests/bestiary_params.yml. It enumerates
        # BUILT binaries in .lake/build/bin, so it only guards what CI builds
        # — hence the explicit `lake build` of every bestiary-* exe first.
        # Lives here rather than proofs.yml because the counts move when the
        # shared layer kit (LeanMlir/Spec.lean) changes; both it and Bestiary/**
        # are in this workflow's path filters, and the nightly cron backs them up. Ran nowhere for
        # the three months to 2026-07-26, in which time 41 counts drifted.
        run: |
          set -e
          BESTIARY=$(grep -oP '^lean_exe\s+«?\K[^»\s]+' lakefile.lean | sed 's/»$//' | grep '^bestiary-' | tr '\n' ' ')
          echo "building ${BESTIARY}"
          lake build $BESTIARY
          if python3 tests/test_bestiary_params.py; then
            echo "✅ **Bestiary param counts match the golden table**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Bestiary param-count drift** — see log. Intentional? regenerate with \`tests/test_bestiary_params.py --update-golden\` and review the diff." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Corpus sorry count
        run: |
          echo "## Certificate corpus" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SORRIES=$(lake build Certs 2>&1 | grep -c "sorry" || true)
          if [ "$SORRIES" -eq 0 ]; then
            echo "✅ **Corpus fully built — zero sorry**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **${SORRIES} sorry(s) in the corpus:**" >> $GITHUB_STEP_SUMMARY
            lake build Certs 2>&1 | grep "sorry" | head -20 >> $GITHUB_STEP_SUMMARY
          fi

      - name: Install scc
        # scc counts code / comment / blank lines per file (Lean's nested `/- -/` included) for
        # scripts/stats/summary.py. Pinned release, checksum-verified.
        run: |
          curl -sSfL -o /tmp/scc.tgz https://github.com/boyter/scc/releases/download/v3.5.0/scc_Linux_x86_64.tar.gz
          echo "6c31f4d0cf3b7a8c5ca910fa4e451949434798f6541ec5dea4b83f4973e13772  /tmp/scc.tgz" | sha256sum -c -
          sudo tar xzf /tmp/scc.tgz -C /usr/local/bin scc

      - name: Declaration / LoC counts
        # Per-proof-file declaration counts from the elaborated environment (scripts/stats/Decls.lean,
        # after `lake build Certs` above) and code / comment lines from scc; then the same Bestiary +
        # Codebase tables as proofs.yml's summary.
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 scripts/stats/summary.py --decls Certs >> $GITHUB_STEP_SUMMARY
