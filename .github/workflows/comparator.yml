name: Comparator (independent kernel re-check)

# Independent kernel re-verification of the proof suite via
# leanprover/comparator: re-runs Lean's kernel typechecker (separately
# from the elaborator) and statically checks the transitive axiom closure
# of every theorem against [propext, Quot.sound, Classical.choice].
#
# This is the deep, slow backstop for the zero-project-axioms claim.
# The fast per-push gate stays `proofs.yml` (which runs tests/AuditAxioms.lean).
#
# ⭐ PROMOTION NOTE (2026-09-20). The header used to say "keep this NON-REQUIRED until it
# has gone green a few times on the runner". It has: 100 runs from 2026-08-13 to
# 2026-09-20 are 94 success / 2 cancelled / 4 failure, the last failure was 2026-08-30 and
# it failed in `lake build Certs` rather than in comparator, and the current streak of 10
# spans both the Lean 4.34 bump and the ~24.7k-line Mathlib-reuse refactor. Comparator
# itself has never reported a kernel or axiom-closure failure here. It is fit to be a
# required check; flip it in branch protection, which is a GitHub setting, not a file.
#
# ⭐ 2026-10-13, Lean 4.35: `lake comparator` replaces the external toolchain. Lean now bundles
# comparator as a Lake command, its exporter (`leanexport`, always the toolchain's own, so the
# old lean4export olean-compatibility pin is gone), and five independent checkers beyond Lean's
# kernel: leanchecker-paranoid, lean4lean, nanoda, con-leche and con-ron. `--paranoid` requires
# every one of them to accept. The landrun / lean4export / comparator builds, their caches and
# the landrun flag shim are deleted; nanoda — long "disabled pending a rebuild" — runs by default.
#
# Sandbox: `bwrap`, not Landlock. `/` read-only, `/home` and `/tmp` replaced by tmpfs, only the
# project's `.lake` writable, no network after dependency resolution. bwrap needs unprivileged
# user namespaces, which Ubuntu 24.04 gates behind AppArmor; the `Install bubblewrap` step lifts
# that sysctl and smoke-tests bwrap, so a sandbox failure shows there and not mid-check.
#
# Layout: the six Challenge/Solution modules are the ROOT package's `ComparatorTests` lib. The
# sandbox reads only the project directory, so the old nested package's `path = "../.."` require
# could not resolve; as part of the root, the sandboxed build reuses the Certs oleans below.

on:
  push:
    branches: [main]
    # Filtered like the PR trigger (it was NOT until 2026-09-09: every push to main, docs and
    # demos included, paid ~35 min of `lake build Certs` + run.sh here — the corpus tail that
    # certs.yml's header says those pushes no longer pay). Toolchain/manifest/lakefile: a bump
    # can change what the kernel re-checks.
    paths:
      - 'LeanMlir/Proofs/**'
      - 'LeanMlir.lean'   # the root module: `LeanMlir/**` does not match it
      - 'tests/comparator/**'
      - '.github/workflows/comparator.yml'
      # Both are inputs to the `--check` step: the generator writes the tier pair, and the
      # yaml is the list that step requires every comparator config to cover.
      - 'scripts/gates/gen_comparator_tier.py'
      - 'formalization.yaml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  pull_request:
    paths:
      - 'LeanMlir/Proofs/**'
      - 'LeanMlir.lean'   # the root module: `LeanMlir/**` does not match it
      - 'tests/comparator/**'
      - '.github/workflows/comparator.yml'
      # Both are inputs to the `--check` step: the generator writes the tier pair, and the
      # yaml is the list that step requires every comparator config to cover.
      - 'scripts/gates/gen_comparator_tier.py'
      - 'formalization.yaml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

concurrency:
  # A superseded run of the same ref is cancelled; the 2026-09-09 00:05–00:29 burst ran four of these for three superseded commits.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ⭐ 2026-10-28: split four ways. Run 40732487806's timestamps put the tier config at 1123 s, of
  # which 995 s were the six checkers one after another (Lean paranoid 266, lean4lean 311, nanoda
  # 64, con-leche 100, con-ron 49, Lean default 205) and 127 s the sandboxed build+export. Each leg
  # below builds and exports for itself and runs Lean's default kernel (comparator always does),
  # plus its share of the five external checkers, so every checker still sees an export made in its
  # own sandbox. The tier legs are balanced including that default pass: ~516 / ~471 / ~418 s.
  # The two small configs keep one `--paranoid` leg. `comparator` below is the one check branch
  # protection requires; it fails unless every leg passed.
  comparator-leg:
    name: comparator (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    # A COLD Certs build is ~42 min (`Build proof suite`), plus the ~2-min generator drift check,
    # plus the leg's comparator pass (≤ ~10 min for the tier legs). 150 leaves room for a slower
    # runner. The old 45-min cap killed the one-time cold bootstrap before it could save the
    # `lake-certs-` cache (run #219). certs.yml uses 180.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: mathlib + arch, all checkers
            configs: config.json config-arch.json
            kernels: ''
          - leg: tier, lean4lean
            configs: config-tier.json
            kernels: lean4lean
          - leg: tier, Lean paranoid
            configs: config-tier.json
            kernels: paranoid
          - leg: tier, nanoda + con-leche + con-ron
            configs: config-tier.json
            kernels: nanoda,con-leche,con-ron
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # Mathlib is now materialized once (the nested package and its second ~2.3 GB tree
        # are gone), but the Certs oleans plus three NDJSON exports in /tmp still crowd the
        # runner's ~14 GB free; reclaiming the unused preinstalled SDKs is cheap headroom.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install bubblewrap (the `lake comparator` sandbox)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all --die-with-parent true \
            || { echo "::error::bwrap cannot create its namespaces on this runner"; exit 1; }

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache .lake (parent — Mathlib + proof oleans)
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            !.lake/build/doc
            !.lake/build/doc-data
          # ⚠ This path block must stay BYTE-IDENTICAL across certs.yml, comparator.yml,
          # certs-heavy.yml and blueprint.yml's rolling step: actions/cache hashes the path list
          # into a cache "version", and restore only ever matches entries of the same version.
          # blueprint.yml needs the two exclusions (its doc-gen4 output lives in those dirs);
          # they are no-ops here, and carrying them is what lets blueprint restore `lake-certs-`.
          # Learned 2026-09-09: blueprint run 34384974391 missed BOTH its restores for this
          # reason and built 242 modules cold.
          # Cache ONLY the parent project build (Certs oleans), NOT .lake/packages
          # — Mathlib comes from `lake exe cache get` below. Rolling key kept for
          # freshness, but the entry is now a few hundred MB instead of ~3 GB, so
          # it no longer blows GitHub's ~10 GB budget → no eviction. Shares the
          # `lake-certs-` namespace with certs.yml (both run `lake build Certs`),
          # so the two warm each other and never restore proofs.yml's Proofs-only
          # build (which would rebuild the Certs corpus cold). See proofs.yml.
          key: lake-certs-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lake-certs-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            lake-certs-

      - name: Build proof suite (warms Mathlib + corpus oleans for comparator)
        run: |
          # `Certs` since the 2026-07-06 Proofs/Certs split: the comparator
          # re-checks corpus theorems (whole-net VJPs, seals), and `Proofs` is
          # now only the slim demo-cone slice. Certs' roots subsume it.
          lake exe cache get || true   # like the other five workflows: a cache blip is not a proof failure
          # `ComparatorTests` too: the sandboxed `lake comparator` build then only replays.
          lake build Certs ComparatorTests

      - name: Comparator tier files match their generator
        id: tier
        # Once, on the small leg. tests/comparator/{Challenge,Solution}Tier.lean are PRINTED from
        # the project declarations' own types (scripts/gates/gen_comparator_tier.py). A hand-edit,
        # or a statement change upstream, makes them stale — comparator would catch the
        # challenge/solution mismatch, but not a pair that drifted together away from the
        # project. This asks the sharper question: do these files still say what the
        # declarations say? It re-prints every tier type and diffs, ~2 min, no sandbox.
        if: matrix.kernels == ''
        run: python3 scripts/gates/gen_comparator_tier.py --check

      - name: Run lake comparator (${{ matrix.leg }})
        id: run
        run: |
          set -o pipefail
          tests/comparator/run.sh ${{ matrix.kernels != '' && format('--kernels {0}', matrix.kernels) || '' }} \
            ${{ matrix.configs }} 2>&1 | tee "$RUNNER_TEMP/comparator.log"

      - name: Keep the leg's log for the summary
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/leg"
          cp "$RUNNER_TEMP/comparator.log" "$RUNNER_TEMP/leg/" 2>/dev/null || touch "$RUNNER_TEMP/leg/comparator.log"
          echo "${{ matrix.leg }}" > "$RUNNER_TEMP/leg/name"
          echo "${{ steps.tier.outcome }}" > "$RUNNER_TEMP/leg/drift"
          echo "$(bwrap --version) on Linux $(uname -r)" > "$RUNNER_TEMP/leg/sandbox"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparator-log-${{ strategy.job-index }}
          path: ${{ runner.temp }}/leg/
          retention-days: 14

  comparator:
    # The required check: green only if every leg is, and the job summary for the whole run.
    # Built from each leg's `[comparator] <config>: <n> theorems OK in <s> s` lines, which run.sh
    # prints only after comparator exits 0, so a row can only say ✅ for a config whose every leg
    # ran; and from the `[comparator-time]` lines, one row per leg.
    needs: comparator-leg
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests/comparator
            lean-toolchain

      - uses: actions/download-artifact@v4
        with:
          pattern: comparator-log-*
          path: legs

      - name: Job summary
        run: |
          shopt -s nullglob
          legs=(legs/*/)
          total=0; ok=0; rows=""
          for cfg in config.json config-arch.json config-tier.json; do
            n="$(python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1]))["theorem_names"]))' "tests/comparator/$cfg")"
            case "$cfg" in
              config.json)      what="architecture-free; the challenge imports only Mathlib"; want=1 ;;
              config-arch.json) what="architecture VJPs"; want=1 ;;
              config-tier.json) what="formalization.yaml's advertised set (generated), split across three legs"; want=3 ;;
            esac
            total=$((total + n))
            got=0; t=0
            for d in "${legs[@]}"; do
              line="$(grep -F "[comparator] $cfg:" "$d/comparator.log" 2>/dev/null | tail -1)"
              [ -n "$line" ] || continue
              got=$((got + 1)); s="$(sed -E 's/.* in ([0-9]+) s$/\1/' <<< "$line")"
              [ "$s" -gt "$t" ] && t=$s
            done
            if [ "$got" -eq "$want" ]; then
              ok=$((ok + n)); res="✅"; t="$t s"
            else
              res="❌ $got of $want legs passed"; t="—"
            fi
            rows+="| \`$cfg\` | $what | $n | $res | $t |"$'\n'
          done
          drift=""
          for d in "${legs[@]}"; do
            # Only the small leg runs the drift check; the others report `skipped`.
            v="$(cat "$d/drift" 2>/dev/null || true)"
            case "$v" in success|failure) drift=$v ;; esac
          done
          case "$drift" in
            success) tier="✅ the tier files match their generator — every tier declaration's type re-printed and diffed" ;;
            failure) tier="❌ the tier files have drifted from their generator (\`scripts/gates/gen_comparator_tier.py\`)" ;;
            *)       tier="— the tier drift check did not run" ;;
          esac
          phases="build+export|Lean paranoid|lean4lean|nanoda|con-leche|con-ron|Lean default"
          IFS='|' read -ra ph <<< "$phases"
          {
            echo "## Comparator — independent kernel re-check"
            echo ""
            if [ "$ok" -eq "$total" ]; then
              echo "✅ **All ${total} theorems re-checked by Lean's kernel and five independent checkers** (leanchecker-paranoid, lean4lean, nanoda, con-leche, con-ron): every statement matches its challenge, and every axiom closure is within [\`propext\`, \`Quot.sound\`, \`Classical.choice\`]."
            else
              echo "❌ **${ok} of ${total} theorems re-checked** — see the failing leg's \`Run lake comparator\` log."
            fi
            echo ""
            echo "| config | what it covers | theorems | result | time (slowest leg) |"
            echo "|---|---|---|---|---|"
            printf '%s' "$rows"
            echo ""
            # Seconds per phase and leg: the sandboxed build+export, then each checker the leg ran.
            # `·` is a checker the leg does not run; `—` one that did not finish.
            echo "| leg · config (seconds) | ${phases//|/ | } |"
            echo "|---$(printf '|---:%.0s' {1..7})|"
            for d in "${legs[@]}"; do
              leg="$(cat "$d/name" 2>/dev/null || basename "$d")"
              for cfg in config.json config-arch.json config-tier.json; do
                grep -qF "[comparator-time] $cfg " "$d/comparator.log" 2>/dev/null || continue
                row="| $leg · \`$cfg\`"
                for p in "${ph[@]}"; do
                  s="$(grep -F "[comparator-time] $cfg $p: " "$d/comparator.log" | tail -1 | sed -E 's/.*: ([0-9]+) s$/\1/')"
                  if [ -z "$s" ] && ! grep -qF "Running $p kernel" "$d/comparator.log" && [ "$p" != "build+export" ]; then s="·"; fi
                  row+=" | ${s:-—}"
                done
                echo "$row |"
              done
            done
            echo ""
            echo "$tier"
            echo ""
            sb=(legs/*/sandbox)
            echo "**Sandbox:** \`$( [ ${#sb[@]} -gt 0 ] && head -1 "${sb[0]}" || echo unknown)\` · **Lean:** \`$(cat lean-toolchain)\` (\`lake comparator\`; exporter and checkers bundled with the toolchain)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Every leg passed
        run: |
          echo "comparator-leg: ${{ needs.comparator-leg.result }}"
          [ "${{ needs.comparator-leg.result }}" = success ]
