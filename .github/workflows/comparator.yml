name: Comparator (independent kernel re-check)

# Independent kernel re-verification of the proof suite via
# leanprover/comparator: re-runs Lean's kernel typechecker (separately
# from the elaborator) and statically checks the transitive axiom closure
# of every theorem against [propext, Quot.sound, Classical.choice].
#
# This is the deep, slow backstop for the zero-project-axioms claim.
# The fast per-push gate stays `proofs.yml` (which runs tests/AuditAxioms.lean).
#
# ⭐ PROMOTION NOTE (2026-09-20). The header used to say "keep this NON-REQUIRED until it
# has gone green a few times on the runner". It has: 100 runs from 2026-08-13 to
# 2026-09-20 are 94 success / 2 cancelled / 4 failure, the last failure was 2026-08-30 and
# it failed in `lake build Certs` rather than in comparator, and the current streak of 10
# spans both the Lean 4.34 bump and the ~24.7k-line Mathlib-reuse refactor. Comparator
# itself has never reported a kernel or axiom-closure failure here. It is fit to be a
# required check; flip it in branch protection, which is a GitHub setting, not a file.
#
# Sandbox note, corrected 2026-09-20. This used to read "comparator sandboxes via
# Landlock ABI v5, which needs Linux kernel >= 6.10 ... `ubuntu-22.04` does NOT",
# as a risk of the run failing. It is not: comparator passes `--best-effort` to
# landrun unconditionally, so landrun enforces whatever ABI the kernel offers.
# Verified by running all three configs green on a 6.8.0 / ABI 4 box. What an
# older kernel costs is sandbox STRENGTH, silently — landrun does not announce
# the downgrade. So keep `ubuntu-24.04` for the v5 profile, and read the
# `uname -r` step below as recording which profile a given run actually got,
# not as a failure diagnostic.
#
# Tool pinning: lean4export reads the project's `.olean`s, so its build
# must stay olean-compatible with the project's Lean (v4.34.0). LEAN4EXPORT_REF
# is upstream's `v4.34.0` release tag, and the `cp lean-toolchain` in the
# build step below is what keeps that safe across a patch bump with no tag
# (as 4.32.2 was, built from the v4.32.0 tag): the tagged *source* is rebuilt
# with the project's exact Lean, and the cache key hashes lean-toolchain so a
# bump busts it. What matters is the Lean the
# exporter is BUILT with, not the tag it is built FROM; a mismatch shows up as
# "incompatible header" at the export step, which looks nothing like a proof
# failure. If a future bump breaks the build, pin LEAN4EXPORT_REF/COMPARATOR_REF
# to the first commit that went green here.

on:
  push:
    branches: [main]
    # Filtered like the PR trigger (it was NOT until 2026-09-09: every push to main, docs and
    # demos included, paid ~35 min of `lake build Certs` + run.sh here — the corpus tail that
    # certs.yml's header says those pushes no longer pay). Toolchain/manifest/lakefile: a bump
    # can change what the kernel re-checks.
    paths:
      - 'LeanMlir/Proofs/**'
      - 'tests/comparator/**'
      - '.github/workflows/comparator.yml'
      # Both are inputs to the `--check` step: the generator writes the tier pair, and the
      # yaml is the list that step requires every comparator config to cover.
      - 'scripts/gen_comparator_tier.py'
      - 'formalization.yaml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  pull_request:
    paths:
      - 'LeanMlir/Proofs/**'
      - 'tests/comparator/**'
      - '.github/workflows/comparator.yml'
      # Both are inputs to the `--check` step: the generator writes the tier pair, and the
      # yaml is the list that step requires every comparator config to cover.
      - 'scripts/gen_comparator_tier.py'
      - 'formalization.yaml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

concurrency:
  # A superseded run of the same ref is cancelled; the 2026-09-09 00:05–00:29 burst ran four of these for three superseded commits.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparator:
    runs-on: ubuntu-24.04        # kernel >= 6.10 -> Landlock ABI v5, the full sandbox profile
    # 120, not 90: a COLD Certs build is ~42 min (`Build proof suite`) + ~11 min of
    # run.sh, and 2026-09-20 added the 21-theorem tier pair — a third comparator pass,
    # ~2,750 more lines of generated Lean to build, and the ~2-min generator drift check.
    # The old 45-min cap killed the one-time cold bootstrap before it could save the
    # `lake-certs-` cache (run #219). Cold only happens on the first run of a new
    # Mathlib/manifest hash; warm runs were ~6 min before the tier. certs.yml uses 180.
    timeout-minutes: 120
    env:
      LEAN4EXPORT_REF: 076e8e57707e813375e8f9da8bf989799ace9680  # tag v4.34.0
      COMPARATOR_REF:  3afea238d63125383110f8b59acaf11d7788c3e1
      # v0.1.14 is the first release whose CLI accepts comparator's
      # single-dash `-ldd` / `-add-exec` (v0.1.13's urfave/cli rejects them).
      LANDRUN_VERSION: v0.1.14
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # Mathlib is materialized twice here (parent `lake build Certs`, then
        # again when tests/comparator resolves its own Mathlib) — both served
        # from the olean cache (`lake exe cache get`), not compiled from source.
        # Two ~2.3 GB olean trees still land on disk during the run, overflowing
        # the runner's ~14 GB free, so reclaim the ~20+ GB of preinstalled SDKs
        # we don't use (Android, .NET, GHC, CodeQL) up front.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Show kernel (which Landlock ABI the sandbox got)
        run: uname -r

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache .lake (parent — Mathlib + proof oleans)
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            !.lake/build/doc
            !.lake/build/doc-data
          # ⚠ This path block must stay BYTE-IDENTICAL across certs.yml, comparator.yml,
          # certs-heavy.yml and blueprint.yml's rolling step: actions/cache hashes the path list
          # into a cache "version", and restore only ever matches entries of the same version.
          # blueprint.yml needs the two exclusions (its doc-gen4 output lives in those dirs);
          # they are no-ops here, and carrying them is what lets blueprint restore `lake-certs-`.
          # Learned 2026-09-09: blueprint run 34384974391 missed BOTH its restores for this
          # reason and built 242 modules cold.
          # Cache ONLY the parent project build (Certs oleans), NOT .lake/packages
          # — Mathlib comes from `lake exe cache get` below. Rolling key kept for
          # freshness, but the entry is now a few hundred MB instead of ~3 GB, so
          # it no longer blows GitHub's ~10 GB budget → no eviction. Shares the
          # `lake-certs-` namespace with certs.yml (both run `lake build Certs`),
          # so the two warm each other and never restore proofs.yml's Proofs-only
          # build (which would rebuild the Certs corpus cold). See proofs.yml.
          key: lake-certs-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lake-certs-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            lake-certs-

      - name: Build proof suite (warms Mathlib + corpus oleans for comparator)
        run: |
          # `Certs` since the 2026-07-06 Proofs/Certs split: the comparator
          # re-checks corpus theorems (whole-net VJPs, seals), and `Proofs` is
          # now only the slim demo-cone slice. Certs' roots subsume it.
          lake exe cache get || true   # like the other five workflows: a cache blip is not a proof failure
          lake build Certs

      - name: Install landrun
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/landrun" \
            "https://github.com/Zouuup/landrun/releases/download/${LANDRUN_VERSION}/landrun-linux-amd64"
          chmod +x "$HOME/.local/bin/landrun"
          landrun --version
          # Guard: comparator passes single-dash `-ldd`; fail loudly (rather
          # than 40 lines into the run) if a version bump regresses that.
          if landrun -ldd 2>&1 | grep -q 'not defined'; then
            echo "::error::landrun ${LANDRUN_VERSION} rejects the single-dash -ldd flag comparator emits"
            exit 1
          fi

      - name: Cache lean4export build
        id: cache-lean4export
        # Key includes the project toolchain: lean4export's olean reader is
        # version-locked, so it must be rebuilt when the project's Lean
        # changes — and this busts caches from a mismatched build.
        uses: actions/cache@v4
        with:
          path: ~/lean4export
          key: lean4export-${{ env.LEAN4EXPORT_REF }}-${{ hashFiles('lean-toolchain') }}

      - name: Build lean4export (.olean -> text exporter)
        if: steps.cache-lean4export.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/leanprover/lean4export ~/lean4export
          git -C ~/lean4export checkout "$LEAN4EXPORT_REF"
          # lean4export reads the project's .oleans, so it must be built with
          # the project's exact Lean (v4.34.0) — the `cp lean-toolchain` below
          # forces that; a mismatched build rejects our headers ("incompatible
          # header").
          cp lean-toolchain ~/lean4export/lean-toolchain
          (cd ~/lean4export && lake build)

      - name: Cache comparator build
        id: cache-comparator
        uses: actions/cache@v4
        with:
          path: ~/comparator
          key: comparator-${{ env.COMPARATOR_REF }}

      - name: Build comparator
        if: steps.cache-comparator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/leanprover/comparator ~/comparator
          git -C ~/comparator checkout "$COMPARATOR_REF"
          (cd ~/comparator && lake build)

      - name: Link tools onto PATH
        run: |
          ln -sf ~/lean4export/.lake/build/bin/lean4export "$HOME/.local/bin/lean4export"
          ln -sf ~/comparator/.lake/build/bin/comparator  "$HOME/.local/bin/comparator"
          command -v landrun lean4export comparator

      - name: Comparator tier files match their generator
        id: tier
        # tests/comparator/{Challenge,Solution}Tier.lean are PRINTED from the project
        # declarations' own types (scripts/gen_comparator_tier.py). A hand-edit, or a
        # statement change upstream, makes them stale — comparator would catch the
        # challenge/solution mismatch, but not a pair that drifted together away from the
        # project. This asks the sharper question: do these files still say what the
        # declarations say? It re-prints every tier type and diffs, ~2 min, no sandbox.
        run: python3 scripts/gen_comparator_tier.py --check

      - name: Run comparator (Mathlib-only, architecture and tier configs — kernel + axiom-closure re-check)
        id: run
        run: |
          set -o pipefail
          cd tests/comparator
          ./run.sh 2>&1 | tee "$RUNNER_TEMP/comparator.log"

      - name: Job summary
        # The other proof workflows end in a stats table; this one ended in a bare green tick.
        # Built from run.sh's per-config `[comparator] <config>: <n> theorems OK in <s> s` lines,
        # which print only after comparator exits 0, so a row can only say ✅ for a config that ran.
        # `always()`: on a red run the table shows how far it got.
        if: always()
        run: |
          log="$RUNNER_TEMP/comparator.log"
          kern="$(uname -r)"
          if [ "$(printf '%s\n' 6.10 "${kern%%-*}" | sort -V | head -1)" = "6.10" ]; then
            sandbox="Landlock ABI v5, the full profile"
          else
            sandbox="best-effort Landlock (kernel < 6.10, a weaker profile)"
          fi
          total=0; ok=0; rows=""
          for cfg in config.json config-arch.json config-tier.json; do
            n="$(python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1]))["theorem_names"]))' "tests/comparator/$cfg")"
            case "$cfg" in
              config.json)      what="architecture-free; the challenge imports only Mathlib" ;;
              config-arch.json) what="architecture VJPs" ;;
              config-tier.json) what="formalization.yaml's advertised set (generated)" ;;
            esac
            total=$((total + n))
            line="$(grep -F "[comparator] $cfg:" "$log" 2>/dev/null | tail -1)"
            if [ -n "$line" ]; then
              ok=$((ok + n)); res="✅"; t="$(sed -E 's/.* in ([0-9]+) s$/\1/' <<< "$line") s"
            else
              res="❌ not reached, or failed"; t="—"
            fi
            rows+="| \`$cfg\` | $what | $n | $res | $t |"$'\n'
          done
          case "${{ steps.tier.outcome }}" in
            success) tier="✅ the tier files match their generator — every tier declaration's type re-printed and diffed" ;;
            failure) tier="❌ the tier files have drifted from their generator (\`scripts/gen_comparator_tier.py\`)" ;;
            *)       tier="— the tier drift check did not run" ;;
          esac
          {
            echo "## Comparator — independent kernel re-check"
            echo ""
            if [ "$ok" -eq "$total" ]; then
              echo "✅ **All ${total} theorems re-checked by Lean's kernel**: every statement matches its challenge, and every axiom closure is within [\`propext\`, \`Quot.sound\`, \`Classical.choice\`]."
            else
              echo "❌ **${ok} of ${total} theorems re-checked** — see the \`Run comparator\` log."
            fi
            echo ""
            echo "| config | what it covers | theorems | result | time |"
            echo "|---|---|---|---|---|"
            printf '%s' "$rows"
            echo ""
            echo "$tier"
            echo ""
            echo "**Sandbox:** Linux \`$kern\`, $sandbox · **Lean:** \`$(cat lean-toolchain)\` · lean4export \`${LEAN4EXPORT_REF:0:8}\` · comparator \`${COMPARATOR_REF:0:8}\` · landrun \`$LANDRUN_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
