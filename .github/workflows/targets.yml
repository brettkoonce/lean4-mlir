name: Target names

# Deliberately UNFILTERED, and deliberately toolchain-free. Every other workflow here
# is path-filtered so a docs or demo push does not pay for Lean; this one has nothing
# to pay — it is grep, it finishes in under a second, and any file in the tree can name
# a binary. Filtering it would reintroduce exactly the hole it exists to close.
#
# WHAT IT CLOSES (measured 2026-09-20): `scripts/gates/residency_gate_all.sh` carried four
# pre-2026-08-10 `-xla` binary names for six weeks. On a clean tree each of those rows
# reported "SKIP — not built" and the script still exited 0; on the box where it was
# written they passed, because the binaries built before the rename were still in
# .lake/build/bin. Nothing in CI built an apps/ exe, so nothing contradicted it.
#
# The build-level companion is `lake build Apps` in certs.yml: this job asks whether a
# name still resolves, that one asks whether the code behind it still elaborates.
#
# The MANIFEST check rides here for the same reason: its `runs` column counts tracked
# files under runs/ that name each artifact, so a runs/ commit can stale it, and no
# path-filtered workflow sees runs/ commits. It is Python and git, a few seconds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  target-names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every binary a driver names is a live lake target
        run: |
          # GitHub runs steps under `bash -e`, so the failing pipeline must be
          # caught with `|| rc=$?` or the summary below never gets written.
          set -o pipefail
          rc=0
          scripts/gates/check_target_names.sh 2>&1 | tee /tmp/targets.log || rc=$?
          {
            echo "## Target-name lint"
            echo ""
            if [ $rc -eq 0 ]; then
              sed -n 's/^✓ /✅ /p' /tmp/targets.log
            else
              echo "❌ **Dead target names** — a script drives a binary that is not a"
              echo "\`lean_exe\` in \`lakefile.lean\`. On a developer box this hides behind a"
              echo "stale \`.lake/build/bin\`; in CI the gate it feeds simply never runs."
              echo ""
              echo '```'
              grep '✗' /tmp/targets.log
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY
          exit $rc
      - name: Declaration names follow LeanMlir/NAMING.md (ratchet)
        run: |
          set -o pipefail
          rc=0
          python3 scripts/gates/name_lint.py 2>&1 | tee /tmp/names.log || rc=$?
          {
            echo "## Name lint"
            echo ""
            if [ $rc -eq 0 ]; then
              sed -n 's/^✓ /✅ /p' /tmp/names.log
            else
              echo "❌ **New names outside the naming convention** — see \`LeanMlir/NAMING.md\`."
              echo ""
              echo '```'
              grep '✗' /tmp/names.log
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: No unchecked numbers in comments (planning/rubric_review.md, decision 6)
        # Measured results, codebase counts, file:line and commit hashes in comments go stale
        # with nothing to re-check them. Spec constants and statement-backed counts are listed in
        # scripts/gates/comment_numbers_allow.tsv. Here, not in the path-filtered proofs.yml,
        # because the scan covers apps/, demos/, jax/, the lakefile, the yaml and the workflows.
        run: |
          set -o pipefail
          rc=0
          python3 scripts/gates/comment_numbers.py 2>&1 | tee /tmp/numbers.log || rc=$?
          {
            echo "## Comment numbers"
            echo ""
            if [ $rc -eq 0 ]; then
              sed -n 's/^✓ /✅ /p' /tmp/numbers.log
            else
              echo "❌ **Unchecked numbers in comments** — name the source (run dir, theorem,"
              echo "generator) instead, or allow a spec constant in \`comment_numbers_allow.tsv\`."
              echo ""
              echo '```'
              grep '✗' /tmp/numbers.log
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: verified_mlir/MANIFEST.md is current
        # The index of the committed artifacts (writer, variant decode, runs that compiled each).
        # Needs no Lean: `git grep` for the writers, tracked `runs/` logs for the counts. Moved
        # here from proofs.yml 2026-09-27: two runs/ commits staled it unseen behind that
        # workflow's path filter, and the next lakefile push wore the red.
        run: python3 scripts/gates/gen_mlir_manifest.py --check
