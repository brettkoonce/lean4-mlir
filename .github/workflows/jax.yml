# The jax/ subproject (Lean -> JAX Python) has become load-bearing for the
# book, but had no CI of its own: the only workflow that looked at it was
# proofs.yml's zero-axiom grep, and the LoC tables explicitly excluded it.
#
# Four jobs:
#   lint   — no Lean, no Mathlib, no GPU, under a minute. Syntax + stats.
#   build  — the real `lake build`. Cheap because jax/ imports only
#            LeanMlir.Types + LeanMlir.Spec from the parent (8 jobs for the
#            lib, 133 for every exe), and because jax/ now shares the root
#            toolchain and Mathlib pin, so `lake exe cache get` is a hit
#            rather than a second multi-GB cache.
#   oracle — emit + run the 14 layer-family oracle nets on CPU jax against a
#            synthetic MNIST. ~33s locally. Emitter-level only; see the job
#            comment for what it deliberately does not claim.
#   convention — does the VERIFIED render still spell padding, activation and BN
#            the same way its JAX reference does? Six divergences across four
#            nets were each found by hand, a session apiece. Ratchet against
#            scripts/convention_baseline.txt: fails only on a NEW one.
name: JAX subproject

on:
  push:
    paths:
      - 'jax/**'
      - '.github/workflows/jax.yml'
      # The shim-wiring gate reads the VERIFIED side too — which net names which generated shim.
      # Without these, the most likely regression (a sixth .imagenet net added with no
      # `shimScript`) touches nothing this workflow watches. See handoff §0.9.
      - 'LeanMlir/VerifiedNets.lean'
      - 'LeanMlir/VerifiedSpec.lean'
      - 'scripts/gen_shims.sh'
      - 'scripts/shim_wiring_gate.py'
      # The convention audit diffs the RENDER against the reference, so a render change is exactly
      # what can introduce a divergence. Without these paths the most likely regression — someone
      # switches a padding token or an activation on the verified side — touches nothing this
      # workflow watches, which is how all six known divergences got in.
      - 'verified_mlir/**'
      - 'scripts/convention_audit.py'
      - 'scripts/convention_baseline.txt'
      # The one-step optimizer tie reads BOTH sides: the renderer that emits the optimizer stage
      # and the harness that diffs it. ⚠ `ResNet34RenderB.lean` is where `optOne`/`optAllParams`
      # live, so an optimizer change lands there and NOWHERE this workflow otherwise watches —
      # the same omission the six convention divergences got in through.
      - 'LeanMlir/Proofs/Codegen/ResNet34RenderB.lean'
      - 'LeanMlir/Proofs/Codegen/GradClip.lean'
      - 'tests/TestOptStepFixtures.lean'
      - 'scripts/opt_step_tie.py'
  pull_request:
    paths:
      - 'jax/**'
      - '.github/workflows/jax.yml'
      # The shim-wiring gate reads the VERIFIED side too — which net names which generated shim.
      # Without these, the most likely regression (a sixth .imagenet net added with no
      # `shimScript`) touches nothing this workflow watches. See handoff §0.9.
      - 'LeanMlir/VerifiedNets.lean'
      - 'LeanMlir/VerifiedSpec.lean'
      - 'scripts/gen_shims.sh'
      - 'scripts/shim_wiring_gate.py'
      # The convention audit diffs the RENDER against the reference, so a render change is exactly
      # what can introduce a divergence. Without these paths the most likely regression — someone
      # switches a padding token or an activation on the verified side — touches nothing this
      # workflow watches, which is how all six known divergences got in.
      - 'verified_mlir/**'
      - 'scripts/convention_audit.py'
      - 'scripts/convention_baseline.txt'
      # The one-step optimizer tie reads BOTH sides: the renderer that emits the optimizer stage
      # and the harness that diffs it. ⚠ `ResNet34RenderB.lean` is where `optOne`/`optAllParams`
      # live, so an optimizer change lands there and NOWHERE this workflow otherwise watches —
      # the same omission the six convention divergences got in through.
      - 'LeanMlir/Proofs/Codegen/ResNet34RenderB.lean'
      - 'LeanMlir/Proofs/Codegen/GradClip.lean'
      - 'tests/TestOptStepFixtures.lean'
      - 'scripts/opt_step_tie.py'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax gate
        # Every committed .py under jax/ must at least parse. Catches the
        # rot that accumulates in hand-written probe/ trainers nobody has
        # run in months — cheap, and strictly better than the nothing we
        # had. It does NOT import, so a missing jax/torch dep is not a
        # failure here; that is deliberate, this tier installs nothing.
        run: |
          set -e
          fail=0
          for f in $(git ls-files 'jax/**/*.py' 'jax/*.py'); do
            python3 -m py_compile "$f" || { echo "::error file=$f::syntax error"; fail=$((fail+1)); }
          done
          echo "checked $(git ls-files 'jax/**/*.py' 'jax/*.py' | wc -l) files, $fail failures"
          [ "$fail" -eq 0 ]

      - name: Toolchain drift vs parent
        # jax/ `require`s the parent from "..", so a version split means jax/
        # compiles the parent's source under a different Lean AND against its
        # own Mathlib pin — which also costs a second multi-GB cache the 10 GB
        # budget cannot absorb. jax/ sat on 4.30 while root moved to 4.32; that
        # is closed now (both v4.32.0, same mathlib rev), and this step keeps it
        # closed. A warning rather than a failure: drift is worth seeing
        # immediately, but is not itself a broken build.
        run: |
          JAX_TC=$(cat jax/lean-toolchain)
          ROOT_TC=$(cat lean-toolchain)
          echo "| | toolchain |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| jax/ | \`${JAX_TC}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| root | \`${ROOT_TC}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "$JAX_TC" = "$ROOT_TC" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ toolchains match — jax/ can share the root Mathlib cache" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **toolchain split** — jax/ pins its own Mathlib, so a real \`lake build\` here needs a second multi-GB cache. Unify before adding a build job." >> $GITHUB_STEP_SUMMARY
            echo "::warning::jax/ is on ${JAX_TC}, root is on ${ROOT_TC}"
          fi

      - name: Stats
        run: |
          lf() { git ls-files "$@" | wc -l; }
          ll() { git ls-files "$@" | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}'; }
          {
            echo ""
            echo "## JAX subproject"
            echo ""
            echo "| Area | Files | Lines |"
            echo "|------|-------|-------|"
            echo "| Emitter (\`Jax/\`) | $(lf 'jax/Jax/*.lean' 'jax/Jax.lean') | $(ll 'jax/Jax/*.lean' 'jax/Jax.lean') |"
            echo "| Net definitions (\`Main*.lean\`) | $(lf 'jax/Main*.lean') | $(ll 'jax/Main*.lean') |"
            echo "| VJP oracle (Lean) | $(lf 'jax/tests/vjp_oracle/**/*.lean' 'jax/tests/vjp_oracle/*.lean') | $(ll 'jax/tests/vjp_oracle/**/*.lean' 'jax/tests/vjp_oracle/*.lean') |"
            echo "| Probe trainers (Python) | $(lf 'jax/probe/*.py') | $(ll 'jax/probe/*.py') |"
            echo "| Scripts (Python) | $(lf 'jax/scripts/*.py') | $(ll 'jax/scripts/*.py') |"
            echo "| Demos (Python) | $(lf 'jax/demos/*.py') | $(ll 'jax/demos/*.py') |"
            echo "| **Total Lean** | **$(lf 'jax/**/*.lean' 'jax/*.lean')** | **$(ll 'jax/**/*.lean' 'jax/*.lean')** |"
            echo "| **Total Python** | **$(lf 'jax/**/*.py' 'jax/*.py')** | **$(ll 'jax/**/*.py' 'jax/*.py')** |"
            echo ""
            echo "\`lean_exe\` targets: $(grep -c '^lean_exe' jax/lakefile.lean)"
          } >> $GITHUB_STEP_SUMMARY

  build:
    # The real thing: does jax/ compile? It never had this, and the answer
    # turned out to be "no" — MainVjpOracleMbConvV3 had been calling a
    # signature the parent changed in 574b1f9 (2026-04-27), broken for three
    # months with nothing to notice. That is what this job is for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          # Only the project build, never .lake/packages — Mathlib comes from
          # `lake exe cache get`, same discipline as proofs/certs/comparator.
          # Own `lake-jax-` namespace so it never restores another workflow's
          # build. Keyed on BOTH toolchains: jax/ requires the parent from "..",
          # so a root bump invalidates this cache too.
          path: |
            .lake/build
            jax/.lake/build
          key: lake-jax-${{ hashFiles('lean-toolchain', 'jax/lean-toolchain', 'jax/lakefile.lean', 'jax/lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lake-jax-${{ hashFiles('lean-toolchain', 'jax/lean-toolchain', 'jax/lakefile.lean', 'jax/lake-manifest.json') }}-
            lake-jax-

      - name: Build jax/ (emitter + all exes)
        working-directory: jax
        run: |
          set -e
          lake exe cache get || true
          lake build Jax
          EXES=$(grep -oP '^lean_exe\s+«?\K[^»\s]+' lakefile.lean | sed 's/»$//' | tr '\n' ' ')
          echo "building $(echo $EXES | wc -w) exes"
          lake build $EXES
          {
            echo ""
            echo "## JAX build"
            echo ""
            echo "✅ emitter + $(echo $EXES | wc -w) exes built on \`$(cat lean-toolchain)\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Per-net ImageNet shim wiring (handoff §0.9)
        # Every .imagenet net must stream the shim generated from ITS OWN reference recipe. This
        # was hardcoded to ResNet-34's for every net until 2026-08-02, and nothing failed — the
        # three affected nets simply trained on the wrong augmentation. The gate that holds it
        # closed compares each net's config flags to its generated Python's CALL SITES (a
        # definition census mis-reads 2 of 5), and it is what catches a sixth net added without a
        # `shimScript`, or a recipe `out` renamed out from under the wiring.
        #
        # Static tiers only here: `--stream` needs tfds imagenet2012, which CI does not have.
        run: |
          set -e
          scripts/gen_shims.sh
          python3 scripts/shim_wiring_gate.py --break
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ per-net shim wiring: 5 nets, 5 distinct shims, partition matches config" \
            >> $GITHUB_STEP_SUMMARY

  oracle:
    # The CI-runnable slice of the VJP oracle: emit each of the 14 layer-family
    # oracle nets as JAX Python, then RUN each against a tiny synthetic MNIST.
    #
    # What this does NOT do: validate the hand-derived VJPs. The real oracle
    # diffs phase 3 (Lean -> MLIR -> IREE, hand-derived gradients) against
    # phase 2 (Lean -> JAX autodiff); phase 3 needs IREE and a GPU, so it
    # cannot run here. Phase 2 alone has no Lean-derived gradient in the loop
    # — it exercises the EMITTER. Green here means the emitted graph builds,
    # runs and produces a finite loss for every layer family, not that the
    # VJPs agree. That claim still needs tests/vjp_oracle/run.sh on a GPU box.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            jax/.lake/build
          key: lake-jax-${{ hashFiles('lean-toolchain', 'jax/lean-toolchain', 'jax/lakefile.lean', 'jax/lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lake-jax-${{ hashFiles('lean-toolchain', 'jax/lean-toolchain', 'jax/lakefile.lean', 'jax/lake-manifest.json') }}-
            lake-jax-

      - name: Install jax (CPU)
        # CPU wheel only — no cuda/rocm extras. The oracle nets are tiny
        # (3.5k-31k params, 16 steps on 64 synthetic images).
        run: python3 -m pip install --quiet "jax[cpu]"

      - name: Build the oracle exes
        working-directory: jax
        run: |
          set -e
          lake exe cache get || true
          ORACLES=$(grep -oP '^lean_exe\s+«?\K[^»\s]+' lakefile.lean | sed 's/»$//' | grep '^vjp-oracle-' | tr '\n' ' ')
          lake build $ORACLES

      - name: VJP oracle smoke (emit + run, 14 layer families)
        run: |
          set -o pipefail
          ./jax/tests/vjp_oracle/ci_smoke.sh 2>&1 | tee /tmp/oracle.log
          {
            echo ""
            echo "## VJP oracle smoke"
            echo ""
            echo "Emitter-level only — phase 2 (JAX autodiff), no phase 3/IREE, so this does **not** check the hand-derived VJPs."
            echo ""
            echo '```'
            grep -E '^(RUN|EMIT|FAIL)' /tmp/oracle.log || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

  convention:
    # ⭐ CONVENTION AUDIT — does the verified render still spell padding, activation and BN the same
    # way its JAX reference does? Six divergences have been found across four nets, each by hand,
    # each costing a session; they trace to two gaps (the `.convBn` emitter's hardcoded relu, and
    # padding being stated independently on each side). This is the standing check that stops a
    # SEVENTH being discovered a year later.
    #
    # RATCHET, not a hard gate: three divergences are known, tracked in
    # scripts/convention_baseline.txt, and failing on them every run would make the signal
    # worthless. The job fails only on a divergence not already in that list — which is the
    # regression it exists to catch. The list may shrink, never grow.
    #
    # No GPU, no training, no gradients: it runs each reference's forward() once on a 2x3x224x224
    # zero input with jax.lax instrumented and reads the render side out of the committed .mlir.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            jax/.lake/build
          key: lake-jax-${{ hashFiles('lean-toolchain', 'jax/lean-toolchain', 'jax/lakefile.lean', 'jax/lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lake-jax-${{ hashFiles('lean-toolchain', 'jax/lean-toolchain', 'jax/lakefile.lean', 'jax/lake-manifest.json') }}-
            lake-jax-

      - name: Install jax (CPU)
        run: python3 -m pip install --quiet "jax[cpu]"

      - name: Emit the generated references
        # ⚠ `runJax` WRITES the .py and then spawns python to train it. There is no emit-only flag,
        # so each exe is pointed at a data dir that does not exist: the file lands (Runner.lean:21,
        # before the spawn) and the training dies immediately at load. Hence `|| true` — and hence
        # the explicit existence check after it, because "the command failed" is the EXPECTED path
        # here and would otherwise hide a genuine emit failure.
        working-directory: jax
        run: |
          set -e
          lake exe cache get || true
          # ⚠ resnet50-IMAGENET, not resnet50: there is no 10-class R50 reference to generate.
          # The audit uses the 1000-class one as a convention proxy for the Imagenette demo — see
          # the NETS entry in scripts/convention_audit.py for why that is sound.
          NETS="resnet34 mobilenet-v2 mobilenet-v4 efficientnet-b0 resnet50-imagenet"
          lake build $NETS
          for n in $NETS; do lake exe $n /nonexistent-so-training-cannot-start >/dev/null 2>&1 || true; done
          missing=0
          for f in generated_resnet34.py generated_mobilenet_v2.py \
                   generated_mobilenet_v4.py generated_efficientnet_b0.py \
                   generated_resnet50_imagenet.py; do
            if [ ! -s ".lake/build/$f" ]; then echo "::error::$f was not emitted"; missing=1; fi
          done
          [ "$missing" -eq 0 ]

      - name: Convention audit (ratchet + selftest)
        run: |
          set -o pipefail
          JAX_PLATFORMS=cpu python3 scripts/convention_audit.py \
              --baseline scripts/convention_baseline.txt --selftest 2>&1 | tee /tmp/audit.log
          {
            echo ""
            echo "## Convention audit"
            echo ""
            echo "Render vs JAX reference: padding, activation, BN world. Conventions only — a green"
            echo "audit does **not** mean the nets agree numerically (that is \`grad_tie.py\`)."
            echo ""
            echo '```'
            grep -E '^  (r34|r50|mnv2|mnv4|enet) |RATCHET|✓ selftest|NEW DIVERGENCE' /tmp/audit.log || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

  optimizer:
    name: One-step optimizer tie (§5)
    # ⭐⭐ Does the VERIFIED rendered optimizer take the same step as its JAX reference?
    #
    # `oracle` and `grad_tie.py` tie the two implementations at the GRADIENT; nothing tied them at
    # the UPDATE until 2026-08-14. planning/verified_optimizer_parity.md §5: the two paths share a
    # data pipeline BY CONSTRUCTION and share an optimizer BY NOBODY'S CONSTRUCTION — two hand-
    # maintained implementations that happen to agree. D1 (timm's `Lamb.max_grad_norm`, which every
    # LAMB artifact rendered before that date ignored) is what a drift between them looks like.
    #
    # No GPU, no training, no gradients: three tensors of 48/5/24 floats through XLA on CPU, against
    # the reference's own optimizer lines exec'd verbatim out of the generated .py. Seconds.
    #
    # ⚠ The references are REGENERATED here rather than trusted from cache. The on-disk copies go
    # stale — the local ones were four commits behind `f8cd3a9` when this job was written, and while
    # that diff was confined to the eval pipeline, a stale reference is exactly what a tie must not
    # measure against.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            jax/.lake/build
          key: lake-jax-${{ hashFiles('lean-toolchain', 'jax/lean-toolchain', 'jax/lakefile.lean', 'jax/lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lake-jax-${{ hashFiles('lean-toolchain', 'jax/lean-toolchain', 'jax/lakefile.lean', 'jax/lake-manifest.json') }}-
            lake-jax-

      - name: Install jax (CPU)
        run: python3 -m pip install --quiet "jax[cpu]"

      - name: Emit the generated references
        # ⚠ Same `|| true` as the convention job, for the same reason: `runJax` writes the .py and
        # THEN spawns python to train it, with no emit-only flag. The explicit existence check
        # afterwards is what keeps "the command failed" (the expected path) from hiding a real
        # emit failure.
        working-directory: jax
        run: |
          set -e
          lake exe cache get || true
          lake build resnet50-imagenet
          # One recipe per optimizer shape the tie compares against, and each row needs its own:
          #   default     LAMB, no mask, no clip, no accumulation
          #   a2-accum    LAMB + no_weight_decay + global-norm clip + accumulation (wd 0.02)
          #   a1          the same at RSB-A1's wd 0.01 — the `wdStr` row
          #   adam-probe  AdamW + no_weight_decay + clip at eps 1e-8, wd 0.02 — the `.adamw` row
          for r in default a2-accum a1 adam-probe; do
            lake exe resnet50-imagenet "$r" /nonexistent-so-training-cannot-start >/dev/null 2>&1 || true
          done
          missing=0
          for f in generated_resnet50_imagenet.py generated_resnet50_imagenet_a2accum.py \
                   generated_resnet50_imagenet_a1.py generated_resnet50_imagenet_adamprobe.py; do
            if [ ! -s ".lake/build/$f" ]; then echo "::error::$f was not emitted"; missing=1; fi
          done
          [ "$missing" -eq 0 ]

      - name: Emit the optimizer-stage fixtures
        # ⚠ The body of these is `optAllParams`, the SAME call `resnet50TrainStepFaithfulB` makes,
        # so this gates the shipped emission rather than a copy of it.
        run: |
          set -e
          lake exe cache get || true
          lake build opt-step-fixtures
          .lake/build/bin/opt-step-fixtures

      - name: One-step optimizer tie
        run: |
          set -o pipefail
          JAX_PLATFORMS=cpu python3 scripts/opt_step_tie.py 2>&1 | tee /tmp/opt_tie.log
          {
            echo ""
            echo "## One-step optimizer tie"
            echo ""
            echo "Rendered optimizer vs the reference's own, on the same \`(θ, g, m, v, G)\`."
            echo "A green tie does **not** mean the nets agree — that is \`grad_tie.py\`. It means"
            echo "the UPDATE agrees, which nothing else in CI looks at."
            echo ""
            echo '```'
            grep -E '✓|✗|worst|‖Gt‖' /tmp/opt_tie.log || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
