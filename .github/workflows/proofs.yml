name: Verify Proofs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Audit coverage check (AuditAxioms imports ⊆ Proofs+Certs roots)
        # Fail fast (no Lean needed) if tests/AuditAxioms.lean imports a module
        # that `lake build Certs` won't build — the closure check itself runs
        # in certs.yml, but catching a root gap here surfaces it on every push
        # instead of the next corpus run. Locally the gap hides behind stale
        # dev .oleans, so CI is the only place it surfaces (see 5f27766).
        run: python3 scripts/check_audit_coverage.py

      - name: Render coverage check (artifact renderers built + drift-guarded)
        # Fail fast (no Lean needed). Same class of bug as the step above, on
        # the render half: a leaf `#eval` renderer that NOTHING imports is
        # built only as a `lean_lib` root, so a missing root means a missing
        # .olean on a fresh runner — the "object file … does not exist" crash.
        # `Certs`'s docstring claimed it subsumed the `Proofs` roots; it did
        # not, for ResNet34RenderB and MobileNetV2RenderB. Also pins the
        # drift-guard debt at its baseline so it can shrink but never grow.
        run: python3 scripts/check_render_coverage.py

      - name: verified_mlir/ audit suite (writers, pairings, entry names)
        # `scripts/regen_verified_mlir.sh check` writes nothing and needs no Lean, no GPU and no
        # JAX — it reads the committed artifacts. It has existed for a while and CI never ran it,
        # which is how its own blind spot survived: `check_fwd_prefix` pairs each forward with the
        # SGD train step (same renderer, always matches) and never with the ADAM one, the artifact
        # every quoted verified number is trained by. `check_adam_prefix` now forms that pairing —
        # 4 nets pair cleanly, 3 are recorded splits (§3d(b)) — and a divergence that is NOT on the
        # recorded list fails here.
        run: scripts/regen_verified_mlir.sh check

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake/build
          # Cache ONLY the project build (oleans/traces/ir), NOT .lake/packages.
          # Mathlib (~2.3 GB) is restored separately by `lake exe cache get`
          # below, so caching it here just duplicated it — and with the rolling
          # key that wrote a fresh ~3 GB entry every run, blowing GitHub's ~10 GB
          # cache budget across proofs/certs/comparator → LRU eviction → periodic
          # ~30-min cold rebuilds. The rolling key still persists each run's
          # project oleans (freshness, per the note that used to live here); the
          # entries are now a few hundred MB so they no longer thrash. Keyed under
          # a `lake-proofs-` namespace (separate from certs/comparator's
          # `lake-certs-`) so a Proofs job never restores a Certs cache and ends
          # up rebuilding that huge corpus cold — no bare `lake-` fallback.
          key: lake-proofs-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lake-proofs-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            lake-proofs-

      - name: Install Python deps
        run: pip install scipy numpy

      - name: Build proofs (per-push slice)
        run: |
          # `Proofs` is the fast per-push slice since the Certs split
          # (planning/repo_shape_deletion_audit.md §4): the IR/render layer the
          # demo cone reaches + every renderer the drift guard re-elaborates.
          # The certificate corpus + the three-axiom closure audit moved to
          # .github/workflows/certs.yml (proof-path pushes, nightly cron,
          # manual dispatch) — so demo/book/engine pushes skip the corpus tail.
          # Fetch the Mathlib olean cache (fast no-op when the .lake cache already
          # restored it) so a rolling-key cache miss never rebuilds Mathlib from source.
          lake exe cache get || true
          lake build Proofs

      - name: Verified-render drift guard (committed .mlir == proven renderer)
        # Re-elaborate the renderer files (re-runs their #eval writers) so the
        # committed verified_mlir/<net>_* equal the proven renderer the net's
        # FaithfulPoC/TiePoC certifies and Main<Net>Verified trains on. If they
        # drift, fail (regenerate with the `lake env lean …` shown). Covers the
        # full proof-rendered set — every committed forward + SGD train-step the
        # §1a ties certify. NOT covered (exe-generated, not pure-Lean renders):
        # the optimizer variants (*_adam/_sgd/_mom_train_step), *_fwd_eval, and
        # cifar8w_* — those are written by the Main<Net>Verified* exes, see gap #2.
        run: |
          set -e
          # StableHLO.lean writes all 8 proof-rendered forwards + the linear train step.
          lake env lean LeanMlir/Proofs/Codegen/StableHLO.lean
          git diff --exit-code -- \
              verified_mlir/linear_fwd.mlir verified_mlir/linear_train_step.mlir \
              verified_mlir/mlp_fwd.mlir verified_mlir/cnn_fwd.mlir \
              verified_mlir/cifar_fwd.mlir verified_mlir/cifar_bn_fwd.mlir \
              verified_mlir/cifar8_fwd.mlir verified_mlir/cifar8_bn_fwd.mlir \
              verified_mlir/cifar8w_fwd.mlir \
            || { echo "::error::committed verified_mlir/{linear,mlp,cnn,cifar,cifar_bn,cifar8,cifar8_bn,cifar8w}_*.mlir drifted (regen: lake env lean LeanMlir/Proofs/Codegen/StableHLO.lean)"; exit 1; }
          # Per-net train-step renderers.
          lake env lean LeanMlir/Proofs/Codegen/MlpRender.lean
          git diff --exit-code -- verified_mlir/mlp_train_step.mlir \
            || { echo "::error::committed verified_mlir/mlp_train_step.mlir drifted (regen: lake env lean LeanMlir/Proofs/Codegen/MlpRender.lean)"; exit 1; }
          lake env lean LeanMlir/Proofs/Codegen/CnnRender.lean
          # ⭐ The low-precision + batched cifar8 artifacts are guarded HERE, unlike the legacy
          # exe-generated `cifar8w_*`: they are pure-Lean `#eval` renders from this module, so
          # elaborating it rewrites them and any drift shows up in the diff. `cifar8b*` is the
          # BATCHED op family (planning/cifar_lowprec_stability.md §4.1) and `cifar8wb*` is that
          # family at the wide head, which is what the book's §4.3 "Lever 3" trains on.
          git diff --exit-code -- \
              verified_mlir/cnn_train_step.mlir \
              verified_mlir/cifar_train_step.mlir verified_mlir/cifar_bn_train_step.mlir \
              verified_mlir/cifar8_train_step.mlir verified_mlir/cifar8_bn_train_step.mlir \
              verified_mlir/cifar8_bf16_train_step.mlir \
              verified_mlir/cifar8_bf16_mom_train_step.mlir \
              verified_mlir/cifar8_bf16_adam_train_step.mlir \
              verified_mlir/cifar8b_adam_train_step.mlir \
              verified_mlir/cifar8b_bf16_adam_train_step.mlir \
              verified_mlir/cifar8b_fp8_adam_train_step.mlir \
              verified_mlir/cifar8wb_sgd_train_step.mlir \
              verified_mlir/cifar8wb_mom_train_step.mlir \
              verified_mlir/cifar8wb_adam_train_step.mlir \
              verified_mlir/cifar8wb_bf16sgd_train_step.mlir \
              verified_mlir/cifar8wb_bf16mom_train_step.mlir \
              verified_mlir/cifar8wb_bf16adam_train_step.mlir \
              verified_mlir/cifar8_bf16_fwd.mlir \
              verified_mlir/cifar8b_fwd.mlir \
              verified_mlir/cifar8wb_fwd.mlir \
            || { echo "::error::committed verified_mlir/{cnn,cifar,cifar_bn,cifar8,cifar8_bn,cifar8_bf16*,cifar8b*,cifar8wb*}_train_step.mlir drifted (regen: lake env lean LeanMlir/Proofs/Codegen/CnnRender.lean)"; exit 1; }
          # ⭐ The two forwards come from THIS module, not RenderB, and were baselined while the
          # train step beside them was guarded — so `resnet34_fwd` could drift away from the graph
          # `resnet34_train_step` differentiates, with CI green. Elaborating already wrote them.
          lake env lean LeanMlir/Proofs/Codegen/ResNet34Render.lean
          git diff --exit-code -- \
              verified_mlir/resnet34_train_step.mlir \
              verified_mlir/resnet34_fwd.mlir \
              verified_mlir/resnet34_fwd_eval.mlir \
            || { echo "::error::committed verified_mlir/resnet34_{train_step,fwd,fwd_eval}.mlir drifted (regen: lake env lean LeanMlir/Proofs/Codegen/ResNet34Render.lean)"; exit 1; }
          # ResNet34RenderB — the OPTIMIZER renders (AdamW at four batches, its DP peers, heavy-ball)
          # and all four ImageNet (`resnet34in`) artifacts. This module was not elaborated here at
          # all, so its whole output sat baselined-and-unguarded; the 2-GPU ImageNet render landing
          # is what surfaced it. Same argument the mnv2 and ConvNeXt steps already make: one
          # `lake env lean` runs every `#eval` in the file whether or not the result is diffed, so
          # diffing the full set costs nothing and takes ELEVEN lines out of
          # scripts/render_guard_baseline.txt, which is the only direction that file may move.
          lake env lean LeanMlir/Proofs/Codegen/ResNet34RenderB.lean
          git diff --exit-code -- \
              verified_mlir/resnet34_adam_train_step.mlir \
              verified_mlir/resnet34_adam64_train_step.mlir \
              verified_mlir/resnet34_adam128_train_step.mlir \
              verified_mlir/resnet34_adam256_train_step.mlir \
              verified_mlir/resnet34_adamdp_train_step.mlir \
              verified_mlir/resnet34_adamdp128_train_step.mlir \
              verified_mlir/resnet34_mom_train_step.mlir \
              verified_mlir/resnet34in_fwd.mlir \
              verified_mlir/resnet34in_fwd_eval.mlir \
              verified_mlir/resnet34in_mom256_train_step.mlir \
              verified_mlir/resnet34in_momdp64_train_step.mlir \
              verified_mlir/resnet34in_momdp128_train_step.mlir \
              verified_mlir/resnet34in_momdp64bf16_train_step.mlir \
            || { echo "::error::committed verified_mlir/{resnet34,resnet34in}_*.mlir drifted (regen: lake env lean LeanMlir/Proofs/Codegen/ResNet34RenderB.lean)"; exit 1; }
          lake env lean LeanMlir/Proofs/Codegen/MobileNetV2Render.lean
          git diff --exit-code -- verified_mlir/mobilenetv2_train_step.mlir verified_mlir/mobilenetv2_reduced_train_step.mlir \
            || { echo "::error::committed verified_mlir/mobilenetv2_*train_step.mlir drifted (regen: lake env lean LeanMlir/Proofs/Codegen/MobileNetV2Render.lean)"; exit 1; }
          # MobileNetV2RenderB owns every mnv2 OPTIMIZER render — AdamW, its DP peer, RMSProp,
          # and the four ImageNet (`mobilenetv2in`) variants. These were unguarded and baselined until
          # the RMSProp render landed; guarding the module covers all seven at once, which is why
          # four lines came OUT of scripts/render_guard_baseline.txt rather than three going in.
          # (The step comment above saying the *_adam_train_step variants are "exe-generated" is
          # stale for this net: since the §2f swap this `#eval` is their sole writer.)
          lake env lean LeanMlir/Proofs/Codegen/MobileNetV2RenderB.lean
          git diff --exit-code -- \
              verified_mlir/mobilenetv2_adam_train_step.mlir \
              verified_mlir/mobilenetv2_adamdp_train_step.mlir \
              verified_mlir/mobilenetv2_rms_train_step.mlir \
              verified_mlir/mobilenetv2in_adam64_train_step.mlir \
              verified_mlir/mobilenetv2in_adamdp64_train_step.mlir \
              verified_mlir/mobilenetv2in_rms64_train_step.mlir \
              verified_mlir/mobilenetv2in_rmsdp64_train_step.mlir \
              verified_mlir/mobilenetv2in_rmsdp128_train_step.mlir \
              verified_mlir/mobilenetv2in_adam64bf16_train_step.mlir \
              verified_mlir/mobilenetv2in_adamdp64bf16_train_step.mlir \
            || { echo "::error::committed verified_mlir/{mobilenetv2,mobilenetv2in}_*_train_step.mlir drifted (regen: lake env lean LeanMlir/Proofs/Codegen/MobileNetV2RenderB.lean)"; exit 1; }
          # MobileNetV4-Conv-S (planning/mnv4_verified.md §3i). Elaborating this module writes
          # ALL THREE artifacts, so all three are diffed — the fwd/fwd_eval/train_step set comes
          # from ONE traversal (`mnv4FwdChainB` switched by `BnMode`), and guarding only the train
          # step would leave the two forwards free to drift away from the graph that trains them.
          # That is precisely the §3d(b) split this net was built to make impossible.
          # The same module also writes the three 1000-class ImageNet artifacts (`mnv4in`,
          # handoff §4a-quater). Same argument, same traversal: elaborating the module emits
          # them whether or not they are diffed, so leaving them out bought nothing and let the
          # ImageNet renders drift with CI green.
          lake env lean LeanMlir/Proofs/Codegen/MobileNetV4RenderB.lean
          git diff --exit-code -- \
              verified_mlir/mnv4_fwd.mlir \
              verified_mlir/mnv4_fwd_eval.mlir \
              verified_mlir/mnv4_adam_train_step.mlir \
              verified_mlir/mnv4in_fwd.mlir \
              verified_mlir/mnv4in_fwd_eval.mlir \
              verified_mlir/mnv4in_adam64_train_step.mlir \
              verified_mlir/mnv4in_adam64bf16_train_step.mlir \
              verified_mlir/mnv4in_adamdp64_train_step.mlir \
              verified_mlir/mnv4in_adamdp64bf16_train_step.mlir \
            || { echo "::error::committed verified_mlir/mnv4*_*.mlir drifted (regen: lake env lean LeanMlir/Proofs/Codegen/MobileNetV4RenderB.lean)"; exit 1; }
          # Elaborating this module writes all EIGHT ConvNeXt artifacts, so diffing only the SGD
          # train step left seven of them unguarded-but-baselined — the same gap the EfficientNet
          # step below had until 2026-08-02. The `lake env lean` above already ran every writer, so
          # diffing the full set costs nothing and shrinks the baseline, which is the only direction
          # scripts/render_guard_baseline.txt is allowed to move.
          lake env lean LeanMlir/Proofs/Codegen/ConvNeXtRender.lean
          git diff --exit-code -- verified_mlir/convnext_train_step.mlir \
              verified_mlir/convnext_fwd.mlir \
              verified_mlir/convnext_adam_train_step.mlir \
              verified_mlir/convnext_adamdp_train_step.mlir \
              verified_mlir/convnext_ema_train_step.mlir \
              verified_mlir/convnext_emadp_train_step.mlir \
              verified_mlir/convnextin_adam_train_step.mlir \
              verified_mlir/convnextin_adamdp_train_step.mlir \
              verified_mlir/convnextin_ema_train_step.mlir \
              verified_mlir/convnextin_emadp_train_step.mlir \
              verified_mlir/convnextin_fwd.mlir \
              verified_mlir/convnext_adamwx_train_step.mlir \
              verified_mlir/convnextin_adamwx_train_step.mlir \
              verified_mlir/convnext_adamclip_train_step.mlir \
              verified_mlir/convnextin_adamwxclip_train_step.mlir \
              verified_mlir/convnextin_adamdpwxclip_train_step.mlir \
              verified_mlir/convnextsin_fwd.mlir \
              verified_mlir/convnextbin_fwd.mlir \
            || { echo "::error::committed verified_mlir/{convnext,convnextin,convnextsin,convnextbin}_* drifted (regen: lake env lean LeanMlir/Proofs/Codegen/ConvNeXtRender.lean)"; exit 1; }
          # The STOCHASTIC-DEPTH renders come from a DIFFERENT module — ConvNeXtRenderB, the chain at
          # the batched index N := B, which is the only one where a per-EXAMPLE drop mask is
          # expressible at all (handoff §0.10). It is a separate `lake env lean` because it is a
          # separate file, not because the artifacts are less guarded: all five are diffed.
          lake env lean LeanMlir/Proofs/Codegen/ConvNeXtRenderB.lean
          git diff --exit-code -- verified_mlir/convnext_adamdrop_train_step.mlir \
              verified_mlir/convnext_adamdpdrop_train_step.mlir \
              verified_mlir/convnext_drop_fwd.mlir \
              verified_mlir/convnextin_adamwxclipdrop_train_step.mlir \
              verified_mlir/convnextin_adamdpwxclipdrop_train_step.mlir \
              verified_mlir/convnextin_drop_fwd.mlir \
              verified_mlir/convnextsin_drop_fwd.mlir \
              verified_mlir/convnextsin_adamwxclipdrop_train_step.mlir \
              verified_mlir/convnextsin_adamdpwxclipdrop_train_step.mlir \
              verified_mlir/convnextsin_adamwxclipdropbf16_train_step.mlir \
              verified_mlir/convnextsin_adamdpwxclipdropbf16_train_step.mlir \
              verified_mlir/convnextbin_drop_fwd.mlir \
              verified_mlir/convnextbin_adamwxclipdrop_train_step.mlir \
              verified_mlir/convnextbin_adamdpwxclipdrop_train_step.mlir \
              verified_mlir/convnextin_adamwxclipdropbf16_train_step.mlir \
              verified_mlir/convnextin_adamdpwxclipdropbf16_train_step.mlir \
              verified_mlir/convnextbin_adamwxclipdropbf16_train_step.mlir \
              verified_mlir/convnextbin_adamdpwxclipdropbf16_train_step.mlir \
            || { echo "::error::committed verified_mlir/{convnext,convnextin,convnextsin,convnextbin}_*drop* drifted (regen: lake env lean LeanMlir/Proofs/Codegen/ConvNeXtRenderB.lean)"; exit 1; }
          # ViT's SD renders, from ViTRenderB — the batched chain. ⚠ That chain reproduces ViT's
          # committed drop-free artifacts byte-for-byte (unlike ConvNeXt's, which differs on 78
          # conv-VJP lines), so these come from the same emitter as vit_fwd/vit_adam_train_step.
          lake env lean LeanMlir/Proofs/Codegen/ViTRenderB.lean
          git diff --exit-code -- verified_mlir/vit_adamdrop_train_step.mlir \
              verified_mlir/vit_adamdpdrop_train_step.mlir \
              verified_mlir/vit_drop_fwd.mlir \
              verified_mlir/vitin_adamwxclipdrop_train_step.mlir \
              verified_mlir/vitin_drop_fwd.mlir \
              verified_mlir/vitin_adamdp128x4wxclipdrop_train_step.mlir \
              verified_mlir/vitsin_drop_fwd.mlir \
              verified_mlir/vitsin_fwd.mlir \
              verified_mlir/vitbin_adamdp32x4wxclipdrop_train_step.mlir \
              verified_mlir/vitbin_adamdp32x4wxclipdropbf16_train_step.mlir \
              verified_mlir/vitbin_fwd.mlir \
              verified_mlir/vitsin_adamdp128x4wxclipdrop_train_step.mlir \
              verified_mlir/vitsin_adamdp128x4wxclipdropbf16_train_step.mlir \
              verified_mlir/vitin_adamdp256x2wxclipdrop_train_step.mlir \
              verified_mlir/vitin_adamdp128x2wxclipdrop_train_step.mlir \
              verified_mlir/vitin_adamwxclipdropbf16_train_step.mlir \
              verified_mlir/vitin_adamdp128x4wxclipdropbf16_train_step.mlir \
            || { echo "::error::committed verified_mlir/{vit,vitin}_*drop* drifted (regen: lake env lean LeanMlir/Proofs/Codegen/ViTRenderB.lean)"; exit 1; }
          # Elaborating this module writes ALL FOURTEEN EfficientNet artifacts, so diffing only
          # the SGD train step left thirteen of them unguarded-but-baselined. Diffing the full set
          # costs nothing extra (the `lake env lean` above already ran every writer) and is why ten
          # lines came OUT of scripts/render_guard_baseline.txt when the RMSProp render landed.
          lake env lean LeanMlir/Proofs/Codegen/EfficientNetRender.lean
          git diff --exit-code -- \
              verified_mlir/efficientnet_train_step.mlir \
              verified_mlir/efficientnet_fwd.mlir verified_mlir/efficientnet_fwd_eval.mlir \
              verified_mlir/efficientnet_adam_train_step.mlir \
              verified_mlir/efficientnet_adamdp_train_step.mlir \
              verified_mlir/efficientnet_adam128_train_step.mlir \
              verified_mlir/efficientnet_adamdp128_train_step.mlir \
              verified_mlir/efficientnet_rms_train_step.mlir \
              verified_mlir/efficientnet_emarms_train_step.mlir \
              verified_mlir/efficientnet_adamdrop_train_step.mlir \
              verified_mlir/efficientnet_adamdpdrop_train_step.mlir \
              verified_mlir/efficientnet_drop_fwd.mlir \
              verified_mlir/efficientnet_drop_fwd_eval.mlir \
              verified_mlir/efficientnet_adamdo_train_step.mlir \
              verified_mlir/efficientnet_do_fwd.mlir \
              verified_mlir/efficientnet_do_fwd_eval.mlir \
              verified_mlir/efficientnetin_emarms64_train_step.mlir \
              verified_mlir/efficientnetin_emarmsdp64_train_step.mlir \
              verified_mlir/efficientnetin_emarms64drop_train_step.mlir \
              verified_mlir/efficientnetin_emarms64dropdo_train_step.mlir \
              verified_mlir/efficientnetin_emarmsdp64dropdo_train_step.mlir \
              verified_mlir/efficientnetin_emarmsdp128dropdo_train_step.mlir \
              verified_mlir/efficientnetin_drop_fwd.mlir \
              verified_mlir/efficientnetin_dropdo_fwd.mlir \
              verified_mlir/efficientnetin_fwd.mlir verified_mlir/efficientnetin_fwd_eval.mlir \
              verified_mlir/efficientnetin_adam64_train_step.mlir \
              verified_mlir/efficientnetin_adamdp64_train_step.mlir \
              verified_mlir/efficientnetin_rms64_train_step.mlir \
              verified_mlir/efficientnetin_rmsdp64_train_step.mlir \
              verified_mlir/efficientnetin_rms64bf16_train_step.mlir \
              verified_mlir/efficientnetin_rmsdp64bf16_train_step.mlir \
            || { echo "::error::committed verified_mlir/{efficientnet,efficientnetin}_*.mlir drifted (regen: lake env lean LeanMlir/Proofs/Codegen/EfficientNetRender.lean)"; exit 1; }
          lake env lean LeanMlir/Proofs/Codegen/ViTRender.lean
          git diff --exit-code -- verified_mlir/vit_train_step.mlir verified_mlir/vit_fwd.mlir \
              verified_mlir/vit_adam_train_step.mlir \
              verified_mlir/vit_adamdp_train_step.mlir \
              verified_mlir/vit_adam64_train_step.mlir \
              verified_mlir/vit_adamdp64_train_step.mlir \
              verified_mlir/vit_adamdp32x4_train_step.mlir \
              verified_mlir/vit_adam128_train_step.mlir \
              verified_mlir/vit_adamdp128x4_train_step.mlir \
              verified_mlir/vit_ema_train_step.mlir \
              verified_mlir/vit_adamwx_train_step.mlir \
              verified_mlir/vitin_adam128wx_train_step.mlir \
              verified_mlir/vit_adamclip_train_step.mlir \
              verified_mlir/vitin_adam128wxclip_train_step.mlir \
              verified_mlir/vitin_adamdp128x4wxclip_train_step.mlir \
              verified_mlir/vitin_fwd.mlir \
              verified_mlir/vitin_adam128_train_step.mlir \
              verified_mlir/vitin_adamdp128x4_train_step.mlir \
              verified_mlir/vitin_ema128_train_step.mlir \
              verified_mlir/vitin_emadp128x4_train_step.mlir \
            || { echo "::error::committed verified_mlir/{vit,vitin}_*.mlir drifted (regen: lake env lean LeanMlir/Proofs/Codegen/ViTRender.lean)"; exit 1; }
          # ResNet50RenderB is the SOLE writer of all twenty-seven R50 artifacts — both
          # resolutions (`resnet50in` @224 and `resnet50in160` @160, which are different NET
          # SPECS, not a suffix), every optimizer variant (AdamW, LAMB, accumulation, their DP
          # peers, BCE), and both `_fwd`/`_fwd_eval` forwards. Guarded from the start rather
          # than baselined: the whole family arrived in one arc and re-elaborating the module
          # costs ~18 s, so there was never a CI-budget reason to defer it. The RSB-A3 run of
          # 2026-08-07 trains on `resnet50in160_lambaccdp8x64bce_train_step`, so that one is a
          # published result's artifact and must not drift silently.
          lake env lean LeanMlir/Proofs/Codegen/ResNet50RenderB.lean
          git diff --exit-code -- \
              verified_mlir/resnet50in_fwd.mlir \
              verified_mlir/resnet50in_fwd_eval.mlir \
              verified_mlir/resnet50in_adam64_train_step.mlir \
              verified_mlir/resnet50in_adamdp64_train_step.mlir \
              verified_mlir/resnet50in_adam64bce_train_step.mlir \
              verified_mlir/resnet50in_lamb64_train_step.mlir \
              verified_mlir/resnet50in_lamb64bce_train_step.mlir \
              verified_mlir/resnet50in_acc4x64_train_step.mlir \
              verified_mlir/resnet50in_accdp4x64_train_step.mlir \
              verified_mlir/resnet50in_accdp8x64_train_step.mlir \
              verified_mlir/resnet50in160_fwd.mlir \
              verified_mlir/resnet50in160_fwd_eval.mlir \
              verified_mlir/resnet50in160_lamb64bce_train_step.mlir \
              verified_mlir/resnet50in160_lambdp64bce_train_step.mlir \
              verified_mlir/resnet50in160_lambacc4x64bce_train_step.mlir \
              verified_mlir/resnet50in160_lambacc8x64bce_train_step.mlir \
              verified_mlir/resnet50in160_lambaccdp8x64wxbce_train_step.mlir \
              verified_mlir/resnet50in160_lambacc8x64wxbce_train_step.mlir \
              verified_mlir/resnet50in160_lambaccdp8x128bce_train_step.mlir \
              verified_mlir/resnet50in160_lambaccdp8x64bce_train_step.mlir \
              verified_mlir/resnet50in160_lambaccdp8x64wxclipbce_train_step.mlir \
              verified_mlir/resnet50in160_lambacc8x64wxclipbce_train_step.mlir \
              verified_mlir/resnet50in_mom256_train_step.mlir \
              verified_mlir/resnet50in_momdp64_train_step.mlir \
              verified_mlir/resnet50_fwd.mlir \
              verified_mlir/resnet50_fwd_eval.mlir \
              verified_mlir/resnet50_adam_train_step.mlir \
              verified_mlir/resnet50in_momdp64bf16_train_step.mlir \
              verified_mlir/resnet50in_lambaccdp8x64wxclipbce_train_step.mlir \
              verified_mlir/resnet50in_lambacc8x64wxclipbce_train_step.mlir \
              verified_mlir/resnet50in_lambaccdp8x64wxclipbcebf16_train_step.mlir \
              verified_mlir/resnet50in_lambacc8x64wxclipbcebf16_train_step.mlir \
              verified_mlir/resnet50in_lambaccdp8x64wxclipbcewd001_train_step.mlir \
              verified_mlir/resnet50in_lambacc8x64wxclipbcewd001_train_step.mlir \
              verified_mlir/resnet50in_lambaccdp8x64wxclipbcewd001bf16_train_step.mlir \
              verified_mlir/resnet50in_lambacc8x64wxclipbcewd001bf16_train_step.mlir \
            || { echo "::error::committed verified_mlir/resnet50*.mlir drifted (regen: lake env lean LeanMlir/Proofs/Codegen/ResNet50RenderB.lean)"; exit 1; }

      - name: Zero-axiom-declaration guard
        # The former trusted-bridge footprint check is gone: Binary32Instance's
        # ieeeRnd/ieeeRnd_err axioms are DISCHARGED by the constructed rndP grid operator
        # (post_audit_roadmap §2), and the binary32/fp8 bridge capstones are audited inside
        # the main 3-axiom closure above like everything else. This guard makes the new
        # invariant durable: ZERO `axiom` declarations anywhere in the repo's Lean sources.
        run: |
          set -e
          hits=$(grep -rn --include='*.lean' --exclude-dir=.lake -E '^[[:space:]]*(private[[:space:]]+|protected[[:space:]]+)?axiom[[:space:]]+[A-Za-z_]' LeanMlir apps tests jax || true)
          if [ -n "$hits" ]; then
            echo "::error::axiom declarations found (the repo is supposed to have none):"
            echo "$hits"
            exit 1
          fi
          echo "zero axiom declarations repo-wide"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Zero axiom declarations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **No \`axiom\` declarations anywhere in the repo's Lean sources — the former IEEE rounding axioms are discharged by the constructed \`rndP\` operator (\`Binary32Instance.lean\`), audited in the main 3-axiom closure.**" >> $GITHUB_STEP_SUMMARY

      # ── The SCORING gates. Pure host arithmetic, no GPU, milliseconds — there is no reason
      #    for these not to be here, and they were not until 2026-08-05.
      #
      #    Both exist because of defects that shipped and were invisible for months: `argmax-check`
      #    for an argmax that scanned a literal 10 of 1000 logits, `label-check` for eval labels
      #    read one byte wide (`label % 256`). BOTH were correct on every net this repo gates —
      #    Imagenette, CIFAR and MNIST are all 10-class — and wrong on exactly the ungated
      #    1000-class tier, where together they under-reported ImageNet top-1 by ~4x.
      #
      #    Each ships a CONTROL that must go red (a 10-wide argmax window must MISS a peak at 700;
      #    a byte-0 read must MISS every label above 255), so a green here is not vacuous.
      #
      #    ⚠ The GPU-bound gates cannot live here and are deliberately absent: `r34-dp-shard`
      #    (4 replicas) and `scripts/residency_gate_all.sh`. Those stay manual — a limit, not an
      #    oversight, and worth knowing when reading a green run.
      - name: Scoring gates (argmax width, label width)
        run: |
          lake build argmax-check label-check
          .lake/build/bin/argmax-check
          .lake/build/bin/label-check
          echo "### Scoring gates" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **\`argmax-check\`** — argmax honours its class count at K=1000, at a row offset, and the 10-wide control MISSES." >> $GITHUB_STEP_SUMMARY
          echo "✅ **\`label-check\`** — int32 labels round-trip 0..999, and the byte-0 control MISSES every label > 255." >> $GITHUB_STEP_SUMMARY

      - name: Summary
        run: |
          echo "## Proof Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Sorry count
          SORRIES=$(lake build Proofs 2>&1 | grep -c "sorry" || true)
          if [ "$SORRIES" -eq 0 ]; then
            echo "✅ **All proofs verified — zero sorry**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **${SORRIES} sorry(s) remaining:**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| File | Line | Note |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
            lake build Proofs 2>&1 | grep "sorry" | while read line; do
              file=$(echo "$line" | sed 's/warning: //' | sed 's/:.*//')
              lineno=$(echo "$line" | grep -o ':[0-9]*:' | head -1 | tr -d ':')
              decl=$(echo "$line" | sed "s/.*declaration uses .sorry.//" | sed "s/'//g")
              case "$file" in
                *Tensor*) note="vjp3_comp: 6-level Finset.sum_comm (sum reordering bookkeeping)" ;;
                *) note="$decl" ;;
              esac
              link="https://github.com/${{ github.repository }}/blob/${{ github.sha }}/${file}#L${lineno}"
              echo "| [${file}](${link}) | ${lineno} | ${note} |" >> $GITHUB_STEP_SUMMARY
            done
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Theorems / Defs | Axioms | Lines |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----------------|--------|-------|" >> $GITHUB_STEP_SUMMARY
          # Count all top-level theorems and (noncomputable) defs — broader
          # than a VJP-keyword filter, catches structural lemmas too.
          THM_PAT='^(theorem|noncomputable def|def) '
          TOTAL_THMS=0
          TOTAL_AXMS=0
          for f in LeanMlir/Proofs/*/*.lean; do
            name=${f#LeanMlir/Proofs/}
            thms=$(grep -cE "$THM_PAT" "$f" || true)
            axms=$(grep -c "^axiom " "$f" || true)
            lines=$(wc -l < "$f")
            echo "| \`${name}\` | ${thms} | ${axms} | ${lines} |" >> $GITHUB_STEP_SUMMARY
            TOTAL_THMS=$((TOTAL_THMS + thms))
            TOTAL_AXMS=$((TOTAL_AXMS + axms))
          done
          TOTAL_LINES=$(cat LeanMlir/Proofs/*/*.lean | wc -l)
          echo "| **Total** | **${TOTAL_THMS}** | **${TOTAL_AXMS}** | **${TOTAL_LINES}** |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Numerical Gradient Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Axiom | Max Error | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          python3 LeanMlir/Proofs/check_jacobians.py 2>&1 | grep -E "PASS|FAIL" | while read line; do
            status=$(echo "$line" | grep -o "PASS\|FAIL")
            name=$(echo "$line" | sed 's/.*: //' | sed 's/ *max_err.*//')
            err=$(echo "$line" | grep -o "max_err=[0-9.e+-]*" | sed 's/max_err=//')
            icon=$( [ "$status" = "PASS" ] && echo "✅" || echo "❌" )
            echo "| ${name} | ${err} | ${icon} ${status} |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY

          # Fail CI if gradient checks fail
          python3 LeanMlir/Proofs/check_jacobians.py

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Bestiary Entries" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Variants | Lines |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|-------|" >> $GITHUB_STEP_SUMMARY
          total_variants=0
          total_bestiary_lines=0
          total_bestiary_files=0
          for f in Bestiary/*.lean; do
            base=$(basename "$f")
            # Each `def X : NetSpec` is a variant (architecture + sizes + tiny fixtures)
            variants=$(grep -cE '^def [a-zA-Z0-9_]+ : NetSpec' "$f" || true)
            lines=$(wc -l < "$f")
            echo "| \`${base}\` | ${variants} | ${lines} |" >> $GITHUB_STEP_SUMMARY
            total_variants=$((total_variants + variants))
            total_bestiary_lines=$((total_bestiary_lines + lines))
            total_bestiary_files=$((total_bestiary_files + 1))
          done
          echo "| **Total (${total_bestiary_files} files)** | **${total_variants}** | **${total_bestiary_lines}** |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Codebase Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Files | Lines |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|-------|" >> $GITHUB_STEP_SUMMARY
          # Rows partition the Lean tree and sum to Total Lean. Each is a `find` that excludes
          # any nested .lake build tree (e.g. tests/comparator/.lake/packages/mathlib — which a
          # plain `*.lean` walk would otherwise add ~millions of Mathlib lines for).
          lf() { find "$@" -name "*.lean" -not -path "*/.lake/*" 2>/dev/null | wc -l; }      # file count
          ll() { find "$@" -name "*.lean" -not -path "*/.lake/*" -print0 2>/dev/null | xargs -0 cat 2>/dev/null | wc -l; }  # line count
          # Core Library = LeanMlir/ minus the Proofs/ subtree, plus the root umbrella.
          core() { find LeanMlir -name "*.lean" -not -path "LeanMlir/Proofs/*" -not -path "*/.lake/*"; ls LeanMlir.lean 2>/dev/null; }
          echo "| Proofs | $(lf LeanMlir/Proofs) | $(ll LeanMlir/Proofs) |" >> $GITHUB_STEP_SUMMARY
          # Per-bucket breakdown of the Proofs row (the six subdirectories).
          for d in Foundation Architectures Float Codegen Certificates Training; do
            echo "| — $d | $(lf LeanMlir/Proofs/$d) | $(ll LeanMlir/Proofs/$d) |" >> $GITHUB_STEP_SUMMARY
          done
          echo "| Core Library | $(core | wc -l) | $(core | xargs cat 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Bestiary | $(lf Bestiary) | $(ll Bestiary) |" >> $GITHUB_STEP_SUMMARY
          # Trainers = apps/**/Main*.lean (all backends/optimizers) + the historical/ trainers.
          echo "| Trainers | $(find apps historical -name 'Main*.lean' 2>/dev/null | wc -l) | $(find apps historical -name 'Main*.lean' -exec cat {} + 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Demos | $(ls demos/*.lean 2>/dev/null | wc -l) | $(cat demos/*.lean 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | $(lf tests) | $(ll tests) |" >> $GITHUB_STEP_SUMMARY
          echo "| FFI (C) | $(ls ffi/*.c ffi/*.h 2>/dev/null | wc -l) | $(cat ffi/*.c ffi/*.h 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          # Total Lean: every *.lean except build files (lakefile.lean), any nested .lake tree,
          # and the jax/ + phase-1 mnist-lean4/ subprojects.
          total_lean=$(find . -name "*.lean" -not -name "lakefile.lean" -not -path "*/.lake/*" -not -path "./jax/*" -not -path "./mnist-lean4/*" -print0 | xargs -0 cat 2>/dev/null | wc -l)
          total_c=$(cat ffi/*.c ffi/*.h 2>/dev/null | wc -l)
          echo "| **Total Lean** | | **${total_lean}** |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total C** | | **${total_c}** |" >> $GITHUB_STEP_SUMMARY
