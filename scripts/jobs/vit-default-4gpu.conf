# ViT-Tiny (DeiT-Ti) / ImageNet-1k, VERIFIED path (Lean → StableHLO → XLA/PJRT), 4-GPU data-parallel.
#
#     scripts/supervise.sh vit-default-4gpu
#
# 4 replicas x bs 128 = global batch 512, 2,502 steps/epoch.
#
# ⭐ MEASURED 2026-08-05, this shape, residency + prefetch:
#
#       SHIM_WORKERS=1   4,348 ms/step      ← what §0.13 recorded
#       SHIM_WORKERS=8     665 ms/step      ← 6.5x, KEEP
#       SHIM_WORKERS=16    710 ms/step      ← WORSE; the box is out of cores
#       LEAN_MLIR_BENCH_SYNTH (no data)  250 ms/step   — the compute-only floor
#
#   27.7 min/epoch ⇒ 300 ep ≈ 138.7 h ≈ 5.8 d. §0.13's table said 250 h for EIGHTY epochs.
#
# ⚠⚠ THIS IS THE ONE NET STILL DATA-BOUND AFTER THE FIX, and that is a hardware fact rather than a
#   bug. 665 against a 250 ms floor means ~415 ms/step of producer the prefetch cannot hide. ViT
#   needs ~2,048 img/s; 8 producers deliver ~770, and 16 is slower than 8 because 32 cores cannot
#   run 16 tf.data pipelines plus the trainer plus four GPU streams. Closing it would need ~21
#   producers' worth of cores.
#
#   Its shim is the heaviest of the five: AutoAugment + RandAugment + random erasing + REPEATED
#   augmentation. ⚠ Do not "fix" this by trimming the augmentation — that is the reference recipe,
#   and a second definition of the transform on the Lean side is the double-writer failure this
#   repo keeps paying for. ⚠ And uint8 on the wire does NOT help here: the constraint is CPU
#   augmentation, not transport.
#
# ▶ Unexamined, and 47% of the non-data step: this net's LAUNCH time is 118 ms against R34's 9.4
#   (`PJRT_FFI_TIMING=10`). Worth a look before anyone treats 250 ms as ViT's floor.

# ▶ §2c N1: this must equal the second dash-field of the filename. supervise.sh refuses
#   otherwise — the job namespace drifted from the recipe namespace once already.
RECIPE=default
DEVS="0,2,3,4"          # the AER-clean four; idx 1 and 5 are excluded (reference_ares_pcie_aer)
EPOCHS=300              # vitImagenetConfig.epochs — the DeiT-Ti schedule length

CMD=(.lake/build/bin/vit-imagenet-verified data)

ENV_EXTRA=(
  PJRT_PLUGIN=".venv/lib/python3.12/site-packages/jax_plugins/xla_cuda12/xla_cuda_plugin.so"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⚠ The `drop` DP artifact, NOT `adamdp128x4wxclip`. Both exist and only this one carries
  # dropPath, which DeiT-Ti's recipe sets. ⚠ Verify by listing what the artifact BAKES
  # (handoff §0.5) — the variant name is a label, not evidence.
  LEAN_MLIR_VARIANT=adamdp128x4wxclipdrop
  LEAN_MLIR_BATCH=128                # PER REPLICA
  PJRT_FFI_RESIDENT=1
  # ⚠⚠ REQUIRED — worth 6.5x. ⚠ And do NOT raise it to 16: measured slower (710 vs 665).
  SHIM_WORKERS=8
)

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

CKPT_EPOCH_FILE=".lake/build/vitin_adamdp128x4wxclipdrop_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_vit
precheck_vit() {
  [ -x .venv/bin/python3 ] || { echo "missing .venv/bin/python3 (the pinned env)"; return 1; }
  [ -f verified_mlir/vitin_adamdp128x4wxclipdrop_train_step.mlir ] || {
    echo "missing the 4-replica dropPath render — build the ViT renderer"; return 1; }
  [ -f jax/.lake/build/generated_vit_tiny_imagenet_shim.py ] || {
    echo "missing ViT's OWN tfds shim — scripts/gen_shims.sh"; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "PJRT_FFI_RESIDENT=1 is missing from ENV_EXTRA — opt-in, defaults OFF, silent."; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'SHIM_WORKERS=8' || {
    echo "SHIM_WORKERS=8 is missing from ENV_EXTRA. One producer gives 4,348 ms/step against 665,"
    echo "i.e. ~38 days instead of ~6, with NOTHING in the log to say so."; return 1; }
  # ⚠ vitin's DP shard gate is `vit-dp-check`, which hands both replicas the SAME rows and is
  # therefore structurally blind to a shard-OFFSET bug. This job runs 4 genuinely-sharded replicas.
  # Not fatal, but this is the net whose sharding has the weakest evidence behind it.
  return 0
}
