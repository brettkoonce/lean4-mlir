# ViT-Tiny (DeiT-Ti) / ImageNet-1k, VERIFIED path (Lean → StableHLO → XLA/PJRT), 4-GPU data-parallel.
#
#     scripts/supervise.sh vit-default-4gpu
#
# 4 replicas x bs 128 = global batch 512, 2,502 steps/epoch.
#
# ⚠ NOT THE SHIPPING ViT JOB. This is the f32, no-EMA `adamdp128x4wxclipdrop` arm; the book's
#   72.35 / 91.22 came from `vit-default-emabf16-4gpu` (bf16 + EMA), which is the lakefile's Ch. 9
#   row. Kept as the f32 axis sibling.
#
# ⭐ MEASURED 2026-08-05 on ares, this shape, residency + prefetch (tf.data determinism ON then):
#       SHIM_WORKERS=1   4,348 ms/step
#       SHIM_WORKERS=8     665 ms/step
#       SHIM_WORKERS=16    710 ms/step
#       LEAN_MLIR_BENCH_SYNTH (no data)  250 ms/step   — the compute-only floor
#   Superseded for worker choice by the 2026-09-10 re-probe in ENV_EXTRA.
#
# ⚠ This net's shim is the heaviest of the five: RandAugment m9 mstd 0.5 + mixup/cutmix + random
#   erasing + repeated augmentation x3, all per image on CPU. Do not "fix" feed-boundness by
#   trimming it — that is the reference recipe.
#
# ▶ Unexamined: this net's LAUNCH time was 118 ms against R34's 9.4 (`PJRT_FFI_TIMING=10`).

# ▶ §2c N1: this must equal the second dash-field of the filename. supervise.sh refuses
#   otherwise — the job namespace drifted from the recipe namespace once already.
RECIPE=default
DEVS="0,1,2,3"          # all four cards; the two PCIe-AER cards (old idx 1 and 5) were pulled 2026-09-08
EPOCHS=300              # vitImagenetConfig.epochs — the DeiT-Ti schedule length
# ETA from runs/2026-09-10-bf16-probe-4060ti (400-step window from step 200). ⚠ Stale: the means
# (544 / 539) were twice the medians under the periodic stall, and nothing has re-probed since the
# stall and leak fixes; the bf16+EMA sibling measured 48.0 h end to end on the 4x 3060 box.
ETA="f32 ~57 h on 4x 4060 Ti by the 259 ms/step MEDIAN (300 ep); the mean was 539, re-probe owed"

CMD=(.lake/build/bin/vit-imagenet-verified data)

# Box selection (copied from r50-2018-bf16-4gpu.conf, f3d89574): the repo venv's cuda12 plugin if
# it is there, else the 3060 box's cuda13.
#   * ares: the repo's pinned `.venv` with the xla_cuda12 plugin, no SHIM_PYTHON needed.
#   * the 3060 box: /home/skoonce/.venv-cuda with xla_cuda13 (driver 610.57.04 / CUDA 13.3), and
#     SHIM_PYTHON is REQUIRED because that box's .venv/bin/python3 is a WRAPPER that execs the
#     retired ROCm venv (lean4-jax/.venv), which no longer has a usable jax.
# ⛔ Until 2026-09-10 this conf hardcoded ares' xla_cuda12 path and carried no SHIM_PYTHON, so on
#   the 3060 box it died at step 0 with a plugin-load error. Fixing ffi/pjrt_ffi.c's default plugin
#   search list (it knows xla_cuda12 + xla_rocm7, not xla_cuda13) would delete PJRT_PLUGIN from
#   every conf and this block with it.
. "$(dirname "${BASH_SOURCE[0]}")/_box.sh"   # BOX, BOX_PLUG, BOX_PY, BOX_SHIMPY
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⚠ The `drop` DP artifact, NOT `adamdp128x4wxclip`. Both exist and only this one carries
  # dropPath, which DeiT-Ti's recipe sets. ⚠ Verify by listing what the artifact BAKES
  # (handoff §0.5) — the variant name is a label, not evidence.
  LEAN_MLIR_VARIANT=adamdp128x4wxclipdrop
  LEAN_MLIR_BATCH=128                # PER REPLICA
  PJRT_FFI_RESIDENT=1
  # ⚠⚠ REQUIRED — worth 6.5x.
  # ⭐⭐ 4 -> 8, 2026-09-10, and the 2026-08-31 sweep that set 4 is SUPERSEDED. That sweep
  # ranked on the MEDIAN and ran with tf.data determinism ON (its default until 2026-09-08).
  # Both matter here: this net's median sits at its compute floor at EVERY worker count while
  # the tail is catastrophic, so the median cannot see starvation at all, and determinism ON
  # capped each producer at ~1/5 its throughput so adding producers genuinely did nothing.
  # Re-measured with the mean over a 400-step window from step 200
  # (runs/2026-09-10-bf16-probe-4060ti/vit_all.tsv), f32 4x bs128:
  #     w4  med 220  mean 894  p90 2974   -> ~190 h / 300 ep
  #     w8  med 213  mean 520  p90 1616   -> ~112 h        <- KEEP
  #     w12 med 222  mean 593  p90 1293   -> ~127 h
  #     w16 med 251  mean 570  p90 1023   -> ~122 h
  #     SYNTH (no feed) med 217 mean 217 p90 219 -> ~48 h   <- the compute floor
  # ▶ Past 8 the mean stops improving, so 8 is the knee, not the ceiling of the problem:
  #   fed is still 2.4x the floor at w8. ⛔ This net is FEED-BOUND and ~64 h of its 112 is
  #   the data pipeline, which no worker count recovered. The p90 falling (2974 -> 1023)
  #   while the mean plateaus says the stalls are periodic, not steady starvation.
  # ⚠ OPEN (VT-2): vit-default-emabf16-4gpu trained its 48 h run at 4, from the 08-31 median sweep
  # this block calls superseded; the two probes differ in box, precision and statistic. A
  # median+mean probe at 4 and 8 on one box settles it.
  SHIM_WORKERS=8
)

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

CKPT_EPOCH_FILE=".lake/build/vitin_adamdp128x4wxclipdrop_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_vit
precheck_vit() {
  . scripts/lib/precheck.sh
  local ok=0
  pc_box || ok=1
  pc_render vitin adamdp128x4wxclipdrop 4 200 || ok=1
  pc_ckpt vitin adamdp128x4wxclipdrop || ok=1
  pc_exe vit-imagenet-verified LeanMlir/VerifiedTrain.lean ffi/f32_helpers.c \
    apps/imagenette/MainViTImagenet.lean || ok=1
  pc_pjrt_so || ok=1
  pc_jax_box || ok=1
  pc_shim vit_tiny_imagenet || ok=1
  local shim=jax/.lake/build/generated_vit_tiny_imagenet_shim.py
  pc_aug_call "$shim" '_randaugment(img, 2, 9.0' "RandAugment N2 m9" || ok=1
  pc_aug_call "$shim" '_random_erase(img)' "random erasing" || ok=1
  pc_env PJRT_FFI_RESIDENT=1 "opt-in, defaults OFF, silent" || ok=1
  pc_env SHIM_WORKERS=8 "the 2026-09-10 mean re-probe: w4 894 -> w8 520 ms/step; see VT-2 above" || ok=1
  # ⚠ vitin's DP gate is `vit-dp-check`, which hands every replica the SAME rows and so cannot see a
  # shard-offset bug (planning/imagenet_parity.md G1). Not fatal; the weakest sharding evidence here.
  pc_gpu_idle || ok=1
  return $ok
}
