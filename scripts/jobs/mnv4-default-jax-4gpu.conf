# MobileNetV4-Conv-M / ImageNet-1k, JAX REFERENCE path, the `default` recipe (100 epochs), 4 GPUs.
#
#     START_AT=00:00 STOP_AT=08:00 setsid nohup scripts/supervise.sh mnv4-default-jax-4gpu >/dev/null 2>&1 &
#
# The JAX side of the 100-epoch pair; the verified side is `mnv4-default-4gpu`. Recipe = the
# tier-2 `default` (AdamW 0.004 @ 4096 = 512 × accum 8, wd 0.05 not on norm/bias, LS 0.1,
# dropout 0.1, RandAugment N2 m9, EMA 0.9999, eval every 5 epochs on running BN). bf16. On the
# timm-parity net (90e4af7e).
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo, like the pre-timm 100-epoch reference's (~/mnv4_convm_100ep,
# a different net: never point CKPT_BASE there).
RECIPE=default
DEVS="0,1,2,3"
EPOCHS=100
CKPT_BASE=/home/skoonce/mnv4_timm_100ep/mobilenet_v4_imagenet
PY_REL=.lake/build/generated_mobilenet_v4_imagenet.py    # relative to jax/
# ~9.0 min/epoch on the pre-timm net (its 100 epochs took ~16 h); the timm net's compute floor is
# ~10% higher on the verified path. ⚠ Unmeasured on the timm net: the verified path's probe
# forecast 11-15 min/epoch and its first chunk measured ~25 min (mnv4-default-4gpu.conf), so this
# estimate may be short by a similar factor. The chunk planner replaces EPOCH_SECS with the
# longest epoch it times itself.
EPOCH_SECS=660
ETA="~16-18 h for 100 ep on 4x 4060 Ti, UNMEASURED on the timm net (the pre-timm 100-ep reference ran ~16 h); re-probe owed"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_mnv4_default_jax
precheck_mnv4_default_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  pc_jax_trainer || ok=1
  pc_aug_call "jax/$PY_REL" '_randaugment(img, 2, 9.0' "RandAugment N2 m9, the default recipe" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "the default recipe is RandAugment only" || ok=1
  pc_gpu_idle || ok=1
  return $ok
}
