# ResNet-50 / ImageNet-1k, RSB-A3, VERIFIED path (Lean → StableHLO → XLA/PJRT), 4-GPU data-parallel.
#
#     scripts/supervise.sh r50-a3-4gpu
#
# The composed A3 artifact: LAMB × BCE-with-logits × gradient accumulation k=8, trained @160,
# evaluated @224. 4 replicas x bs 64 = micro-batch 256, x k=8 = EFFECTIVE BATCH 2048 — the batch
# the recipe is specified at, and not a detail: `planning/rsb_a2_resnet50.md` records LAMB at
# bs512 giving 40.8% against 78.1%. That is the entire reason `8x64` is in the artifact name.
#
# ⭐ MEASURED 2026-08-06, this exact shape (4x160, resident, prefetch, 8 producers), the probe
#   `planning/next_session_a3_the_run.md` §1 asked for:
#
#       real data                240 ms/step
#       LEAN_MLIR_BENCH_SYNTH=1  222 ms/step   ← compute + allreduce only, no producer
#       per-epoch eval @224       ~54 s        ← measured as the smoke1-smoke2 delta
#
#     ⇒ 5000 x 240 ms + 54 s = 20.9 min/epoch ⇒ 30 ep ≈ 10.5 h, 100 ep ≈ 34.8 h.
#
#   ⚠ 34.8 h is against a 40 h bar and does NOT yet include the thermal duty cycle, which is
#     unmeasured on this net — leg 1 is what measures it. If leg 1 lands materially above 10.5 h,
#     the margin for leg 2 is gone and the answer is bf16 or fewer epochs, decided BEFORE leg 2.
#
#   ▶ The producer is NOT the bottleneck: the real-vs-synth gap is 18 ms (7.5%), so 8 workers keep
#     up with RandAugment m6 at ~1,067 img/s. Do NOT raise SHIM_WORKERS chasing this. Contrast
#     EfficientNet, where the same gap was 1,865 ms.
#   ▶ The allreduce at 160 costs 222 - 166 = 56 ms, against the 59 ms that used to be borrowed
#     from the 224 measurement. Before this probe every 4-GPU 160 number in the record was that
#     borrowed extrapolation (166 + 59 = 225); the two terms had never been measured TOGETHER,
#     because the 4-replica 160 artifact did not exist until 2026-08-06. The estimate was sound —
#     it simply omitted the producer, which is where the remaining 240 - 225 went.
#
# ⚠ WHAT TO CHECK FIRST IN LEG 1: BCE's trivial solution. The 3-epoch plumbing smoke (150 updates,
#   ~0.24 epochs of data) showed loss collapsing 0.526 → 0.017 → 0.008 with top-1 pinned at chance
#   (0.118% vs 0.1%). mean-BCE ≈ z/1000, so 0.008 means the net had simply driven every logit to
#   ~-8 — predict "no" for all 1000 classes. That is expected that early and top-5 was already just
#   above chance (0.62% vs 0.5%), but if top-1 has not climbed decisively off 0.1% by ~epoch 5
#   (3,125 updates), the recipe is not descending and the remaining hours are wasted.

# ▶ §2c N1: this must equal the second dash-field of the filename. supervise.sh refuses
#   otherwise — the job namespace drifted from the recipe namespace once already.
RECIPE=a3
DEVS="0,2,3,4"          # the AER-clean four; idx 1 (bus 02) and idx 5 (bus 62) threw BadTLP
                        # (reference_ares_pcie_aer)

# ⚠⚠ EPOCHS IS THE SUPERVISOR'S COMPLETION BAR, NOT THE RUN'S SCHEDULE — and for this job the two
# live in DIFFERENT PLACES. The LR schedule is `totalSteps := cfg.epochs * nb / accK`
# (VerifiedTrain.lean:1166), off `resnet50ImagenetConfig.epochs`, COMPILED IN at
# `apps/imagenette/MainResnet50Imagenet.lean` — set to **100** on 2026-08-06 (RSB-A3's own
# length). The driver loops `[startEpoch:nEpochs]` with `nEpochs = min(MAX_EPOCHS, cfg.epochs)`.
#
# ⭐ THE RUN IS DELIBERATELY SPLIT IN TWO LEGS, and the split is FREE — because MAX_EPOCHS caps the
#   LOOP without touching the SCHEDULE, leg 1 is a true resumable PREFIX of the 100-epoch cosine,
#   not a separate shorter experiment. Total cost is the same ~33 h either way.
#
#   LEG 1 ✅ DONE:           EPOCHS=30,  LEAN_MLIR_MAX_EPOCHS=30 in ENV_EXTRA → epochs 0..29.
#                            Measured: 10h20m, 20.6 min/epoch, ep30 top-1 50.67% / top-5 76.34%.
#   LEG 2 ◀ CURRENT:         EPOCHS=100, MAX_EPOCHS line deleted              → resumes 30..99, ~24 h.
#
#   ▶ Leg 2 RESUMES — do NOT clear the checkpoint between the legs. That is the whole point of
#     the prefix property, and it is the opposite of what the old `epochs := 30` config required.
#
# ⚠ Why look at all: nothing had ever run one step at lr 0.008 before leg 1 (the driver's default
#   is 0.001 and the 8x was found on 2026-08-06), and `planning/rsb_a2_resnet50.md` records this
#   recipe collapsing to 40.8% when the batch was wrong. Leg 1 also MEASURES the thermal duty cycle
#   and the per-epoch eval cost, which is what turns "~33 h against a 40 h bar" into a real number.
EPOCHS="${EPOCHS:-100}"

CMD=(.lake/build/bin/resnet50-imagenet-verified data)

ENV_EXTRA=(
  PJRT_PLUGIN=".venv/lib/python3.12/site-packages/jax_plugins/xla_cuda12/xla_cuda_plugin.so"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # The composed A3 artifact. ⚠ The name is not the evidence — verify what it BAKES, never off the
  # recipe matrix. `lambaccdp8x64bce` = LAMB + accumulation k=8 + data-parallel + bs64 + BCE.
  LEAN_MLIR_VARIANT=lambaccdp8x64bce
  # ⚠ Selects the NET SPEC, not a filename suffix: slug `resnet50in160`, d0 76800, and the
  # `_short_` shim (RandAugment m6 mstd0.5 @160 train, 224 eval). Refuses on any value but 160/224.
  LEAN_MLIR_RES=160
  LEAN_MLIR_BATCH=64                 # PER REPLICA
  # ✅ LEG 1 COMPLETE 2026-08-06 14:07 (30/30 in 10h20m, 1 attempt, 0 cooldowns, 0 crashes;
  # ep30 top-1 50.67% / top-5 76.34%). `LEAN_MLIR_MAX_EPOCHS=30` LIVED HERE and was removed to
  # start leg 2 — the checkpoint resumes at epoch 31 on the SAME 100-epoch cosine, because the cap
  # only ever bounded the loop. ⚠ Do not re-add it while EPOCHS=100: that pairing makes the driver
  # exit at the cap and the supervisor relaunch into the empty range [30:30] forever. PRECHECK
  # refuses it below.
  # ⚠⚠ REQUIRED, AND THE DRIVER'S DEFAULT IS WRONG FOR THIS RECIPE. 8000 x 1e-6 = 0.008, the
  # paper's 8e-3 @ bs2048 (NOT the 512-scaled 2e-3) — see jax/MainResnet50Imagenet.lean:118 and
  # the reference tag `lamb-cosine-lr0.008-wd0.02-n0-rand-m6-mstd0.5-inc1-m0.1-...-100`.
  # Absent, `runResnet50Imagenet` defaults to 0.001, which is AdamW's rate and the right default
  # for this net's OTHER artifacts. That is 8x low, and it descends and reports a number.
  LEAN_MLIR_BASE_LR_U=8000
  # ⚠⚠ LOAD-BEARING — THE RUN REFUSES WITHOUT IT, but only AFTER the ~28 GB data drain.
  # ImageNet gives 5,004 micro-batches/epoch at global batch 256, and 5004 = 2²·3²·139 is NOT
  # divisible by 8, while k=8 is exactly what effective batch 2048 requires. A cycle straddling
  # the epoch boundary would apply < k micro-batches' gradient still divided by k — a short step at
  # a wrong scale, once per epoch, invisible in the loss curve — so VerifiedTrain.lean:1044 throws
  # rather than rounding. 5000 = 8 x 625 drops 4 micro-batches = 1,024 images/epoch = 0.08%.
  # ▶ Do NOT instead pick a k that divides 5004: k=6 gives effective batch 1536 and k=9 gives 2304,
  #   i.e. it silently changes the recipe's batch to make the arithmetic tidy.
  # ⭐ The cap also makes epochs align with cycles — 5000/8 = 625 COMPLETE cycles per epoch — so an
  #   epoch boundary is always a cycle boundary and the per-epoch checkpoint never lands mid-cycle.
  #   That is what makes crash-resume safe with accumulation on.
  LEAN_MLIR_G2_STEPS=5000
  # ⚠⚠ REQUIRED. Device-resident parameters are OPT-IN and default OFF, and their absence is
  # SILENT — it is how a 16 h benchmark and a 26 h production run diverged unnoticed for a week.
  PJRT_FFI_RESIDENT=1
  # ⚠⚠ REQUIRED. One tf.data producer saturates ~3 of this box's 32 cores and stays there;
  # `num_parallel_calls=AUTOTUNE` does NOT scale out, so the fix is process count. This net's shim
  # runs RandAugment m6 per image on CPU — the same augmentation cost that put EfficientNet at
  # 2,061 ms/step on one producer against 203 on eight, a run that "read exactly like a correct
  # one". 4 replicas at 240 ms/step demand ~1,067 img/s.
  # ⭐ SHIM_WORKERS=4, not 8 (changed 2026-08-31 after a measured sweep 2..16 per net).
  # R50/A3 bf16 4x: w8 166.5 -> w4 147 ms/step (floor 141). 23.6 h -> 20.9 h / 100 ep.
  # ▶ Producers past ~4 add no throughput and contend with the trainer's own host thread.
  # ⛔ NOT a fleet-wide constant: EfficientNet-B0's probe is +/-30% and stayed at 8.
  SHIM_WORKERS=4
)

# Thermal: this box has no fans on. Prefer temperature-driven resting over a fixed epoch schedule.
TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

CKPT_EPOCH_FILE=".lake/build/resnet50in160_lambaccdp8x64bce_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_r50
precheck_r50() {
  # ▶ §2c N1, the R50 half: `a3` is not a `LEAN_MLIR_RECIPE` string, it is `LEAN_MLIR_RES=160`.
  # The engine checks RECIPE against the filename; only this file knows what selects `a3`.
  # ⚠ And LEAN_MLIR_RECIPE must stay ABSENT: `MainResnet50Imagenet.lean:93` THROWS on any
  # non-default recipe at 160, because 2018 is a 224/224 recipe and the two selectors cannot
  # both move. A conf that "helpfully" spelled `LEAN_MLIR_RECIPE=a3` would not start.
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_RES=160' || {
    echo "⛔ RECIPE=a3 but LEAN_MLIR_RES=160 is missing from ENV_EXTRA. 160 is what SELECTS A3:"
    echo "   slug resnet50in160, d0 76800, and the _short_ shim. Without it this trains 224."; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -q '^LEAN_MLIR_RECIPE=' && {
    echo "⛔ LEAN_MLIR_RECIPE is set alongside LEAN_MLIR_RES=160 — the driver throws on that"
    echo "   pairing. A3 is selected by the resolution alone."; return 1; }
  [ -x .venv/bin/python3 ] || { echo "missing .venv/bin/python3 (the pinned env)"; return 1; }
  [ -f verified_mlir/resnet50in160_lambaccdp8x64bce_train_step.mlir ] || {
    echo "missing the composed A3 render (LAMB x BCE x accum k=8, 4-replica, 160)"; return 1; }
  # ⚠ eval is @224 off a SEPARATE artifact — the train@160/eval@224 split is the A3 signature, and
  # the driver reads the eval width off this file rather than reusing net.d0.
  [ -f verified_mlir/resnet50in160_fwd_eval.mlir ] || {
    echo "missing the @224 eval forward — the 160 net would be untrainable-to-a-number"; return 1; }
  # ⚠ The `_short_` shim, NOT generated_resnet50_imagenet_shim.py. Both exist; only this one emits
  # A3's split (76,800 floats/img train @160, 150,528 @224 val) and RandAugment m6.
  [ -f jax/.lake/build/generated_resnet50_imagenet_short_shim.py ] || {
    echo "missing R50's A3 shim (160/224 split, RandAugment m6) — scripts/gen_shims.sh"; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "PJRT_FFI_RESIDENT=1 is missing from ENV_EXTRA — residency is opt-in and defaults OFF,"
    echo "and nothing in the run's output says which path it took."; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'SHIM_WORKERS=4' || {
    echo "SHIM_WORKERS=4 is missing from ENV_EXTRA. R50/A3 measured 2026-08-31: 8 gives 166.5 ms/step against 4's 147 (floor 141)."; return 1; }
  # ⚠ The driver DOES throw on this one — but only after the ~28 GB data drain, i.e. ~20 minutes
  # in. Refusing here costs nothing and the failure is identical.
  local g2; g2="$(printf '%s\n' "${ENV_EXTRA[@]}" | sed -n 's/^LEAN_MLIR_G2_STEPS=//p')"
  [ -n "$g2" ] || { echo "LEAN_MLIR_G2_STEPS is missing from ENV_EXTRA — 5004 micro-batches/epoch"
    echo "is not divisible by k=8 and the driver will refuse AFTER the 28 GB drain."; return 1; }
  [ $(( g2 % 8 )) -eq 0 ] || {
    echo "LEAN_MLIR_G2_STEPS=$g2 is not a multiple of k=8: the last cycle of every epoch would"
    echo "apply $(( g2 % 8 )) micro-batches' gradient still divided by 8."; return 1; }
  # ⚠⚠ THE SPIN. If the loop cap is below the supervisor's completion bar, the driver exits at the
  # cap, the supervisor sees cap < EPOCHS, relaunches, and the driver resumes into an EMPTY epoch
  # range — writing nothing and burning all 60 attempts while looking like a job that is running.
  # This is the leg-1 → leg-2 transition's one failure mode: bumping EPOCHS to 100 and forgetting
  # to delete the MAX_EPOCHS line.
  local me; me="$(printf '%s\n' "${ENV_EXTRA[@]}" | sed -n 's/^LEAN_MLIR_MAX_EPOCHS=//p')"
  if [ -n "$me" ] && [ "$EPOCHS" -gt "$me" ]; then
    echo "LEAN_MLIR_MAX_EPOCHS=$me caps the driver's loop below EPOCHS=$EPOCHS, so the supervisor"
    echo "would relaunch forever into an empty epoch range. For leg 2: DELETE the MAX_EPOCHS line"
    echo "from ENV_EXTRA (the checkpoint resumes; the cosine is already the 100-epoch one)."
    return 1
  fi
  # ⚠ 8x low is still a descending loss curve. This is the knob with no gate behind it.
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_BASE_LR_U=8000' || {
    echo "LEAN_MLIR_BASE_LR_U=8000 (lr 0.008) is missing from ENV_EXTRA. The driver defaults to"
    echo "0.001 — AdamW's rate, 8x below RSB-A3's 8e-3 @ bs2048."; return 1; }
  return 0
}
