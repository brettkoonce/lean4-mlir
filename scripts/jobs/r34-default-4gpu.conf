# ResNet-34 / ImageNet-1k, VERIFIED path, the 90-epoch PAPER schedule.
#
#     scripts/supervise.sh r34-default-4gpu
#
# ⭐ THE 30-EPOCH VALIDATION TIER IS THIS FILE WITH `EPOCHS=30`, not a second config.
#
#     EPOCHS=30 scripts/supervise.sh r34-default-4gpu
#
# `r34-imagenet-4gpu.conf` used to be that second config and was folded in here on 2026-08-27
# with the §2c naming pass. It was safe to fold because the two never differed in RECIPE: same
# `momdp64` render, same shim, same DEVS, same per-replica batch. The 30-epoch job did not set
# `LEAN_MLIR_EPOCHS` either, so it annealed over the 90-epoch cosine and stopped at 30 — which is
# exactly what `EPOCHS=30` against `LEAN_MLIR_EPOCHS=90` below reproduces. The only thing it
# lacked was `SHIM_WORKERS=8`, and that is throughput, not recipe.
#
# ▶ Its completed run is `runs/r34in_verified_30ep_2026-08-05/` (30/30, 2026-08-05). ⚠ That run
#   predates C3/C4 — timm's validation protocol (f8cd3a9) and the 50,000 denominator (ccca380) —
#   so its top-1 is not comparable to anything measured after 2026-08-14. The PRECHECK below
#   refuses a binary older than the render for exactly that reason.
# ▶ Measured 2026-08-01 at 625 ms/step (~52 min/epoch) BEFORE device residency; the same shape
#   runs 386 ms/step with `PJRT_FFI_RESIDENT=1`, which this file sets and its PRECHECK requires.
#
# ⚠ NOTE the folded file's `EPOCHS=30` comment claimed that was `resnet34ImagenetConfig.epochs`.
# It is not: `apps/imagenette/MainResnet34Imagenet.lean` sets `epochs := 90`. That comment is gone
# with it, but the same trap is live — do not read the supervisor's EPOCHS as the config's.
#
# ⚠⚠ `LEAN_MLIR_EPOCHS` SETS the schedule; `LEAN_MLIR_MAX_EPOCHS` only CAPS it (`min n cfg.epochs`).
# `totalSteps := cfg.epochs * nb / accK` is what the cosine anneals over, so the former re-shapes
# the schedule and the latter would silently keep annealing over the wrong length. Set explicitly
# below even though 90 is also the default, because the PRECHECK can then verify it.
DEVS="0,2,3,4"          # the AER-clean four; idx 1 and 5 throw BadTLP (reference_ares_pcie_aer)
EPOCHS="${EPOCHS:-90}"  # the paper schedule
CMD=(.lake/build/bin/resnet34-imagenet-verified data)
ENV_EXTRA=(
  PJRT_PLUGIN=".venv/lib/python3.12/site-packages/jax_plugins/xla_cuda12/xla_cuda_plugin.so"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  LEAN_MLIR_VARIANT=momdp64          # -> verified_mlir/resnet34in_momdp64_train_step.mlir
  LEAN_MLIR_BATCH=64                 # PER REPLICA -> global 256, the reference batch
  LEAN_MLIR_EPOCHS=90                # SETS the cosine (see above)
  LEAN_MLIR_BASE_LR_U=100000         # 0.1, the reference rate; the 0.001 default is AdamW's
  PJRT_FFI_RESIDENT=1                # opt-in; OFF silently halves throughput (596 vs 386 ms/step)
  SHIM_WORKERS=8
)
TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs, which adapts to ambient better than a fixed schedule
CKPT_EPOCH_FILE=".lake/build/resnet34in_momdp64_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}
PRECHECK=precheck_r34_90
precheck_r34_90() {
  local ok=0
  [ -x .venv/bin/python3 ] || { echo "missing .venv/bin/python3 (the pinned env)"; ok=1; }
  [ -f verified_mlir/resnet34in_momdp64_train_step.mlir ] || {
    echo "missing the 4-replica render — build LeanMlir.Proofs.Codegen.ResNet34RenderB"; ok=1; }

  # ⚠⚠ THE ONE THAT MATTERS FOR THIS RUN'S PURPOSE. The point of the 90-epoch re-run is to have a
  # number measured under timm's validation protocol (C3, f8cd3a9, 2026-08-14 18:37) and the
  # 50,000 denominator (C4, ccca380, 2026-08-14 14:51). The binary on disk was built 2026-08-12
  # when this config was written — running THAT reproduces the very number we are replacing, and
  # nothing in the log would say so. Refuse unless the exe is newer than both commits.
  local exe=.lake/build/bin/resnet34-imagenet-verified
  [ -x "$exe" ] || { echo "missing $exe — lake build resnet34-imagenet-verified"; ok=1; }
  if [ -x "$exe" ] && [ "$exe" -ot verified_mlir/resnet34in_momdp64_train_step.mlir ]; then
    echo "⛔ $exe is OLDER than the render it must execute — rebuild it."
    echo "   A pre-2026-08-14 binary predates C3/C4 and would silently reproduce the old number."
    ok=1
  fi

  # The shim carries C3's antialiased resampler; existence is not freshness.
  [ -f jax/.lake/build/generated_resnet34_imagenet_shim.py ] || {
    echo "missing R34's tfds shim — scripts/gen_shims.sh"; ok=1; }
  grep -q 'antialias' jax/.lake/build/generated_resnet34_imagenet_shim.py 2>/dev/null || {
    echo "⛔ the R34 shim has no antialiased resize — it predates C3. Run scripts/gen_shims.sh."; ok=1; }

  # ⚠⚠ SCHEDULE FUSION. `MainResnet34Imagenet.lean` warns: resuming a 30-epoch checkpoint into a
  # 90-epoch cosine silently fuses two learning-rate curves. A checkpoint at an epoch this run
  # would treat as already-done — left over from an `EPOCHS=30` launch of THIS file, which now
  # writes the same checkpoint path — does exactly that, and the supervisor's resume logic cannot
  # tell the two apart. Folding the 30-epoch job in here makes that collision easier to hit, not
  # harder, which is why this guard stays.
  if [ -f "$CKPT_EPOCH_FILE" ]; then
    local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"; n="${n:-0}"
    if [ "$n" -eq 30 ]; then
      echo "⛔ $CKPT_EPOCH_FILE says epoch 30 — that is an EPOCHS=30 run's checkpoint."
      echo "   Resuming it into the 90-epoch cosine fuses two LR curves. Move it aside first."
      ok=1
    fi
  fi

  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "PJRT_FFI_RESIDENT=1 missing — residency is opt-in and OFF halves throughput."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_EPOCHS=90' || {
    echo "LEAN_MLIR_EPOCHS=90 missing — MAX_EPOCHS cannot reach the 90-epoch tier from a cap."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_BASE_LR_U=100000' || {
    echo "LEAN_MLIR_BASE_LR_U=100000 (lr 0.1) missing — the driver would use AdamW's 0.001."; ok=1; }
  return $ok
}
