# ResNet-50 RSB-A1 / ImageNet-1k, JAX REFERENCE path, the `a1` recipe (600 epochs), 4 GPUs.
#
#     setsid nohup scripts/supervise.sh r50-a1-jax-4gpu >/dev/null 2>&1 &
#
# Recipe = `resnet50ImagenetConfigA1`, RSB Table 2's A1: A2's recipe (LAMB 5e-3 at an effective 2048
# as 512 × accum 4, BCE with the 0.2 target threshold, RandAugment m7 mstd0.5, repeated aug ×3,
# drop-path 0.05, no EMA, 224 / 0.95) at 600 epochs, wd 0.01, Mixup α 0.2 and label smoothing 0.1.
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo.
RECIPE=a1
DEVS="0,1,2,3"
EPOCHS=600
CKPT_BASE=/home/skoonce/r50_a1_600ep/resnet50_imagenet_a1
PY_REL=.lake/build/generated_resnet50_imagenet_a1.py    # relative to jax/
# 2x A2's measured rate (planning/side_quest_runs.md §5: 1,405 ms per optimizer step, no stall).
EPOCH_SECS=900
ETA="~153 h for 600 ep on 4x 4060 Ti (1,469 ms per optimizer step, flat; measured 2026-10-05, runs/2026-10-04-dimm-fan-thermal)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_r50_a1_jax
precheck_r50_a1_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  . scripts/lib/precheck.sh; pc_crop "jax/$PY_REL" torchvision random || ok=1   # train crop + resize kernel
  pc_jax_trainer || ok=1
  pc_aug_call "jax/$PY_REL" '_randaugment(img, 2, 7.000000, 0.500000)' "RSB RandAugment m7 mstd0.5" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "RSB is RandAugment only" || ok=1
  grep -q 'tgt = (tgt > 0.200000)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no BCE target threshold — re-emit"; ok=1; }
  grep -q 'tgt = tgt \* (1.0 - 0.100000)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL does not smooth the BCE target at 0.1 (A1's ε)"; ok=1; }
  grep -q 'jax.random.beta(key, 0.200000, 0.200000)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not at A1's Mixup α 0.2"; ok=1; }
  grep -q '^GRAD_ACCUM = 4$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not the 512 × 4 accumulation trainer"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
