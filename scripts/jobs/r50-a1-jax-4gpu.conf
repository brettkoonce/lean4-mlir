# ResNet-50 RSB-A1 / ImageNet-1k, JAX REFERENCE path, the `a1` recipe (600 epochs), 4 GPUs.
#
#     setsid nohup scripts/supervise.sh r50-a1-jax-4gpu >/dev/null 2>&1 &
#
# Recipe = `resnet50ImagenetConfigA1`, RSB Table 2's A1: A2's recipe (LAMB 5e-3 at an effective 2048
# as 512 × accum 4, BCE with the 0.2 target threshold, RandAugment m7 mstd0.5, repeated aug ×3,
# drop-path 0.05, no EMA, 224 / 0.95) at 600 epochs, wd 0.01, Mixup α 0.2 and label smoothing 0.1.
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo.
RECIPE=a1
DEVS="0,1,2,3"
EPOCHS=600
CKPT_BASE=/home/skoonce/r50_a1_600ep/resnet50_imagenet_a1
PY_REL=.lake/build/generated_resnet50_imagenet_a1.py    # relative to jax/
# 2x A2's measured rate (planning/side_quest_runs.md §5: 1,405 ms per optimizer step, no stall).
EPOCH_SECS=900
ETA="~150 h for 600 ep on 4x 4060 Ti (1,441 ms per optimizer step, flat; measured 2026-10-07 post-X5 + torchvision crop, runs/2026-10-07-d17-reprobe; 1,469 on 10-05)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_r50_a1_jax
precheck_r50_a1_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  . scripts/lib/precheck.sh; pc_crop "jax/$PY_REL" torchvision random || ok=1   # train crop + resize kernel
  pc_jax_trainer || ok=1
  pc_aug_call "jax/$PY_REL" '_randaugment(img, 2, 7.000000, 0.500000)' "RSB RandAugment m7 mstd0.5" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "RSB is RandAugment only" || ok=1
  grep -q 'tgt = (tgt > 0.200000)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no BCE target threshold — re-emit"; ok=1; }
  grep -q 'tgt = tgt \* (1.0 - 0.100000)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL does not smooth the BCE target at 0.1 (A1's ε)"; ok=1; }
  grep -q 'jax.random.beta(key, 0.200000, 0.200000)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not at A1's Mixup α 0.2"; ok=1; }
  # timm's RSB recipe as run (A3's args files on discussion #924; the era's defaults for A1 / A2; 2026-10-11):
  # the cosine stepped once an epoch, warmup from 1e-4 over 5 epochs, floor 1e-6; Mixup or CutMix
  # drawn per batch at 0.5; RandAugment's fill at img_mean; the 3 repeated-aug copies adjacent in one
  # optimizer step (RASampler); the logged number scored through an f32 forward (F1 / F3 / F4 / F5 / F8).
  grep -q 'lr = jnp.float32(0.000100 + epoch \* (LR - 0.000100) / 5)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no per-epoch warmup from 1e-4 (schedPerEpoch / warmupLRInit) — re-emit"; ok=1; }
  grep -q 'lr = jnp.float32(0.000001 + 0.5 \* (LR - 0.000001) \* (1 + np.cos(np.pi \* epoch / EPOCHS)))' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no per-epoch cosine to the 1e-6 floor (schedPerEpoch / minLR) — re-emit"; ok=1; }
  grep -q '^MIX_CHUNKS = 8$' "jax/$PY_REL" && grep -q 'random(MIX_CHUNKS) < 0.500000' "jax/$PY_REL" \
    && grep -q 'x, y = _mix_chunked(x, y, ' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL does not draw Mixup/CutMix per 256-row chunk at 0.5 (mixChunks 8, mixSwitchProb)"; ok=1; }
  grep -q '^_RA_FILL = tf.constant(\[124.0, 116.0, 104.0\])' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL fills RandAugment geometry with grey, not timm's img_mean (randAugmentFillMean)"; ok=1; }
  grep -q '# repeatedAugAdjacent' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL re-shuffles the 3 repeated-aug copies apart (repeatedAugAdjacent off)"; ok=1; }
  grep -q 'DT = jnp.float32; CONV_DT = jnp.float32   # evalF32' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL scores through its bf16 training forward, not f32 (evalF32)"; ok=1; }
  grep -q '^GRAD_ACCUM = 4$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not the 512 × 4 accumulation trainer"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
