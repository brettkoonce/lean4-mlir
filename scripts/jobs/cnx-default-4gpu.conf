# cnx-default-4gpu.conf — ConvNeXt-T / ImageNet-1k, VERIFIED path (Lean → StableHLO → XLA/PJRT),
# bf16, 4-GPU data-parallel, 300 epochs.
#
#     RUNDIR=runs/<date>-cnx-verified-300ep scripts/supervise.sh cnx-default-4gpu
#
# ⛔ Launch under `systemd-run --user`, never a bare `&` — the agent harness SIGKILLs background
# processes under memory pressure (it killed two watchers of the R34 bf16 run). RUNDIR in-repo from
# before the first step: R34's phase-2 master log was lost to a power cut when it lived under /tmp.
#
# ⭐⭐⭐ REWRITTEN 2026-09-17. Three things changed and the first is not a tuning choice:
#
#   1. ⛔⛔ **THE BATCH. 32 → 64 per replica, i.e. global 128 → 256.** Until today this job was NOT
#      a pair with its reference and the mismatch was a RECIPE difference, not a lowering one.
#      The reference's own banner:
#          [sup] START ConvNeXt-T ImageNet 300ep · GPUs 0,1,2,3 · bf16 · batch 256 (4x64) · SPE 5004
#          lr=0.000250  batch_size=256 (4 devices x 64)  epochs=300  params=28589128
#      This job ran 4×32 = global 128 at **10,009 steps/epoch against the reference's 5,004**, with
#      a `baseLR` that was the bs-256 value — half the batch, twice the updates, an LR off the
#      linear-scaling rule. §8 would have had to open by conceding that, and the ONE thing this
#      pair is in the book for would be gone: ConvNeXt has **no BatchNorm**, so it is the net that
#      isolates the LOWERER rather than a statistic group. A tie here says the lowerer is clean; an
#      offset here implicates the lowerer or the feed fleet-wide. Neither reading survives a batch
#      mismatch. The rescope (`ConvNeXtRenderB.cnxInBS`) made `cBS`/`bB` parameters and re-rendered
#      the 13 `convnextin_*` artifacts at 64; every other ConvNeXt artifact is BYTE-IDENTICAL.
#      ⭐ It also fixed the LR for free: 2.5e-4 IS the reference's knob at global 256.
#      ⭐ And it halved the step count, which is most of the throughput win below.
#
#   2. bf16 (`adamdpwxclipdropbf16`), flipped IN PLACE. The reference is bf16 — read off its master
#      log, not a recipe table. In-place is safe here in a way it was NOT for R34: no published
#      ConvNeXt verified number depends on the f32 arm (Ch. 8 has never run), and the lakefile's
#      Ch. 8 row already names this file. R34 got a SECOND conf only because its f32 number was
#      published and flipping would have orphaned it.
#
#   3. Loader respawn ON from step 0 (`LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10`) — see the block below.
#
# ⚠⚠ WHAT A RESULT FROM THIS CONF MAY CLAIM. Both sides ran on THIS box (4× RTX 3060) for once —
# the reference is `/home/skoonce/convnext_t300_3060/`, 2026-09-04→09-07, 76.5 h, final
# **81.53 / 95.51**. So the pair moves ONE axis: the lowering. Say "one architecture, one recipe,
# two independent lowerings"; never "proven" — the proof-carrying tier stops at Imagenette.
# ⚠ The book prints 81.53 / **95.50** where the reference log's last epoch is 95.51. Resolve that
#   before §8 quotes either (the run leaves `reference_curve.tsv` behind so it can be resolved).
#
# ⚠ What this pair does NOT isolate: drop-path and dropout MASKS are host-drawn here and
# `jax.random`'s there. That is variance, not bias — do not read a small gap as a lowering fact.
#
# ⭐⭐⭐ THROUGHPUT, MEASURED ON THIS BOX 2026-09-17 — runs/2026-09-17-cnx-sweep/.
#   4× RTX 3060; exe rebuilt after the batch-64 rescope; jax/.lake/build in sync
#   (`regen_jax_generated.sh box`: 78 ok); bf16, 4×64; 400 measured steps (WARM=200 STEPS=600);
#   5,004 steps/epoch.
#
#       arm                median   mean    min    p90     starvation
#       fed  (w4)            220     219    203    233       15 ms (6.8%)   <- THIS CONF
#       synth (no shim)      205     205    202    207        —             <- the compute floor
#
#   ⭐⭐ THE STARVATION IS 6.8%, AND THE PLAN PREDICTED ~28%. The forecast was that ConvNeXt's
#   shim — AutoAugment + RandAugment + random erasing per image — would starve the feed like
#   EfficientNet's (37 ms of 134, 28%) rather than like R34's flip-only one (19 of 163, 12%).
#   Measured, it is BETTER THAN BOTH, and the batch rescope is why: the per-step COMPUTE doubled
#   (205 ms at bs64 against ~102 at bs32) while the per-step feed cost did not, so the same
#   augmentation work now amortises over twice the arithmetic. ⚠ Read it as a RATIO result, not
#   as evidence the loaders are healthy — the absolute feed cost per IMAGE is unchanged, and §3's
#   loader-degradation risk is about drift over HOURS, which a 400-step probe cannot see at all.
#
#   ETA: 5,004 × 220 ms = 1,101 s/epoch of steps. MNv2, B0 and R34 all realised ~5% over their
#   probe on this box for eval + checkpoint (the reference's own eval is 17.7 s), so
#   ~1,156 s/epoch × 300 ≈ **96 h ≈ 4.0 d**. ⚠ Confirm from consecutive checkpoint mtimes once the
#   run is going — the probe is a forecast, the checkpoint is a clock.
#
#   ⭐ FOR SCALE, what the two changes bought: this job's only previously measured shape on this
#   box was f32 4×32 at 220 ms/step, which is 10,009 steps/epoch = **183.7 h**. Same ms/step, half
#   the steps, so the rescope plus bf16 is a **1.9× wall-clock win** — 183.7 h → ~96 h.
#   ⚠ And against the JAX reference on the SAME box and the SAME shape (179 ms/step, 76.5 h), the
#   verified path is **1.23×** — that is the honest lowering overhead at this batch.
#
# ▶ §2c N1: RECIPE must equal the second dash-field of the filename. supervise.sh refuses
#   otherwise — the job namespace drifted from the recipe namespace once already.
RECIPE=default
DEVS="0,1,2,3"          # all four cards; the two PCIe-AER cards (old idx 1 and 5) were pulled 2026-09-08
EPOCHS="${EPOCHS:-300}" # convnextImagenetConfig.epochs — the ConvNeXt paper's schedule length
# ⭐ REPLACED WITH THE MEASURED VALUE 2026-09-17 05:20 UTC, off epoch 3 (the first clean epoch —
# e1/e2 carry the deliberate resume test). The probe was RIGHT about the steps and my overhead
# convention was wrong: 220 ms/step held exactly (4,998 steps in 1,118 s = 223.7 ms), but
# eval + checkpoint costs 105 s/epoch, not the ~5% (55 s) that MNv2/B0/R34 realised. 782 eval
# batches at bs 64 over the 50,000 split plus a 343 MB checkpoint write is simply more than
# those nets pay. 1,120 + 105 = 1,225 s/epoch against e3's measured 1,224.
ETA="bf16 ~102 h (4.25 d) on 4x 3060 — MEASURED 1,224 s/epoch at e3 (1,120 s steps at 220 ms + 105 s eval/ckpt), 300 ep"
CMD=(.lake/build/bin/convnext-imagenet-verified data)

# Box selection (copied from r50-2018-bf16-4gpu.conf, f3d89574): the repo venv's cuda12 plugin if
# it is there, else the 3060 box's cuda13.
#   * ares: the repo's pinned `.venv` with the xla_cuda12 plugin, no SHIM_PYTHON needed.
#   * the 3060 box: /home/skoonce/.venv-cuda with xla_cuda13 (driver 610.57.04 / CUDA 13.3), and
#     SHIM_PYTHON is REQUIRED because that box's .venv/bin/python3 is a WRAPPER that execs the
#     retired ROCm venv (lean4-jax/.venv), which no longer has a usable jax.
# ⛔ Fixing ffi/pjrt_ffi.c's default plugin search list (it knows xla_cuda12 + xla_rocm7, not
#   xla_cuda13) would delete PJRT_PLUGIN from every conf and this block with it.
ARES_PLUG=".venv/lib/python3.12/site-packages/jax_plugins/xla_cuda12/xla_cuda_plugin.so"
if [ -f "$ARES_PLUG" ]; then
  BOX=ares;  BOX_PLUG="$ARES_PLUG"; BOX_PY=".venv/bin/python3"; BOX_SHIMPY=()
else
  BOX=3060;  BOX_PLUG="/home/skoonce/.venv-cuda/lib/python3.12/site-packages/jax_plugins/xla_cuda13/xla_cuda_plugin.so"
  BOX_PY="/home/skoonce/.venv-cuda/bin/python3"; BOX_SHIMPY=(SHIM_PYTHON="$BOX_PY")
fi
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⭐ bf16 + the regularised DP artifact — wd-excluded + grad clip + dropPath, which is
  # `convNeXtTinyImagenetConfig` entire on the optimizer-and-regulariser axis.
  # ⚠ The NAME is not the evidence. The PRECHECK verifies what the artifact BAKES.
  LEAN_MLIR_VARIANT=adamdpwxclipdropbf16
  # ⛔⛔ PER REPLICA → global 256 = the reference's batch, 5,004 steps/epoch. Was 32 (global 128,
  # 10,009 steps/epoch) until the 2026-09-17 rescope. The render bakes it, so a mismatch here is a
  # shape error at the first invoke, not a silent limp — and the PRECHECK greps the artifact anyway.
  LEAN_MLIR_BATCH=64
  # ⚠⚠ SETS the cosine. `LEAN_MLIR_MAX_EPOCHS` only CAPS it (`min n cfg.epochs`), so it cannot
  # re-shape the schedule; `totalSteps := cfg.epochs * nb / accK` is what anneals. Set explicitly
  # even though 300 is the driver default, because then the PRECHECK can verify it.
  LEAN_MLIR_EPOCHS=300
  # ⭐ 2.5e-4, in MICRO-units. This is the reference's own knob AND the linear-scaling value at
  # global 256 — the two agree only because of the batch rescope. Set EXPLICITLY rather than left
  # to the driver default: a number nothing asserts is a number that can be wrong forever, and this
  # one silently disagreed with the rule for as long as the batch was 32.
  LEAN_MLIR_BASE_LR_U=250
  # ⚠⚠ REQUIRED. §2d.3's device-resident parameters are OPT-IN, default OFF, and the OFF path
  # prints NOTHING — the failure is an absent line in a 5,000-line log.
  PJRT_FFI_RESIDENT=1
  # ⭐ 4, not 8 — measured per-net sweep 2026-08-31: ConvNeXt-T bf16 4× went w8 145.5 → w4 126
  # ms/step (floor 118). Producers past ~4 add no throughput and contend with the trainer's own
  # host thread. ⛔ NOT a fleet constant: EfficientNet-B0's probe is ±30% and stayed at 8.
  # ⚠ Absent ENTIRELY, ONE producer feeds this net: 895 ms/step vs 235, and the log reads normal.
  SHIM_WORKERS=4
  # ⭐⭐ RESPAWN ON FROM STEP 0 — and this run is its first PRODUCTION test (63b21d84).
  # Every E epochs one loader is replaced, staggered, ~3 s each, after the checkpoint is on disk.
  # At E=10 with 4 producers each loader lives ≤ 40 epochs.
  # ▶ WHY ARM B HERE, where R34 deliberately ran bare: R34 ALREADY supplied the Arm-A evidence —
  #   its flip-only shim never degraded in 21.9 h. ConvNeXt's shim is the HEAVY kind (AutoAugment +
  #   RandAugment + random erasing per image), which is EfficientNet's class, and B0's degraded at
  #   ~5.6–13 h: one of four producers drifting to 7–11 GiB RSS and pacing the whole round-robin
  #   feed 1.8× slow, clearing only on a kill. On the book's LONGEST schedule that is not a risk
  #   worth taking bare, and running it ON is itself the A/B that
  #   planning/shim_loader_health_and_resume_tests.md §2 asked for.
  LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10
)

# ⚠ ConvNeXt's initial loss is 10.42 where every other net starts near ln(1000) = 6.91. It descends
# briskly and its baked loss divisor is correct, but §5 lists its `%loss` as a report-only carve-out
# outside every faithfulness theorem — and R34 shipped a wrong `%loss` once, caught only by a
# numeric tie. ⛔ Do NOT quote a loss curve off this run without reading that first.

# Thermal: TEMP_MAX governs. ⭐ Measured inert on this box — zero cooldowns across EfficientNet's
# 350 epochs / 3 days, and zero across R34's 90.
TEMP_MAX=78
TEMP_RESUME=62
# ⛔ EMPTY ON PURPOSE. `REST_EPOCHS` is not a cooldown, it is a FEED REFRESH (75a477b1): the
# supervisor kills right after the epoch checkpoint and resumes with FRESH loaders. With the respawn
# ON, a rest would refresh the feed by a SECOND mechanism and muddle the test — if the pace holds we
# could not say which one held it. Rests are the FALLBACK if the respawn fails (see RESULTS.md).
REST_EPOCHS=""
REST_SECS=15

# ⚠⚠ KEYED TO THE VARIANT. Checkpoints are `<slug>_<variant>_ckpt_xla.bin`, so this MUST move with
# LEAN_MLIR_VARIANT above. Left at the f32 name it tracks a file the bf16 run never writes and
# `epoch_now()` returns 0 forever — a run that never advances and never ends. This is the single
# edit most likely to be forgotten when flipping a conf's precision, so the PRECHECK asserts it.
CKPT_EPOCH_FILE=".lake/build/convnextin_adamdpwxclipdropbf16_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_cnx_bf16_300
# ⛔⛔ Rewritten 2026-09-17 on `r34-default-bf16-4gpu.conf`'s gate. The gate this replaces asserted
# NONE of: the variant, the checkpoint/variant agreement, the exe's freshness, the render's baked
# BATCH, the shim's freshness, the LR, or an idle GPU. It tested `.venv/bin/python3`, which on this
# box is a WRAPPER into a retired ROCm venv — so it passed while naming the wrong interpreter.
# ⚠ Every assertion below names what it defends.
precheck_cnx_bf16_300() {
  local ok=0
  local exe=.lake/build/bin/convnext-imagenet-verified
  local render=verified_mlir/convnextin_adamdpwxclipdropbf16_train_step.mlir

  echo "box=$BOX plugin=$BOX_PLUG python=$BOX_PY"
  [ -f "$BOX_PLUG" ] || { echo "⛔ PJRT_PLUGIN not found: $BOX_PLUG"; ok=1; }
  [ -x "$BOX_PY" ]   || { echo "⛔ python for the shim missing: $BOX_PY"; ok=1; }

  # ⛔ THE ARM — the env string AND the artifact it names, or the run trains the f32 twin for three
  # days and produces a number that pairs against nothing.
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_VARIANT=adamdpwxclipdropbf16' || {
    echo "⛔ LEAN_MLIR_VARIANT is not adamdpwxclipdropbf16 — see the note in ENV_EXTRA."; ok=1; }
  [ -f "$render" ] || {
    echo "⛔ missing the bf16 4-replica render ($render)"
    echo "   lake build LeanMlir.Proofs.Codegen.ConvNeXtRenderB"; ok=1; }

  # ⛔⛔ THE BATCH, READ OFF THE ARTIFACT. This is the assertion the whole 2026-09-17 rescope exists
  # to make checkable: the render must BAKE 64, not 32. A 32 render under LEAN_MLIR_BATCH=64 fails
  # loudly at the first invoke, but a 32 render under a forgotten LEAN_MLIR_BATCH does NOT — it
  # trains happily at global 128 and pairs against nothing, which is exactly what happened here.
  if [ -f "$render" ]; then
    local n64 n32
    # ⚠ `|| echo 0` would be WRONG here and was, for one dry run: `grep -c` PRINTS "0" and then
    # EXITS 1, so the fallback appends a second line and the comparison sees "0\n0". `|| true`
    # keeps grep's own "0" and swallows only the status.
    n64="$(grep -c 'tensor<64x3x224x224' "$render" 2>/dev/null || true)"
    n32="$(grep -c 'tensor<32x3x224x224' "$render" 2>/dev/null || true)"
    n64="${n64:-0}"; n32="${n32:-0}"
    [ "$n64" -ge 1 ] || { echo "⛔ $render does not bake a 64-wide input — re-render at cnxInBS=64."; ok=1; }
    [ "$n32" -eq 0 ] || { echo "⛔ $render still carries $n32 batch-32 shapes — mixed-width render."; ok=1; }
    printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_BATCH=64' || {
      echo "⛔ LEAN_MLIR_BATCH=64 missing from ENV_EXTRA — the render bakes 64."; ok=1; }
    # And the loss-gradient DIVISOR, which is a SEPARATE spelling of the batch (`bStr`, a string
    # literal, not derived from the shapes until today). At 64 shapes with a 32.0 divisor every
    # gradient is exactly 2× too large and NOTHING fails — it just reads as a 2× learning rate.
    grep -q 'stablehlo.constant dense<64.0> : tensor<64x1000xf32>' "$render" || {
      echo "⛔ $render's loss divisor is not 64.0 on a 64-row tensor — the batch and the"
      echo "   divisor have drifted. See ConvNeXtRenderB.cnxInBS."; ok=1; }
    # 4 replicas is baked in; a mismatch fails at step 0 with a shape error.
    grep -q 'all_reduce' "$render" || {
      echo "⛔ $render has no collectives — that is a single-device render."; ok=1; }
  fi

  # ⚠ And the checkpoint path has to have moved with the variant.
  case "$CKPT_EPOCH_FILE" in
    *convnextin_adamdpwxclipdropbf16_ckpt_xla.bin.epoch) ;;
    *) echo "⛔ CKPT_EPOCH_FILE does not match LEAN_MLIR_VARIANT: $CKPT_EPOCH_FILE"; ok=1 ;;
  esac

  # ⛔ THE BINARY. `lake build` of ANY OTHER TARGET does not relink this exe (the lake exe-cache
  # gotcha), so a stale one runs whatever the trainer was when it was last linked. It must be newer
  # than every source this run's behaviour rides on — including VerifiedTrain.lean, which carries
  # the shim respawn (63b21d84) this run exists to test and the resume fix (367bb28b) §4 relies on.
  # A binary older than those has no respawn to exercise and a resume that drops `ema_bn`.
  [ -x "$exe" ] || { echo "⛔ $exe missing — lake build convnext-imagenet-verified"; ok=1; }
  local src
  for src in LeanMlir/VerifiedTrain.lean ffi/f32_helpers.c ffi/pjrt_ffi.c \
             apps/imagenette/MainConvNeXtImagenet.lean; do
    [ "$exe" -nt "$src" ] || {
      echo "⛔ $exe is OLDER than $src — lake build convnext-imagenet-verified"; ok=1; }
  done
  if [ -x "$exe" ] && [ -f "$render" ] && [ "$exe" -ot "$render" ]; then
    echo "⛔ $exe is OLDER than the render it must execute — rebuild it."; ok=1
  fi

  # ⛔ The shim is a GENERATED artifact under gitignored .lake/build, and a warm cache serves a
  # stale one silently. Instant: a diff, no Lean, no GPU.
  [ -f jax/.lake/build/generated_convnext_tiny_imagenet_shim.py ] || {
    echo "⛔ missing ConvNeXt's OWN tfds shim — scripts/gen_shims.sh"; ok=1; }
  # ⚠ Existence is not freshness, and this net's shim is the heavy one — the augmentations §3's
  # respawn exists for must actually be IN it.
  grep -q '_autoaugment(' jax/.lake/build/generated_convnext_tiny_imagenet_shim.py 2>/dev/null || {
    echo "⛔ ConvNeXt's shim has no AutoAugment CALL SITE — a definition is not a call site"
    echo "   (§0.9 finding 1). Run scripts/gen_shims.sh."; ok=1; }
  scripts/regen_jax_generated.sh box >/dev/null 2>&1 || {
    echo "⛔ this box's jax/.lake/build artifacts are STALE vs committed jax/generated/:"
    scripts/regen_jax_generated.sh box 2>&1 | grep -E 'STALE|not built' | sed 's/^/   /'
    echo "   scripts/regen_jax_generated.sh sync, then re-run."; ok=1; }

  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "⛔ PJRT_FFI_RESIDENT=1 is missing — residency is opt-in, defaults OFF, and silently"
    echo "   halves throughput. The OFF path prints nothing at all."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_EPOCHS=300' || {
    echo "⛔ LEAN_MLIR_EPOCHS=300 missing — MAX_EPOCHS only CAPS, it cannot SET the cosine."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_BASE_LR_U=250' || {
    echo "⛔ LEAN_MLIR_BASE_LR_U=250 (lr 2.5e-4) missing — the reference's rate at global 256."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'SHIM_WORKERS=4' || {
    echo "⛔ SHIM_WORKERS=4 is missing. Measured 2026-08-31: 8 producers give 145.5 ms/step against"
    echo "   4's 126 (floor 118). Absent entirely, ONE producer feeds this net: 895 vs 235."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10' || {
    echo "⚠ LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10 is not set — the run is then Arm A (bare loaders) on"
    echo "  the heaviest shim in the fleet and the longest schedule in the book. Deliberate?"; }
  if [ -n "${REST_EPOCHS// /}" ]; then
    echo "⚠ REST_EPOCHS is non-empty ($REST_EPOCHS) — with the respawn ON there are then TWO feed"
    echo "  refresh mechanisms and the respawn test is muddled."
  fi

  # ⚠ Resume across a schedule change fuses two LR curves silently.
  if [ -f "$CKPT_EPOCH_FILE" ]; then
    local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"; n="${n:-0}"
    echo "⚠ $CKPT_EPOCH_FILE exists (epoch $n) — this run will RESUME from it, not start fresh."
  fi

  # ⚠⚠ Checkpoints are per-VARIANT and outlive the artifact they trained on. An f32 or a batch-32
  # blob is a DIFFERENT shape; resuming one into this run is not a resume, it is corruption.
  # ⛔ And every convnextin checkpoint on disk today predates the batch-64 rescope.
  local stray; stray="$(ls .lake/build/convnextin_*_ckpt_xla*.bin 2>/dev/null \
    | grep -v 'convnextin_adamdpwxclipdropbf16_ckpt_xla.bin$' || true)"
  if [ -n "$stray" ]; then
    echo "⚠ other convnextin checkpoints present — they must NOT be resumed into this run:"
    printf '   %s\n' $stray
  fi

  # ⚠⚠ A stale GPU process fakes OOM and NCCL errors on this box.
  local busy; busy="$(nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader 2>/dev/null)"
  if [ -n "$busy" ]; then
    echo "⛔ GPUs are not idle — a leftover process will fake an OOM at step 0:"
    echo "$busy" | sed 's/^/   /'; ok=1
  fi

  return $ok
}
