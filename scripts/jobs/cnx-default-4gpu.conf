# ConvNeXt-Tiny / ImageNet-1k, VERIFIED path (Lean → StableHLO → XLA/PJRT), 4-GPU data-parallel.
#
#     scripts/supervise.sh cnx-default-4gpu
#
# 4 replicas x bs 32 = global batch 128, 10,009 steps/epoch — DOUBLE every other net's step count,
# because the per-replica batch is 32 rather than 64. That is the single biggest lever left on this
# job and it is scoped-but-not-built (handoff §2p: "the single best pre-run optimisation available").
#
# ⭐ MEASURED 2026-08-05, this shape, residency + prefetch + 8 producers:
#
#       SHIM_WORKERS=1     895 ms/step
#       SHIM_WORKERS=8     235 ms/step      ← 3.8x, against a 214 ms compute-only floor
#
#   39.2 min/epoch ⇒ 300 ep ≈ 196 h ≈ 8.2 d. §0.13's table said 205 h for EIGHTY epochs.
#
# ▶ Same cause as EfficientNet's: this net's shim runs AutoAugment + RandAugment + random erasing
#   per image on CPU, and one tf.data producer saturates ~3 of 32 cores regardless of
#   `num_parallel_calls=AUTOTUNE`. At 8 producers the data path is within 10% of free.
#
# ⚠ At 235 ms/step this job is now COMPUTE-bound, so the batch-64 rescope is what moves it next:
#   it halves the step count per epoch, and the step will not double.
#
# ⭐⭐ RE-MEASURED 2026-08-29 after the two layout fixes, 4x 4060 Ti, 40 steps, same env:
#
#       adamdpwxclipdrop      (f32, WHAT THIS CONF NAMES)   206 ms/step   ~175 h / 300 ep
#       adamdpwxclipdropbf16                                131 ms/step   ~112 h / 300 ep
#
#   The f32 arm is INERT across both fixes (A/B'd today: 207 -> 206), because XLA keeps f32
#   convolutions in NCHW and there is no layout to convert. bf16 went 180 -> 144 -> 131.
# ▶ Flipping LEAN_MLIR_VARIANT to the bf16 twin is worth ~63 h on this run and the artifact
#   already exists. Left f32 deliberately: no bf16 ConvNeXt has been trained to accuracy yet.

# ▶ §2c N1: this must equal the second dash-field of the filename. supervise.sh refuses
#   otherwise — the job namespace drifted from the recipe namespace once already.
RECIPE=default
DEVS="0,2,3,4"          # the AER-clean four; idx 1 and 5 are excluded (reference_ares_pcie_aer)
EPOCHS=300              # convnextImagenetConfig.epochs — the ConvNeXt paper's schedule length

CMD=(.lake/build/bin/convnext-imagenet-verified data)

ENV_EXTRA=(
  PJRT_PLUGIN=".venv/lib/python3.12/site-packages/jax_plugins/xla_cuda12/xla_cuda_plugin.so"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # The regularised DP artifact — wd-excluded + grad clip + dropPath. This is the one net whose
  # shipping DP render already carried dropPath when §0.5's audit ran; keep it that way.
  LEAN_MLIR_VARIANT=adamdpwxclipdrop
  LEAN_MLIR_BATCH=32                 # PER REPLICA — see the 10,009 steps/epoch note above
  PJRT_FFI_RESIDENT=1
  # ⚠⚠ REQUIRED — worth 3.8x here. Absent, this job is 895 ms/step and reads exactly like a
  # correct one: 31 days instead of 8.
  # ⭐ SHIM_WORKERS=4, not 8 (changed 2026-08-31 after a measured sweep 2..16 per net).
  # ConvNeXt-T bf16 4x: w8 145.5 -> w4 126 ms/step (floor 118). 121.4 h -> 105.1 h / 300 ep.
  # ▶ Producers past ~4 add no throughput and contend with the trainer's own host thread.
  # ⛔ NOT a fleet-wide constant: EfficientNet-B0's probe is +/-30% and stayed at 8.
  SHIM_WORKERS=4
)

# ⚠ ConvNeXt's initial loss is 10.42 where every other net starts near ln(1000) = 6.91. It descends
# briskly and its baked loss divisor is correct, but §5 lists its `%loss` as a report-only carve-out
# outside every faithfulness theorem — and R34 shipped a wrong `%loss` once, caught only by a
# numeric tie. Do not quote a loss curve off this run without looking at that first.

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

CKPT_EPOCH_FILE=".lake/build/convnextin_adamdpwxclipdrop_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_cnx
precheck_cnx() {
  [ -x .venv/bin/python3 ] || { echo "missing .venv/bin/python3 (the pinned env)"; return 1; }
  [ -f verified_mlir/convnextin_adamdpwxclipdrop_train_step.mlir ] || {
    echo "missing the 4-replica regularised render — build the ConvNeXt renderer"; return 1; }
  [ -f jax/.lake/build/generated_convnext_tiny_imagenet_shim.py ] || {
    echo "missing ConvNeXt's OWN tfds shim — scripts/gen_shims.sh"; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "PJRT_FFI_RESIDENT=1 is missing from ENV_EXTRA — opt-in, defaults OFF, silent."; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'SHIM_WORKERS=4' || {
    echo "SHIM_WORKERS=4 is missing from ENV_EXTRA. ConvNeXt-T measured 2026-08-31: 8 producers give 145.5 ms/step against 4's 126 (floor 118)."; return 1; }
  return 0
}
