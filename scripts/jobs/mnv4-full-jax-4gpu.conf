# MobileNetV4-Conv-M / ImageNet-1k, JAX REFERENCE path, the `full` recipe (500 epochs), 4 GPUs.
#
#     setsid nohup scripts/supervise.sh mnv4-full-jax-4gpu >/dev/null 2>&1 &
#
# The paper tier: AdamW 0.004 @ 4096 = 512 × accum 8, wd 0.1 off norm/bias, LS 0.1, dropout 0.2,
# RandAugment N2 m15, drop-path 0.075, no EMA (the live weights are scored), eval every 5 epochs
# on running BN, bf16, 224. Known differences from the paper: RandAugment is applied at p 0.5,
# not 0.7, and m15 extrapolates past the shim's _AA_MAX of 10.
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo, and apart from the 100-epoch pair's (~/mnv4_timm_100ep).
RECIPE=full
DEVS="0,1,2,3"
EPOCHS=500
CKPT_BASE=/home/skoonce/mnv4_full_500ep/mobilenet_v4_imagenet_full
PY_REL=.lake/build/generated_mobilenet_v4_imagenet_full.py    # relative to jax/
# The 4x 4060 Ti probe (runs/2026-09-25-mnv4-timm-probe) put the timm net at ~136 ms/step bf16,
# ~680 s/epoch, ~95 h for 500 ep; the 4x 3060 box measured 582 s/epoch on the default recipe.
EPOCH_SECS=720
ETA="~95 h for 500 ep on 4x 4060 Ti (probe), ~81 h on 4x 3060"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_mnv4_full_jax
precheck_mnv4_full_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  pc_jax_trainer || ok=1
  pc_aug_call "jax/$PY_REL" '_randaugment(img, 2, 15.000000' "RandAugment N2 m15, the paper recipe" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "the paper recipe is RandAugment only" || ok=1
  grep -q '^EMA_DECAY' "jax/$PY_REL" && {
    echo "⛔ jax/$PY_REL still trains an EMA shadow — the full recipe scores live weights; re-emit"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
