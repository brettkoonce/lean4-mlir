# ResNet-50 / ImageNet-1k, JAX REFERENCE path, the `2018` recipe (90 epochs), 4 GPUs.
#
#     setsid nohup scripts/supervise.sh r50-2018-jax-4gpu >/dev/null 2>&1 &
#
# Recipe = `resnet50ImagenetConfig2018`: SGD momentum 0.9, lr 0.1 at 256 (4 × 64), wd 1e-4 on all
# parameters, cosine with a 5-epoch warmup, softmax CE with label smoothing 0.1, random-resized-crop
# + flip, 224 / 224, zero-γ, BN decay 0.9, bf16. The peer of `r50-2018-bf16-4gpu`. The rerun §5.8
# owes: the landed 76.95 (/home/skoonce/r50_2018_90ep/, 2026-08) trained a bf16 head at BN decay
# 0.99; this trainer has the fp32 head (X3) and 0.9, and the verified side now starts at zero-γ (X4).
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo, in a directory of their own: pointing CKPT_BASE at the August
# run's would resume its epoch-90 state and finish at once.
RECIPE=2018
DEVS="0,1,2,3"
EPOCHS=90
CKPT_BASE=/home/skoonce/r50_2018_jax_2610/resnet50_imagenet_2018
PY_REL=.lake/build/generated_resnet50_imagenet_2018.py    # relative to jax/
# The August run on this box: median 897 s an epoch, eval included (22.5 h over 90).
EPOCH_SECS=900
ETA="~22.5 h for 90 ep on 4x 4060 Ti (median 897 s/epoch incl. eval; the 2026-08 run, /home/skoonce/r50_2018_90ep)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_r50_2018_jax
precheck_r50_2018_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  pc_jax_trainer || ok=1
  pc_aug_no_call "jax/$PY_REL" '_randaugment(' "the 2018 recipe has no RandAugment" || ok=1
  grep -q '^    EPOCHS = 90$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not the 90-epoch trainer"; ok=1; }
  grep -q '^LR = 0.100000$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not at the 2018 rate 0.1"; ok=1; }
  grep -q 'x = jnp.matmul(x, params\[53\]\[0\].T)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's classifier head is not the fp32 matmul (X3) — re-emit"; ok=1; }
  grep -q 'momentum=0.9\b' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's BN decay is not 0.9 (timm's, and the verified side's)"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
