# ResNet-50 RSB-A3 / ImageNet-1k, JAX REFERENCE path, the `rsb-faithful-mix8` recipe (100 epochs), 4 GPUs.
#
#     systemd-run --user --unit=r50-a3mix8-jax --working-directory="$PWD" --setenv=PATH="$PATH" \
#       --setenv=RUNDIR=runs/<date>-r50-a3mix8-jax scripts/supervise.sh r50-a3mix8-jax-4gpu
#
# The A/B on `r50-a3-jax-4gpu` for the reference's gap to the paper at A3 (77.60 / 77.66 / 77.64 over
# three seeds against timm's 78.1; runs/2026-10-30-r50-a3-seeds/RESULTS.md). One change: Mixup/CutMix
# drawn per 256-row chunk, eight a step (`mixChunks := 8`), as timm draws once per GPU batch, instead
# of one draw for the step's 2048. Everything else is `rsb-faithful`, and at RUN_SEED 1 the init,
# shuffle and augmentation streams are the landed seed-1 run's, so the two checkpoints pair.
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
RECIPE=a3mix8
DEVS="0,1,2,3"
EPOCHS=100
RUN_SEED="${RUN_SEED:-1}"
case "$RUN_SEED" in ''|*[!0-9]*|0) echo "⛔ RUN_SEED must be a positive integer, got '$RUN_SEED'"; exit 1 ;; esac
_A3_DIR=/home/skoonce/r50_a3mix8_jax; [ "$RUN_SEED" = 1 ] || _A3_DIR=${_A3_DIR}_s$RUN_SEED
ENV_EXTRA=(LEAN_MLIR_SEED_OFFSET=$((100 * (RUN_SEED - 1))))   # r50-a3-jax-4gpu's seed spacing
CKPT_BASE=$_A3_DIR/resnet50_imagenet_rsbfaithful_mix8
PY_REL=.lake/build/generated_resnet50_imagenet_rsbfaithful_mix8.py    # relative to jax/
# the mars bench of r50-a3-jax-4gpu (runs/2026-11-02-bench-mars/): 511 s an epoch, eval included
EPOCH_SECS=515
ETA="~14.5 h for 100 ep on mars (r50-a3-jax-4gpu's pace, runs/2026-11-02-bench-mars/; the chunked draw is elementwise)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_r50_a3mix8_jax
precheck_r50_a3mix8_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  pc_crop "jax/$PY_REL" torchvision random || ok=1
  grep -q '^def _aa_warp1d' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no PIL-bicubic RandAugment geometry (C6)"; ok=1; }
  pc_jax_trainer || ok=1
  grep -q "^_SEED_OFF = int(os.environ.get('LEAN_MLIR_SEED_OFFSET', '0'))" "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no LEAN_MLIR_SEED_OFFSET knob; re-emit"; ok=1; }
  pc_aug_call "jax/$PY_REL" '_randaugment(img, 2, 6.000000, 0.500000)' "RSB-A3 RandAugment m6 mstd0.5" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "RSB is RandAugment only" || ok=1
  grep -q 'tgt = (tgt > 0.200000)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no BCE target threshold (timm's A3 ran at 0.2)"; ok=1; }
  grep -q '^GRAD_ACCUM = 4$' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL is not the 512 × 4 accumulation trainer"; ok=1; }
  grep -q '^LR = 0.008000$' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL is not at RSB-A3's 8e-3 at 2048"; ok=1; }
  grep -q '^    EPOCHS = 100$' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL is not the 100-epoch trainer"; ok=1; }
  grep -q 'lr = jnp.float32(0.000100 + epoch \* (LR - 0.000100) / 5)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no per-epoch warmup from 1e-4; re-emit"; ok=1; }
  grep -q 'lr = jnp.float32(0.000001 + 0.5 \* (LR - 0.000001) \* (1 + np.cos(np.pi \* epoch / EPOCHS)))' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no per-epoch cosine to the 1e-6 floor; re-emit"; ok=1; }
  # the one change: eight draws a step, each chunk its own coin
  grep -q '^MIX_CHUNKS = 8$' "jax/$PY_REL" && grep -q 'random(MIX_CHUNKS) < 0.500000' "jax/$PY_REL" \
    && grep -q 'x, y = _mix_chunked(x, y, ' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL does not draw Mixup/CutMix per 256-row chunk (mixChunks 8)"; ok=1; }
  grep -q '^_RA_FILL = tf.constant(\[124.0, 116.0, 104.0\])' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL fills RandAugment geometry with grey, not timm's img_mean"; ok=1; }
  grep -q 'DT = jnp.float32; CONV_DT = jnp.float32   # evalF32' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL scores through its bf16 training forward, not f32 (evalF32)"; ok=1; }
  grep -q 'x = jnp.matmul(x, params\[53\]\[0\].T)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's classifier head is not the fp32 matmul (X3)"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
