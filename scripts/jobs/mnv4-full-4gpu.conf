# mnv4-full-4gpu.conf — MobileNetV4-Conv-M / ImageNet-1k, VERIFIED path, the paper tier, 500 epochs.
#
#     scripts/supervise.sh mnv4-full-4gpu
#
# The verified peer of `mnv4-full-jax-4gpu`: AdamW 0.004 at effective 4096 (4 x 128 x k=8, sync-BN
# over 512), wd 0.1 off norm/bias, label smoothing 0.1 (baked), dropout 0.2 and drop-path 0.075 on
# the 18 skip UIB blocks (host-drawn masks, `mnv4ImagenetFullVerified`), RandAugment N2 m15 from
# the `full` shim, no EMA (the live weights are scored), bf16, 224, eval every 5 epochs.
# `LEAN_MLIR_RECIPE=full` selects the spec; the driver refuses a variant without `drop` on it.
# Score at timm's test protocol afterwards: 256 / 1.0 through `mnv4in_fwd_eval_s256`.

# ▶ §2c N1: this must equal the second dash-field of the filename.
RECIPE=full
DEVS="0,1,2,3"
EPOCHS=500
# Modelled at the verified shim ceiling (253 ms per 512, planning/side_quest_runs.md §4.2): the 4x 3060
# box ran the 100-epoch pair at 666 s/epoch. The chunk planner replaces EPOCH_SECS with the longest
# epoch it times itself. ⚠ probe median + mean before launch.
EPOCH_SECS=700
ETA="~90 h for 500 ep on 4x 4060 Ti (modelled at the shim ceiling, not measured on this render)"

CMD=(.lake/build/bin/mobilenetv4-imagenet-verified data)

. "$(dirname "${BASH_SOURCE[0]}")/_box.sh"   # BOX, BOX_PLUG, BOX_PY, BOX_SHIMPY
VARIANT=accdp8x128wxdropdowd01bf16
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  LEAN_MLIR_RECIPE=full              # the spec: the m15 shim, dropout 0.2, the drop-path keeps
  LEAN_MLIR_VARIANT=$VARIANT
  LEAN_MLIR_BATCH=128                # PER REPLICA, baked into the render
  LEAN_MLIR_EPOCHS=500               # = EPOCHS; sets the cosine length as well as the loop bound
  LEAN_MLIR_BASE_LR_U=4000           # 0.004, the reference's peak at effective 4096
  LEAN_MLIR_G2_STEPS=2496            # 312 × k: whole accumulation cycles, the reference's 312 steps
  LEAN_MLIR_VAL_EVERY=5              # the reference's cadence; the last epoch is always scored
  SHIM_WORKERS=4                     # the MNv4 shim peaks at 4 producers (side_quest_runs.md §4.2)
  LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10
)

TEMP_MAX=78
TEMP_RESUME=62

CKPT_EPOCH_FILE=".lake/build/mnv4in_${VARIANT}_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_mnv4_full
precheck_mnv4_full() {
  . scripts/lib/precheck.sh
  local ok=0
  local mlir="verified_mlir/mnv4in_${VARIANT}_train_step.mlir"
  pc_box || ok=1
  pc_render mnv4in "$VARIANT" 4 464 || ok=1
  pc_ckpt mnv4in "$VARIANT" || ok=1
  pc_exe mobilenetv4-imagenet-verified LeanMlir/Verified/Train.lean LeanMlir/Verified/NetsCore.lean \
    apps/imagenette/MainMobilenetV4Imagenet.lean || ok=1
  pc_pjrt_so || ok=1
  if [ -f "$mlir" ]; then
    # 4 regions [θ|m|v|G] x 233 + 154 BN stats + 18 drop masks + the dropout mask + 2 data + 5 scalars.
    local nargs; nargs="$(sed -n '2p' "$mlir" | grep -o '%[a-zA-Z0-9_]*: tensor<' | wc -l)"
    [ "$nargs" = "1112" ] || {
      echo "⛔ $mlir has $nargs operands, not 1112 — not the no-EMA drop-path layout."; ok=1; }
    grep -q 'EMA WEIGHT SHADOW' "$mlir" && {
      echo "⛔ $mlir carries an EMA shadow; the paper tier has none."; ok=1; }
    grep -q 'stablehlo.constant dense<0.1> : tensor<f32>' "$mlir" || {
      echo "⛔ $mlir does not bake the paper's wd 0.1."; ok=1; }
  fi
  pc_jax_box || ok=1
  pc_shim mobilenet_v4_imagenet_full || ok=1
  local shim=jax/.lake/build/generated_mobilenet_v4_imagenet_full_shim.py
  pc_aug_call "$shim" '_randaugment(img, 2, 15.0' "RandAugment N2 m15, the paper tier" || ok=1
  pc_aug_no_call "$shim" '_autoaugment(' "the paper tier is RandAugment only" || ok=1
  pc_env LEAN_MLIR_RECIPE=full "selects the m15 shim and the dropout/drop-path keeps" || ok=1
  pc_env SHIM_WORKERS=4 "the MNv4 shim's measured peak" || ok=1
  pc_env LEAN_MLIR_EPOCHS=500 "sets the cosine; must equal EPOCHS" || ok=1
  pc_env LEAN_MLIR_BASE_LR_U=4000 "0.004, the reference's peak at 4096" || ok=1
  pc_env LEAN_MLIR_G2_STEPS=2496 "312 whole accumulation cycles of 8" || ok=1
  pc_gpu_idle || ok=1
  return $ok
}
