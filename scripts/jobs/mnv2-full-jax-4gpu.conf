# MobileNetV2 / ImageNet-1k, JAX REFERENCE path, the `full` recipe (350 epochs), 4 GPUs.
#
#     START_AT=00:00 STOP_AT=08:00 setsid nohup scripts/supervise.sh mnv2-full-jax-4gpu >/dev/null 2>&1 &
#
# The JAX side of the MobileNetV2 pair; the verified side is `mnv2-default-4gpu`
# (`rmsdp64wxdols0bf16`). Recipe = `mobilenetV2ImagenetConfigFull`: RMSProp (ρ 0.9, μ 0.9, ε 1.0
# inside the root, mean-square initialised to 1.0) at lr 0.045 on batch 256 (4 × 64), 5 warmup
# epochs then ×0.98 per epoch, coupled L2 4e-5 off BN γ/β and biases, classifier dropout 0.2, no
# label smoothing, crop + flip only, ReLU6 throughout, running-BN eval on all 50,000. bf16.
#
# This reruns the 71.90 reference, which trained before the ReLU6 stem/head fix (2026-08-30) and,
# by the note in mnv2-default-4gpu.conf's precheck, off a stale emit that still smoothed labels.
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo. ~/mnv2_350ep holds the retired run: never point CKPT_BASE there.
RECIPE=full
DEVS="0,1,2,3"
EPOCHS=350
CKPT_BASE=/home/skoonce/mnv2_full350_relu6/mobilenet_v2_imagenet
PY_REL=.lake/build/generated_mobilenet_v2_imagenet_full.py    # relative to jax/
# The retired 350-epoch run took 38.4 h on this box's predecessor cards (book, ch. 6); unmeasured on
# the 4060 Ti. The chunk planner replaces EPOCH_SECS with the longest epoch it times itself.
EPOCH_SECS=400
ETA="~38 h for 350 ep (the retired run's wall clock); unmeasured on 4x 4060 Ti, re-probe owed"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_mnv2_full_jax
precheck_mnv2_full_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  pc_jax_trainer || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "MobileNetV2's recipe is crop + flip only" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_randaugment(' "MobileNetV2's recipe is crop + flip only" || ok=1
  grep -q 'WD_MASK = _wd_mask(params)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL decays BN γ/β and biases — it predates wdExcludeNormBias; re-emit"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
