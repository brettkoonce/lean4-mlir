# ViT-Small (DeiT-S) / ImageNet-1k, JAX REFERENCE path, the `default` recipe (300 epochs), 4 GPUs.
#
#     setsid nohup scripts/supervise.sh vits-default-jax-4gpu >/dev/null 2>&1 &
#
# The JAX side of the ViT-S pair. Recipe = `vitSImagenetConfig`: DeiT-S at batch 512, AdamW 5e-4,
# wd 0.05 off norm/bias/pos/CLS, 5 warmup epochs + cosine, clip 1.0, mixup 0.8 / cutmix 1.0,
# RandAugment m9 mstd0.5 inc1, random erasing 0.25, repeated augmentation ×3, drop-path 0.1,
# label smoothing 0.1 folded into the mixed target, EMA 0.99996, bf16, trunc_normal(0.02) init.
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo.
RECIPE=default
DEVS="0,1,2,3"
EPOCHS=300
CKPT_BASE=/home/skoonce/vit_s_default_300ep/vit_s_imagenet
PY_REL=.lake/build/generated_vit_s_imagenet.py    # relative to jax/
# Compute-only 290 ms/step (runs/2026-08-27-jax-sb-tier-step-probe), but ViT-Ti's trainer was
# feed-bound at ~380 ms/step on 4x 4060 Ti, so plan on ~380: 2,502 steps -> ~950 s/epoch, ~79 h.
EPOCH_SECS=1000
ETA="~79 h for 300 ep on 4x 4060 Ti (feed-bound estimate; 60 h compute-only)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_vits_default_jax
precheck_vits_default_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  pc_jax_trainer || ok=1
  pc_aug_call "jax/$PY_REL" '_randaugment(img, 2, 9.000000, 0.500000)' "DeiT RandAugment m9 mstd0.5" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "DeiT's recipe is RandAugment only" || ok=1
  grep -q 'one_hot(y, 1000) \* (1.0 - 0.100000) + 0.100000 / 1000' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL mixes raw one-hots — it predates 4b765be7 and trains at label smoothing 0"; ok=1; }
  grep -q '(timm trunc_normal std=0.02)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no DeiT init — re-emit"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
