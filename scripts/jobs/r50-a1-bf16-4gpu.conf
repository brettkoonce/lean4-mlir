# r50-a1-bf16-4gpu.conf — ResNet-50 RSB-A1 / ImageNet-1k, VERIFIED path, bf16, 600 epochs.
#
#     scripts/supervise.sh r50-a1-bf16-4gpu
#
# The verified peer of the A1 JAX conf (batch 3). RSB Table 2's RSB-A1: LAMB lr 5e-3 at effective 2048
# (4 replicas x 128 x k=4, BN group 512 by sync-BN), BCE with the target threshold 0.2, no EMA,
# stochastic depth 0.05, wd 0.01, baked as the `wd001` marker, 5-epoch warmup + cosine, train 224 / crop 0.95.
# The threshold, label smoothing 0.1 and Mixup α ride the recipe's own shim
# (`LEAN_MLIR_RECIPE=a1`); the render takes `%onehot` as given.
# Score at timm's test protocol afterwards: 288 / 1.0 through `resnet50in_fwd_eval_s288`
# (scripts/parity/score_timm.sh).

# ▶ §2c N1: this must equal the second dash-field of the filename.
RECIPE=a1
DEVS="0,1,2,3"
EPOCHS="${EPOCHS:-600}"
ETA="bf16 ~193 h for 600 ep on 4x 4060 Ti (mean 463 / median 460 / floor 425 ms per micro-batch, 2,500 per epoch, 35 ms starved — X5's bicubic RandAugment geometry in the shim; measured 2026-10-07, runs/2026-10-07-d17-reprobe; 444 / 444 / 412 on 10-05)"

CMD=(.lake/build/bin/resnet50-imagenet-verified data)

. "$(dirname "${BASH_SOURCE[0]}")/_box.sh"   # BOX, BOX_PLUG, BOX_PY, BOX_SHIMPY
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  LEAN_MLIR_RECIPE=a1                # selects the NET SPEC, hence the shim; the driver refuses a
                                     # variant that does not match it
  LEAN_MLIR_VARIANT=lambaccdp4x128wxclipdropbcewd001bf16
  LEAN_MLIR_BATCH=128                # PER REPLICA
  LEAN_MLIR_EPOCHS=600               # SETS the cosine; the driver's default is A3's 100
  LEAN_MLIR_BASE_LR_U=5000           # RSB lr 5e-3 at bs2048; the driver's default is AdamW's 0.001
  # 2,502 micro-batches/epoch is not divisible by k=4; 2500 makes every epoch a cycle boundary.
  LEAN_MLIR_G2_STEPS=2500
  SHIM_WORKERS=8                     # RandAugment m7 per image
  LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10
  # one Mixup/CutMix draw per 256 rows, two per 512-row shim record — as r50-a2-bf16-4gpu; timm
  # draws once per GPU batch, and one draw a step cost the JAX reference half a point at A3
  SHIM_MIX_CHUNK=256
)

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

CKPT_EPOCH_FILE=".lake/build/resnet50in_lambaccdp4x128wxclipdropbcewd001bf16_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_r50_a1_bf16
precheck_r50_a1_bf16() {
  . scripts/lib/precheck.sh
  local ok=0
  . scripts/lib/precheck.sh; pc_crop jax/.lake/build/generated_resnet50_imagenet_a1_shim.py torchvision random || ok=1   # train crop + resize kernel
  local var=lambaccdp4x128wxclipdropbcewd001bf16
  local mlir="verified_mlir/resnet50in_${var}_train_step.mlir"
  local shim=jax/.lake/build/generated_resnet50_imagenet_a1_shim.py
  pc_box || ok=1
  # 161 gradient all-reduces + 159 BN-statistic ones (sync-BN).
  pc_render resnet50in "$var" 4 320 || ok=1
  pc_ckpt resnet50in "$var" || ok=1
  pc_exe resnet50-imagenet-verified LeanMlir/Verified/Train.lean ffi/f32_helpers.c \
    apps/imagenette/MainResnet50Imagenet.lean || ok=1
  pc_pjrt_so || ok=1
  if [ -f "$mlir" ]; then
    # 4 regions [θ|m|v|acc] x 161 + 106 BN stats + 16 drop masks + 2 data + 5 scalars = 773;
    # the EMA twin has 936.
    # the driver copies the output blob back, so #out = #in − 2 with every mask passed through
    python3 scripts/gates/train_step_arity.py "$mlir" | grep -v '^✓'; [ "${PIPESTATUS[0]}" = 0 ] || ok=1
    local nargs; nargs="$(sed -n '2p' "$mlir" | grep -o '%[a-zA-Z0-9_]*: tensor<' | wc -l)"
    [ "$nargs" = "773" ] || {
      echo "⛔ $mlir has $nargs operands, not 773 — not the no-EMA A2/A1 layout."; ok=1; }
    grep -q 'EMA WEIGHT SHADOW' "$mlir" && {
      echo "⛔ $mlir carries an EMA shadow; RSB Table 2 has none."; ok=1; }
    grep -q 'stablehlo.constant dense<0.01> : tensor<f32>' "$mlir" || {
      echo "⛔ $mlir does not bake RSB-A1's weight decay."; ok=1; }
  fi
  [ -f verified_mlir/resnet50in_fwd_eval.mlir ] || {
    echo "⛔ missing verified_mlir/resnet50in_fwd_eval.mlir, the per-epoch eval forward"; ok=1; }
  pc_jax_box || ok=1
  pc_shim resnet50_imagenet_a1 || ok=1
  # timm's RSB recipe as run (A3's args files on discussion #924; the era's defaults for A1 / A2; 2026-10-11):
  # the shim draws Mixup or CutMix per batch at 0.5, fills RandAugment geometry at img_mean and keeps
  # the 3 repeated-aug copies adjacent (RASampler); the driver steps the cosine once an epoch, 1e-4 → the
  # peak over 5 epochs, floor 1e-6, on the a2 / a1 recipes and the 160² render.
  grep -q 'rng.random() < 0.500000' "$shim" || {
    echo "⛔ the shim alternates Mixup / CutMix by step, not timm's per-batch draw at 0.5 (mixSwitchProb; sync)"; ok=1; }
  grep -q '^_RA_FILL = tf.constant(\[124.0, 116.0, 104.0\])' "$shim" || {
    echo "⛔ the shim fills RandAugment geometry with grey, not timm's img_mean (randAugmentFillMean; sync)"; ok=1; }
  grep -q '# repeatedAugAdjacent' "$shim" || {
    echo "⛔ the shim re-shuffles the 3 repeated-aug copies apart (repeatedAugAdjacent off; sync)"; ok=1; }
  grep -q '(minLR := if rsb then 0.000001 else 0.0) (schedPerEpoch := rsb) (warmupLRInit := if rsb then 0.0001 else 0.0)' apps/imagenette/MainResnet50Imagenet.lean || {
    echo "⛔ apps/imagenette/MainResnet50Imagenet.lean does not pass timm's per-epoch schedule on the a2 / a1 recipes"; ok=1; }
  grep -q 'to = (to > np.float32(0.200000))' "$shim" || {
    echo "⛔ $shim does not threshold the BCE target at 0.2 — scripts/gen_shims.sh"; ok=1; }
  grep -q "to = to \* np.float32(1.0 - 0.100000)" "$shim" || {
    echo "⛔ $shim does not smooth the BCE target at 0.1 — scripts/gen_shims.sh"; ok=1; }
  grep -q "SHIM_MIXUP_ALPHA', '0.200000'" "$shim" || {
    echo "⛔ $shim is not at A1's Mixup α 0.2"; ok=1; }
  pc_aug_call "$shim" '_randaugment(img, 2, 7.000000, 0.500000)' "RSB RandAugment m7 mstd0.5" || ok=1
  pc_env LEAN_MLIR_RECIPE=a1 "the recipe selects the shim; the driver checks the variant against it" || ok=1
  pc_env LEAN_MLIR_EPOCHS=600 "the driver defaults to A3's 100-epoch cosine" || ok=1
  pc_env LEAN_MLIR_BASE_LR_U=5000 "the driver defaults to AdamW's 0.001, 5x low" || ok=1
  pc_env LEAN_MLIR_G2_STEPS=2500 "2,502 is not divisible by k=4" || ok=1
  pc_env SHIM_WORKERS=8 "RandAugment on one producer is a ~10x wall-clock penalty" || ok=1
  pc_env SHIM_MIX_CHUNK=256 "the shim would draw Mixup/CutMix once per 512-row record" || ok=1
  grep -q "_MIX_CHUNK = int(os.environ.get('SHIM_MIX_CHUNK', '0'))" "$shim" || {
    echo "⛔ the A1 shim does not read SHIM_MIX_CHUNK (it would draw per record); regen_jax_generated.sh sync"; ok=1; }
  pc_gpu_idle || ok=1
  # Per-image top-1 bitmaps, one per epoch, into this run's dir — the McNemar pairing's input
  # (appended here because PRECHECK runs in the supervisor's shell after RUNDIR is fixed).
  mkdir -p "$RUNDIR/bitmaps"
  ENV_EXTRA+=("LEAN_MLIR_DUMP_CORRECT=$RUNDIR/bitmaps/a1_lambaccdp4x128wxclipdropbcewd001bf16")
  echo "  per-image bitmaps -> $RUNDIR/bitmaps/a1_lambaccdp4x128wxclipdropbcewd001bf16_e{N}.bin (LEAN_MLIR_DUMP_CORRECT)"
  return $ok
}
