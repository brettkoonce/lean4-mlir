# ResNet-34 / ImageNet-1k, JAX REFERENCE path, the `default` recipe (the 2018 recipe, 90 epochs), 4 GPUs.
#
#     setsid nohup scripts/supervise.sh r34-default-jax-4gpu >/dev/null 2>&1 &
#
# Recipe = `resnet34ImagenetConfig`: SGD momentum 0.9, lr 0.1 at 256 (4 × 64), wd 1e-4, cosine with a
# 5-epoch warmup, softmax CE with label smoothing 0.1, random-resized-crop + flip, 224 / 224, bf16.
# The peer of `r34-default-bf16-4gpu`. The rerun the book's §5.7 owes: the landed 74.16
# (/home/skoonce/r34_2018_90ep/, 2026-08) scored through a bf16 classifier head; this trainer's head
# is fp32 (X3), as the verified render's always was. BN decay 0.99 on both paths.
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo, in a directory of their own: pointing CKPT_BASE at the August
# run's would resume its epoch-90 state and finish at once.
RECIPE=default
DEVS="0,1,2,3"
EPOCHS=90
CKPT_BASE=/home/skoonce/r34_2018_jax_2610/resnet34_imagenet
PY_REL=.lake/build/generated_resnet34_imagenet.py    # relative to jax/
# The August run on this box: median 527 s an epoch, eval included (13.3 h over 90).
EPOCH_SECS=530
ETA="~13.3 h for 90 ep on 4x 4060 Ti (median 527 s/epoch incl. eval; the 2026-08 run, /home/skoonce/r34_2018_90ep)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_r34_default_jax
precheck_r34_default_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  . scripts/lib/precheck.sh; pc_crop "jax/$PY_REL" torchvision bilinear || ok=1   # train crop + resize kernel
  pc_jax_trainer || ok=1
  pc_aug_no_call "jax/$PY_REL" '_randaugment(' "the 2018 recipe has no RandAugment" || ok=1
  grep -q '^    EPOCHS = 90$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not the 90-epoch trainer"; ok=1; }
  grep -q '^LR = 0.100000$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not at the 2018 rate 0.1"; ok=1; }
  grep -q 'x = jnp.matmul(x, params\[36\]\[0\].T)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's classifier head is not the fp32 matmul (X3) — re-emit"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
