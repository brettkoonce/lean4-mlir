# EfficientNet-B0 / ImageNet-1k, VERIFIED path (Lean → StableHLO → XLA/PJRT), 4-GPU data-parallel.
#
#     scripts/supervise.sh enet-default-4gpu
#
# 4 replicas x bs 64 = global batch 256, 5,004 steps/epoch — the same global batch the reference
# trains at, so the wall-clock is directly comparable.
#
# ⭐ MEASURED 2026-08-05, this shape, residency + prefetch + 8 producers:
#
#       SHIM_WORKERS=1   2,061 ms/step        ← what §0.13 recorded, and it is a PRODUCER number
#       SHIM_WORKERS=4     346 ms/step
#       SHIM_WORKERS=8     203 ms/step        ← 10.2x, and within 4% of the 196 ms compute-only floor
#
#   16.9 min/epoch, so the reference's 80 epochs is ~22.6 h. §0.13's table said 225 h.
#
# ⭐⭐ RE-MEASURED 2026-08-30, 4x 4060 Ti, 40 steps, THIS conf's variant (emarmsdp64dropdo).
#   ⛔ THE ROW BELOW IS THE SECOND MEASUREMENT OF THE DAY. The first (357 f32 / 280 bf16) was
#   correct for the binary it ran, and that binary spent 150 ms/step drawing a dropout mask in
#   pure Lean — fixed the same day, see the second table.
#
#                              was          NOW      / 350 ep
#       emarmsdp64dropdo       357 ms      188 ms    91.5 h   (f32, WHAT THIS CONF NAMES)
#       emarmsdp64dropdobf16   281 ms      107 ms    52.1 h
#
# ⭐⭐ WHAT CHANGED: `F32.dropoutMask` went `@[extern]` C (`lean_f32_dropout_fill`), byte-identical.
#   This net is the ONLY one that pays that draw — `dropoutKeep` is set on the two EfficientNet
#   specs and nowhere else — and at global batch 256 it was 327,680 boxed-Float draws EVERY STEP,
#   measured at 150.07 ms against 71.6 ms for the whole bf16 graph. B0 was 2.63x its JAX reference
#   and is now 1.00x (8.92 min/ep against 8.88). Full account: planning/…parity.md §6.1.
#
#   ⚠ The 203 ms further up is a LIGHTER graph. EMA + drop-path + classifier dropout nearly double
#   B0's step, and the blueprint costed the light one for a while — verify against what the
#   artifact BAKES, never against a number carried forward.
#   ⛔ "SHIM_WORKERS=16 is WORSE than 8 (293 vs 280), so this net is not producer-bound" reached
#   the right conclusion from a premise that does not support it — 16 being worse is equally
#   consistent with oversubscription on top of a starved feed. The measurement that settles it is
#   LEAN_MLIR_BENCH_SYNTH=1, which deletes the producer: it recovered 36 ms of a 281 ms step then,
#   and 9 ms of a 107 ms step now. 8 stands, and the feed did NOT become binding at the shorter step.
# ⛔⛔ THE "~39 h" ABOVE IS WITHDRAWN. RE-MEASURED 2026-08-30 on the 4x 3060 box, THIS conf's
#   own variants, 600 steps with the probe clock started at 200 (runs/probe3060_prod.tsv):
#
#                                 median   MEAN    synth    350 ep
#       emarmsdp64dropdo      f32    170    190      163     96.1 h
#       emarmsdp64dropdobf16  bf16   103    192       96     97.1 h   <- NOT 52.1
#
#   bf16 compute really is 1.7x (163 -> 96 synth). End to end at SHIM_WORKERS=8 it buys NOTHING:
#   96.1 h -> 97.1 h. The feed, not the graph, sets the step.
#
#   ⭐ WHERE 107 CAME FROM: it is the MEDIAN, and the median is right. bf16's step is bimodal --
#   most steps land at the compute floor and a minority stall on an empty queue (p90 788 ms against
#   a 103 ms median). Wall-clock follows the MEAN. The f32 arm is only 14% starved, so there
#   median ~ mean (170 vs 190) and the method looks sound; it breaks on the ONE arm fast enough to
#   outrun the producers, which is the arm the recommendation was about.
#
#   ⭐ bf16 IS worth having -- but only together with more producers, and the two are not separable:
#       f32 @ w=8   96.1 h        bf16 @ w=8    97.1 h  (-1.0 h)
#                                 bf16 @ w=14   82.9 h  (+13.1 h)
#   ▶ So: flip to the bf16 twin AND raise SHIM_WORKERS to 14. Floor is 50.3 h, so ~33 h of feed
#   starvation survives w=14 and more producers will not take it -- at 14 they are near 21 of this
#   box's 24 threads, and 16 already regresses. The rest is the 602 KB/img fp32 wire.
#   ⚠ Measured on the 3060 box. The 188/107 row above is a 4060 Ti at 40 steps -- two differences.
#
# ▶ THE 6–10x "MYSTERY" WAS THE DATA PIPELINE, and this file is the fix. `LEAN_MLIR_BENCH_SYNTH=1`
#   (no shim at all) measures 196 ms/step with a byte-identical invoke — 188.7 ms real vs 188.5 ms
#   synth — so the entire 1,865 ms gap was the producer, and none of it was the net. EfficientNet's
#   device compute is 144.5 ms, CHEAPER than ResNet-34's 188.3.
#
#   The cause is the augmentation this net's own shim runs: AutoAugment + RandAugment, per image,
#   on CPU. R34 and MobileNetV2 do flip only, which is exactly the fast/slow split across the five
#   nets. ⚠ Nothing regressed to cause this — `imagenet_sweep.md`'s 310 ms was measured when every
#   net was hardcoded to R34's LIGHT shim (the bug fixed 2026-08-02). The pipeline became CORRECT
#   and the producer count did not follow.
#
# ⭐⭐⭐ RE-MEASURED 2026-09-12 ON THIS BOX — FOR SCHEDULING, EVERY TABLE ABOVE IS SUPERSEDED.
#   4x RTX 3060; exe rebuilt after 13d90e68 (mimalloc) and 4a0a2781 (tf.data determinism OFF);
#   jax/.lake/build in sync (`regen_jax_generated.sh box`: 78 ok); bf16, fed arm; 800 measured
#   steps (WARM=200 STEPS=1000, twice the 2026-09-11 window); per-step dumps beside the table in
#   runs/2026-09-12-enet-bf16-sweep/.
#
#       SHIM_WORKERS   median   mean   p90   steps > 500 ms
#            4           134     134    151      0 / 800      <- THIS CONF
#            6           136     135    153      0 / 800
#            8           137     136    153      0 / 800
#           10           137     137    154      0 / 800
#           12           139     140    161      1 / 800      <- first regression: oversubscribed
#       synth (no shim)   98      97     99      0 / 800      <- the compute floor
#
#   ⛔ The w=14 recommendation above was an artifact of the stale-shim bug: producers capped at
#   ~1.7 cores each needed 14 of them. With determinism off the curve is FLAT from 4 to 10 and
#   turns up at 12, so 4 is the cheapest point. ⚠ The feed still costs 37 ms of the 134 (28%) — and
#   that cost does not move with the count, so it is the producers' AGGREGATE CPU ceiling (the
#   2026-09-11 README measured ~21 cores whether there are 4, 6 or 8), not a worker-count knob.
#   At the 97 ms floor 350 epochs would be ~47 h; the recipe's CPU augmentation is the other ~18. ⭐ And the bimodal stall is GONE on this
#   box: mean = median, not one step over 500 ms in 3,200. The 2026-09-11 table's 279 mean over a
#   149 median was a 4x 4060 Ti on 32 threads, and it does not reproduce here.
#   ETA: 5,004 x 134 ms = 11.2 min/epoch of steps. MNv2's run on this box realised ~5% over its
#   probe for eval + checkpoint, so ~11.7 min/epoch x 350 ≈ 68 h. Confirm from consecutive
#   checkpoint mtimes once the run is going — the probe is a forecast, the checkpoint is a clock.

# ▶ §2c N1: this must equal the second dash-field of the filename. supervise.sh refuses
#   otherwise — the job namespace drifted from the recipe namespace once already.
RECIPE=default
DEVS="0,1,2,3"          # all four cards; the two PCIe-AER cards (old idx 1 and 5) were pulled 2026-09-08
EPOCHS=350              # efficientnetImagenetConfig.epochs — this net's own reference length.
# ETA re-measured 2026-09-12 on this box, runs/2026-09-12-enet-bf16-sweep (mean = median, 800 steps from step 200)
ETA="bf16 ~68 h (2.8 d) on 4x 3060 (134 ms/step mean at SHIM_WORKERS=4, no stall tail; +~5% eval/ckpt; 350 ep)"
                        # ⚠⚠ WAS 80, AND THAT WAS NOT AN ACCOUNTING SLIP. `EPOCHS` is the
                        # supervisor's STOP condition (`last_epoch >= EPOCHS` ⇒ COMPLETE), while
                        # the trainer anneals over the CONSTANT — which is 350
                        # (apps/imagenette/MainEfficientNetImagenet.lean:35). At 80 the run was
                        # killed a quarter of the way through its own LR schedule and reported
                        # ✅ COMPLETE. That is the same defect the book warns about for
                        # MobileNetV2: a truncated schedule is a different learning-rate curve
                        # end to end, not a shorter version of the same one.

CMD=(.lake/build/bin/efficientnet-imagenet-verified data)

# Box selection (copied from r50-2018-bf16-4gpu.conf, f3d89574): the repo venv's cuda12 plugin if
# it is there, else the 3060 box's cuda13.
#   * ares: the repo's pinned `.venv` with the xla_cuda12 plugin, no SHIM_PYTHON needed.
#   * the 3060 box: /home/skoonce/.venv-cuda with xla_cuda13 (driver 610.57.04 / CUDA 13.3), and
#     SHIM_PYTHON is REQUIRED because that box's .venv/bin/python3 is a WRAPPER that execs the
#     retired ROCm venv (lean4-jax/.venv), which no longer has a usable jax.
# ⛔ Until 2026-09-10 this conf hardcoded ares' xla_cuda12 path and carried no SHIM_PYTHON, so on
#   the 3060 box it died at step 0 with a plugin-load error. Fixing ffi/pjrt_ffi.c's default plugin
#   search list (it knows xla_cuda12 + xla_rocm7, not xla_cuda13) would delete PJRT_PLUGIN from
#   every conf and this block with it.
ARES_PLUG=".venv/lib/python3.12/site-packages/jax_plugins/xla_cuda12/xla_cuda_plugin.so"
if [ -f "$ARES_PLUG" ]; then
  BOX=ares;  BOX_PLUG="$ARES_PLUG"; BOX_PY=".venv/bin/python3"; BOX_SHIMPY=()
else
  BOX=3060;  BOX_PLUG="/home/skoonce/.venv-cuda/lib/python3.12/site-packages/jax_plugins/xla_cuda13/xla_cuda_plugin.so"
  BOX_PY="/home/skoonce/.venv-cuda/bin/python3"; BOX_SHIMPY=(SHIM_PYTHON="$BOX_PY")
fi
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⭐ bf16, NOT f32 — flipped 2026-09-12, for the reason mnv2-default-4gpu gives (44426027): the
  # JAX reference this run pairs against (§7's 77.15/93.30) is ITSELF bf16, so an f32 verified run
  # would differ from it in precision as well as in lowerer. Until now this conf shipped the f32 arm
  # with a header comment saying to flip it by hand — and a PRECHECK that validated the f32 render
  # and refused the header's own recommended worker count.
  # ⚠ The `dropdo` DP artifact, NOT `emarmsdp64`. Both exist and only this one carries the
  # regularisers the reference sets — dropPath AND classifier dropout. Picking the shorter name
  # trains a quieter net that still descends and still reports a number. ⚠ The name is not the
  # evidence: verify by listing what the artifact BAKES (handoff §0.5), never off the recipe matrix.
  LEAN_MLIR_VARIANT=emarmsdp64dropdobf16   # -> verified_mlir/efficientnetin_emarmsdp64dropdobf16_train_step.mlir
  LEAN_MLIR_BATCH=64                 # PER REPLICA
  # ⚠⚠ REQUIRED. §2d.3's device-resident parameters are OPT-IN and default OFF, and their absence is
  # SILENT — it is how a 16 h benchmark and a 26 h production run diverged unnoticed for a week.
  PJRT_FFI_RESIDENT=1
  # ⚠⚠ REQUIRED — one tf.data producer feeds this net ~10x too slowly (AutoAugment + RandAugment per
  # image, on CPU) and its absence is silent: a run that looks completely normal at 10x the wall
  # clock. ⭐ 4, MEASURED ON THIS BOX 2026-09-12 (header table): flat from 4 to 10 once determinism
  # is off, so the cheapest point on the plateau. ⛔ The 8 this line carried, and the header's 14,
  # were both set against producers capped by the stale-shim determinism bug.
  SHIM_WORKERS=4
)

# Thermal: this box has no fans on. Prefer temperature-driven resting over a fixed epoch schedule.
# ⚠ These steps are 10x denser than the ones the R34 job was tuned against, so the duty cycle is
# higher per unit wall-clock even though the run is shorter. Watch the first rest interval.
TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

# ⚠⚠ KEYED TO THE VARIANT. Checkpoints are `<slug>_<variant>_ckpt_xla.bin`, so this MUST move with
# LEAN_MLIR_VARIANT above. Left at the f32 name it tracks a file the bf16 run never writes, and
# supervise.sh reads epoch 0 forever — a run that never advances and never ends.
CKPT_EPOCH_FILE=".lake/build/efficientnetin_emarmsdp64dropdobf16_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_enet
# ⛔⛔ REWRITTEN 2026-09-12 on mnv2-default-4gpu's model (44426027). The old gate checked the f32
# render, asserted no variant string, tested ares' `.venv/bin/python3` (on the 3060 box a wrapper
# into a retired ROCm venv — it passed, and was the wrong python), and REQUIRED SHIM_WORKERS=8, so
# following the header's own advice to raise it made the job refuse to start. Every assertion below
# names the string it is defending.
precheck_enet() {
  local ok=0
  local exe=.lake/build/bin/efficientnet-imagenet-verified

  # Whichever box the block above selected must actually have its plugin and its python.
  echo "box=$BOX plugin=$BOX_PLUG python=$BOX_PY"
  [ -f "$BOX_PLUG" ] || { echo "⛔ PJRT_PLUGIN not found: $BOX_PLUG"; ok=1; }
  [ -x "$BOX_PY" ] || { echo "⛔ python for the shim missing: $BOX_PY"; ok=1; }

  # ⛔ THE ARM. Both halves — the env string AND the artifact it names — or the run trains the f32
  # twin for three days and produces a result §7 cannot pair against its bf16 reference.
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_VARIANT=emarmsdp64dropdobf16' || {
    echo "⛔ LEAN_MLIR_VARIANT is not emarmsdp64dropdobf16 — see the note in ENV_EXTRA."; ok=1; }
  [ -f verified_mlir/efficientnetin_emarmsdp64dropdobf16_train_step.mlir ] || {
    echo "⛔ missing the bf16 4-replica render (efficientnetin_emarmsdp64dropdobf16_train_step.mlir)"; ok=1; }
  # ⚠ And the checkpoint path has to have moved with it, or supervise.sh reads epoch 0 forever.
  case "$CKPT_EPOCH_FILE" in
    *efficientnetin_emarmsdp64dropdobf16_ckpt_xla.bin.epoch) ;;
    *) echo "⛔ CKPT_EPOCH_FILE does not match LEAN_MLIR_VARIANT: $CKPT_EPOCH_FILE"; ok=1 ;;
  esac

  # ⛔ THE BINARY. `lake build` of any other target does not relink this exe, and a stale one runs
  # whatever the trainer was when it was last linked — the MNv2 run's was 11 days old at launch and
  # carried the mimalloc leak. It must be newer than every source this run's behaviour rides on,
  # including the 2026-09-12 atomic-checkpoint + BN-companion change in VerifiedTrain.lean.
  [ -x "$exe" ] || { echo "⛔ $exe missing — lake build efficientnet-imagenet-verified"; ok=1; }
  local src
  for src in LeanMlir/VerifiedTrain.lean ffi/f32_helpers.c ffi/pjrt_ffi.c \
             apps/imagenette/MainEfficientNetImagenet.lean; do
    [ "$exe" -nt "$src" ] || {
      echo "⛔ $exe is OLDER than $src — lake build efficientnet-imagenet-verified"; ok=1; }
  done

  # ⛔ The shim this run streams is a GENERATED artifact in gitignored .lake/build, and a warm cache
  # serves a stale one silently — the stale runtime shims are what capped every producer at ~1.7
  # cores until 13d90e68. Instant: a diff, no Lean, no GPU.
  [ -f jax/.lake/build/generated_efficientnet_b0_imagenet_shim.py ] || {
    echo "⛔ missing EfficientNet's OWN tfds shim — scripts/gen_shims.sh"; ok=1; }
  scripts/regen_jax_generated.sh box >/dev/null 2>&1 || {
    echo "⛔ this box's jax/.lake/build artifacts are STALE vs committed jax/generated/:"
    scripts/regen_jax_generated.sh box 2>&1 | grep -E 'STALE|not built' | sed 's/^/   /'
    echo "   scripts/regen_jax_generated.sh sync, then re-run."; ok=1; }

  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "⛔ PJRT_FFI_RESIDENT=1 is missing from ENV_EXTRA — opt-in, defaults OFF, silent."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'SHIM_WORKERS=4' || {
    echo "⛔ SHIM_WORKERS=4 is missing — see the 2026-09-12 sweep in the header. Absent, ONE producer"
    echo "   feeds this net and the run is ~10x slower with nothing in the log to say so."; ok=1; }

  # ⚠ Checkpoints are per-VARIANT and outlive the artifact they trained on. An f32 or non-dropdo
  # blob is a different region layout; resuming one into this run is not a resume, it is corruption.
  local stray; stray="$(ls .lake/build/efficientnetin_*_ckpt_xla*.bin 2>/dev/null \
    | grep -v 'efficientnetin_emarmsdp64dropdobf16_ckpt_xla.bin$' || true)"
  if [ -n "$stray" ]; then
    echo "⚠ other efficientnetin checkpoints present — they must NOT be resumed into this run:"
    printf '   %s\n' $stray
  fi
  if [ -f "$CKPT_EPOCH_FILE" ]; then
    echo "⚠ $CKPT_EPOCH_FILE exists — this run will RESUME from it, not start fresh."
  fi

  # ⚠⚠ A stale GPU process fakes OOM and NCCL errors on this box.
  local busy; busy="$(nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader 2>/dev/null)"
  if [ -n "$busy" ]; then
    echo "⛔ GPUs are not idle — a leftover process will fake an OOM at step 0:"
    echo "$busy" | sed 's/^/   /'; ok=1
  fi

  return $ok
}
