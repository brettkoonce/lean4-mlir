# EfficientNet-B0 / ImageNet-1k, VERIFIED path (Lean → StableHLO → XLA/PJRT), 4-GPU data-parallel.
#
#     scripts/supervise.sh enet-default-4gpu
#
# 4 replicas x bs 64 = global batch 256, 5,004 steps/epoch — the same global batch the reference
# trains at, so the wall-clock is directly comparable.
#
# History, kept short: the 2026-08-05 and 2026-08-30 tables that used to stand here (2,061 ms/step on
# one producer, 188/107 ms on a 4060 Ti at 40 steps, the "flip to bf16 AND w=14" advice) were all
# measured under the stale-shim determinism bug or with the pure-Lean dropout draw that
# `lean_f32_dropout_fill` replaced, and are withdrawn. What survives from them: the feed, not the
# graph, set this net's step for most of its history, because its shim runs AutoAugment per image on
# CPU where R34 and MobileNetV2 do crop + flip only; and the bf16 median can hide a bimodal stall
# tail, so rank on the mean. The table below is the one to schedule from.
#
# ⭐⭐⭐ MEASURED 2026-09-12 ON THE 4x 3060 BOX — the scheduling table.
#   4x RTX 3060; exe rebuilt after 13d90e68 (mimalloc) and 4a0a2781 (tf.data determinism OFF);
#   jax/.lake/build in sync (`regen_jax_generated.sh box`: 78 ok); bf16, fed arm; 800 measured
#   steps (WARM=200 STEPS=1000, twice the 2026-09-11 window); per-step dumps beside the table in
#   runs/2026-09-12-enet-bf16-sweep/.
#
#       SHIM_WORKERS   median   mean   p90   steps > 500 ms
#            4           134     134    151      0 / 800      <- THIS CONF
#            6           136     135    153      0 / 800
#            8           137     136    153      0 / 800
#           10           137     137    154      0 / 800
#           12           139     140    161      1 / 800      <- first regression: oversubscribed
#       synth (no shim)   98      97     99      0 / 800      <- the compute floor
#
#   ⛔ The withdrawn w=14 recommendation was an artifact of the stale-shim bug: producers capped at
#   ~1.7 cores each needed 14 of them. With determinism off the curve is FLAT from 4 to 10 and
#   turns up at 12, so 4 is the cheapest point. ⚠ The feed still costs 37 ms of the 134 (28%) — and
#   that cost does not move with the count, so it is the producers' AGGREGATE CPU ceiling (the
#   2026-09-11 README measured ~21 cores whether there are 4, 6 or 8), not a worker-count knob.
#   At the 97 ms floor 350 epochs would be ~47 h; the recipe's CPU augmentation is the other ~18. ⭐ And the bimodal stall is GONE on this
#   box: mean = median, not one step over 500 ms in 3,200. The 2026-09-11 table's 279 mean over a
#   149 median was a 4x 4060 Ti on 32 threads, and it does not reproduce here.
#   ETA: 5,004 x 134 ms = 11.2 min/epoch of steps; ~5% for eval + checkpoint gave a 68 h forecast.
#   The run it budgeted (runs/2026-09-12-enet-verified-350ep) took 73 h 23 m, deliberate restarts
#   and rests included.
#   ⚠ PRE-SYNC-BN. Both numbers are the per-replica render's (213 all-reduces); the committed render
#   is sync-BN since cad811ac (360), and nothing has timed it. Re-probe owed before the next launch.

# ▶ §2c N1: this must equal the second dash-field of the filename. supervise.sh refuses
#   otherwise — the job namespace drifted from the recipe namespace once already.
RECIPE=default
DEVS="0,1,2,3"          # all four cards; the two PCIe-AER cards (old idx 1 and 5) were pulled 2026-09-08
EPOCHS=350              # efficientnetImagenetConfig.epochs — this net's own reference length.
# ⚠ RECIPE=default names the job, but 350 epochs is the JAX side's `full` tier (the `default` tier is
#   80 epochs); the two share one shim, so only the epoch count differs. Renaming the job is owed.
# ETA: the 2026-09-12 run on the PRE-sync-BN render (see the header); re-probe owed
ETA="bf16 ~80 h on 4x 4060 Ti: PROBED 2026-09-25 on the sync-BN render at 148 ms/step median (= mean, 741 s/epoch) + ~85 s/epoch eval/ckpt from the per-replica run, 350 ep; ~73 h on 4x 3060 (MEASURED end to end, per-replica render)"
                        # ⚠⚠ WAS 80, AND THAT WAS NOT AN ACCOUNTING SLIP. `EPOCHS` is the
                        # supervisor's STOP condition (`last_epoch >= EPOCHS` ⇒ COMPLETE), while
                        # the trainer anneals over the CONSTANT — which is 350
                        # (apps/imagenette/MainEfficientNetImagenet.lean:35). At 80 the run was
                        # killed a quarter of the way through its own LR schedule and reported
                        # ✅ COMPLETE. That is the same defect the book warns about for
                        # MobileNetV2: a truncated schedule is a different learning-rate curve
                        # end to end, not a shorter version of the same one.

CMD=(.lake/build/bin/efficientnet-imagenet-verified data)

# Box selection (copied from r50-2018-bf16-4gpu.conf, f3d89574): the repo venv's cuda12 plugin if
# it is there, else the 3060 box's cuda13.
#   * ares: the repo's pinned `.venv` with the xla_cuda12 plugin, no SHIM_PYTHON needed.
#   * the 3060 box: /home/skoonce/.venv-cuda with xla_cuda13 (driver 610.57.04 / CUDA 13.3), and
#     SHIM_PYTHON is REQUIRED because that box's .venv/bin/python3 is a WRAPPER that execs the
#     retired ROCm venv (lean4-jax/.venv), which no longer has a usable jax.
# ⛔ Until 2026-09-10 this conf hardcoded ares' xla_cuda12 path and carried no SHIM_PYTHON, so on
#   the 3060 box it died at step 0 with a plugin-load error. Fixing ffi/pjrt_ffi.c's default plugin
#   search list (it knows xla_cuda12 + xla_rocm7, not xla_cuda13) would delete PJRT_PLUGIN from
#   every conf and this block with it.
. "$(dirname "${BASH_SOURCE[0]}")/_box.sh"   # BOX, BOX_PLUG, BOX_PY, BOX_SHIMPY
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⭐ bf16, NOT f32 — flipped 2026-09-12, for the reason mnv2-default-4gpu gives (44426027): the
  # JAX reference this run pairs against (§7's 77.15/93.30) is ITSELF bf16, so an f32 verified run
  # would differ from it in precision as well as in lowerer. Until now this conf shipped the f32 arm
  # with a header comment saying to flip it by hand — and a PRECHECK that validated the f32 render
  # and refused the header's own recommended worker count.
  # ⚠ The `dropdo` DP artifact, NOT `emarmsdp64`. Both exist and only this one carries the
  # regularisers the reference sets — dropPath AND classifier dropout. Picking the shorter name
  # trains a quieter net that still descends and still reports a number. ⚠ The name is not the
  # evidence: verify by listing what the artifact BAKES (handoff §0.5), never off the recipe matrix.
  LEAN_MLIR_VARIANT=emarmsdp64dropdobf16   # -> verified_mlir/efficientnetin_emarmsdp64dropdobf16_train_step.mlir
  LEAN_MLIR_BATCH=64                 # PER REPLICA
  # ⚠⚠ REQUIRED. §2d.3's device-resident parameters are OPT-IN and default OFF, and their absence is
  # SILENT — it is how a 16 h benchmark and a 26 h production run diverged unnoticed for a week.
  PJRT_FFI_RESIDENT=1
  # ⚠⚠ REQUIRED — one tf.data producer feeds this net ~10x too slowly (AutoAugment per image, on
  # CPU) and its absence is silent: a run that looks completely normal at 10x the wall
  # clock. ⭐ 4, MEASURED ON THIS BOX 2026-09-12 (header table): flat from 4 to 10 once determinism
  # is off, so the cheapest point on the plateau. ⛔ The 8 this line carried, and the header's 14,
  # were both set against producers capped by the stale-shim determinism bug.
  SHIM_WORKERS=4
)

# Thermal: this box has no fans on. Prefer temperature-driven resting over a fixed epoch schedule.
# ⚠ These steps are 10x denser than the ones the R34 job was tuned against, so the duty cycle is
# higher per unit wall-clock even though the run is shorter. Watch the first rest interval.
TEMP_MAX=78
TEMP_RESUME=62
# ⭐ PLANNED RESTS ARE A FEED REFRESH, NOT A COOLDOWN (2026-09-14). The 2026-09-12 run held 690
#   s/epoch for 64 epochs (~13 h of producer uptime), then degraded to ~1,250 s by epoch 114: ONE of
#   the four shim producers fell behind and the round-robin feed ran at its pace (three blocked in
#   pipe_write in 20/20 samples, the fourth never). Not CPU (no thread > 18%), not disk (0 real
#   reads, 81% of shards cached), not swap, not throttling; producer RSS had grown 5 -> 7-11 GB.
#   A supervisor rest kills right after the epoch checkpoint and resumes with FRESH producers — the
#   resume path is lossless since 367bb28b. 125 is an early one to exercise this path; then every 40.
REST_EPOCHS="125 160 200 240 280 320"
REST_SECS=15

# ⚠⚠ KEYED TO THE VARIANT. Checkpoints are `<slug>_<variant>_ckpt_xla.bin`, so this MUST move with
# LEAN_MLIR_VARIANT above. Left at the f32 name it tracks a file the bf16 run never writes, and
# supervise.sh reads epoch 0 forever — a run that never advances and never ends.
CKPT_EPOCH_FILE=".lake/build/efficientnetin_emarmsdp64dropdobf16_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_enet
# The checks are scripts/lib/precheck.sh's, shared with the other ImageNet confs; each call names
# what it defends. ⛔ The gate before 2026-09-12 checked the f32 render, tested ares' python on the
# 3060 box, and REQUIRED the worker count the header advised against.
precheck_enet() {
  . scripts/lib/precheck.sh
  local ok=0
  pc_box || ok=1

  # ⛔ THE ARM — env string, artifact and checkpoint lineage. 360 all-reduces = the sync-BN render
  # (cad811ac); the finished 2026-09-12 run trained the per-replica one (213), so a relaunch is the
  # sync-BN run, not a repeat (planning/imagenet_parity.md H4). The `dropdo` artifact, not
  # `emarmsdp64`: only this one carries drop-path AND classifier dropout.
  pc_render efficientnetin emarmsdp64dropdobf16 4 360 || ok=1
  pc_ckpt efficientnetin emarmsdp64dropdobf16 || ok=1

  pc_exe efficientnet-imagenet-verified || ok=1
  pc_pjrt_so || ok=1

  # ⛔ The shim is a GENERATED artifact in gitignored .lake/build, and a warm cache serves a stale one
  # silently — the stale runtime shims are what capped every producer at ~1.7 cores until 13d90e68.
  pc_jax_box || ok=1
  pc_shim efficientnet_b0_imagenet || ok=1
  local shim=jax/.lake/build/generated_efficientnet_b0_imagenet_shim.py
  pc_aug_call "$shim" '_autoaugment(img)' "B0's recipe is AutoAugment" || ok=1
  pc_aug_no_call "$shim" '_randaugment(' "B0's recipe is AutoAugment only" || ok=1

  pc_env PJRT_FFI_RESIDENT=1 "opt-in, defaults OFF, silent" || ok=1
  pc_env SHIM_WORKERS=4 "see the 2026-09-12 sweep in the header; absent, ONE producer feeds this net ~10x slower with nothing in the log" || ok=1
  pc_gpu_idle || ok=1
  return $ok
}
