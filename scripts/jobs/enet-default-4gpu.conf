# EfficientNet-B0 / ImageNet-1k, VERIFIED path (Lean → StableHLO → XLA/PJRT), 4-GPU data-parallel.
#
#     scripts/supervise.sh enet-default-4gpu
#
# 4 replicas x bs 64 = global batch 256, 5,004 steps/epoch — the same global batch the reference
# trains at, so the wall-clock is directly comparable.
#
# ⭐ MEASURED 2026-08-05, this shape, residency + prefetch + 8 producers:
#
#       SHIM_WORKERS=1   2,061 ms/step        ← what §0.13 recorded, and it is a PRODUCER number
#       SHIM_WORKERS=4     346 ms/step
#       SHIM_WORKERS=8     203 ms/step        ← 10.2x, and within 4% of the 196 ms compute-only floor
#
#   16.9 min/epoch, so the reference's 80 epochs is ~22.6 h. §0.13's table said 225 h.
#
# ⭐⭐ RE-MEASURED 2026-08-30, 4x 4060 Ti, 40 steps, THIS conf's variant (emarmsdp64dropdo).
#   ⛔ THE ROW BELOW IS THE SECOND MEASUREMENT OF THE DAY. The first (357 f32 / 280 bf16) was
#   correct for the binary it ran, and that binary spent 150 ms/step drawing a dropout mask in
#   pure Lean — fixed the same day, see the second table.
#
#                              was          NOW      / 350 ep
#       emarmsdp64dropdo       357 ms      188 ms    91.5 h   (f32, WHAT THIS CONF NAMES)
#       emarmsdp64dropdobf16   281 ms      107 ms    52.1 h
#
# ⭐⭐ WHAT CHANGED: `F32.dropoutMask` went `@[extern]` C (`lean_f32_dropout_fill`), byte-identical.
#   This net is the ONLY one that pays that draw — `dropoutKeep` is set on the two EfficientNet
#   specs and nowhere else — and at global batch 256 it was 327,680 boxed-Float draws EVERY STEP,
#   measured at 150.07 ms against 71.6 ms for the whole bf16 graph. B0 was 2.63x its JAX reference
#   and is now 1.00x (8.92 min/ep against 8.88). Full account: planning/…parity.md §6.1.
#
#   ⚠ The 203 ms further up is a LIGHTER graph. EMA + drop-path + classifier dropout nearly double
#   B0's step, and the blueprint costed the light one for a while — verify against what the
#   artifact BAKES, never against a number carried forward.
#   ⛔ "SHIM_WORKERS=16 is WORSE than 8 (293 vs 280), so this net is not producer-bound" reached
#   the right conclusion from a premise that does not support it — 16 being worse is equally
#   consistent with oversubscription on top of a starved feed. The measurement that settles it is
#   LEAN_MLIR_BENCH_SYNTH=1, which deletes the producer: it recovered 36 ms of a 281 ms step then,
#   and 9 ms of a 107 ms step now. 8 stands, and the feed did NOT become binding at the shorter step.
# ⛔⛔ THE "~39 h" ABOVE IS WITHDRAWN. RE-MEASURED 2026-08-30 on the 4x 3060 box, THIS conf's
#   own variants, 600 steps with the probe clock started at 200 (runs/probe3060_prod.tsv):
#
#                                 median   MEAN    synth    350 ep
#       emarmsdp64dropdo      f32    170    190      163     96.1 h
#       emarmsdp64dropdobf16  bf16   103    192       96     97.1 h   <- NOT 52.1
#
#   bf16 compute really is 1.7x (163 -> 96 synth). End to end at SHIM_WORKERS=8 it buys NOTHING:
#   96.1 h -> 97.1 h. The feed, not the graph, sets the step.
#
#   ⭐ WHERE 107 CAME FROM: it is the MEDIAN, and the median is right. bf16's step is bimodal --
#   most steps land at the compute floor and a minority stall on an empty queue (p90 788 ms against
#   a 103 ms median). Wall-clock follows the MEAN. The f32 arm is only 14% starved, so there
#   median ~ mean (170 vs 190) and the method looks sound; it breaks on the ONE arm fast enough to
#   outrun the producers, which is the arm the recommendation was about.
#
#   ⭐ bf16 IS worth having -- but only together with more producers, and the two are not separable:
#       f32 @ w=8   96.1 h        bf16 @ w=8    97.1 h  (-1.0 h)
#                                 bf16 @ w=14   82.9 h  (+13.1 h)
#   ▶ So: flip to the bf16 twin AND raise SHIM_WORKERS to 14. Floor is 50.3 h, so ~33 h of feed
#   starvation survives w=14 and more producers will not take it -- at 14 they are near 21 of this
#   box's 24 threads, and 16 already regresses. The rest is the 602 KB/img fp32 wire.
#   ⚠ Measured on the 3060 box. The 188/107 row above is a 4060 Ti at 40 steps -- two differences.
#
# ▶ THE 6–10x "MYSTERY" WAS THE DATA PIPELINE, and this file is the fix. `LEAN_MLIR_BENCH_SYNTH=1`
#   (no shim at all) measures 196 ms/step with a byte-identical invoke — 188.7 ms real vs 188.5 ms
#   synth — so the entire 1,865 ms gap was the producer, and none of it was the net. EfficientNet's
#   device compute is 144.5 ms, CHEAPER than ResNet-34's 188.3.
#
#   The cause is the augmentation this net's own shim runs: AutoAugment + RandAugment, per image,
#   on CPU. R34 and MobileNetV2 do flip only, which is exactly the fast/slow split across the five
#   nets. ⚠ Nothing regressed to cause this — `imagenet_sweep.md`'s 310 ms was measured when every
#   net was hardcoded to R34's LIGHT shim (the bug fixed 2026-08-02). The pipeline became CORRECT
#   and the producer count did not follow.

# ▶ §2c N1: this must equal the second dash-field of the filename. supervise.sh refuses
#   otherwise — the job namespace drifted from the recipe namespace once already.
RECIPE=default
DEVS="0,2,3,4"          # the AER-clean four; idx 1 and 5 are excluded (reference_ares_pcie_aer)
EPOCHS=350              # efficientnetImagenetConfig.epochs — this net's own reference length.
                        # ⚠⚠ WAS 80, AND THAT WAS NOT AN ACCOUNTING SLIP. `EPOCHS` is the
                        # supervisor's STOP condition (`last_epoch >= EPOCHS` ⇒ COMPLETE), while
                        # the trainer anneals over the CONSTANT — which is 350
                        # (apps/imagenette/MainEfficientNetImagenet.lean:35). At 80 the run was
                        # killed a quarter of the way through its own LR schedule and reported
                        # ✅ COMPLETE. That is the same defect the book warns about for
                        # MobileNetV2: a truncated schedule is a different learning-rate curve
                        # end to end, not a shorter version of the same one.

CMD=(.lake/build/bin/efficientnet-imagenet-verified data)

ENV_EXTRA=(
  PJRT_PLUGIN=".venv/lib/python3.12/site-packages/jax_plugins/xla_cuda12/xla_cuda_plugin.so"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⚠ The `dropdo` DP artifact, NOT `emarmsdp64`. Both exist and only this one carries the
  # regularisers the reference sets — dropPath AND classifier dropout. Picking the shorter name
  # trains a quieter net that still descends and still reports a number. ⚠ The name is not the
  # evidence: verify by listing what the artifact BAKES (handoff §0.5), never off the recipe matrix.
  LEAN_MLIR_VARIANT=emarmsdp64dropdo
  LEAN_MLIR_BATCH=64                 # PER REPLICA
  # ⚠⚠ REQUIRED. §2d.3's device-resident parameters are OPT-IN and default OFF, and their absence is
  # SILENT — it is how a 16 h benchmark and a 26 h production run diverged unnoticed for a week.
  PJRT_FFI_RESIDENT=1
  # ⚠⚠ REQUIRED, AND THIS ONE IS WORTH 10x ON THIS NET. One tf.data producer saturates ~3 of this
  # box's 32 cores and stays there — `num_parallel_calls=AUTOTUNE` does NOT scale out — so the fix
  # is process count, not kernel speed. 8 is measured; 4 leaves 143 ms/step on the table. Its
  # failure mode is the same as residency's: an absent line, a run that looks completely normal,
  # and 10x the wall-clock.
  SHIM_WORKERS=8
)

# Thermal: this box has no fans on. Prefer temperature-driven resting over a fixed epoch schedule.
# ⚠ These steps are 10x denser than the ones the R34 job was tuned against, so the duty cycle is
# higher per unit wall-clock even though the run is shorter. Watch the first rest interval.
TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

CKPT_EPOCH_FILE=".lake/build/efficientnetin_emarmsdp64dropdo_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_enet
precheck_enet() {
  [ -x .venv/bin/python3 ] || { echo "missing .venv/bin/python3 (the pinned env)"; return 1; }
  [ -f verified_mlir/efficientnetin_emarmsdp64dropdo_train_step.mlir ] || {
    echo "missing the 4-replica regularised render — build the EfficientNet renderer"; return 1; }
  [ -f jax/.lake/build/generated_efficientnet_b0_imagenet_shim.py ] || {
    echo "missing EfficientNet's OWN tfds shim — scripts/gen_shims.sh (generates all five)"; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "PJRT_FFI_RESIDENT=1 is missing from ENV_EXTRA — residency is opt-in and defaults OFF,"
    echo "and nothing in the run's output says which path it took."; return 1; }
  # ⚠ The knob this job exists to carry. Absent, the run is 2,061 ms/step instead of 203 and reads
  # exactly like a correct one — 225 h instead of 22.6 h, discovered on day three.
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'SHIM_WORKERS=8' || {
    echo "SHIM_WORKERS=8 is missing from ENV_EXTRA. One producer feeds this net at 137 img/s"
    echo "against the ~1,260 img/s its compute wants: 2,061 ms/step instead of 203, i.e."
    echo "225 h instead of 22.6 h, with NOTHING in the log to say so."; return 1; }
  return 0
}
