# r34-default-bf16-4gpu.conf — ResNet-34, the 2018 recipe, VERIFIED path, bf16, 90 epochs.
#
#     RUNDIR=runs/<date>-r34-bf16-90ep scripts/supervise.sh r34-default-bf16-4gpu
#
# ⛔ Launch it under `systemd-run --user`, never a bare `&` — the agent harness SIGKILLs background
# processes under memory pressure (it killed two watchers of this very run). RUNDIR in-repo from
# before the first step: R34's phase-2 master log was lost to a power cut when it lived under /tmp.
#
# ⭐ R34's counterpart of `r50-2018-bf16-4gpu`, written 2026-09-16 — the conf
# planning/shim_loader_health_and_resume_tests.md §5 said did not exist and needed writing.
# ⛔ NAMED `default`, NOT `2018`, and that is forced: §2c N1 makes RECIPE equal the second
#   dash-field of the filename, R34's recipe slug is `default` (its ONLY recipe — there is no
#   generated_resnet34_imagenet_2018_shim.py), and supervise.sh refuses a mismatch. Same shape as
#   `vit-default-emabf16-4gpu.conf`. ⚠ Do NOT add LEAN_MLIR_RECIPE here: only R50's driver reads it,
#   and setting it to anything but `default` makes supervise.sh refuse.
#
# ⛔⛔ THIS FILE DOES NOT REPLACE `r34-default-4gpu.conf`, AND THAT IS THE POINT.
#   That conf stays fp32 (`momdp64`) because it is the lakefile's Ch. 5 ImageNet row
#   (lakefile.lean, `imagenetRows`) and the reproduction path for the book's PUBLISHED verified
#   number — §5's 74.14 / 91.86, fp32, 4x 4060 Ti. Flipping it in place would have left that row
#   with no committed conf that reproduces it, silently. This is the R50/ViT pair convention:
#     r50-2018-4gpu.conf  / r50-2018-bf16-4gpu.conf
#     vit-default-4gpu.conf / vit-default-emabf16-4gpu.conf
#     r34-default-4gpu.conf / r34-default-bf16-4gpu.conf     <- this file
#
# ⚠⚠ WHAT A RESULT FROM THIS CONF MAY AND MAY NOT CLAIM. §5 already reports a phase-4 verified R34
# ImageNet pair, and it is a dead heat:
#
#       reference (JAX)   bf16   4x 4060 Ti   ~8.8 min/ep    ~14.8 h   74.16 / 91.92
#       verified (PJRT)   fp32   4x 4060 Ti   ~24.7 min/ep   ~37.1 h   74.14 / 91.86   (-0.02)
#
#   A bf16 verified run on the 3060 box moves TWO AXES against that verified row — PRECISION
#   (fp32 -> bf16) and BOX (4x 4060 Ti -> 4x 3060). It therefore CANNOT replace that row and must
#   not be tabulated beside it as though it could. What it honestly is: a SECOND verified datapoint,
#   bf16, on this box, against the SAME reference number (74.16 / 91.92).
#
# ⭐⭐ AND THE ACCURACY IS NOT WHY THIS RUN EXISTS. It is the first real test of the staggered shim
#   loader respawn (63b21d84) — built, inert-when-off, smoke-tested, and never once run against the
#   fault it was written for (shim_loader_health_and_resume_tests.md §1, §3b, which still ends at
#   "unproven against the actual slowdown"). R34's shim is FLIP-ONLY — no AutoAugment, no
#   RandAugment — where EfficientNet's is the heaviest in the fleet. If a loader still degrades
#   here, the fault is not augmentation weight, and that finding is worth more than the top-1.
#
# ▶ THE EXPERIMENT IS ARM A, AND THE DEFAULTS BELOW IMPLEMENT IT:
#     * LEAN_MLIR_SHIM_RESPAWN_EPOCHS is NOT set -> respawn OFF (default 0, announced in the
#       banner). The mitigation HIDES the fault it fixes, so the first ~40 epochs run bare, with
#       loader_rss.tsv logging, to find out whether the fault reproduces on a flip-only shim AT ALL.
#     * REST_EPOCHS="" and it MUST STAY EMPTY for those epochs — see the note on it below.
#     * Then restart with LEAN_MLIR_SHIM_RESPAWN_EPOCHS=E and watch the pace return. That is the A/B
#       the mitigation has never had, and the resume path is lossless since 367bb28b, so the restart
#       is free.
#   Arm B (respawn ON from step 0 at E=10, so each of 4 loaders lives ~4E=40 epochs ~ 9 h) is safer
#   for the NUMBER and proves NOTHING about the fault. Choose before launching, not after.
#
# ⚠ Loader LIFETIME is the quantity that matters, not epoch count: on EfficientNet the divergence
#   appeared anywhere from 5.6 h to NEVER across five generations. One clean run is not evidence.
# ⭐ Thermal rests are not a confound here: TEMP_MAX=78 fired ZERO times across the 350-epoch
#   EfficientNet run on this box (3 days; master.log has no 🌡 line). Only planned rests ever fired.
#
# ⭐⭐⭐ THROUGHPUT, MEASURED ON THIS BOX 2026-09-16 — runs/2026-09-16-r34-bf16-sweep/.
#   4x RTX 3060; exe rebuilt after 63b21d84; jax/.lake/build in sync (`regen_jax_generated.sh box`:
#   78 ok); bf16, fed arm; 800 measured steps (WARM=200 STEPS=1000); 5,004 steps/epoch.
#
#       SHIM_WORKERS   median   mean    min    p90    starvation (median - synth median)
#            4            163     163    145    172         19 ms  (12%)   <- THIS CONF
#            6            166     166    146    175         22 ms
#            8            166     166    143    180         22 ms          <- what r34-default carries
#           10            166     166    149    175         22 ms
#           12            166     166    149    176         22 ms
#       synth (no shim)   144     143    141    144          —             <- the compute floor
#
#   ⭐ FLAT from 6 to 12, and 4 is the cheapest point — the same shape EfficientNet showed once
#   determinism was off, and mean = median on every row, so there is no stall tail on this box.
#   ⭐⭐ AND THE STARVATION IS SMALL: the feed costs 19 ms of the 163 (12%), against 37 ms of 134
#   (28%) on EfficientNet. That is exactly what a FLIP-ONLY shim should look like beside one doing
#   AutoAugment + RandAugment per image — and it is why this net is the honest test of whether the
#   loader fault is augmentation-weight-dependent. There is very little feed here to degrade.
#   ETA: 5,004 x 163 ms = 13.6 min/epoch of steps. MNv2 and B0 both realised ~5% over their probe
#   on this box for eval + checkpoint, so ~14.3 min/epoch x 90 ~ 21.4 h. Confirm from consecutive
#   checkpoint mtimes once the run is going — the probe is a forecast, the checkpoint is a clock.
#
# ⛔ The SHIM_WORKERS=8 that `r34-default-4gpu.conf` carries predates BOTH feed fixes (13d90e68
#   mimalloc, 4a0a2781 tf.data determinism OFF) — exactly as EfficientNet's 8 did before its
#   re-probe moved it to 4 and halved its ETA error.
#
# ▶ §2c N1: RECIPE must equal the second dash-field of the filename. supervise.sh refuses
#   otherwise — the job namespace drifted from the recipe namespace once already.
RECIPE=default
DEVS="0,1,2,3"          # all four cards; the two PCIe-AER cards (old idx 1 and 5) were pulled 2026-09-08
EPOCHS="${EPOCHS:-90}"  # the paper schedule
# ⚠⚠ `LEAN_MLIR_EPOCHS` SETS the schedule; `LEAN_MLIR_MAX_EPOCHS` only CAPS it (`min n cfg.epochs`).
# `totalSteps := cfg.epochs * nb / accK` is what the cosine anneals over, so the former re-shapes the
# schedule and the latter would silently keep annealing over the wrong length. Set explicitly below
# even though 90 is also the default, because the PRECHECK can then verify it.
# ⚠ Do NOT read the supervisor's EPOCHS as the config's: apps/imagenette/MainResnet34Imagenet.lean
# sets `epochs := 90`, and an `EPOCHS=30` launch of this file still anneals over the 90-epoch cosine.
# ETA measured on this box 2026-09-16, runs/2026-09-16-r34-bf16-sweep (mean = median, 800 steps)
ETA="bf16 ~21.4 h on 4x 3060 (163 ms/step mean at SHIM_WORKERS=4, no stall tail; +~5% eval/ckpt; 90 ep)"
CMD=(.lake/build/bin/resnet34-imagenet-verified data)
# Box selection (copied from r50-2018-bf16-4gpu.conf, f3d89574): the repo venv's cuda12 plugin if
# it is there, else the 3060 box's cuda13.
#   * ares: the repo's pinned `.venv` with the xla_cuda12 plugin, no SHIM_PYTHON needed.
#   * the 3060 box: /home/skoonce/.venv-cuda with xla_cuda13 (driver 610.57.04 / CUDA 13.3), and
#     SHIM_PYTHON is REQUIRED because that box's .venv/bin/python3 is a WRAPPER that execs the
#     retired ROCm venv (lean4-jax/.venv), which no longer has a usable jax.
# ⛔ Fixing ffi/pjrt_ffi.c's default plugin search list (it knows xla_cuda12 + xla_rocm7, not
#   xla_cuda13) would delete PJRT_PLUGIN from every conf and this block with it.
. "$(dirname "${BASH_SOURCE[0]}")/_box.sh"   # BOX, BOX_PLUG, BOX_PY, BOX_SHIMPY
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⭐ bf16. The reference this run pairs against (§5's 74.16 / 91.92) is ITSELF bf16.
  # ⚠ The name is not the evidence — verify what the artifact BAKES, never off the recipe matrix.
  LEAN_MLIR_VARIANT=momdp64bf16      # -> verified_mlir/resnet34in_momdp64bf16_train_step.mlir
  LEAN_MLIR_BATCH=64                 # PER REPLICA -> global 256, the reference batch
  LEAN_MLIR_EPOCHS=90                # SETS the cosine (see above)
  LEAN_MLIR_BASE_LR_U=100000         # 0.1, the reference rate; the 0.001 default is AdamW's
  # ⚠⚠ REQUIRED. §2d.3's device-resident parameters are OPT-IN and default OFF, and their absence is
  # SILENT — the OFF path prints nothing at all. 596 vs 386 ms/step on this shape.
  PJRT_FFI_RESIDENT=1
  # ⭐ 4, MEASURED ON THIS BOX 2026-09-16 (header table). ⚠ Absent entirely, ONE producer feeds the
  # net and the run is multiples slower with NOTHING in the log to say so.
  SHIM_WORKERS=4
  # ⛔ LEAN_MLIR_SHIM_RESPAWN_EPOCHS is DELIBERATELY ABSENT (default 0 = off, and the banner says
  # so). That is Arm A. Setting it here turns the run into Arm B and forfeits the experiment.
)

# Thermal: TEMP_MAX governs, which adapts to ambient better than a fixed schedule. ⭐ Measured on
# this box it is inert — zero thermal cooldowns across EfficientNet's 350 epochs / 3 days.
TEMP_MAX=78
TEMP_RESUME=62
# ⛔⛔ MUST STAY EMPTY FOR ARM A. `REST_EPOCHS` is not a cooldown, it is a FEED REFRESH (75a477b1):
# the supervisor kills right after the epoch checkpoint and resumes with FRESH loaders. Scheduling
# one inside the observation window silently fixes the fault this run exists to observe — the log
# would show a healthy pace and nobody would know why. Add rests only AFTER the Arm A window, or in
# Arm B where the respawn already owns loader lifetime.
REST_EPOCHS=""
REST_SECS=15

# ⚠⚠ KEYED TO THE VARIANT. Checkpoints are `<slug>_<variant>_ckpt_xla.bin`, so this MUST move with
# LEAN_MLIR_VARIANT above. Left at the f32 name it tracks a file the bf16 run never writes, and
# supervise.sh reads epoch 0 forever — a run that never advances and never ends.
CKPT_EPOCH_FILE=".lake/build/resnet34in_momdp64bf16_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_r34_bf16_90
# ⛔⛔ Built on enet-default-4gpu's gate (13d9b460), which was itself MNv2's (44426027), plus the two
# assertions worth keeping from `r34-default-4gpu.conf` — the exe-vs-render freshness check and the
# epoch-30 schedule-fusion guard — re-pointed at the bf16 names. ⚠ Note what the OLD R34 gate got
# wrong and is NOT copied here: it tested `.venv/bin/python3`, which on this box is a WRAPPER into a
# retired ROCm venv, so it passed while being the wrong interpreter. Every assertion names what it
# defends.
precheck_r34_bf16_90() {
  local ok=0
  local exe=.lake/build/bin/resnet34-imagenet-verified
  local render=verified_mlir/resnet34in_momdp64bf16_train_step.mlir

  # Whichever box the block above selected must actually have its plugin and its python.
  echo "box=$BOX plugin=$BOX_PLUG python=$BOX_PY"
  [ -f "$BOX_PLUG" ] || { echo "⛔ PJRT_PLUGIN not found: $BOX_PLUG"; ok=1; }
  [ -x "$BOX_PY" ] || { echo "⛔ python for the shim missing: $BOX_PY"; ok=1; }

  # ⛔ THE ARM. Both halves — the env string AND the artifact it names — or the run trains the f32
  # twin for a day and produces a number that pairs against neither §5 row.
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_VARIANT=momdp64bf16' || {
    echo "⛔ LEAN_MLIR_VARIANT is not momdp64bf16 — see the note in ENV_EXTRA."; ok=1; }
  [ -f "$render" ] || {
    echo "⛔ missing the bf16 4-replica render ($render)"
    echo "   build LeanMlir.Proofs.Codegen.ResNet34RenderB"; ok=1; }
  # 4 replicas is baked into the artifact; a mismatch fails at step 0 with a shape error.
  grep -q 'DATA-PARALLEL over 4 replicas' "$render" 2>/dev/null || {
    echo "⛔ $render is not a 4-replica render — re-render or change PJRT_REPLICAS."; ok=1; }
  # ⚠ And the checkpoint path has to have moved with it, or supervise.sh reads epoch 0 forever.
  case "$CKPT_EPOCH_FILE" in
    *resnet34in_momdp64bf16_ckpt_xla.bin.epoch) ;;
    *) echo "⛔ CKPT_EPOCH_FILE does not match LEAN_MLIR_VARIANT: $CKPT_EPOCH_FILE"; ok=1 ;;
  esac

  # ⛔ THE BINARY. `lake build` of ANY OTHER TARGET does not relink this exe, so a stale one runs
  # whatever the trainer was when it was last linked. It must be newer than every source this run's
  # behaviour rides on — including VerifiedTrain.lean, which carries the 2026-09-16 shim respawn
  # (63b21d84) this run exists to test. A binary older than that has no respawn to exercise.
  [ -x "$exe" ] || { echo "⛔ $exe missing — lake build resnet34-imagenet-verified"; ok=1; }
  local src
  for src in LeanMlir/VerifiedTrain.lean ffi/f32_helpers.c ffi/pjrt_ffi.c \
             apps/imagenette/MainResnet34Imagenet.lean; do
    [ "$exe" -nt "$src" ] || {
      echo "⛔ $exe is OLDER than $src — lake build resnet34-imagenet-verified"; ok=1; }
  done
  # ⭐ KEPT FROM THE OLD GATE, re-pointed. A pre-2026-08-14 binary predates C3 (timm's validation
  # protocol, f8cd3a9) and C4 (the 50,000 denominator, ccca380) and would silently report a number
  # measured under the OLD protocol, with nothing in the log to say so.
  if [ -x "$exe" ] && [ -f "$render" ] && [ "$exe" -ot "$render" ]; then
    echo "⛔ $exe is OLDER than the render it must execute — rebuild it."; ok=1
  fi

  # ⛔ The shim this run streams is a GENERATED artifact in gitignored .lake/build, and a warm cache
  # serves a stale one silently — stale runtime shims are what capped every producer at ~1.7 cores
  # until 13d90e68. Instant: a diff, no Lean, no GPU.
  [ -f jax/.lake/build/generated_resnet34_imagenet_shim.py ] || {
    echo "⛔ missing R34's OWN tfds shim — scripts/gen_shims.sh"; ok=1; }
  # ⭐ KEPT: existence is not freshness. C3's antialiased resampler must be IN it.
  grep -q 'antialias' jax/.lake/build/generated_resnet34_imagenet_shim.py 2>/dev/null || {
    echo "⛔ the R34 shim has no antialiased resize — it predates C3. Run scripts/gen_shims.sh."; ok=1; }
  scripts/regen_jax_generated.sh box >/dev/null 2>&1 || {
    echo "⛔ this box's jax/.lake/build artifacts are STALE vs committed jax/generated/:"
    scripts/regen_jax_generated.sh box 2>&1 | grep -E 'STALE|not built' | sed 's/^/   /'
    echo "   scripts/regen_jax_generated.sh sync, then re-run."; ok=1; }

  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "⛔ PJRT_FFI_RESIDENT=1 is missing — residency is opt-in, defaults OFF, and silently"
    echo "   halves throughput (596 vs 386 ms/step)."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_EPOCHS=90' || {
    echo "⛔ LEAN_MLIR_EPOCHS=90 missing — MAX_EPOCHS only CAPS, it cannot SET the 90-epoch cosine."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_BASE_LR_U=100000' || {
    echo "⛔ LEAN_MLIR_BASE_LR_U=100000 (lr 0.1) missing — the driver would use AdamW's 0.001."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'SHIM_WORKERS=4' || {
    echo "⛔ SHIM_WORKERS=4 is missing — see the 2026-09-16 sweep in the header. Absent, ONE"
    echo "   producer feeds this net and the run is multiples slower with nothing to say so."; ok=1; }

  # ⛔ ARM A'S INTEGRITY. Both of these SILENTLY refresh the loaders and would hide the degradation
  # this run exists to observe. Warnings, not failures: Arm B is a legitimate later choice.
  if printf '%s\n' "${ENV_EXTRA[@]}" | grep -q 'LEAN_MLIR_SHIM_RESPAWN_EPOCHS'; then
    echo "⚠ LEAN_MLIR_SHIM_RESPAWN_EPOCHS is set in ENV_EXTRA — this is ARM B, not Arm A."
    echo "   The respawn hides the fault it fixes; Arm A wants the first ~40 epochs bare."
  fi
  if [ -n "${REST_EPOCHS// /}" ]; then
    echo "⚠ REST_EPOCHS is non-empty ($REST_EPOCHS) — a planned rest is a FEED REFRESH, not a"
    echo "   cooldown. Any rest inside the observation window destroys Arm A's evidence."
  fi

  # ⚠⚠ SCHEDULE FUSION — KEPT FROM THE OLD GATE, re-pointed at the bf16 checkpoint.
  # MainResnet34Imagenet.lean warns: resuming a 30-epoch checkpoint into a 90-epoch cosine silently
  # fuses two learning-rate curves, and the supervisor's resume logic cannot tell the two apart.
  if [ -f "$CKPT_EPOCH_FILE" ]; then
    local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"; n="${n:-0}"
    if [ "$n" -eq 30 ]; then
      echo "⛔ $CKPT_EPOCH_FILE says epoch 30 — that is an EPOCHS=30 run's checkpoint."
      echo "   Resuming it into the 90-epoch cosine fuses two LR curves. Move it aside first."
      ok=1
    fi
    echo "⚠ $CKPT_EPOCH_FILE exists (epoch $n) — this run will RESUME from it, not start fresh."
  fi

  # ⚠ Checkpoints are per-VARIANT and outlive the artifact they trained on. An f32 or mom256 blob is
  # a different region layout; resuming one into this run is not a resume, it is corruption.
  local stray; stray="$(ls .lake/build/resnet34in_*_ckpt_xla*.bin 2>/dev/null \
    | grep -v 'resnet34in_momdp64bf16_ckpt_xla.bin$' || true)"
  if [ -n "$stray" ]; then
    echo "⚠ other resnet34in checkpoints present — they must NOT be resumed into this run:"
    printf '   %s\n' $stray
  fi

  # ⚠⚠ A stale GPU process fakes OOM and NCCL errors on this box.
  local busy; busy="$(nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader 2>/dev/null)"
  if [ -n "$busy" ]; then
    echo "⛔ GPUs are not idle — a leftover process will fake an OOM at step 0:"
    echo "$busy" | sed 's/^/   /'; ok=1
  fi

  return $ok
}
