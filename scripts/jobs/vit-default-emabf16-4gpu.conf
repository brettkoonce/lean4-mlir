# vit-default-emabf16-4gpu.conf — ViT-Tiny (DeiT-Ti) / ImageNet-1k, VERIFIED path, 300 epochs.
#
#     scripts/supervise.sh vit-default-emabf16-4gpu
#
# The phase-4 peer of the phase-2 JAX reference that landed 2026-08-29 at 72.31 / 91.12
# (34.22 h, one attempt). §9.6's phase-4 subsection ends on a bare
# `[TODO: run vit-imagenet-verified.]`; this job is what fills it, and it gives ViT the
# {reference, verified} pair Chapter 5 already has for ResNet-50.
#
# ⭐ THE PAIR IS ONE-VARIABLE IN RECIPE AS OF `68842de5`, AND IT WAS NOT BEFORE. Three axes
# differed and all three closed that day:
#     weight init   Glorot Linears (3.6x wide at d=192), CLS 5x wide  ->  vitInit, sigma 0.02
#     EMA           no artifact combined it with wx+clip+drop         ->  emadp...bf16 exists
#     precision     fp32                                              ->  bf16, as the reference
# Everything else already matched and was checked individually: 128/replica x 4 = global 512
# and 2,502 steps/epoch; 300 epochs, warmup 5, cosine; AdamW lr 5e-4, wd 0.05, wdExclude,
# clip 1.0; label smoothing 0.1 (BAKED into the render); dropPath 0.1 with 24 independent
# masks; soft targets via %onehot: tensor<128x1000xf32>; and the data side is the SAME shim
# the reference's recipe emits.
#
# ⚠ THE NAME. The handoff (planning/vit_verified_run.md §1) calls this job `vit-verified-4gpu`,
# which would put `verified` in the slot §2c N1 reserves for the RECIPE. `verified` is a PATH,
# not a recipe — R50's verified job is `r50-2018-bf16-4gpu` under RECIPE=2018, and the recipe
# here is `default`, i.e. DeiT-Ti. Verified-ness is carried by CMD, which names the verified
# binary. The axis field says what actually differs from `vit-default-4gpu`: ema + bf16.
#
# ⚠ BOX-SPECIFIC, unlike `vit-default-4gpu.conf` beside it, which is ares':
#   * DEVS is a plain 0,1,2,3 — no PCIe AER exclusions; this box's four cards are all clean.
#     ares' conf says DEVS="0,2,3,4" for hardware that is not here.
#   * PJRT_PLUGIN is xla_cuda13 (driver 610.57.04 / CUDA 13.3). ares' says cuda12.
#   * SHIM_PYTHON is required: the repo's .venv/bin/python3 is a WRAPPER that execs the retired
#     ROCm venv (lean4-jax/.venv), which no longer has a usable jax.

# ▶ §2c N1: this must equal the second dash-field of the filename.
RECIPE=default
DEVS="0,1,2,3"
EPOCHS="${EPOCHS:-300}"

CMD=(.lake/build/bin/vit-imagenet-verified data)

ENV_EXTRA=(
  SHIM_PYTHON="/home/skoonce/.venv-cuda/bin/python3"
  PJRT_PLUGIN="/home/skoonce/.venv-cuda/lib/python3.12/site-packages/jax_plugins/xla_cuda13/xla_cuda_plugin.so"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⛔⛔ LOAD BEARING, AND THE WHOLE RUN. `adamdp128x4wxclipdropbf16` is a COMMITTED artifact
  # one character-class away that has NO EMA (3 regions, 629 operands, against this one's 4 and
  # 831). It would train fine, report a number, and not be the pair. PRECHECK asserts both the
  # string and the artifact's shape; `vit-ema-drop-render` proves the layout.
  LEAN_MLIR_VARIANT=emadp128x4wxclipdropbf16
  LEAN_MLIR_BATCH=128                # PER REPLICA -> global 512, DeiT's batch
  LEAN_MLIR_EPOCHS=300               # SETS the cosine, not just the loop bound. MAX_EPOCHS
                                     # would only CAP it, leaving a PREFIX of the decay.
  PJRT_FFI_RESIDENT=1                # opt-in; OFF silently halves throughput
  # ⚠⚠ REQUIRED — worth 6.5x on this net (4,348 ms/step at 1 producer against 665 at 8), with
  # NOTHING in the log to say so. ⚠ Do NOT raise to 16: measured slower (710 vs 665), the box
  # is out of cores. ViT is the one net still data-bound after the residency fix.
  # ⭐ SHIM_WORKERS=4, not 8 (changed 2026-08-31 after a measured sweep 2..16 per net).
  # ViT-Ti bf16 4x: w8 154.5 -> w4 143 ms/step; w12 is WORSE at 173.
  # ▶ Producers past ~4 add no throughput and contend with the trainer's own host thread.
  # ⛔ NOT a fleet-wide constant: EfficientNet-B0's probe is +/-30% and stayed at 8.
  SHIM_WORKERS=4
)
# ⚠ NO `LEAN_MLIR_BASE_LR_U`. MainViTImagenet.lean defaults baseLR to 5e-4, which IS the DeiT
# batch-512 rate, unlike R50-2018 where the default is AdamW's 0.001 and the knob is mandatory.
# Setting it here could only introduce a rounding difference against the reference.

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs; this box has done two multi-day runs back to
                        # back (phase-2 ViT 34.22 h, R50-2018 30.72 h) with zero thermal rests,
                        # peak 55/62/61/66 °C. Cooldowns are OFF deliberately.

# ⚠ The default 1800 s is too tight for the FIRST launch: 831 operands / 829 outputs / 20,784
# lines is the heaviest render here, and XLA compiles it before the first step prints. A stall
# kill during compile restarts from epoch 0 and re-compiles — i.e. an infinite loop that looks
# like progress. Costs one wasted hour if the run genuinely hangs, once.
STALL_SECS=3600

CKPT_EPOCH_FILE=".lake/build/vitin_emadp128x4wxclipdropbf16_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_vit_emabf16
precheck_vit_emabf16() {
  local ok=0
  local exe=.lake/build/bin/vit-imagenet-verified
  local mlir=verified_mlir/vitin_emadp128x4wxclipdropbf16_train_step.mlir

  [ -x "$exe" ] || { echo "missing $exe — lake build vit-imagenet-verified"; ok=1; }

  # ⚠ NO mtime staleness check, deliberately. R50-2018's conf has one and it FALSE-POSITIVES:
  # `lake build` replays from cache and leaves the binary byte-identical but newly stamped, so
  # mtime is not staleness. ASK THE ARTIFACT WHAT IT IS instead — this string is baked by the
  # init announcement and only exists in a binary built after the vitInit commit.
  if [ -x "$exe" ] && ! strings -a "$exe" | grep -qF 'timm/DeiT'; then
    echo "⛔ $exe has no 'timm/DeiT' announcement — it predates vitInit. Rebuild."; ok=1
  fi

  [ -f "$mlir" ] || { echo "⛔ missing the EMA render: $mlir"; ok=1; }
  if [ -f "$mlir" ]; then
    # 4 replicas is baked; a mismatch fails at step 0 with a shape error.
    grep -q 'DATA-PARALLEL over 4 replicas' "$mlir" || {
      echo "⛔ $mlir is not a 4-replica render — re-render or change PJRT_REPLICAS."; ok=1; }
    # ⛔ THE ADAMDP CONFUSION, caught structurally rather than by name. 4 regions [θ|m|v|ema]
    # x 200 params + 2 data + 5 scalars + 24 masks = 831. The no-EMA twin has 629.
    local nargs; nargs="$(sed -n '2p' "$mlir" | grep -o '%[a-zA-Z0-9_]*: tensor<' | wc -l)"
    [ "$nargs" = "831" ] || {
      echo "⛔ $mlir has $nargs operands, not 831 — that is not the 4-region EMA layout."; ok=1; }
    grep -q 'EMA WEIGHT SHADOW' "$mlir" || {
      echo "⛔ $mlir carries no EMA shadow — this is the adamdp twin, not the pair."; ok=1; }
    # timm's no_weight_decay: 126 of 200 params take %wdz. The `wx` in the name is a label.
    grep -q 'wdExcludeNormBias' "$mlir" || {
      echo "⛔ $mlir does not exclude norm/bias from weight decay — the wx axis is missing."; ok=1; }
    # Gradient clipping has no comment marker, but it has an exact structural signature:
    # measured across all 14 committed vitin_* renders 2026-08-29, `stablehlo.minimum` is 200
    # in every `clip` variant and 0 in every non-clip one, with no exceptions.
    local nmin; nmin="$(grep -c 'stablehlo\.minimum' "$mlir")"
    [ "$nmin" = "200" ] || {
      echo "⛔ $mlir has $nmin stablehlo.minimum ops, not 200 — gradient clipping is not in it."; ok=1; }
  fi

  # ⭐ The real layout gate, and stronger than anything above: it parses the artifact's signature
  # and reconciles it against what the DRIVER packs from the variant string alone.
  if [ -x .lake/build/bin/vit-ema-drop-render ]; then
    .lake/build/bin/vit-ema-drop-render >/dev/null 2>&1 || {
      echo "⛔ vit-ema-drop-render FAILED — run it directly for the diagnosis."; ok=1; }
  else
    echo "⚠ vit-ema-drop-render not built (lake build vit-ema-drop-render) — layout gate skipped."
  fi

  # ⚠⚠ trainAdamSched's emaDecay DEFAULTS to 0.9999 where the reference's is 0.99996. A shadow
  # averaging 4x too fast still trains and still reports. The named arg is the fix; a future edit
  # that reorders those positional args reverts it silently. ⚠ The RUN'S OWN `decay min(0.999960,
  # ...)` line is the real check — this only catches the source regression.
  grep -q 'emaDecay := 0.99996' apps/imagenette/MainViTImagenet.lean || {
    echo "⛔ MainViTImagenet.lean no longer passes (emaDecay := 0.99996) — the shadow would"
    echo "   average 4x too fast against the reference and report it as the pair."; ok=1; }

  # The shim is the heaviest of the five (RandAugment m9/mstd0.5/inc1, mixup+cutmix, random
  # erase 0.25, repeated-aug 3x) and is the SAME one the phase-2 reference streamed.
  [ -f jax/.lake/build/generated_vit_tiny_imagenet_shim.py ] || {
    echo "⛔ missing ViT's OWN tfds shim — scripts/gen_shims.sh"; ok=1; }
  # ⛔ The shim this run streams is a GENERATED artifact in gitignored .lake/build, and a warm
  # cache serves a stale one silently. That is how MNv2's published 350ep run got labelSmoothing
  # 0.1 three weeks after its source said 0.0. Instant: a diff, no Lean and no GPU.
  scripts/regen_jax_generated.sh box >/dev/null 2>&1 || {
    echo "⛔ this box's jax/.lake/build artifacts are STALE vs committed jax/generated/:"
    scripts/regen_jax_generated.sh box 2>&1 | grep -E 'STALE|not built' | sed 's/^/   /'
    echo "   Re-emit before trusting a run off them (scripts/regen_jax_generated.sh)."; ok=1; }
  grep -q 'antialias' jax/.lake/build/generated_vit_tiny_imagenet_shim.py 2>/dev/null || {
    echo "⛔ the ViT shim has no antialiased resize — it predates C3. Run scripts/gen_shims.sh."; ok=1; }

  local plug; plug="$(printf '%s\n' "${ENV_EXTRA[@]}" | sed -n 's/^PJRT_PLUGIN=//p' | tr -d '"')"
  [ -f "$plug" ] || { echo "⛔ PJRT_PLUGIN not found: $plug"; ok=1; }
  [ -x "/home/skoonce/.venv-cuda/bin/python3" ] || {
    echo "⛔ SHIM_PYTHON missing — .venv/bin/python3 execs the retired ROCm venv."; ok=1; }

  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_VARIANT=emadp128x4wxclipdropbf16' || {
    echo "⛔ LEAN_MLIR_VARIANT is not emadp128x4wxclipdropbf16 — see the note in ENV_EXTRA."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "PJRT_FFI_RESIDENT=1 missing — residency is opt-in and OFF halves throughput."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'SHIM_WORKERS=4' || {
    echo "SHIM_WORKERS=4 is missing from ENV_EXTRA. ViT measured 2026-08-31: 8 gives 154.5 ms/step against 4's 143; 12 is worse at 173."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_EPOCHS=300' || {
    echo "LEAN_MLIR_EPOCHS=300 missing — MAX_EPOCHS cannot reach the 300-epoch cosine."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -q '^LEAN_MLIR_BASE_LR_U=' && {
    echo "⛔ LEAN_MLIR_BASE_LR_U is set. This driver already defaults to 5e-4, the DeiT"
    echo "   batch-512 rate; the knob can only move it off the reference."; ok=1; }

  # ⚠ Checkpoints are per-VARIANT and outlive the artifact they trained on. A vitin_adamdp...
  # blob has 3 regions where this run wants 4 — a different byte count entirely.
  local stray; stray="$(ls .lake/build/vitin_*_ckpt_xla.bin 2>/dev/null \
    | grep -v 'vitin_emadp128x4wxclipdropbf16_ckpt_xla.bin' || true)"
  if [ -n "$stray" ]; then
    echo "⚠ other vitin checkpoints present — they must NOT be resumed into this run:"
    printf '   %s\n' $stray
  fi
  if [ -f "$CKPT_EPOCH_FILE" ]; then
    echo "⚠ $CKPT_EPOCH_FILE exists — this run will RESUME from it, not start fresh."
  fi

  # ⚠⚠ A stale GPU process fakes OOM and NCCL errors. kill -9 on a wrapper leaves the Lean exe
  # grandchild holding ~9 GB on all four cards.
  local busy; busy="$(nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader 2>/dev/null)"
  if [ -n "$busy" ]; then
    echo "⛔ GPUs are not idle — a leftover process will fake an OOM at step 0:"
    printf '   %s\n' "$busy"; ok=1
  fi

  return $ok
}
