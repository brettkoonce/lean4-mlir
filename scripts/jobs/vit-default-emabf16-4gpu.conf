# vit-default-emabf16-4gpu.conf — ViT-Tiny (DeiT-Ti) / ImageNet-1k, VERIFIED path, 300 epochs.
#
#     scripts/supervise.sh vit-default-emabf16-4gpu
#
# The phase-4 peer of the phase-2 JAX reference that landed 2026-08-29 at 72.31 / 91.12
# (34.22 h, one attempt). §9.6's phase-4 subsection ends on a bare
# `[TODO: run vit-imagenet-verified.]`; this job is what fills it, and it gives ViT the
# {reference, verified} pair Chapter 5 already has for ResNet-50.
#
# ⭐ THE PAIR IS ONE-VARIABLE IN RECIPE AS OF `68842de5`, AND IT WAS NOT BEFORE. Three axes
# differed and all three closed that day:
#     weight init   Glorot Linears (3.6x wide at d=192), CLS 5x wide  ->  vitInit, sigma 0.02
#     EMA           no artifact combined it with wx+clip+drop         ->  emadp...bf16 exists
#     precision     fp32                                              ->  bf16, as the reference
# Everything else already matched and was checked individually: 128/replica x 4 = global 512
# and 2,502 steps/epoch; 300 epochs, warmup 5, cosine; AdamW lr 5e-4, wd 0.05, wdExclude,
# clip 1.0; label smoothing 0.1 (BAKED into the render); dropPath 0.1 with 24 independent
# masks; soft targets via %onehot: tensor<128x1000xf32>; and the data side is the SAME shim
# the reference's recipe emits.
#
# ⚠ THE NAME. The handoff (planning/archive/vit_verified_run.md §1) calls this job `vit-verified-4gpu`,
# which would put `verified` in the slot §2c N1 reserves for the RECIPE. `verified` is a PATH,
# not a recipe — R50's verified job is `r50-2018-bf16-4gpu` under RECIPE=2018, and the recipe
# here is `default`, i.e. DeiT-Ti. Verified-ness is carried by CMD, which names the verified
# binary. The axis field says what actually differs from `vit-default-4gpu`: ema + bf16.
#
# ⚠ BOTH BOXES. This conf was written for the 4x 3060 box with that box's paths hard-coded; it now
#   picks the plugin and the shim python from _box.sh (cuda13 + SHIM_PYTHON on the 3060 box, the
#   repo .venv's cuda12 on ares), like every other ImageNet conf.
# ⚠ Its label-smoothing claim above is the RENDER's: the verified run trained at 0.1, while the JAX
#   reference's 72.31 predates 4b765be7 and trained at an effective 0 (planning/imagenet_parity.md
#   H1), so the pair is one-variable in recipe only once the reference reruns.
#
# MEASURED end to end on the 4x 3060 box: 300 epochs in 48.0 h, 9.6 min/epoch, 199 ms/step
# (72.35 / 91.22, the book's ViT side-by-side table).
#
# ⭐ THE 2026-10-01 PARITY RERUN (planning/next_session_vit.md, planning/vit_parity_todo.md). Both arms
# rerun post-C6 and the pair now differs in nothing either side's code can see:
#     LN ε          1e-5 both       ->  1e-6 both (DeiT): THIS variant, `…eps0000001bf16`, and its
#                                       own eval forward `vitin_<variant>_fwd.mlir`
#     min_lr        0 both          ->  1e-5 both (DeiT), `trainAdamSched (minLR := …)`
#     CLS + pos     0 here, σ.02 J  ->  σ 0.02 both (init kind 5, `vitInit`)
#     stem + head   f32 here, bf16 J ->  f32 both (`TrainConfig.f32StemHead` on the JAX side)
#     cosine        one step ahead  ->  the reference's 0-based progress
#     smoothing     0.1 here, 0 J   ->  0.1 both (the reference rerun, H1)
# A NEW variant means a NEW checkpoint name: the 72.35 run's `vitin_emadp128x4wxclipdropbf16`
# checkpoint (marker 300) cannot be resumed into this one.

# ▶ §2c N1: this must equal the second dash-field of the filename.
RECIPE=default
DEVS="0,1,2,3"
EPOCHS="${EPOCHS:-300}"
ETA="bf16 ~61-62 h on 4x 3060 post-C6 (PROBED 2026-09-26 at 277 ms/step; the pre-C6 72.35 run was 48.0 h). ⚠ FEED-BOUND on 4x 4060 Ti: PROBED 2026-09-25 at 288 median / 691 mean / 605 p90 ms/step (shim starvation), i.e. well over 100 h here — run it on the 3060 box"

CMD=(.lake/build/bin/vit-imagenet-verified data)

# Box selection (the r50-2018-bf16-4gpu pattern, f3d89574). This conf was written FOR the 3060
# box and hardcoded its paths, which is the mirror of the bug that fix addressed: it refused on
# ares exactly as ares' confs refused here. Now it picks by what is on disk.
. "$(dirname "${BASH_SOURCE[0]}")/_box.sh"   # BOX, BOX_PLUG, BOX_PY, BOX_SHIMPY
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⛔⛔ THE WHOLE RUN. `adamdp128x4wxclipdropbf16` is a COMMITTED artifact
  # one character-class away that has NO EMA (3 regions, 629 operands, against this one's 4 and
  # 831). It would train fine, report a number, and not be the pair. PRECHECK asserts both the
  # string and the artifact's shape; `vit-ema-drop-render` proves the layout.
  # 2026-10-01: the same render at DeiT's LayerNorm ε 1e-6 (`eps0000001`); 831 operands, 200
  # all-reduces, the 72.35 run's layout exactly. Its JAX partner is `lnEps := 1e-6`.
  LEAN_MLIR_VARIANT=emadp128x4wxclipdropeps0000001bf16
  LEAN_MLIR_BATCH=128                # PER REPLICA -> global 512, DeiT's batch
  LEAN_MLIR_EPOCHS=300               # SETS the cosine, not just the loop bound. MAX_EPOCHS
                                     # would only CAP it, leaving a PREFIX of the decay.
  # ⚠⚠ REQUIRED — worth 6.5x on this net (4,348 ms/step at 1 producer against 665 at 8), with
  # NOTHING in the log to say so. ⚠ Do NOT raise to 16: measured slower (710 vs 665), the box
  # is out of cores. ViT is the one net still data-bound after the residency fix.
  # ⭐ SHIM_WORKERS=4, set 2026-08-31 from a median sweep (bf16 4x: w8 154.5 -> w4 143 ms/step; w12
  # 173), and the 48 h run above trained at it.
  # ⚠ OPEN (VT-2): vit-default-4gpu uses 8, from a 2026-09-10 re-probe on ares that ranked on the
  # MEAN with tf.data determinism off (f32: w4 mean 894 vs w8 520 ms/step) and calls the 08-31 sweep
  # superseded. The two were measured on different boxes, precisions and statistics; neither
  # settles the other. A median+mean probe of THIS variant at 4 and 8 is owed before the next run.
  SHIM_WORKERS=4
  # Loader respawn (2026-09-27): every 10 epochs one shim producer is replaced, round-robin. The
  # MNv4 100-ep run's producers aged into B0's fault (one at 8.2 GiB arena, epochs 629 -> 1,095 s,
  # e77-83) and needed a checkpoint restart; the R50 A3/2018 shims crept 3.4-3.8 -> 6.7-6.9 GiB.
  LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10
)
# ⚠ NO `LEAN_MLIR_BASE_LR_U`. MainViTImagenet.lean defaults baseLR to 5e-4, which IS the DeiT
# batch-512 rate, unlike R50-2018 where the default is AdamW's 0.001 and the knob is mandatory.
# Setting it here could only introduce a rounding difference against the reference.

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs; this box has done two multi-day runs back to
                        # back (phase-2 ViT 34.22 h, R50-2018 30.72 h) with zero thermal rests,
                        # peak 55/62/61/66 °C. Cooldowns are OFF deliberately.

# ⚠ The default 1800 s is too tight for the FIRST launch: 831 operands / 829 outputs / 20,784
# lines is the heaviest render here, and XLA compiles it before the first step prints. A stall
# kill during compile restarts from epoch 0 and re-compiles — i.e. an infinite loop that looks
# like progress. Costs one wasted hour if the run genuinely hangs, once.
STALL_SECS=3600

CKPT_EPOCH_FILE=".lake/build/vitin_emadp128x4wxclipdropeps0000001bf16_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_vit_emabf16
# The shared checks are scripts/lib/precheck.sh's; the ViT-specific ones (operand count, EMA marker,
# wx, clip signature, layout gate, EMA decay) stay here. Each names what it defends.
precheck_vit_emabf16() {
  . scripts/lib/precheck.sh
  local ok=0
  local exe=.lake/build/bin/vit-imagenet-verified
  local var=emadp128x4wxclipdropeps0000001bf16
  local mlir="verified_mlir/vitin_${var}_train_step.mlir"
  pc_box || ok=1

  # 200 all-reduces: one per parameter gradient (LayerNorm only, no statistic collectives).
  pc_render vitin "$var" 4 200 || ok=1
  pc_ckpt vitin "$var" || ok=1

  pc_exe vit-imagenet-verified LeanMlir/Verified/Train.lean ffi/f32_helpers.c \
    apps/imagenette/MainViTImagenet.lean || ok=1
  # the init announcement is baked into the binary and exists only after the vitInit commit
  if [ -x "$exe" ] && ! strings -a "$exe" | grep -qF 'timm/DeiT'; then
    echo "⛔ $exe has no 'timm/DeiT' announcement — it predates vitInit. Rebuild."; ok=1
  fi
  # init kind 5 (CLS + pos-embed at σ 0.02) announces itself in the same banner
  if [ -x "$exe" ] && ! strings -a "$exe" | grep -qF 'CLS/pos-embed'; then
    echo "⛔ $exe predates init kind 5 — the CLS token and pos-embed would start at 0. Rebuild."; ok=1
  fi
  pc_pjrt_so || ok=1

  if [ -f "$mlir" ]; then
    # ⛔ THE ADAMDP CONFUSION, caught structurally rather than by name. 4 regions [θ|m|v|ema]
    # x 200 params + 2 data + 5 scalars + 24 masks = 831. The no-EMA twin has 629.
    # the driver copies the output blob back, so #out = #in − 2 with every mask passed through
    python3 scripts/gates/train_step_arity.py "$mlir" | grep -v '^✓'; [ "${PIPESTATUS[0]}" = 0 ] || ok=1
    local nargs; nargs="$(sed -n '2p' "$mlir" | grep -o '%[a-zA-Z0-9_]*: tensor<' | wc -l)"
    [ "$nargs" = "831" ] || {
      echo "⛔ $mlir has $nargs operands, not 831 — that is not the 4-region EMA layout."; ok=1; }
    # DeiT's LN ε, at all 25 LN sites of the forward and their 50 backward reads.
    local neps; neps="$(grep -c 'dense<1.0e-6>' "$mlir" || true)"
    [ "$neps" = "75" ] || {
      echo "⛔ $mlir has $neps LN ε=1e-6 constants, not 75 — not the eps0000001 render."; ok=1; }
    # ITS OWN EVAL FORWARD: without it the trainer falls back to vitin_fwd.mlir (ε 1e-5) — the
    # driver's checkLnEpsWorld refuses that at startup, this catches it before launch.
    local fwd="verified_mlir/vitin_${var}_fwd.mlir"
    if [ ! -f "$fwd" ]; then
      echo "⛔ missing $fwd — the run would score at LN ε 1e-5"; ok=1
    else
      local nfe; nfe="$(grep -c 'dense<1.0e-6>' "$fwd" || true)"
      [ "$nfe" = "25" ] || { echo "⛔ $fwd has $nfe LN ε=1e-6 constants, not 25."; ok=1; }
    fi
    grep -q 'EMA WEIGHT SHADOW' "$mlir" || {
      echo "⛔ $mlir carries no EMA shadow — this is the adamdp twin, not the pair."; ok=1; }
    # timm's no_weight_decay: 126 of 200 params take %wdz. The `wx` in the name is a label.
    grep -q 'wdExcludeNormBias' "$mlir" || {
      echo "⛔ $mlir does not exclude norm/bias from weight decay — the wx axis is missing."; ok=1; }
    # Gradient clipping has no comment marker, but it has an exact structural signature:
    # across all 14 committed vitin_* renders (2026-08-29), `stablehlo.minimum` is 200 in every
    # `clip` variant and 0 in every non-clip one.
    local nmin; nmin="$(grep -c 'stablehlo\.minimum' "$mlir" || true)"
    [ "$nmin" = "200" ] || {
      echo "⛔ $mlir has $nmin stablehlo.minimum ops, not 200 — gradient clipping is not in it."; ok=1; }
  fi

  # ⭐ The real layout gate: it parses the artifact's signature and reconciles it against what the
  # DRIVER packs from the variant string alone.
  if [ -x .lake/build/bin/vit-ema-drop-render ]; then
    .lake/build/bin/vit-ema-drop-render vitin "$var" >/dev/null 2>&1 || {
      echo "⛔ vit-ema-drop-render FAILED — run it directly for the diagnosis."; ok=1; }
  else
    echo "⚠ vit-ema-drop-render not built (lake build vit-ema-drop-render) — layout gate skipped."
  fi

  # ⚠⚠ trainAdamSched's emaDecay DEFAULTS to 0.9999 where the reference's is 0.99996. A shadow
  # averaging 4x too fast still trains and still reports. The run's own `decay min(0.999960, ...)`
  # line is the real check; this only catches the source regression.
  grep -q 'emaDecay := 0.99996' apps/imagenette/MainViTImagenet.lean || {
    echo "⛔ MainViTImagenet.lean no longer passes (emaDecay := 0.99996) — the shadow would"
    echo "   average 4x too fast against the reference and report it as the pair."; ok=1; }

  # DeiT `--min-lr 1e-5`, matching the reference's `minLR`; 0 would anneal to zero.
  grep -q '(minLR := 0.00001)' apps/imagenette/MainViTImagenet.lean || {
    echo "⛔ MainViTImagenet.lean does not pass (minLR := 0.00001) — the cosine would anneal to 0"
    echo "   while the reference floors at 1e-5."; ok=1; }

  # The shim (RandAugment m9 mstd 0.5, mixup + cutmix, random erasing, repeated augmentation x3) is
  # the one the phase-2 reference streamed.
  pc_jax_box || ok=1
  pc_shim vit_tiny_imagenet || ok=1
  local shim=jax/.lake/build/generated_vit_tiny_imagenet_shim.py
  pc_aug_call "$shim" '_randaugment(img, 2, 9.0' "RandAugment N2 m9" || ok=1
  pc_aug_call "$shim" '_random_erase(img)' "random erasing" || ok=1
  pc_aug_no_call "$shim" '_autoaugment(' "not in DeiT's recipe" || ok=1

  pc_env SHIM_WORKERS=4 "the worker count the 48 h run trained at; see VT-2 in ENV_EXTRA" || ok=1
  pc_env LEAN_MLIR_EPOCHS=300 "MAX_EPOCHS cannot reach the 300-epoch cosine" || ok=1
  pc_env_absent LEAN_MLIR_BASE_LR_U "this driver already defaults to 5e-4, the DeiT batch-512 rate" || ok=1
  pc_gpu_idle || ok=1
  return $ok
}
