# r50-2018-4gpu.conf — ResNet-50, the 2018 recipe, VERIFIED path, 90 epochs.
#
# The verified peer to the JAX `2018` recipe (leg 0 of queue_r50_a3_pair.sh). The blueprint's
# A3-vs-2018 section needs both sides measured under the same rules; this is the verified side.
#
# Render: `resnet50in_momdp64_train_step.mlir` — bottleneck batch-BN heavy-ball momentum +
# coupled L2, DATA-PARALLEL over 4 replicas, 64/replica -> global 256 @224². That matches the
# 2018 spec (SGD+mom 0.9, bs256, 224/224) as closely as a rendered artifact does.
#
# ⚠ BOX-SPECIFIC LINES, unlike the ares confs beside it: this is the 4× RTX 3060 box.
#   * PJRT_PLUGIN is xla_cuda13 (driver 610.57.04 / CUDA 13.3). The ares confs say cuda12.
#   * DEVS is a plain 0,1,2,3 — no PCIe AER exclusions; this box's four cards are all clean.
#   * SHIM_PYTHON is required here: the repo's .venv/bin/python3 is a WRAPPER that execs the
#     retired ROCm venv (lean4-jax/.venv), which no longer has a usable jax.
#   Fixing ffi/pjrt_ffi.c's default plugin search list (it knows xla_cuda12 + xla_rocm7, not
#   xla_cuda13) would remove the PJRT_PLUGIN line entirely.
#
# Measured 2026-08-24 on this box: 352.3 ms/step (floor 352.2), 5004 steps/epoch
#   => 29.4 min/epoch => ~44.1 h for 90 epochs.
# ▶ §2c N1: this must equal the second dash-field of the filename. supervise.sh refuses
#   otherwise — the job namespace drifted from the recipe namespace once already.
RECIPE=2018
DEVS="0,1,2,3"
EPOCHS="${EPOCHS:-90}"
CMD=(.lake/build/bin/resnet50-imagenet-verified data)
ENV_EXTRA=(
  SHIM_PYTHON="/home/skoonce/.venv-cuda/bin/python3"
  PJRT_PLUGIN="/home/skoonce/.venv-cuda/lib/python3.12/site-packages/jax_plugins/xla_cuda13/xla_cuda_plugin.so"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  LEAN_MLIR_VARIANT=momdp64          # -> verified_mlir/resnet50in_momdp64_train_step.mlir
  LEAN_MLIR_RECIPE=2018              # ⛔ LOAD BEARING -> generated_resnet50_imagenet_2018_shim.py
                                     # Without it the 224 net streams the `default` = RSB-A2 shim,
                                     # which RandAugments (m7, mstd 0.5) and defaults SHIM_MIX to
                                     # 'both'. That is what killed the 2026-08-24 attempt at ep13
                                     # (mean -4.90 top-1 vs the JAX curve over ep 1-10).
  LEAN_MLIR_BATCH=64                 # PER REPLICA -> global 256, the 2018 batch
  LEAN_MLIR_EPOCHS=90                # SETS the cosine, not just the loop bound
  LEAN_MLIR_BASE_LR_U=100000         # 0.1, the 2018 rate; the 0.001 default is AdamW's
  PJRT_FFI_RESIDENT=1                # opt-in; OFF silently halves throughput
  SHIM_WORKERS=8
)
TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs
CKPT_EPOCH_FILE=".lake/build/resnet50in_momdp64_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}
PRECHECK=precheck_r50_2018
precheck_r50_2018() {
  local ok=0
  local exe=.lake/build/bin/resnet50-imagenet-verified
  [ -x "$exe" ] || { echo "missing $exe — lake build resnet50-imagenet-verified"; ok=1; }
  if [ -x "$exe" ] && [ "$exe" -ot verified_mlir/resnet50in_momdp64_train_step.mlir ]; then
    echo "⛔ $exe is OLDER than the render it must execute — rebuild it."; ok=1
  fi
  [ -f verified_mlir/resnet50in_momdp64_train_step.mlir ] || {
    echo "missing the momdp64 render"; ok=1; }
  # 4 replicas is baked into the artifact; a mismatch fails at step 0 with a shape error.
  grep -q 'DATA-PARALLEL over 4 replicas' verified_mlir/resnet50in_momdp64_train_step.mlir || {
    echo "⛔ resnet50in_momdp64 is not a 4-replica render — re-render or change PJRT_REPLICAS."; ok=1; }
  # The shim carries C3's antialiased resampler; existence is not freshness.
  [ -f jax/.lake/build/generated_resnet50_imagenet_shim.py ] || {
    echo "missing R50's tfds shim — scripts/gen_shims.sh"; ok=1; }
  grep -q 'antialias' jax/.lake/build/generated_resnet50_imagenet_shim.py 2>/dev/null || {
    echo "⛔ the R50 shim has no antialiased resize — it predates C3. Run scripts/gen_shims.sh."; ok=1; }
  # This box's plugin is cuda13; the ares confs' cuda12 path does not exist here.
  local plug; plug="$(printf '%s\n' "${ENV_EXTRA[@]}" | sed -n 's/^PJRT_PLUGIN=//p' | tr -d '"')"
  [ -f "$plug" ] || { echo "⛔ PJRT_PLUGIN not found: $plug"; ok=1; }
  [ -x "/home/skoonce/.venv-cuda/bin/python3" ] || {
    echo "⛔ SHIM_PYTHON missing — .venv/bin/python3 execs the retired ROCm venv."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "PJRT_FFI_RESIDENT=1 missing — residency is opt-in and OFF halves throughput."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_EPOCHS=90' || {
    echo "LEAN_MLIR_EPOCHS=90 missing — MAX_EPOCHS cannot reach the 90-epoch tier from a cap."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_BASE_LR_U=100000' || {
    echo "LEAN_MLIR_BASE_LR_U=100000 (lr 0.1) missing — the driver would use AdamW's 0.001."; ok=1; }
  # ⛔ THE ONE THAT KILLED THE FIRST ATTEMPT. Augmentation is not recoverable from a loss curve.
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_RECIPE=2018' || {
    echo "⛔ LEAN_MLIR_RECIPE=2018 missing — the 224 net would stream RSB-A2's RandAugment shim."; ok=1; }
  [ -f jax/.lake/build/generated_resnet50_imagenet_2018_shim.py ] || {
    echo "missing the 2018 shim — scripts/gen_shims.sh"; ok=1; }
  # Freshness, not existence: this shim is defined by what it does NOT do.
  if grep -q '_randaugment(' jax/.lake/build/generated_resnet50_imagenet_2018_shim.py 2>/dev/null; then
    echo "⛔ the 2018 shim calls _randaugment — it was emitted from the wrong recipe."; ok=1
  fi
  # A checkpoint from the killed RSB-A2-augmented attempt must never be resumed into this run.
  if [ -f "$CKPT_EPOCH_FILE" ]; then
    echo "⚠ $CKPT_EPOCH_FILE exists — if it predates the 2018-shim fix it carries A2 augmentation."
    echo "   The killed 2026-08-24 attempt's checkpoint was moved to .lake/build/stale/."
  fi
  return $ok
}
