# ViT-Base (DeiT-B) / ImageNet-1k, JAX REFERENCE path, the `accum` recipe (300 epochs), 4 GPUs.
#
#     setsid nohup scripts/supervise.sh vitb-accum-jax-4gpu >/dev/null 2>&1 &
#
# The JAX side of the ViT-B pair: `vitBImagenetConfig` (DeiT-B at an effective 512, AdamW 5e-4,
# wd 0.05 off norm/bias/pos/CLS, 5 warmup epochs + cosine, clip 1.0, mixup 0.8 / cutmix 1.0,
# RandAugment m9 mstd0.5 inc1, random erasing 0.25, repeated aug ×3, drop-path 0.1, label smoothing
# 0.1, EMA 0.99996, bf16, trunc_normal(0.02) init; since 2026-10-05 also ViT-Ti's 10-01 items, DeiT's
# LN ε 1e-6 and min_lr 1e-5 with the patch embed and head in fp32) as 128 × accum 4, because one 512
# micro-batch does not fit the default JAX arena. ViT has no BatchNorm, so the accumulation is exact.
# The verified peer is `vitb-default-emabf16-4gpu` (`emadp128x4wxclipdropeps0000001erfbf16`, 4 × 128).
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo.
RECIPE=accum
DEVS="0,1,2,3"
EPOCHS=300
CKPT_BASE=/home/skoonce/vit_b_accum_300ep/vit_b_imagenet_accum
PY_REL=.lake/build/generated_vit_b_imagenet_accum.py    # relative to jax/
# The 4-GPU compute probe (runs/2026-08-27-jax-sb-tier-step-probe): 700.8 ms/step, feed not
# binding (~730 img/s needed against a 2,580 img/s tf.data ceiling). ⚠ probed at one 512 step;
# accum 4 adds some per-micro-batch overhead.
EPOCH_SECS=1800
ETA="~148 h for 300 ep on 4x 4060 Ti (708 ms/step, flat; measured 2026-10-05, runs/2026-10-04-dimm-fan-thermal)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_vitb_accum_jax
precheck_vitb_accum_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  . scripts/lib/precheck.sh; pc_crop "jax/$PY_REL" torchvision || ok=1   # train crop + resize kernel
  pc_gelu "jax/$PY_REL" exact || ok=1   # nn.GELU's x·Φ(x), not the tanh approximation
  pc_jax_trainer || ok=1
  pc_aug_call "jax/$PY_REL" '_randaugment(img, 2, 9.000000, 0.500000)' "DeiT RandAugment m9 mstd0.5" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "DeiT's recipe is RandAugment only" || ok=1
  grep -q 'one_hot(y, 1000) \* (1.0 - 0.100000) + 0.100000 / 1000' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL mixes raw one-hots — it trains at label smoothing 0"; ok=1; }
  grep -q '(timm trunc_normal std=0.02)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no DeiT init — re-emit"; ok=1; }
  # 2026-10-05 parity with the verified eps0000001 render (ViT-Ti's 10-01 items): DeiT's LN ε and
  # min_lr, fp32 patch embed + head
  grep -q 'jnp.sqrt(var + 0.000001)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's layer_norm is not at ε 1e-6 — re-emit (lnEps)"; ok=1; }
  grep -q 'lr = jnp.float32(0.000010 + (LR - 0.000010)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's cosine has no 1e-5 floor — re-emit (minLR)"; ok=1; }
  [ "$(grep -c 'x = jnp.matmul(x, params\[' "jax/$PY_REL")" = "2" ] || {
    echo "⛔ jax/$PY_REL does not keep the patch embed AND the head in fp32 — re-emit (f32StemHead)"; ok=1; }
  grep -q '^GRAD_ACCUM = 4$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not the 128 × 4 accumulation trainer"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
