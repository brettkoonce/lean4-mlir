# MobileNetV4-Conv-M / ImageNet-1k, VERIFIED path, the `default` recipe (100 epochs), 4 GPUs, bf16.
#
#     START_AT=00:00 STOP_AT=08:00 setsid nohup scripts/supervise.sh mnv4-default-4gpu >/dev/null 2>&1 &
#
# The verified side of the 100-epoch pair; the JAX side is `mnv4-default-jax-4gpu`. The JAX
# reference's tier-2 recipe (`mobilenetV4ConvMImagenetConfig`) on the timm-parity net (90e4af7e):
#   * AdamW 0.004, 8 accumulated micro-batches of 4 × 128 = effective 4096. The JAX reference runs
#     512 × accum 8, and its BN group is the 512 micro-batch; sync-BN over 4 × 128 is the same 512.
#   * 2,496 micro-batches per epoch (`LEAN_MLIR_G2_STEPS`) = 312 optimizer steps, the reference's
#     1,281,167 // 4096. The driver refuses a cycle that straddles an epoch, and 2,502 is not a
#     multiple of 8.
#   * wd 0.05 off BN γ/β and biases (`wx`, `wd005`), LS 0.1, classifier dropout 0.1 (`do`, keep
#     0.9 from `mnv4ImagenetVerified.dropoutKeep`), EMA 0.9999 warmup-corrected (`ema`), warmup 5.
#   * RandAugment N2 m9 from the shim, byte-identical to the reference's augmentation block.
#   * Eval every 5 epochs and at the last, on the EMA shadow with its BN running stats, through
#     `mnv4in_fwd_eval.mlir` at batch 64 (the driver reads the eval batch off that artifact).
# Gates: `mnv4-dp-check` on this pair (duplicated batch, five regions + mask),
# `dropout-tie --net` on this render, `variant-predicates` for the name.
#
# ⚠ The checkpoint is TAGGED `e100` (`LEAN_MLIR_CKPT_TAG`). The untagged
# `mnv4in_emaaccdp8x128wxdowd005bf16_ckpt_xla.bin` is the retired 50-epoch run's (stopped at
# epoch 16 of a 50-epoch cosine, planning/archive/mnv4_half_pair.md); resuming it would splice a
# different LR schedule into this run.
RECIPE=default
DEVS="0,1,2,3"
EPOCHS=100
# MEASURED on the 50-epoch run's first chunk (runs/2026-09-25-mnv4-half-4gpu, same render and
# geometry): 16 epochs, three of them scored, from launch 03:20:27 to the epoch-16 checkpoint at
# 10:04:43 = 24,256 s, i.e. ~1,516 s/epoch with compile and eval included. The chunk planner
# replaces EPOCH_SECS with the longest epoch it times itself.
EPOCH_SECS=1520
ETA="~42 h for 100 ep on 4x 4060 Ti (MEASURED ~1,516 s/epoch, eval included) — about five 8 h overnight chunks"

CMD=(.lake/build/bin/mobilenetv4-imagenet-verified data)

. "$(dirname "${BASH_SOURCE[0]}")/_box.sh"   # BOX, BOX_PLUG, BOX_PY, BOX_SHIMPY
VARIANT=emaaccdp8x128wxdowd005bf16
CKPT_TAG=e100
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4                    # both replica knobs: the shim compiles for N, the driver
                                     # calls the data-parallel invoke; one alone fails at step 1
  LEAN_MLIR_REPLICAS=4
  LEAN_MLIR_VARIANT=$VARIANT
  LEAN_MLIR_CKPT_TAG=$CKPT_TAG       # keeps the retired 50-epoch run's checkpoint out (header)
  LEAN_MLIR_BATCH=128                # PER REPLICA, baked into the render
  LEAN_MLIR_EPOCHS=100               # = EPOCHS; sets the cosine length as well as the loop bound
  LEAN_MLIR_BASE_LR_U=4000           # 0.004, the reference's peak at effective 4096
  LEAN_MLIR_G2_STEPS=2496            # 312 × k: whole accumulation cycles, the reference's 312 steps
  LEAN_MLIR_VAL_EVERY=5              # the reference's cadence; the last epoch is always scored
  PJRT_FFI_RESIDENT=1                # opt-in and SILENT when absent
  SHIM_WORKERS=4                     # measured best at 4 × 128 too (6: 282/523, 8: 320/678 ms)
)

TEMP_MAX=78
TEMP_RESUME=62

CKPT_EPOCH_FILE=".lake/build/mnv4in_${VARIANT}_ckpt_xla_${CKPT_TAG}.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_mnv4_default
precheck_mnv4_default() {
  . scripts/lib/precheck.sh
  local ok=0
  pc_box || ok=1
  # 464 all-reduces: the Chan sync-BN statistics over the 4 x 128 group plus the gradients.
  pc_render mnv4in "$VARIANT" 4 464 || ok=1
  pc_ckpt mnv4in "$VARIANT" "$CKPT_TAG" || ok=1
  pc_env "LEAN_MLIR_CKPT_TAG=$CKPT_TAG" "without it the retired 50-epoch checkpoint resumes" || ok=1
  # a binary older than `mnv4ImagenetVerified.dropoutKeep` passes no dropout mask and fails at the
  # first step (hit 2026-09-25)
  pc_exe mobilenetv4-imagenet-verified || ok=1
  pc_pjrt_so || ok=1
  pc_jax_box || ok=1
  pc_shim mobilenet_v4_imagenet || ok=1
  local shim=jax/.lake/build/generated_mobilenet_v4_imagenet_shim.py
  pc_aug_call "$shim" '_randaugment(img, 2, 9.0' "RandAugment N2 m9, the default recipe" || ok=1
  pc_aug_no_call "$shim" '_autoaugment(' "the default recipe is RandAugment only" || ok=1
  pc_env PJRT_FFI_RESIDENT=1 "residency is opt-in, and OFF prints nothing" || ok=1
  pc_env SHIM_WORKERS=4 "measured best at 4 x 128 (6: 282/523, 8: 320/678 ms)" || ok=1
  pc_env LEAN_MLIR_EPOCHS=100 "sets the cosine; must equal EPOCHS" || ok=1
  pc_env LEAN_MLIR_BASE_LR_U=4000 "0.004, the reference's peak at 4096" || ok=1
  pc_env LEAN_MLIR_G2_STEPS=2496 "312 whole accumulation cycles of 8" || ok=1
  pc_gpu_idle || ok=1
  return $ok
}
