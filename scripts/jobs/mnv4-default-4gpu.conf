# MobileNetV4-Conv-M / ImageNet-1k, VERIFIED path (Lean → StableHLO → XLA/PJRT), 4-GPU data-parallel.
#
#     scripts/supervise.sh mnv4-default-4gpu
#
# 4 replicas x bs 64 = global batch 256, 5,004 steps/epoch.
#
# ⭐ MEASURED at exactly this geometry (`bf16_renderer.md` §21.1, scripts/bf16_probe_4gpu.sh):
#
#       adamdp64       177 ms/step   ->  14.8 min/epoch  ->  100 ep ≈ 25.6 h   ← THIS JOB
#       adamdp64bf16   126 ms/step   ->  10.5 min/epoch  ->  100 ep ≈ 18.6 h   (1.40x)
#
# ⭐ RE-CONFIRMED 2026-08-30 after the pointwise 4-D shape fix, medians of three 40-step probes:
#
#       adamdp64       176 ms/step  (176/180/176)  ->  14.7 min/ep  ->  100 ep ≈ 25.5 h
#       adamdp64bf16   122 ms/step  (125/122/120)  ->  10.2 min/ep  ->  100 ep ≈ 18.0 h   (1.44x)
#
#   ⛔ THE SHAPE FIX'S 1.11x DID NOT REACH THE RUNNER, and that is the finding, not a null result
#   to explain away. MNv4's bare graph went 0.776 -> 0.056 GB of transposes and 47.8 -> 43.0 ms,
#   but the step is unchanged because HALF OF IT IS NOT THE GRAPH. At 4 replicas, bf16:
#
#       bare graph (all-reduce included)   61.1 ms      <- bf16 is 2.00x here (f32 122.0)
#       unhidden shim feed                 39   ms
#       host-side                          22   ms
#       ------------------------------------------
#       step                              122   ms      <- bf16 is 1.44x here
#
#   ▶ So this net is FEED-bound, like MobileNetV2 and unlike ConvNeXt. SHIM_WORKERS is the knob
#   with headroom here; the emit no longer is.
# ⚠ Artifact prefix is `mnv4in_`, NOT `mobilenetv4in_` — the exe name and the render slug differ,
#   and a probe naming the exe's prefix finds no file rather than erroring.
#
#   ▶ The bf16 arm is rendered and tied too. It is not the default here for the same reason the
#     other nets' f32 jobs are not: this is the artifact whose accuracy nothing has measured yet,
#     and changing two axes at once (first run + reduced precision) makes a disappointing number
#     unattributable. Switch by editing LEAN_MLIR_VARIANT below — the PRECHECK checks the file.
#
# ⚠⚠ THIS JOB ONLY EXISTS BECAUSE THE COLLECTIVES ARE TIED, and that was the whole hold-up.
# `mnv4in_adamdp64` sat on disk from 2026-08-25 rendered but UNQUOTABLE: `MobileNetV4RenderB.lean`
# said "do not train off these" because nothing had tied MNv4's collectives, and an untied
# collective artifact looks exactly as trustworthy as a tied one. Both halves landed 2026-08-27:
#
#       mnv4-dp-check  (duplicated batch)   fp32  bnstat BIT-EXACT 67,904/67,904, gradient 8.45e-7
#                                           bf16  BIT-EXACT on all 9,715,512 floats
#       shard-check mnv4in (asymmetric)     TEST 1.10e-6 vs CONTROL 2.00 — 1.8e6x apart
#
#   Both go RED on a sum-not-mean render, the shard TEST landing on exactly 3.000000 = |4g-g|/|g|.
#   ▶ runs/2026-08-27-mnv4-dp-shard-gates/ — logs, controls and a run.sh.
#
# ⚠⚠ FOUR REPLICAS, NOT TWO, AND THAT IS BAKED. `adamdp64` is rendered at 4 replicas only and MNv4
#   has no 2-replica peer, so a 2-GPU attempt hits the shim's replica-count guard rather than
#   degrading to a 2-way run. PJRT_REPLICAS and LEAN_MLIR_REPLICAS must BOTH be 4.
#
# ⚠ TARGET, NOT RESULT. The Conv-M reference reaches 75.51% (jax, 100 ep, OUTSIDE this repo at
#   /home/skoonce/mnv4_convm_100ep). Nothing on the verified path has been trained to convergence,
#   and the optimizer here does NOT match the reference — AdamW @1e-3/bs256 against the paper's
#   AdamW @0.004/bs4096 with drop-path, EMA and RandAugment m15. `planning/chapter_makeover.md`'s
#   MNv4 phase-4 gap list is the ledger; three of those gaps are still open.

# ▶ §2c N1: this must equal the second dash-field of the filename. supervise.sh refuses
#   otherwise — the job namespace drifted from the recipe namespace once already.
RECIPE=default
DEVS="0,2,3,4"          # the AER-clean four; idx 1 and 5 are excluded (reference_ares_pcie_aer)
EPOCHS=100              # mnv4ImagenetConfig.epochs — the Conv-M reference's tier-2 schedule length

CMD=(.lake/build/bin/mobilenetv4-imagenet-verified data)

ENV_EXTRA=(
  PJRT_PLUGIN=".venv/lib/python3.12/site-packages/jax_plugins/xla_cuda12/xla_cuda_plugin.so"
  # BOTH replica knobs, and neither is optional: PJRT_REPLICAS configures the shim's client and
  # compile options, LEAN_MLIR_REPLICAS makes the Lean driver call the data-parallel invoke.
  # Setting only one fails at the first step with a confusing "compiled for N replicas" error.
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  LEAN_MLIR_VARIANT=adamdp64         # -> verified_mlir/mnv4in_adamdp64_train_step.mlir
  LEAN_MLIR_BATCH=64                 # PER REPLICA -> global 256. BAKED into the graph: the
                                     # forwards are rendered at 64 too, because the driver scores
                                     # eval through them at the train batch.
  # ⚠⚠ REQUIRED and SILENT when absent. Device-resident parameters are opt-in and default OFF;
  # the OFF case prints NOTHING, which is how a 16 h benchmark and a 26 h production run diverged
  # unnoticed for a week on the R34 job. The 177 ms/step above was measured WITH it.
  PJRT_FFI_RESIDENT=1
  # ⚠ This net's shim is HEAVY — AutoAugment AND RandAugment per image on CPU (2 `_randaugment(`
  # call sites, 1 `_autoaugment(`). That puts it with EfficientNet/ConvNeXt/R50 rather than with
  # MobileNetV2, whose flip-only shim measurably prefers ONE producer. The 177 ms/step figure was
  # measured at 8. Do not copy mnv2's SHIM_WORKERS=1 here on the assumption that the two
  # MobileNets share a data path — the knob is per-net because the AUGMENTATION is per-net.
  # ⭐ SHIM_WORKERS=4, not 8 (changed 2026-08-31 after a measured sweep 2..16 per net).
  # MNv4 bf16 4x: w8 126.5 -> w4 85 ms/step (floor 82). 17.6 h -> 11.8 h / 100 ep. ⛔ w3 STARVES at 276 — 4 is the floor, not a midpoint.
  # ▶ Producers past ~4 add no throughput and contend with the trainer's own host thread.
  # ⛔ NOT a fleet-wide constant: EfficientNet-B0's probe is +/-30% and stayed at 8.
  SHIM_WORKERS=4
)

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs; it adapts to ambient better than a fixed schedule

CKPT_EPOCH_FILE=".lake/build/mnv4in_adamdp64_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_mnv4
precheck_mnv4() {
  local ok=0
  [ -x .venv/bin/python3 ] || { echo "missing .venv/bin/python3 (the pinned env)"; ok=1; }

  # ⚠ Check the render NAMED IN ENV_EXTRA, not a hardcoded path — this job is meant to be switched
  # to the bf16 arm by editing one line, and a precheck that verified the f32 file regardless would
  # green-light a variant that does not exist.
  local var; var="$(printf '%s\n' "${ENV_EXTRA[@]}" | sed -n 's/^LEAN_MLIR_VARIANT=//p')"
  local render="verified_mlir/mnv4in_${var}_train_step.mlir"
  [ -f "$render" ] || {
    echo "⛔ missing $render — regenerate with scripts/regen_verified_mlir.sh proofs"; ok=1; }

  # ⚠⚠ THE ONE THAT MATTERS FOR THIS JOB. 4 replicas is baked into the artifact; a mismatch fails
  # at step 0 with a shape error, ~20 min in, after the val drain. And MNv4 has no 2-replica peer
  # to fall back to, so this is not recoverable by lowering the replica count.
  if [ -f "$render" ]; then
    grep -q 'DATA-PARALLEL over 4 replicas' "$render" || {
      echo "⛔ $render is not a 4-replica render. MNv4 has no 2-replica peer; re-render or fix the"
      echo "   variant. (mnv4AdamVariant 64 4 == \"adamdp64\".)"; ok=1; }
  fi

  # ⛔ THE GATE THAT LICENSES THIS JOB AT ALL. Until 2026-08-27 this artifact was rendered and
  # explicitly not trainable, because nothing tied MNv4's collectives. If the gate binaries are
  # gone the tie is unverifiable from here, and a DP run off an unverified collective is exactly
  # what the caveat existed to prevent.
  for g in mnv4-dp-check shard-check; do
    [ -x ".lake/build/bin/$g" ] || {
      echo "⛔ missing .lake/build/bin/$g — this job's DP artifact is only quotable because that"
      echo "   gate passes. Run: lake build mnv4-dp-check shard-check"
      echo "   then runs/2026-08-27-mnv4-dp-shard-gates/run.sh"; ok=1; }
  done

  [ -f jax/.lake/build/generated_mobilenet_v4_imagenet_shim.py ] || {
    echo "⛔ missing MNv4's OWN tfds shim — scripts/gen_shims.sh"; ok=1; }

  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "PJRT_FFI_RESIDENT=1 is missing from ENV_EXTRA — residency is opt-in, defaults OFF, and"
    echo "its absence is SILENT. The 177 ms/step this job is budgeted at assumed it."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'SHIM_WORKERS=4' || {
    echo "SHIM_WORKERS=4 is missing from ENV_EXTRA. MNv4 measured 2026-08-31: 8 gives 126.5 ms/step against 4's 85 (floor 82). Do NOT go BELOW 4 either: w3 measured 276 ms/step — this net's AutoAugment+RandAugment shim starves."; ok=1; }
  return $ok
}
