# ViT-Small (DeiT-S) / ImageNet-1k, JAX REFERENCE path, the `accum` recipe (300 epochs), 4 GPUs.
#
#     setsid nohup scripts/supervise.sh vits-accum-jax-4gpu >/dev/null 2>&1 &
#
# ⚠ On mars (12 GB RTX 3060s) launch with XLA_PYTHON_CLIENT_MEM_FRACTION=0.90 (systemd-run --setenv):
# the default 0.75 is ~8.9 GiB there and the fresh start OOM'd asking for a 7.35 GiB block. At 0.90
# it trained 300 epochs at ~14.7 min an epoch (runs/2026-11-05-vits-jax-300ep/, 79.95).
#
# The JAX side of the ViT-S pair; the verified side is `vits-default-emabf16-4gpu`
# (`vitsin_emadp256x4wxdropeps0000001erfbf16`, 4 x 256 one-shot). Recipe = `vitSImagenetConfigAccum`,
# DeiT-S as timm runs it (2026-10-11; planning/recipe_prep.md §3, ch 9's S/B marker): an effective batch
# of 1024 as GRAD_ACCUM 2 micro-batches of 512 (4 x 128) — the one-shot 4 x 256 `default` trainer dies
# RESOURCE_EXHAUSTED on these cards at the default arena (12.08 GiB asked of 11.68) AND at 0.97 (14.32 of
# 15.11; runs/2026-10-11-vits-jax-smoke/), where the verified render of the same step fits the default
# (the two compilers lay the backward out differently); ViT has no BatchNorm, so the accumulation is
# exact and the pair is the same function. The 4 x 128 micro-batch runs at XLA's DEFAULT arena (the
# same smoke dir, `full_accum.log`), so unlike `vitb-accum-jax-4gpu` this conf sets no fraction — AdamW 1e-3
# (5e-4 · 1024/512), wd 0.05 off norm/bias/pos/CLS, timm's per-epoch cosine from `--warmup-lr 1e-6`
# over 5 warmup + 300 epochs floored at 1e-5, NO gradient clip (DeiT's `--clip-grad` is None), Mixup
# 0.8 or CutMix 1.0 drawn per batch at p 0.5, RandAugment m9 mstd0.5 inc1 with the geometric fill at
# timm's img_mean, random erasing 0.25, repeated augmentation x3 with the copies adjacent, drop-path
# 0.1, label smoothing 0.1 folded into the mixed target, EMA 0.99996 constant from step 0, bf16,
# trunc_normal(0.02) init, DeiT's LN ε 1e-6, the patch embed and head in fp32, and the validation
# forward in f32 (evalF32). Line for line `vitTinyImagenetConfig` at this width — DeiT's one recipe.
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo, in a lineage of their own: a `…_default_300ep/` checkpoint
# from the batch-512 clip recipe would be resumed by jax_job.sh (newest .state.npz) and is not this run.
RECIPE=accum
DEVS="0,1,2,3"
EPOCHS=300
CKPT_BASE=/home/skoonce/vit_s_jax_2611/vit_s_imagenet_accum   # the 2026-10-11 recipe (1024 as 512 x 2, no clip, timm's schedule)
PY_REL=.lake/build/generated_vit_s_imagenet_accum.py    # relative to jax/
# 2026-10-07 at batch 512: 341 ms/step, flat, tf.data-bound (runs/2026-10-07-d17-reprobe) → the 512 x 2
# smoke (runs/2026-10-11-vits-jax-smoke/) sets the pace below; the chunk planner replaces EPOCH_SECS
# with the longest epoch it times itself.
EPOCH_SECS=900   # 2026-10-11 smoke on ares at 512 x 2: 648 ms a 1024-row step (epoch 2) + 17 s the f32 validation
ETA="~70-75 h on ares at 512 x 2 (2026-10-11 smoke, runs/2026-10-11-vits-jax-smoke/: 648 ms a 1024-row optimizer step at XLA's default arena, 1,251 steps + 17 s eval an epoch, 300 ep); at batch 512 one-shot the trainer read 341 ms a 512-row step, ~71 h (2026-10-07); on mars ~14.7 min an epoch at MEM_FRACTION 0.90, ~72 h (runs/2026-11-05-vits-jax-300ep/)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_vits_accum_jax
precheck_vits_accum_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  . scripts/lib/precheck.sh; pc_crop "jax/$PY_REL" torchvision || ok=1   # train crop + resize kernel
  pc_gelu "jax/$PY_REL" exact || ok=1   # nn.GELU's x·Φ(x), not the tanh approximation
  pc_jax_trainer || ok=1
  pc_aug_call "jax/$PY_REL" '_randaugment(img, 2, 9.000000, 0.500000)' "DeiT RandAugment m9 mstd0.5" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "DeiT's recipe is RandAugment only" || ok=1
  grep -q 'one_hot(y, 1000) \* (1.0 - 0.100000) + 0.100000 / 1000' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL mixes raw one-hots — it predates 4b765be7 and trains at label smoothing 0"; ok=1; }
  grep -q '(timm trunc_normal std=0.02)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no DeiT init — re-emit"; ok=1; }
  # recipe_prep R4: the patch-embed BIAS on PyTorch's Conv2d default too (`initPatchEmbedBiasTorch`),
  # as the verified peer's init kind 8. The landed Ti pair started it at 0 (disclosed); this pair does not.
  grep -q 'patch-embed bias: PyTorch Conv2d default, not 0 (initPatchEmbedBiasTorch)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL starts the patch-embed bias at 0 — re-emit (initPatchEmbedBiasTorch, recipe_prep R4)"; ok=1; }
  # 2026-10-05 parity with the verified eps0000001 render (ViT-Ti's 10-01 items): DeiT's LN ε, fp32
  # patch embed + head
  grep -q 'jnp.sqrt(var + 0.000001)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's layer_norm is not at ε 1e-6 — re-emit (lnEps)"; ok=1; }
  [ "$(grep -c 'x = jnp.matmul(x, params\[' "jax/$PY_REL")" = "2" ] || {
    echo "⛔ jax/$PY_REL does not keep the patch embed AND the head in fp32 — re-emit (f32StemHead)"; ok=1; }
  # ⭐ 2026-10-11, DeiT as timm runs it (planning/recipe_prep.md §3; ch 9's S/B marker). Each line below
  # is the emitted text of one recipe item; a trainer missing any of them is the 10-05 recipe.
  grep -q '^LR = 0.001000' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not at DeiT's lr 1e-3 for batch 1024 (5e-4 · 1024/512) — re-emit"; ok=1; }
  # The accumulation geometry: 2 micro-batches of 512; the verified render is the one-shot 4 x 256.
  grep -q '^GRAD_ACCUM = 2$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not the 512 × 2 accumulation trainer (GRAD_ACCUM 2)"; ok=1; }
  grep -q 'MICRO_BATCH = (512 // n_devices)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's micro-batch is not 512 (4 x 128) — re-emit"; ok=1; }
  grep -q 'BATCH_SIZE = MICRO_BATCH \* GRAD_ACCUM' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL does not accumulate to the effective batch — re-emit"; ok=1; }
  grep -q 'lr = jnp.float32(0.000010 + 0.5 \* (LR - 0.000010) \* (1 + np.cos(np.pi \* epoch / EPOCHS)))' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's schedule is not timm's per-epoch cosine over all 300 epochs (schedPerEpoch) — re-emit"; ok=1; }
  grep -q 'lr = jnp.float32(0.000001 + epoch \* (LR - 0.000001) / 5)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL does not warm up from timm's 1e-6 once per epoch (warmupLRInit) — re-emit"; ok=1; }
  grep -q 'random() < 0.500000' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL alternates Mixup/CutMix by step — timm draws one per batch at p 0.5 (mixSwitchProb)"; ok=1; }
  grep -q '^_RA_FILL = tf.constant(\[124.0, 116.0, 104.0\])' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL fills RandAugment's geometric ops with 128, not timm's img_mean (randAugmentFillMean)"; ok=1; }
  grep -q '# repeatedAugAdjacent' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL re-shuffles the 3 repeated-augmentation copies apart (repeatedAugAdjacent)"; ok=1; }
  grep -q 'DT = jnp.float32; CONV_DT = jnp.float32   # evalF32' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL scores through its bf16 training forward, not f32 (evalF32)"; ok=1; }
  grep -q 'd = EMA_DECAY   # emaWarmup off' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL ramps the EMA decay in — DeiT's ModelEma holds it from step 0 (emaWarmup)"; ok=1; }
  if grep -q 'gn = jnp.sqrt(sum(jnp.sum(g \* g)' "jax/$PY_REL"; then
    echo "⛔ jax/$PY_REL clips gradients — DeiT does not (--clip-grad None; runs/2026-10-11-vit-clipoff-probe/)"; ok=1; fi
  pc_gpu_idle || ok=1
  return $ok
}
