# cnxs-default-emabf16-4gpu.conf — ConvNeXt-S / ImageNet-1k, VERIFIED path, EMA + bf16, 300 epochs.
#
#     scripts/supervise.sh cnxs-default-emabf16-4gpu
#
# The verified peer of `cnxs-default-jax-4gpu`: ConvNeXt-T's pair recipe (`cnx-default-emabf16-4gpu`)
# at S's depth — AdamW 2.5e-4 at 64 × 4 = global 256, wd 0.05 off norm/bias, clip 1.0, drop-path 0.4
# (the spec's ramp), label smoothing 0.1 (baked), EMA 0.9999, bf16, ConvNeXt init (cnxInit), 20
# warmup epochs, RandAugment m9 + pixel erasing + mixup/cutmix from ConvNeXt's shim, eval every 5.
# `cnxs-default-4gpu` is the older f32 4 × 32 sibling.
# Score at timm's test protocol afterwards: 288 / 1.0 through `convnextsin_fwd_s288`.
#
# ⚠ Open recipe decisions (planning/imagenet_parity.md §5.4): exact-erf vs tanh GELU, the clip at
#   300 epochs. This conf takes T's answers.

# ▶ §2c N1: this must equal the second dash-field of the filename.
RECIPE=default
DEVS="0,1,2,3"
EPOCHS="${EPOCHS:-300}"
ETA="bf16 ~156 h for 300 ep on 4x 4060 Ti (mean 373 / median 372 ms/step; measured 2026-10-05, runs/2026-10-04-dimm-fan-thermal); peak 6.80 GiB of the 11.68 default (compile probe 2026-09-29)"

CMD=(.lake/build/bin/convnext-s-imagenet-verified data)

. "$(dirname "${BASH_SOURCE[0]}")/_box.sh"   # BOX, BOX_PLUG, BOX_PY, BOX_SHIMPY
VARIANT=emadpwxclipdropbf16
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⛔ `adamdpwxclipdropbf16` is one marker away, at batch 32 and without the shadow.
  LEAN_MLIR_VARIANT=$VARIANT
  LEAN_MLIR_BATCH=64                 # PER REPLICA -> global 256; the render bakes it
  LEAN_MLIR_EPOCHS=300               # SETS the cosine; MAX_EPOCHS would only cap it
  LEAN_MLIR_BASE_LR_U=250            # 2.5e-4, the reference's rate at global 256
  SHIM_WORKERS=4                     # ConvNeXt-T's measured best (w8 145.5 vs w4 126 ms/step)
  LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10
)

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs
STALL_SECS=3600         # 1,419 operands; the first compile needs the longer window

CKPT_EPOCH_FILE=".lake/build/convnextsin_${VARIANT}_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_cnxs_emabf16
precheck_cnxs_emabf16() {
  . scripts/lib/precheck.sh
  local ok=0
  local render="verified_mlir/convnextsin_${VARIANT}_train_step.mlir"
  pc_box || ok=1
  pc_render convnextsin "$VARIANT" 4 344 || ok=1
  pc_ckpt convnextsin "$VARIANT" || ok=1
  if [ -f "$render" ]; then
    grep -q 'tensor<64x3x224x224' "$render" || {
      echo "⛔ $render does not bake a 64-wide input."; ok=1; }
    grep -q 'stablehlo.constant dense<64.0> : tensor<64x1000xf32>' "$render" || {
      echo "⛔ $render's loss divisor is not 64.0 on a 64-row tensor."; ok=1; }
    # the shadow's scalar pair; the non-EMA sibling has neither
    grep -q '%oemad: tensor<f32>' "$render" || {
      echo "⛔ $render carries no EMA shadow (no %oemad operand)."; ok=1; }
  fi
  if [ -x .lake/build/bin/vit-ema-drop-render ]; then
    .lake/build/bin/vit-ema-drop-render convnextsin >/dev/null 2>&1 || {
      echo "⛔ vit-ema-drop-render convnextsin FAILED — run it directly for the diagnosis."; ok=1; }
  else
    echo "⚠ vit-ema-drop-render not built (lake build vit-ema-drop-render) — layout gate skipped."
  fi
  pc_exe convnext-s-imagenet-verified LeanMlir/Verified/Train.lean ffi/f32_helpers.c \
    apps/imagenette/MainConvNeXtSImagenet.lean || ok=1
  pc_pjrt_so || ok=1
  pc_jax_box || ok=1
  pc_shim convnext_tiny_imagenet || ok=1
  local shim=jax/.lake/build/generated_convnext_tiny_imagenet_shim.py
  pc_aug_call "$shim" '_randaugment(img, 2, 9.0' "RandAugment N2 m9" || ok=1
  pc_aug_no_call "$shim" '_autoaugment(' "not in ConvNeXt's recipe" || ok=1
  pc_env LEAN_MLIR_BATCH=64 "the render bakes 64" || ok=1
  pc_env LEAN_MLIR_EPOCHS=300 "MAX_EPOCHS only CAPS, it cannot SET the cosine" || ok=1
  pc_env LEAN_MLIR_BASE_LR_U=250 "lr 2.5e-4, the reference's rate at global 256" || ok=1
  pc_env SHIM_WORKERS=4 "ConvNeXt's measured best producer count" || ok=1
  pc_env_absent LEAN_MLIR_MEM_FRACTION "S fits the default arena (6.80 GiB); 0.97 OOMs ConvNeXt's bf16 arms" || ok=1
  pc_gpu_idle || ok=1
  return $ok
}
