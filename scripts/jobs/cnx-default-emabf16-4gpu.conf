# ConvNeXt-T / ImageNet-1k, VERIFIED path — the shipping recipe WITH THE EMA SHADOW, bf16, 4 GPUs.
#
#     ./run_cnx_verified.sh                       # = scripts/supervise.sh cnx-default-emabf16-4gpu
#
# ▶ `cnx-default-4gpu` with one change: `emadpwxclipdropbf16` for `adamdpwxclipdropbf16`, i.e. the
#   same graph (wd 0.05 off norm/bias, clip 1.0, drop-path, bf16, 4 x 64 = global 256, lr 2.5e-4)
#   plus a model-EMA shadow, decay 0.9999 warmup-corrected, advanced once per step on the UPDATED
#   weights — what `convNeXtTinyImagenetConfig.useEMA` asks for and what the JAX reference's
#   81.53 / 95.51 is scored on. Eval and checkpoint score the SHADOW. (2026-09-25)
#
# This file SOURCES cnx-default-4gpu.conf and swaps the variant, so the batch, LR, schedule, shim
# workers, loader respawn, thermal policy and PRECHECK are that conf's, and its header is the
# record for them (the batch-64 rescope, the 2026-09-17 throughput sweep, the pair's claims).
#
# ⚠ Why this job exists: the non-EMA run (runs/2026-09-18-cnx-verified-300ep, 81.30 raw) was
#   paired against a reference that scores its EMA shadow; this is the pair's missing half.
# ⚠ Never run on a GPU as of e38e56ab: a smoke + resume test is owed before the 300-epoch launch.
# ⚠ A new variant is a new checkpoint (`convnextin_emadpwxclipdropbf16_ckpt_xla.bin`, 4 regions); it
#   cannot resume a run of the non-EMA variant, and the driver's size guard refuses if asked to.

. "$(dirname "${BASH_SOURCE[0]}")/cnx-default-4gpu.conf"

VARIANT=emadpwxclipdropbf16
ENV_EXTRA=("${ENV_EXTRA[@]/#LEAN_MLIR_VARIANT=*/LEAN_MLIR_VARIANT=$VARIANT}")
CKPT_EPOCH_FILE=".lake/build/convnextin_${VARIANT}_ckpt_xla.bin.epoch"

# ⚠ The non-EMA variant's measured epoch (1,120 s of steps + 105 s eval/ckpt). The shadow adds one
#   elementwise pass over the 28.6M parameters per step and nothing has timed it; re-probe owed.
ETA="bf16 ~107 h on 4x 4060 Ti: PROBED 2026-09-25 on this variant at 237 ms/step median (240 mean, 5,004 steps = 1,186 s) + ~105 s/epoch eval/ckpt from the non-EMA run, 300 ep; ~102 h on 4x 3060 (the non-EMA variant, MEASURED)"
