# ViT-Base (DeiT-B) / ImageNet-1k, VERIFIED path (Lean → StableHLO → XLA/PJRT), 4 GPUs.
#
#     scripts/supervise.sh vitb-default-g512-4gpu
#
# 4 replicas × bs 128 = global 512, 2,502 steps/epoch. That is DeiT-B's batch, which is why the
# recipe's baseLR = 5e-4 is the right rate here and was not at the deleted 32×4 (global 128).
#
# ⭐ MEASURED 2026-08-27, 40 steps: 1,381 ms/step fp32, 837 bf16 ⇒ 291 h (12.1 d) and 178 h
#   (7.4 d) for 300 epochs incl. 37.5 s/epoch eval + ckpt. Compute-bound: the feed costs ~85 ms
#   and hides. ▶ bf16 is the arm worth running.
#
# ⚠⚠ LEAN_MLIR_MEM_FRACTION IS NOT OPTIONAL AND DOES NOT DEGRADE — it dies. The fp32 graph peaks
#   at 13.99 GiB against the plugin's default 11.68 arena, so the first step raises
#   RESOURCE_EXHAUSTED on all four devices. There is no small-batch fallback; the driver refuses
#   without it. ⚠ It also only works if ffi/libpjrt_ffi.so was rebuilt after the allocator-options
#   change — that shim is not a lake target. Both are prechecked below.
#   ▶ runs/2026-08-27-vitb-global512/

# ▶ §2c N1: this must equal the second dash-field of the filename. supervise.sh refuses otherwise.
# ⚠ The net token is `vitb`, not `vit-b`. The engine splits the filename on dashes, so a net whose
#   token contains one would make `<recipe>` read as `b` — supervise.sh's header says as much
#   ("a net whose name contains a dash would break the field split — none does") and this is the
#   first net whose EXE name (`vit-b-imagenet-verified`, N4's hyphenated size) would have.
#   The exe spelling and the job token are different namespaces; N4 governs the first only.
RECIPE=default
DEVS="0,1,2,3"          # all four cards; the two PCIe-AER cards (old idx 1 and 5) were pulled 2026-09-08
EPOCHS=300              # vitBImagenetConfig.epochs — the DeiT schedule length
# ETA re-measured 2026-09-10, runs/2026-09-10-bf16-probe-4060ti (mean, 400-step window from step 200)
ETA="bf16 ~170 h (7.1 d) / f32 ~286 h (11.9 d) on 4x 4060 Ti (799 / 1359 ms/step median, 300 ep)"

CMD=(.lake/build/bin/vit-b-imagenet-verified data)

# Box selection (copied from r50-2018-bf16-4gpu.conf, f3d89574): the repo venv's cuda12 plugin if
# it is there, else the 3060 box's cuda13.
#   * ares: the repo's pinned `.venv` with the xla_cuda12 plugin, no SHIM_PYTHON needed.
#   * the 3060 box: /home/skoonce/.venv-cuda with xla_cuda13 (driver 610.57.04 / CUDA 13.3), and
#     SHIM_PYTHON is REQUIRED because that box's .venv/bin/python3 is a WRAPPER that execs the
#     retired ROCm venv (lean4-jax/.venv), which no longer has a usable jax.
# ⛔ Until 2026-09-10 this conf hardcoded ares' xla_cuda12 path and carried no SHIM_PYTHON, so on
#   the 3060 box it died at step 0 with a plugin-load error. Fixing ffi/pjrt_ffi.c's default plugin
#   search list (it knows xla_cuda12 + xla_rocm7, not xla_cuda13) would delete PJRT_PLUGIN from
#   every conf and this block with it.
ARES_PLUG=".venv/lib/python3.12/site-packages/jax_plugins/xla_cuda12/xla_cuda_plugin.so"
if [ -f "$ARES_PLUG" ]; then
  BOX=ares;  BOX_PLUG="$ARES_PLUG"; BOX_PY=".venv/bin/python3"; BOX_SHIMPY=()
else
  BOX=3060;  BOX_PLUG="/home/skoonce/.venv-cuda/lib/python3.12/site-packages/jax_plugins/xla_cuda13/xla_cuda_plugin.so"
  BOX_PY="/home/skoonce/.venv-cuda/bin/python3"; BOX_SHIMPY=(SHIM_PYTHON="$BOX_PY")
fi
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⚠⚠ LOAD-BEARING. See the header — without this the first step is RESOURCE_EXHAUSTED, not a
  # slower run. The shim announces it: `[pjrt_ffi] allocator: 1 create option(s),
  # memory_fraction=0.970`. If that line is absent from the log, the option did not reach PJRT.
  LEAN_MLIR_MEM_FRACTION=0.97
  # ⚠ The variant name must match the render's baked batch or the shim refuses the call. This is
  # also the driver's default now, so the line is a restatement rather than an override — kept
  # because a job config that reads correctly on its own is worth one redundant line.
  LEAN_MLIR_VARIANT=adamdp128x4wxclipdrop
  LEAN_MLIR_BATCH=128                # PER REPLICA ⇒ global 512
  PJRT_FFI_RESIDENT=1
  # ⚠ Worth 6.5× on ViT-Tiny's job. Kept at 8 here for the same reason (32 cores), though this
  # net is predicted compute-bound and may not need all of them.
  SHIM_WORKERS=8
)

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

CKPT_EPOCH_FILE=".lake/build/vitbin_adamdp128x4wxclipdrop_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_vitb
precheck_vitb() {
  [ -x .venv/bin/python3 ] || { echo "missing .venv/bin/python3 (the pinned env)"; return 1; }
  [ -f verified_mlir/vitbin_adamdp128x4wxclipdrop_train_step.mlir ] || {
    echo "missing the 128×4 render — lake build LeanMlir.Proofs.Codegen.ViTRenderB"; return 1; }
  [ -f jax/.lake/build/generated_vit_tiny_imagenet_shim.py ] || {
    echo "missing ViT's OWN tfds shim — scripts/gen_shims.sh"; return 1; }

  # ⚠⚠ THE TWO CHECKS THIS JOB EXISTS FOR. Everything else here is copied from vit-default.
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_MEM_FRACTION=0.97' || {
    echo "LEAN_MLIR_MEM_FRACTION=0.97 is missing from ENV_EXTRA."
    echo "This graph peaks at 13.99 GiB. The plugin's default arena is 11.68. Without the"
    echo "option the FIRST STEP dies RESOURCE_EXHAUSTED on all four devices — it does not"
    echo "run slower, it does not fall back to a smaller batch, it stops."; return 1; }

  # ⚠⚠ AND THE OPTION IS ONLY REAL IF THE SHIM WAS REBUILT. `ffi/pjrt_ffi.c` IS NOT A LAKE
  # TARGET: editing it and running `lake build` reports SUCCESS without recompiling it, so a
  # tree that has the source fix can still be running a shim that ignores the variable — and
  # the failure would look exactly like the OOM above, i.e. like a hardware limit.
  [ -f ffi/libpjrt_ffi.so ] || { echo "ffi/libpjrt_ffi.so is missing — build the PJRT shim"; return 1; }
  strings ffi/libpjrt_ffi.so 2>/dev/null | grep -q memory_fraction || {
    echo "ffi/libpjrt_ffi.so does not contain the string \`memory_fraction\`, so the built shim"
    echo "predates the allocator-options change and LEAN_MLIR_MEM_FRACTION will be IGNORED."
    echo "Rebuild it (the gcc one-liner in ffi/); \`lake build\` will not."; return 1; }

  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "PJRT_FFI_RESIDENT=1 is missing from ENV_EXTRA — opt-in, defaults OFF, silent."; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'SHIM_WORKERS=8' || {
    echo "SHIM_WORKERS=8 is missing from ENV_EXTRA."; return 1; }

  # ⚠ The batch in ENV_EXTRA and the batch BAKED into the artifact are two spellings of one
  # number, and only one of them is checked by the shim's buffer-count refusal at step 1.
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_BATCH=128' || {
    echo "LEAN_MLIR_BATCH must be 128 to match the render named by LEAN_MLIR_VARIANT."; return 1; }
  return 0
}
