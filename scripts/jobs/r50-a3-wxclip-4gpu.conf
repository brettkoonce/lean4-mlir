# ResNet-50 / ImageNet-1k, RSB-A3, VERIFIED path — the `wx` + `clip` artifact.
#
#     scripts/supervise.sh r50-a3-wxclip-4gpu
#
# ⭐ WHY THIS EXISTS ALONGSIDE `r50-a3-4gpu.conf` RATHER THAN REPLACING ITS VARIANT.
# That config records a COMPLETED run (`lambaccdp8x64bce`, 77.43% on 2026-08-07, leg 1 + leg 2
# measured in its own comments). Editing its variant in place would leave those measurements
# describing a run nobody could reproduce from the file that claims them. This is the sibling for
# the NEXT artifact; the two differ in exactly two knobs, both named in the variant string.
#
# `lambaccdp8x64wxclipbce` = `lambaccdp8x64bce` + `wx` + `clip`:
#   wx    — wdExcludeNormBias, timm's no_weight_decay list (BN γ/β + biases skip weight decay)
#   clip  — D1's gradient clip at 1.0
# Both are `planning/a3_paper_fidelity.md` deltas that were open when the 77.43% run went out, so
# this is the artifact `planning/verified_optimizer_parity.md:289` calls "the one that most nearly
# implements RSB-A3 on paper".
#
# ⭐ THE CLIP IS FREE. Profiled 2026-08-15 at 206 ms/step (4×bs64, 160², synth) — identical to the
# baseline, so `clip` costs nothing in wall clock and the ETA below is the unchanged one.
#
# ⚠ ITS JAX PEER IS `rsb-faithful`, AND THE PAIRING IS DELIBERATE. `planning/imagenet_rerun_sweep.md`
# §5 refuses to let this run be quoted without a reference measured under the same rules. Checked
# 2026-08-16: `resnet50ImagenetConfigRSBFaithful` already sets `wdExcludeNormBias := true` and
# inherits `gradClipNorm := 1.0` from the base (MainResnet50Imagenet.lean:104), plus BCE, LAMB,
# 100 epochs and effective batch 2048 — so the reference needs NO edit to be a one-variable peer.
#
#   ▶ THE ONE REMAINING SHAPE DIFFERENCE, and it is not fixable without changing a recipe:
#     this path accumulates 8 × 256 (4 replicas × bs64); the JAX peer accumulates 4 × 512
#     (512 sharded 4 × 128). Both reach effective 2048, but BN normalises over 64/GPU here and
#     128/GPU there — different Ghost-BN granularity. Do not attribute a small verified-vs-
#     reference gap to the verified path without accounting for it.
#
# ETA ≈ 31–34 h (see r50-a3-4gpu.conf's measured 240 ms/step breakdown; nothing here moves it).

# ▶ §2c N1: this must equal the second dash-field of the filename. supervise.sh refuses
#   otherwise — the job namespace drifted from the recipe namespace once already.
RECIPE=a3
DEVS="0,2,3,4"          # the AER-clean four; idx 1 (bus 02) and idx 5 (bus 62) threw BadTLP
EPOCHS="${EPOCHS:-100}" # RSB-A3's own length; the compiled-in cosine is the 100-epoch one

CMD=(.lake/build/bin/resnet50-imagenet-verified data)

ENV_EXTRA=(
  PJRT_PLUGIN=".venv/lib/python3.12/site-packages/jax_plugins/xla_cuda12/xla_cuda_plugin.so"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⚠ The name is not the evidence — this must match a render that actually exists; PRECHECK
  # checks the file rather than trusting the string.
  LEAN_MLIR_VARIANT=lambaccdp8x64wxclipbce
  LEAN_MLIR_RES=160                  # selects the NET SPEC (slug resnet50in160, the _short_ shim)
  LEAN_MLIR_BATCH=64                 # PER REPLICA
  # ⚠⚠ 8000 × 1e-6 = 0.008, RSB-A3's 8e-3 @ bs2048. The driver defaults to 0.001 — AdamW's rate,
  # 8× low — and 8× low still descends and reports a number. PRECHECK refuses without it.
  LEAN_MLIR_BASE_LR_U=8000
  # ⚠⚠ LOAD-BEARING. 5004 micro-batches/epoch is not divisible by k=8; the driver throws rather
  # than applying a short cycle at a wrong scale — but only AFTER the ~28 GB drain, ~20 min in.
  # 5000 = 8 × 625 drops 4 micro-batches/epoch (0.08%) and makes every epoch boundary a cycle
  # boundary, which is what makes crash-resume safe with accumulation on.
  LEAN_MLIR_G2_STEPS=5000
  # ⚠⚠ Device-resident parameters are OPT-IN, default OFF, and their absence is SILENT — the way
  # a 16 h benchmark and a 26 h production run diverged unnoticed for a week.
  PJRT_FFI_RESIDENT=1
  # ⚠⚠ One tf.data producer saturates ~3 cores and stays there. This net's shim runs RandAugment
  # m6 per image; one producer put EfficientNet at 2,061 ms/step against 203 on eight.
  SHIM_WORKERS=8
)

# Thermal: this box has no fans on. Temperature-driven resting adapts to ambient instead of
# guessing, which is why the engine supports it.
TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

# The trainer writes .lake/build/<slug>_<variant>_ckpt_xla.bin{,.epoch} each epoch and resumes
# from them automatically — no resume env var to thread, unlike the JAX path.
# ⚠ The variant is IN THE FILENAME, so this is a fresh checkpoint lineage: it will NOT pick up the
# completed `lambaccdp8x64bce` run's epoch 100 and declare itself done.
CKPT_EPOCH_FILE=".lake/build/resnet50in160_lambaccdp8x64wxclipbce_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_r50_wxclip
precheck_r50_wxclip() {
  # ▶ §2c N1, the R50 half: `a3` is not a `LEAN_MLIR_RECIPE` string, it is `LEAN_MLIR_RES=160`.
  # The engine checks RECIPE against the filename; only this file knows what selects `a3`.
  # ⚠ And LEAN_MLIR_RECIPE must stay ABSENT: `MainResnet50Imagenet.lean:93` THROWS on any
  # non-default recipe at 160, because 2018 is a 224/224 recipe and the two selectors cannot
  # both move. A conf that "helpfully" spelled `LEAN_MLIR_RECIPE=a3` would not start.
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_RES=160' || {
    echo "⛔ RECIPE=a3 but LEAN_MLIR_RES=160 is missing from ENV_EXTRA. 160 is what SELECTS A3:"
    echo "   slug resnet50in160, d0 76800, and the _short_ shim. Without it this trains 224."; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -q '^LEAN_MLIR_RECIPE=' && {
    echo "⛔ LEAN_MLIR_RECIPE is set alongside LEAN_MLIR_RES=160 — the driver throws on that"
    echo "   pairing. A3 is selected by the resolution alone."; return 1; }
  [ -x .venv/bin/python3 ] || { echo "missing .venv/bin/python3 (the pinned env)"; return 1; }
  [ -f verified_mlir/resnet50in160_lambaccdp8x64wxclipbce_train_step.mlir ] || {
    echo "missing the wx+clip A3 render — build LeanMlir.Proofs.Codegen.ResNet50RenderB"; return 1; }
  # ⚠ eval is @224 off a SEPARATE artifact — the train@160/eval@224 split is the A3 signature.
  [ -f verified_mlir/resnet50in160_fwd_eval.mlir ] || {
    echo "missing the @224 eval forward — the 160 net would be untrainable-to-a-number"; return 1; }
  # ⚠ The `_short_` shim, NOT generated_resnet50_imagenet_shim.py. Both exist; only this one emits
  # A3's split (76,800 floats/img train @160, 150,528 @224 val) and RandAugment m6.
  [ -f jax/.lake/build/generated_resnet50_imagenet_short_shim.py ] || {
    echo "missing R50's A3 shim (160/224 split, RandAugment m6) — scripts/gen_shims.sh"; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "PJRT_FFI_RESIDENT=1 is missing — residency is opt-in and defaults OFF, and nothing in"
    echo "the run's output says which path it took."; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'SHIM_WORKERS=8' || {
    echo "SHIM_WORKERS=8 is missing. RandAugment m6 per image on one producer is a ~10x wall-clock"
    echo "penalty with NOTHING in the log to say so."; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_BASE_LR_U=8000' || {
    echo "LEAN_MLIR_BASE_LR_U=8000 (lr 0.008) is missing. The driver defaults to 0.001 — AdamW's"
    echo "rate, 8x below RSB-A3's 8e-3 @ bs2048."; return 1; }
  local g2; g2="$(printf '%s\n' "${ENV_EXTRA[@]}" | sed -n 's/^LEAN_MLIR_G2_STEPS=//p')"
  [ -n "$g2" ] || { echo "LEAN_MLIR_G2_STEPS is missing — the driver refuses AFTER the 28 GB drain."
    return 1; }
  [ $(( g2 % 8 )) -eq 0 ] || {
    echo "LEAN_MLIR_G2_STEPS=$g2 is not a multiple of k=8: the last cycle of every epoch would"
    echo "apply $(( g2 % 8 )) micro-batches' gradient still divided by 8."; return 1; }
  # ⚠⚠ THE SPIN. A loop cap below the completion bar makes the driver exit at the cap, the
  # supervisor relaunch, and the driver resume into an EMPTY epoch range — writing nothing while
  # looking like a job that is running, until all 60 attempts burn.
  local me; me="$(printf '%s\n' "${ENV_EXTRA[@]}" | sed -n 's/^LEAN_MLIR_MAX_EPOCHS=//p')"
  if [ -n "$me" ] && [ "$EPOCHS" -gt "$me" ]; then
    echo "LEAN_MLIR_MAX_EPOCHS=$me caps the driver's loop below EPOCHS=$EPOCHS — the supervisor"
    echo "would relaunch forever into an empty epoch range. Delete the MAX_EPOCHS line."; return 1
  fi
  return 0
}
