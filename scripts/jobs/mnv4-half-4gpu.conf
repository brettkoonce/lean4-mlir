# MobileNetV4-Conv-M / ImageNet-1k, VERIFIED path, `half` recipe (50 epochs), 4 GPUs, bf16.
#
#     START_AT=00:00 STOP_AT=08:00 setsid nohup scripts/supervise.sh mnv4-half-4gpu >/dev/null 2>&1 &
#
# The verified half of the 50-epoch pair (planning/mnv4_half_pair.md); the JAX half is
# `mnv4-half-jax-4gpu`. The JAX reference's tier-2 recipe with the cosine over 50 epochs, on the
# timm-parity net (90e4af7e):
#   * AdamW 0.004, 8 accumulated micro-batches of 4 × 128 = effective 4096. The JAX reference runs
#     512 × accum 8, and its BN group is the 512 micro-batch; sync-BN over 4 × 128 is the same 512.
#   * 2,496 micro-batches per epoch (`LEAN_MLIR_G2_STEPS`) = 312 optimizer steps, the reference's
#     1,281,167 // 4096. The driver refuses a cycle that straddles an epoch, and 2,502 is not a
#     multiple of 8.
#   * wd 0.05 off BN γ/β and biases (`wx`, `wd005`), LS 0.1, classifier dropout 0.1 (`do`, keep
#     0.9 from `mnv4ImagenetVerified.dropoutKeep`), EMA 0.9999 warmup-corrected (`ema`), warmup 5.
#   * RandAugment N2 m9 from the shim, byte-identical to the reference's augmentation block.
#   * Eval every 5 epochs and at the last, on the EMA shadow with its BN running stats, through
#     `mnv4in_fwd_eval.mlir` at batch 64 (the driver reads the eval batch off that artifact).
# Gates: `mnv4-dp-check` on this pair (duplicated batch, five regions + mask),
# `dropout-tie --net` on this render, `variant-predicates` for the name.
RECIPE=half
DEVS="0,1,2,3"
EPOCHS=50
# 2026-09-25 probe (runs/2026-09-25-mnv4-timm-probe): 4 × 128 bf16 fed at 4 workers, median 260 /
# mean 362 ms per micro-batch → 11-15 min per epoch. The chunk planner replaces this with the
# longest epoch it times itself.
EPOCH_SECS=960
ETA="~11-15 h for 50 ep on 4x 4060 Ti (260 median / 362 mean ms per 4x128 micro-batch, 2,496 per epoch)"

CMD=(.lake/build/bin/mobilenetv4-imagenet-verified data)

. "$(dirname "${BASH_SOURCE[0]}")/_box.sh"   # BOX, BOX_PLUG, BOX_PY, BOX_SHIMPY
VARIANT=emaaccdp8x128wxdowd005bf16
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4                    # both replica knobs; see mnv4-default-4gpu.conf
  LEAN_MLIR_REPLICAS=4
  LEAN_MLIR_VARIANT=$VARIANT
  LEAN_MLIR_BATCH=128                # PER REPLICA, baked into the render
  LEAN_MLIR_EPOCHS=50                # = EPOCHS; sets the cosine length as well as the loop bound
  LEAN_MLIR_BASE_LR_U=4000           # 0.004, the reference's peak at effective 4096
  LEAN_MLIR_G2_STEPS=2496            # 312 × k: whole accumulation cycles, the reference's 312 steps
  LEAN_MLIR_VAL_EVERY=5              # the reference's cadence; the last epoch is always scored
  PJRT_FFI_RESIDENT=1                # opt-in and SILENT when absent
  SHIM_WORKERS=4                     # measured best at 4 × 128 too (6: 282/523, 8: 320/678 ms)
)

TEMP_MAX=78
TEMP_RESUME=62

CKPT_EPOCH_FILE=".lake/build/mnv4in_${VARIANT}_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_mnv4_half
precheck_mnv4_half() {
  local ok=0
  local render="verified_mlir/mnv4in_${VARIANT}_train_step.mlir"
  [ -f "$render" ] || { echo "⛔ missing $render — scripts/regen_verified_mlir.sh proofs"; ok=1; }
  [ -f "$render" ] && ! grep -q 'DATA-PARALLEL over 4 replicas' "$render" && {
    echo "⛔ $render is not a 4-replica render"; ok=1; }
  # ⛔ BUILD the trainer, don't just check it exists: `lake build Apps` does not cover this exe, and a
  # binary older than `mnv4ImagenetVerified.dropoutKeep` passes no dropout mask and fails at the
  # first step (hit 2026-09-25). A no-op when fresh.
  lake build mobilenetv4-imagenet-verified >/dev/null 2>&1 || {
    echo "⛔ lake build mobilenetv4-imagenet-verified failed"; ok=1; }
  [ -f jax/.lake/build/generated_mobilenet_v4_imagenet_shim.py ] || {
    echo "⛔ missing MNv4's tfds shim — scripts/regen_jax_generated.sh sync"; ok=1; }
  scripts/regen_jax_generated.sh box >/dev/null 2>&1 || {
    echo "⛔ jax/.lake/build differs from jax/generated/ (the shim is read from there) — scripts/regen_jax_generated.sh sync"; ok=1; }
  . scripts/lib/gpu.sh
  if gpu_busy; then echo "⛔ GPUs are not idle"; ok=1; fi
  return $ok
}
