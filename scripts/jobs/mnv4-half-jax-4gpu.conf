# MobileNetV4-Conv-M / ImageNet-1k, JAX REFERENCE path, `half` recipe (50 epochs), 4 GPUs.
#
#     START_AT=00:00 STOP_AT=08:00 setsid nohup scripts/supervise.sh mnv4-half-jax-4gpu >/dev/null 2>&1 &
#
# The JAX half of the 50-epoch pair (planning/mnv4_half_pair.md); the verified half is
# `mnv4-half-4gpu`. Recipe = the tier-2 `default` (AdamW 0.004 @ 4096 = 512 × accum 8, wd 0.05
# not on norm/bias, LS 0.1, dropout 0.1, RandAugment N2 m9, EMA 0.9999, eval every 5 epochs on
# running BN) with the cosine over 50 epochs. bf16. On the timm-parity net (90e4af7e).
#
# The first JAX-path conf for this engine. Until now the reference ran from
# jax/scripts/supervise_mnv4_convm_100ep_4gpu_duty.sh; CMD below is that script's launch, and
# `epoch_now` reads its checkpoints:
#   * `LEAN_MLIR_CKPT_EVERY=1` writes `<base>_e<N>.bin` + `<base>_e<N>.state.npz` every epoch.
#     The pruner keeps the 3 newest `.state.npz`, and the newest is complete (atomic rename).
#   * `LEAN_MLIR_RESUME=<newest .state.npz>` resumes bit for bit, so an overnight chunk that stops
#     on an epoch boundary continues exactly where it stopped.
#   * `JAX_COMPILATION_CACHE_DIR`: the cold compile is ~15 min (UIB has many conv shapes). The
#     cache makes it once per graph, not once per chunk.
# ⚠ Checkpoints live OUTSIDE the repo, like the 100-epoch reference's (~/mnv4_convm_100ep).
RECIPE=half
DEVS="0,1,2,3"
EPOCHS=50
CKPT_BASE=/home/skoonce/mnv4_timm_half50/mobilenet_v4_imagenet
PY_REL=.lake/build/generated_mobilenet_v4_imagenet_half.py    # relative to jax/
# ~9.0 min/epoch on the pre-timm net; the timm net's compute floor is ~10% higher on the verified
# path. The chunk planner replaces this with the longest epoch it times itself.
EPOCH_SECS=660
ETA="~9-10 h for 50 ep on 4x 4060 Ti (the 100-ep reference ran ~16 h on the pre-timm net)"

CMD=(bash -c '
  set -u
  base='"$CKPT_BASE"'
  last=""; n=0
  for f in "${base}"_e*.state.npz; do
    [ -e "$f" ] || continue
    k="${f##*_e}"; k="${k%.state.npz}"
    [ "$k" -gt "$n" ] && { n="$k"; last="$f"; }
  done
  resume=()
  if [ -n "$last" ]; then echo "[jax] resuming from epoch $n ($last)"; resume=(LEAN_MLIR_RESUME="$last")
  else echo "[jax] fresh start"; fi
  cd jax || exit 1
  exec env JAX_COMPILATION_CACHE_DIR=/home/skoonce/.jax_cache \
    LEAN_MLIR_PARAMS_OUT="$base" LEAN_MLIR_CKPT_EVERY=1 \
    TFDS_DATA_DIR="${TFDS_DATA_DIR:-/home/skoonce/tensorflow_datasets}" \
    "${resume[@]}" ../.venv/bin/python -u '"$PY_REL"'
')

epoch_now() {
  local n=0 k f
  for f in "${CKPT_BASE}"_e*.state.npz; do
    [ -e "$f" ] || continue
    k="${f##*_e}"; k="${k%.state.npz}"
    [ "$k" -gt "$n" ] && n="$k"
  done
  echo "$n"
}

PRECHECK=precheck_mnv4_half_jax
precheck_mnv4_half_jax() {
  local ok=0
  mkdir -p "$(dirname "$CKPT_BASE")" /home/skoonce/.jax_cache
  [ -f "jax/$PY_REL" ] || {
    echo "⛔ missing jax/$PY_REL — scripts/regen_jax_generated.sh sync"; ok=1; }
  # the trainer this runs must be the committed one (a stale .lake/build copy trained the MNv2
  # 350-epoch run at a label smoothing its source had dropped)
  scripts/regen_jax_generated.sh box >/dev/null 2>&1 || {
    echo "⛔ jax/.lake/build differs from jax/generated/ — scripts/regen_jax_generated.sh sync"; ok=1; }
  [ -d "${TFDS_DATA_DIR:-/home/skoonce/tensorflow_datasets}/imagenet2012" ] || {
    echo "⛔ no imagenet2012 under ${TFDS_DATA_DIR:-/home/skoonce/tensorflow_datasets}"; ok=1; }
  # the pinned stack only (other jax versions break bf16 convs); the pin is READ from the lock, since
  # the old duty script's hardcoded "0.10.x" went stale when the lock moved to 0.11.0
  local pin; pin="$(sed -n 's/^jax==//p' jax/requirements-cuda-lock.txt)"
  .venv/bin/python -c "import jax,sys; sys.exit(0 if jax.__version__ == '$pin' else 1)" \
    2>/dev/null || { echo "⛔ .venv's jax is not the pinned $pin (jax/requirements-cuda-lock.txt)"; ok=1; }
  . scripts/lib/gpu.sh
  if gpu_busy; then echo "⛔ GPUs are not idle"; ok=1; fi
  return $ok
}
