# ResNet-34 / ImageNet-1k, VERIFIED path (Lean → StableHLO → XLA/PJRT), 4-GPU data-parallel.
#
#     scripts/supervise.sh r34-imagenet-4gpu
#
# 4 replicas x bs 64 = global batch 256 — the same global batch, 5004 steps/epoch and recipe
# as the single-device `mom256` render, and the same batch the JAX reference trains at, so the
# wall-clock is directly comparable to jax/runs/r34_imagenet_bf16_90ep/RESULTS.md.
#
# Measured 2026-08-01: 625 ms/step -> ~52 min/epoch, so 30 epochs is ~26 h.

DEVS="0,2,3,4"          # the AER-clean four; idx 1 and 5 are excluded (reference_ares_pcie_aer)
EPOCHS=30               # resnet34ImagenetConfig.epochs — the short/validation tier, not the 90ep paper run

CMD=(.lake/build/bin/resnet34-imagenet-verified-xla data)

ENV_EXTRA=(
  PJRT_PLUGIN=".venv/lib/python3.12/site-packages/jax_plugins/xla_cuda12/xla_cuda_plugin.so"
  # BOTH replica knobs are required and they are not the same thing: PJRT_REPLICAS configures
  # the shim's client + compile options, LEAN_MLIR_REPLICAS makes the Lean driver call the
  # data-parallel invoke. Setting only one fails with a confusing "compiled for N replicas"
  # error at the first step — that is a real trap, not a hypothetical.
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  LEAN_MLIR_VARIANT=momdp64          # -> verified_mlir/resnet34in_momdp64_train_step.mlir
  LEAN_MLIR_BATCH=64                 # PER REPLICA
  LEAN_MLIR_BASE_LR_U=100000         # 0.1, the reference rate. The 0.001 default is an ADAMW
                                     # rate and under-steps heavy-ball ~100x, which reads as a
                                     # broken render rather than a wrong knob.
)

# Thermal: this box has no fans on. Prefer temperature-driven resting over a fixed epoch
# schedule — it adapts to ambient instead of guessing, and it is why the engine supports it.
TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs; set e.g. "10 20" to also rest on a schedule

# The trainer writes .lake/build/<slug>_<variant>_ckpt_xla.bin{,.epoch} after each epoch and
# resumes from them AUTOMATICALLY on relaunch, so — unlike the JAX path — there is no resume
# env var to thread. The .epoch file is a bare integer.
CKPT_EPOCH_FILE=".lake/build/resnet34in_momdp64_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

# Refuse to start against the wrong interpreter: the tfds shim needs the PINNED env (jax +
# tensorflow_datasets), and a 26 h run that dies at the first val batch is the expensive way
# to find that out.
PRECHECK=precheck_r34
precheck_r34() {
  [ -x .venv/bin/python3 ] || { echo "missing .venv/bin/python3 (the pinned env)"; return 1; }
  [ -f verified_mlir/resnet34in_momdp64_train_step.mlir ] || {
    echo "missing the 4-replica render — build LeanMlir.Proofs.Codegen.ResNet34RenderB"; return 1; }
  [ -f jax/.lake/build/generated_resnet34_imagenet_shim.py ] || {
    echo "missing the tfds shim — (cd jax && lake exe resnet34-imagenet default --shim)"; return 1; }
  return 0
}
