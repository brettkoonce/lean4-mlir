# vits-default-emabf16-4gpu.conf — ViT-Small (DeiT-S) / ImageNet-1k, VERIFIED path, 300 epochs.
#
#     scripts/supervise.sh vits-default-emabf16-4gpu
#
# The verified peer of `vits-default-jax-4gpu`: Tiny's pair recipe (`vit-default-emabf16-4gpu`) at this
# width. EMA 0.99996, AdamW 5e-4 at global 512 (128/replica x 4), wd 0.05 off norm/bias, clip 1.0,
# label smoothing 0.1 (baked into the render), drop-path 0.1 with 24 masks, bf16, timm/DeiT init.
# The `adamdp128x4wxclipdrop` job (`vits-default-g512-4gpu`) is the non-EMA f32 sibling.
#
# ⚠ Open recipe decisions (planning/imagenet_parity.md §5.5): clip on (DeiT has none), LN eps and
#   GELU form, cooldown/min_lr, EMA vs live scoring. This conf takes Tiny's answers.

# ▶ §2c N1: this must equal the second dash-field of the filename.
RECIPE=default
DEVS="0,1,2,3"
EPOCHS="${EPOCHS:-300}"
ETA="bf16 ~68 h on 4x 4060 Ti at the shim ceiling (326 ms per 512, planning/side_quest_runs.md §4.2); the 09-10 non-EMA bf16 probe read 310 ms/step median. ⚠ re-probe the EMA render (median + mean) before launch"

CMD=(.lake/build/bin/vit-s-imagenet-verified data)

. "$(dirname "${BASH_SOURCE[0]}")/_box.sh"   # BOX, BOX_PLUG, BOX_PY, BOX_SHIMPY
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⛔ `adamdp128x4wxclipdropbf16` is committed one marker away and has NO EMA (629 operands
  # against this one's 831). PRECHECK asserts both the string and the artifact's shape.
  LEAN_MLIR_VARIANT=emadp128x4wxclipdropbf16
  LEAN_MLIR_BATCH=128                # PER REPLICA -> global 512, DeiT's batch
  LEAN_MLIR_EPOCHS=300               # SETS the cosine; MAX_EPOCHS would only cap it
  PJRT_FFI_RESIDENT=1                # opt-in; OFF silently halves throughput
  # 4 producers: the ViT shim peaks there and 8 is slower (side_quest_runs.md §4.2).
  SHIM_WORKERS=4
  LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10
)

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

# 831 operands is the heaviest ViT signature; the first compile needs the longer stall window.
STALL_SECS=3600

CKPT_EPOCH_FILE=".lake/build/vitsin_emadp128x4wxclipdropbf16_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_vits_emabf16
precheck_vits_emabf16() {
  . scripts/lib/precheck.sh
  local ok=0
  local exe=.lake/build/bin/vit-s-imagenet-verified
  local var=emadp128x4wxclipdropbf16
  local mlir="verified_mlir/vitsin_${var}_train_step.mlir"
  pc_box || ok=1
  pc_render vitsin "$var" 4 200 || ok=1
  pc_ckpt vitsin "$var" || ok=1
  pc_exe vit-s-imagenet-verified LeanMlir/Verified/Train.lean ffi/f32_helpers.c \
    apps/imagenette/MainViTSImagenet.lean || ok=1
  if [ -x "$exe" ] && ! strings -a "$exe" | grep -qF 'timm/DeiT'; then
    echo "⛔ $exe has no 'timm/DeiT' announcement — it predates vitInit. Rebuild."; ok=1
  fi
  pc_pjrt_so || ok=1

  if [ -f "$mlir" ]; then
    # 4 regions [θ|m|v|ema] x 200 params + 2 data + 5 scalars + 24 masks = 831.
    local nargs; nargs="$(sed -n '2p' "$mlir" | grep -o '%[a-zA-Z0-9_]*: tensor<' | wc -l)"
    [ "$nargs" = "831" ] || {
      echo "⛔ $mlir has $nargs operands, not 831 — that is not the 4-region EMA layout."; ok=1; }
    grep -q 'EMA WEIGHT SHADOW' "$mlir" || {
      echo "⛔ $mlir carries no EMA shadow."; ok=1; }
    grep -q 'wdExcludeNormBias' "$mlir" || {
      echo "⛔ $mlir does not exclude norm/bias from weight decay."; ok=1; }
    # clip's structural signature: 200 stablehlo.minimum in every clip render, 0 otherwise.
    local nmin; nmin="$(grep -c 'stablehlo\.minimum' "$mlir" || true)"
    [ "$nmin" = "200" ] || {
      echo "⛔ $mlir has $nmin stablehlo.minimum ops, not 200 — gradient clipping is not in it."; ok=1; }
  fi

  if [ -x .lake/build/bin/vit-ema-drop-render ]; then
    .lake/build/bin/vit-ema-drop-render vitsin >/dev/null 2>&1 || {
      echo "⛔ vit-ema-drop-render vitsin FAILED — run it directly for the diagnosis."; ok=1; }
  else
    echo "⚠ vit-ema-drop-render not built (lake build vit-ema-drop-render) — layout gate skipped."
  fi

  grep -q 'emaDecay := 0.99996' apps/imagenette/MainViTSImagenet.lean || {
    echo "⛔ MainViTSImagenet.lean does not pass (emaDecay := 0.99996); the default 0.9999 averages 4x too fast."; ok=1; }

  pc_jax_box || ok=1
  pc_shim vit_tiny_imagenet || ok=1
  local shim=jax/.lake/build/generated_vit_tiny_imagenet_shim.py
  pc_aug_call "$shim" '_randaugment(img, 2, 9.0' "RandAugment N2 m9" || ok=1
  pc_aug_call "$shim" '_random_erase(img)' "random erasing" || ok=1
  pc_aug_no_call "$shim" '_autoaugment(' "not in DeiT's recipe" || ok=1

  pc_env PJRT_FFI_RESIDENT=1 "residency is opt-in and OFF halves throughput" || ok=1
  pc_env SHIM_WORKERS=4 "the ViT shim's measured peak" || ok=1
  pc_env LEAN_MLIR_BATCH=128 "the batch baked into the render" || ok=1
  pc_env LEAN_MLIR_EPOCHS=300 "MAX_EPOCHS cannot reach the 300-epoch cosine" || ok=1
  pc_env_absent LEAN_MLIR_BASE_LR_U "the driver already defaults to 5e-4, the DeiT batch-512 rate" || ok=1
  pc_env_absent LEAN_MLIR_MEM_FRACTION "S fits the default arena; 0.97 starves what lives outside the pool" || ok=1
  pc_gpu_idle || ok=1
  return $ok
}
