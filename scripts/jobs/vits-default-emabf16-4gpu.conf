# vits-default-emabf16-4gpu.conf — ViT-Small (DeiT-S) / ImageNet-1k, VERIFIED path, 300 epochs.
#
#     scripts/supervise.sh vits-default-emabf16-4gpu
#
# ⚠ On mars (12 GB RTX 3060s) launch with LEAN_MLIR_MEM_FRACTION=0.95 (systemd-run --setenv; the
# verified path's knob, ffi/pjrt_ffi.c — XLA_PYTHON_CLIENT_MEM_FRACTION does not reach it): the render
# peaks at 10.75 GiB, over the default 0.75's ~8.9 GiB there (runs/2026-11-10-vits-verified-300ep/).
#
# The verified peer of `vits-accum-jax-4gpu`: Tiny's pair recipe (`vit-default-emabf16-4gpu`) at this
# width. EMA 0.99996, AdamW, wd 0.05 off norm/bias, label smoothing 0.1 (baked into the render),
# drop-path 0.1 with 24 masks, bf16, timm/DeiT init (CLS + pos-embed at σ 0.02), DeiT's LayerNorm
# ε 1e-6 and min_lr 1e-5 (2026-10-05, Tiny's 10-01 parity items), DeiT's exact GELU (2026-10-06,
# planning/gelu_erf_and_torchvision_crop.md §3), against a reference with the same plus the patch
# embed and head in fp32 (`f32StemHead`, the render's carve-out).
# The `adamdp128x4wxclipdrop` job (`vits-default-g512-4gpu`) is the non-EMA f32 sibling.
#
# ⭐ DeiT AS timm RUNS IT, 2026-10-11 (planning/recipe_prep.md §3; ch 9's S/B `[TODO: …]` marker is
# this job's contract, with `vitb-default-emabf16-4gpu`). The variant is the 10-06 one at DeiT's own
# batch and without the clip: `emadp256x4wxdropeps0000001erfbf16` — four replicas of 256 = DeiT's
# global 1024 (exact under LayerNorm, no accumulation: the render peaks at 10.75 GiB of the 11.68 GiB
# DEFAULT arena and executes there, bare device at 4 replicas, 587 ms/step — the 2026-10-11 probe),
# lr 1e-3 (DeiT's 5e-4 · 1024/512), and no gradient clipping (DeiT's `--clip-grad` is None; the
# clip-off probe `runs/2026-10-11-vit-clipoff-probe/` was at Ti). Host-side, both paths: timm's
# per-epoch cosine from `--warmup-lr 1e-6` over all 300 epochs (`schedPerEpoch`), the EMA decay
# constant from step 0 (`emaWarmup := false`). In the shim, both paths: Mixup-or-CutMix drawn per
# batch at p 0.5, RandAugment's fill at timm's img_mean, the 3 repeated-augmentation copies adjacent
# (one optimizer step). The reference also scores in f32.
# A NEW variant means a NEW checkpoint name: the 10-06 `…emadp128x4wxclipdropeps0000001erfbf16`
# checkpoint cannot be resumed into this one.
# ⛔ 2026-10-14: THE `smx` RENDER, `emadp256x4wxdropeps0000001smxerfbf16`. The Ti job on the same recipe went NaN at epoch 3:
# its attention softmaxes were plain `exp(s)/Σexp(s)` and one score reached 90.0, past f32's `exp`
# limit of 88.72 (runs/2026-10-14-vit-deit-verified-nan-diag/). This render carries the same
# construction at 6 heads a block. `smx` subtracts each row's max before every `exp`, forward and
# backward — the same function (`rowSoftmaxShiftFlat_eq`); the JAX side's `jax.nn.softmax` always did.
# ▶ §2c N1: this must equal the second dash-field of the filename.
RECIPE=default
DEVS="0,1,2,3"
EPOCHS="${EPOCHS:-300}"
ETA="bf16 ~70-73 h on ares at 4 x 256 (2026-10-11 smoke, runs/2026-10-11-vits-default-emabf16-4gpu/: med 650 / min 641 / p90 668 ms per 1024-row step at w4, starvation 9 ms — compute-bound; 1,251 steps + the streamed eval an epoch, 300 ep); the 4 x 128 clip render read 339 ms a 512-row step on 2026-10-07 (~71 h); the 3060 box is unmeasured at 1024"

CMD=(.lake/build/bin/vit-s-imagenet-verified data)

. "$(dirname "${BASH_SOURCE[0]}")/_box.sh"   # BOX, BOX_PLUG, BOX_PY, BOX_SHIMPY
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⛔ `adamdp128x4wxclipdropbf16` is committed one marker away and has NO EMA (629 operands
  # against this one's 831). PRECHECK asserts both the string and the artifact's shape.
  # 2026-10-11: DeiT's batch 1024 as 4 x 256, and no clip (see the header). 831 operands and 200
  # all-reduces as before (the operand count is the parameter count's, not the batch's); the clip's
  # structural signature, 200 `stablehlo.minimum`, is GONE, and the precheck asserts 0.
  # 2026-10-14: `smx`, the max-shifted attention softmax (see the header); same operands.
  LEAN_MLIR_VARIANT=emadp256x4wxdropeps0000001smxerfbf16
  LEAN_MLIR_BATCH=256                # PER REPLICA -> global 1024, DeiT's batch
  LEAN_MLIR_EPOCHS=300               # SETS the cosine; MAX_EPOCHS would only cap it
  # 4 producers: the ViT shim peaks there and 8 is slower (Ti at 4 x 256 on 2026-10-11: w4 med 638 ms,
  # w8 766 — the feed is CPU-bound at 1024 rows a step and 8 producers contend). Same shim here.
  SHIM_WORKERS=4
  LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10
)
# ⚠ NO `LEAN_MLIR_BASE_LR_U`: MainViTSImagenet.lean defaults baseLR to 1e-3, DeiT's rate at batch 1024.

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

# 831 operands is the heaviest ViT signature; the first compile needs the longer stall window.
STALL_SECS=3600

CKPT_EPOCH_FILE=".lake/build/vitsin_emadp256x4wxdropeps0000001smxerfbf16_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_vits_emabf16
precheck_vits_emabf16() {
  . scripts/lib/precheck.sh
  local ok=0
  . scripts/lib/precheck.sh; pc_crop jax/.lake/build/generated_vit_tiny_imagenet_shim.py torchvision || ok=1   # train crop + resize kernel
  local exe=.lake/build/bin/vit-s-imagenet-verified
  local var=emadp256x4wxdropeps0000001smxerfbf16
  local mlir="verified_mlir/vitsin_${var}_train_step.mlir"
  pc_box || ok=1
  pc_render vitsin "$var" 4 200 || ok=1
  pc_ckpt vitsin "$var" || ok=1
  # DeiT's nn.GELU in the train step and in the forward it scores through (the JAX conf's pc_gelu).
  pc_gelu_render vitsin "$var" exact || ok=1
  pc_exe vit-s-imagenet-verified LeanMlir/Verified/Train.lean ffi/f32_helpers.c \
    apps/imagenette/MainViTSImagenet.lean || ok=1
  if [ -x "$exe" ] && ! strings -a "$exe" | grep -qF 'timm/DeiT'; then
    echo "⛔ $exe has no 'timm/DeiT' announcement — it predates vitInit. Rebuild."; ok=1
  fi
  # init kind 5 (CLS + pos-embed at σ 0.02) announces itself in the same banner
  if [ -x "$exe" ] && ! strings -a "$exe" | grep -qF 'CLS/pos-embed'; then
    echo "⛔ $exe predates init kind 5 — the CLS token and pos-embed would start at 0. Rebuild."; ok=1
  fi
  # init kind 8 (recipe_prep R4): the patch-embed BIAS on PyTorch's Conv2d default, where DeiT
  # leaves it. The driver sets `patchEmbedBiasTorch := true` and the banner names it; the landed
  # Ti pair started it at 0 (disclosed), this pair does not.
  grep -q 'patchEmbedBiasTorch := true' apps/imagenette/MainViTSImagenet.lean || {
    echo "⛔ apps/imagenette/MainViTSImagenet.lean does not set patchEmbedBiasTorch — the patch-embed bias would start at 0 (recipe_prep R4)"; ok=1; }
  if [ -x "$exe" ] && ! strings -a "$exe" | grep -qF 'patch-embed bias on PyTorch'; then
    echo "⛔ $exe predates init kind 8 — the patch-embed bias would start at 0. Rebuild."; ok=1
  fi
  pc_env_absent LEAN_MLIR_PATCH_BIAS_TORCH "the driver already sets patchEmbedBiasTorch; an override here would make the pair's init undisclosed" || ok=1
  pc_pjrt_so || ok=1

  if [ -f "$mlir" ]; then
    # 4 regions [θ|m|v|ema] x 200 params + 2 data + 5 scalars + 24 masks = 831.
    # the driver copies the output blob back, so #out = #in − 2 with every mask passed through
    python3 scripts/gates/train_step_arity.py "$mlir" | grep -v '^✓'; [ "${PIPESTATUS[0]}" = 0 ] || ok=1
    local nargs; nargs="$(sed -n '2p' "$mlir" | grep -o '%[a-zA-Z0-9_]*: tensor<' | wc -l)"
    [ "$nargs" = "831" ] || {
      echo "⛔ $mlir has $nargs operands, not 831 — that is not the 4-region EMA layout."; ok=1; }
    # DeiT's LN ε, at all 25 LN sites of the forward and their 50 backward reads.
    local neps; neps="$(grep -c 'dense<1.0e-6>' "$mlir" || true)"
    [ "$neps" = "75" ] || {
      echo "⛔ $mlir has $neps LN ε=1e-6 constants, not 75 — not the eps0000001 render."; ok=1; }
    # ITS OWN EVAL FORWARD: without it the trainer falls back to vitsin_fwd.mlir (ε 1e-5) — the
    # driver's checkLnEpsWorld refuses that at startup, this catches it before launch.
    local fwd="verified_mlir/vitsin_${var}_fwd.mlir"
    if [ ! -f "$fwd" ]; then
      echo "⛔ missing $fwd — the run would score at LN ε 1e-5"; ok=1
    else
      local nfe; nfe="$(grep -c 'dense<1.0e-6>' "$fwd" || true)"
      [ "$nfe" = "25" ] || { echo "⛔ $fwd has $nfe LN ε=1e-6 constants, not 25."; ok=1; }
    fi
    # THE SOFTMAX SHIFT (2026-10-14): one row-max `reduce … maximum` before each of the 72 forward
    # and 72 backward-recompute attention `exp`s (6 heads x 12 blocks), and 72 in the eval forward.
    # The unshifted render has 0 and overflows at a score of 88.72 (the Ti job's epoch-3 NaN).
    local nmx; nmx="$(grep -c 'applies stablehlo.maximum' "$mlir" || true)"
    [ "$nmx" = "144" ] || {
      echo "⛔ $mlir has $nmx row-max reduces, not 144 — not the smx (max-shifted softmax) render."; ok=1; }
    if [ -f "$fwd" ]; then
      local nmf; nmf="$(grep -c 'applies stablehlo.maximum' "$fwd" || true)"
      [ "$nmf" = "72" ] || { echo "⛔ $fwd has $nmf row-max reduces, not 72 — its softmax is unshifted."; ok=1; }
    fi
    grep -q 'EMA WEIGHT SHADOW' "$mlir" || {
      echo "⛔ $mlir carries no EMA shadow."; ok=1; }
    grep -q 'wdExcludeNormBias' "$mlir" || {
      echo "⛔ $mlir does not exclude norm/bias from weight decay."; ok=1; }
    # clip's structural signature: 200 stablehlo.minimum in every clip render, 0 otherwise. DeiT
    # does not clip (2026-10-11): assert 0.
    local nmin; nmin="$(grep -c 'stablehlo\.minimum' "$mlir" || true)"
    [ "$nmin" = "0" ] || {
      echo "⛔ $mlir has $nmin stablehlo.minimum ops, not 0 — this is a clip render, not DeiT's recipe."; ok=1; }
    # DeiT's batch: the data operand is 256 rows per replica.
    grep -q 'tensor<256x150528xf32>' "$mlir" || {
      echo "⛔ $mlir is not rendered at 256 per replica (global 1024)."; ok=1; }
  fi

  if [ -x .lake/build/bin/vit-ema-drop-render ]; then
    .lake/build/bin/vit-ema-drop-render vitsin "$var" >/dev/null 2>&1 || {
      echo "⛔ vit-ema-drop-render vitsin $var FAILED — run it directly for the diagnosis."; ok=1; }
  else
    echo "⚠ vit-ema-drop-render not built (lake build vit-ema-drop-render) — layout gate skipped."
  fi

  grep -q 'emaDecay := 0.99996' apps/imagenette/MainViTSImagenet.lean || {
    echo "⛔ MainViTSImagenet.lean does not pass (emaDecay := 0.99996); the default 0.9999 averages 4x too fast."; ok=1; }
  # DeiT `--min-lr 1e-5`, matching the reference's `minLR`; 0 would anneal to zero.
  grep -q '(minLR := 0.00001)' apps/imagenette/MainViTSImagenet.lean || {
    echo "⛔ MainViTSImagenet.lean does not pass (minLR := 0.00001) — the cosine would anneal to 0"
    echo "   while the reference floors at 1e-5."; ok=1; }
  # timm's per-epoch scheduler from 1e-6 and DeiT's constant EMA decay (2026-10-11), host-side here.
  grep -q '(emaWarmup := false) (schedPerEpoch := true) (warmupLRInit := 0.000001)' apps/imagenette/MainViTSImagenet.lean || {
    echo "⛔ MainViTSImagenet.lean does not pass (emaWarmup := false) (schedPerEpoch := true) (warmupLRInit := 0.000001)"
    echo "   — the schedule or the EMA ramp would not be DeiT's."; ok=1; }
  grep -q 'batchSize := 256' apps/imagenette/MainViTSImagenet.lean || {
    echo "⛔ MainViTSImagenet.lean's vitSImagenetConfig is not at 256 per replica."; ok=1; }

  # The shim (RandAugment m9 mstd 0.5, mixup + cutmix, random erasing, repeated augmentation x3) is
  # Tiny's — `vitSImagenetVerified.shimScript`; DeiT's one recipe for Ti/S/B, and the S reference's
  # own shim differs from it in one comment line (checked 2026-10-11).
  pc_jax_box || ok=1
  pc_shim vit_tiny_imagenet || ok=1
  local shim=jax/.lake/build/generated_vit_tiny_imagenet_shim.py
  pc_aug_call "$shim" '_randaugment(img, 2, 9.0' "RandAugment N2 m9" || ok=1
  pc_aug_call "$shim" '_random_erase(img)' "random erasing" || ok=1
  pc_aug_no_call "$shim" '_autoaugment(' "not in DeiT's recipe" || ok=1
  # 2026-10-11, the shim side of the DeiT-as-timm items (the JAX conf asserts the trainer's):
  grep -q "rng.random() < 0.500000" "$shim" || {
    echo "⛔ $shim alternates Mixup/CutMix by step — timm draws one per batch at p 0.5 (mixSwitchProb)"; ok=1; }
  grep -q '^_RA_FILL = tf.constant(\[124.0, 116.0, 104.0\])' "$shim" || {
    echo "⛔ $shim fills RandAugment's geometric ops with 128, not timm's img_mean (randAugmentFillMean)"; ok=1; }
  grep -q '# repeatedAugAdjacent' "$shim" || {
    echo "⛔ $shim re-shuffles the 3 repeated-augmentation copies apart (repeatedAugAdjacent)"; ok=1; }

  pc_env SHIM_WORKERS=4 "Ti's measured peak at 4 x 256 (w4 med 638 ms, w8 766); S is compute-bound there (starvation 9 ms, 2026-10-11 smoke)" || ok=1
  pc_env LEAN_MLIR_BATCH=256 "DeiT's global 1024 as 4 x 256; the render is at 256" || ok=1
  pc_env LEAN_MLIR_EPOCHS=300 "MAX_EPOCHS cannot reach the 300-epoch cosine" || ok=1
  pc_env_absent LEAN_MLIR_BASE_LR_U "the driver already defaults to 1e-3, DeiT's rate at batch 1024" || ok=1
  pc_env_absent LEAN_MLIR_MEM_FRACTION "S fits the default arena at 4 x 256 (10.75 of 11.68 GiB, 2026-10-11); 0.97 starves what lives outside the pool" || ok=1
  # Per-image top-1 bitmaps, one per epoch, into this run's dir: the input a McNemar pairing with the
  # reference needs (scripts/demos/mcnemar.py; the JAX side's twin is eval_full50k.py's DUMP_CORRECT).
  # Appended HERE because PRECHECK runs in the supervisor's shell after RUNDIR is fixed, and the
  # conf is sourced before it is. 50 KB an epoch; gitignored (runs/**/*.bin).
  mkdir -p "$RUNDIR/bitmaps"
  ENV_EXTRA+=("LEAN_MLIR_DUMP_CORRECT=$RUNDIR/bitmaps/vits_${var}")
  echo "  per-image bitmaps -> $RUNDIR/bitmaps/vits_${var}_e{N}.bin (LEAN_MLIR_DUMP_CORRECT)"
  pc_gpu_idle || ok=1
  return $ok
}
