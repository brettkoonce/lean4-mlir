# ConvNeXt-S / ImageNet-1k, JAX REFERENCE path, the `default` recipe (300 epochs), 4 GPUs.
#
#     setsid nohup scripts/supervise.sh cnxs-default-jax-4gpu >/dev/null 2>&1 &
#
# `convNeXtSImagenetConfig`: the ConvNeXt-T recipe at S's drop-path 0.4 — AdamW 2.5e-4 at batch 256
# (4e-3 @ 4096 scaled), wd 0.05 off norm/bias, 20 warmup epochs + cosine, clip 1.0, mixup 0.8 /
# cutmix 1.0, RandAugment m9 mstd0.5 inc1, pixel random erasing 0.25, label smoothing 0.1, EMA,
# bf16, ConvNeXt `_init_weights` (cnxInit), eval every 5 epochs.
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo.
RECIPE=default
DEVS="0,1,2,3"
EPOCHS=300
CKPT_BASE=/home/skoonce/cnx_s_default_300ep/convnext_s_imagenet
PY_REL=.lake/build/generated_convnext_s_imagenet.py    # relative to jax/
# The 4-GPU compute probe (runs/2026-08-27-jax-sb-tier-step-probe): 260.8 ms/step at 256, feed
# not binding (~980 img/s needed against a 2,551 img/s tf.data ceiling).
EPOCH_SECS=1400
ETA="~127 h for 300 ep on 4x 4060 Ti (304 ms/step, flat; measured 2026-10-05, runs/2026-10-04-dimm-fan-thermal)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_cnxs_default_jax
precheck_cnxs_default_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  pc_jax_trainer || ok=1
  pc_aug_call "jax/$PY_REL" '_randaugment(img, 2, 9.000000, 0.500000)' "ConvNeXt RandAugment m9 mstd0.5" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "ConvNeXt's recipe is RandAugment only" || ok=1
  grep -q 'ConvNeXt paper init' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no ConvNeXt init (cnxInit) — re-emit"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
