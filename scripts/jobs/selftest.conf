# Engine self-test: no GPU, no trainer. A fake job that advances one epoch then dies,
# so the attempt loop, the resume-from-epoch path and the completion exit all get
# exercised in ~10s. Exists because everything else here is only exercised by a 26-hour
# run, which is a bad place to discover the supervisor has a bug.
#
#     scripts/supervise.sh selftest      # expect: 4 attempts, then ✅ COMPLETE — 4/4
DEVS="0"
EPOCHS=4
EPF="/tmp/supervise_selftest/epoch"
CMD=(bash -c 'mkdir -p /tmp/supervise_selftest
              n=$(cat /tmp/supervise_selftest/epoch 2>/dev/null || echo 0)
              echo "fake trainer: starting from epoch $n"; sleep 2
              echo $((n+1)) > /tmp/supervise_selftest/epoch
              echo "fake trainer: finished epoch $((n+1)); simulating a crash"; exit 1')
STALL_SECS=0
MAX_ATTEMPTS=8
epoch_now() { [ -f "$EPF" ] || { echo 0; return; }; local n; n="$(tr -cd '0-9' < "$EPF")"; echo "${n:-0}"; }
