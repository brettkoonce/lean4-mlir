# vitb-default-emabf16-4gpu.conf — ViT-Base (DeiT-B) / ImageNet-1k, VERIFIED path, 300 epochs.
#
#     scripts/supervise.sh vitb-default-emabf16-4gpu
#
# The verified peer of `vitb-accum-jax-4gpu`: Tiny's pair recipe (`vit-default-emabf16-4gpu`) at this
# width. EMA 0.99996, AdamW 5e-4 at global 512 (128/replica x 4), wd 0.05 off norm/bias, clip 1.0,
# label smoothing 0.1 (baked into the render), drop-path 0.1 with 24 masks, bf16, timm/DeiT init
# (CLS + pos-embed at σ 0.02), and since 2026-10-05 Tiny's 10-01 parity items: DeiT's LayerNorm
# ε 1e-6 and min_lr 1e-5, and since 2026-10-06 DeiT's exact GELU (THIS variant,
# `…eps0000001erfbf16`, with its own eval forward `vitbin_<variant>_fwd.mlir`), against a
# reference with the same three plus the patch embed and head in fp32 (`f32StemHead`, the render's
# carve-out). planning/vit_parity_todo.md §1 has the table; the GELU is
# planning/gelu_erf_and_torchvision_crop.md §3.
# The `adamdp128x4wxclipdrop` job (`vitb-default-g512-4gpu`) is the non-EMA f32 sibling.
#
# ⚠ Open recipe decisions (planning/imagenet_parity.md §5.5, planning/vit_parity_todo.md §3): clip on
#   (DeiT has none), EMA vs live scoring. This conf takes Tiny's answers, LN ε, min_lr and the
#   exact GELU included. A NEW variant means a NEW checkpoint name: a `…clipdropbf16` or
#   `…eps0000001bf16` checkpoint cannot be resumed into this one.

# ▶ §2c N1: this must equal the second dash-field of the filename.
RECIPE=default
DEVS="0,1,2,3"
EPOCHS="${EPOCHS:-300}"
ETA="bf16 ~183 h for 300 ep on 4x 4060 Ti (mean 876 / median 876 / floor 863 ms/step; measured 2026-10-07 on the exact-GELU render + torchvision crop, runs/2026-10-07-d17-reprobe; 887 / 884 on 10-05)"

CMD=(.lake/build/bin/vit-b-imagenet-verified data)

. "$(dirname "${BASH_SOURCE[0]}")/_box.sh"   # BOX, BOX_PLUG, BOX_PY, BOX_SHIMPY
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # The bf16 twin peaks at 12.61 GiB against 15.11, 10.88 at the 11.68 default; the EMA shadow
  # adds a fourth parameter-sized region. 0.97 is the budget the 128x4 renders were probed at.
  LEAN_MLIR_MEM_FRACTION=0.97
  # ⛔ `adamdp128x4wxclipdropbf16` is committed one marker away and has NO EMA (629 operands
  # against this one's 831). PRECHECK asserts both the string and the artifact's shape.
  # 2026-10-05: the same render at DeiT's LayerNorm ε 1e-6 (`eps0000001`), Tiny's pair variant;
  # 831 operands, 200 all-reduces, the 1e-5 render's layout exactly.
  # 2026-10-06: the same render at the exact GELU (`erf`); the form moves no operand or mask.
  LEAN_MLIR_VARIANT=emadp128x4wxclipdropeps0000001erfbf16
  LEAN_MLIR_BATCH=128                # PER REPLICA -> global 512, DeiT's batch
  LEAN_MLIR_EPOCHS=300               # SETS the cosine; MAX_EPOCHS would only cap it
  # 4 producers: the ViT shim peaks there and 8 is slower (side_quest_runs.md §4.2).
  SHIM_WORKERS=4
  LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10
)

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

# 831 operands is the heaviest ViT signature; the first compile needs the longer stall window.
STALL_SECS=3600

CKPT_EPOCH_FILE=".lake/build/vitbin_emadp128x4wxclipdropeps0000001erfbf16_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_vitb_emabf16
precheck_vitb_emabf16() {
  . scripts/lib/precheck.sh
  local ok=0
  . scripts/lib/precheck.sh; pc_crop jax/.lake/build/generated_vit_tiny_imagenet_shim.py torchvision || ok=1   # train crop + resize kernel
  local exe=.lake/build/bin/vit-b-imagenet-verified
  local var=emadp128x4wxclipdropeps0000001erfbf16
  local mlir="verified_mlir/vitbin_${var}_train_step.mlir"
  pc_box || ok=1
  pc_render vitbin "$var" 4 200 || ok=1
  pc_ckpt vitbin "$var" || ok=1
  # DeiT's nn.GELU in the train step and in the forward it scores through (the JAX conf's pc_gelu).
  pc_gelu_render vitbin "$var" exact || ok=1
  pc_exe vit-b-imagenet-verified LeanMlir/Verified/Train.lean ffi/f32_helpers.c \
    apps/imagenette/MainViTBImagenet.lean || ok=1
  if [ -x "$exe" ] && ! strings -a "$exe" | grep -qF 'timm/DeiT'; then
    echo "⛔ $exe has no 'timm/DeiT' announcement — it predates vitInit. Rebuild."; ok=1
  fi
  # init kind 5 (CLS + pos-embed at σ 0.02) announces itself in the same banner
  if [ -x "$exe" ] && ! strings -a "$exe" | grep -qF 'CLS/pos-embed'; then
    echo "⛔ $exe predates init kind 5 — the CLS token and pos-embed would start at 0. Rebuild."; ok=1
  fi
  pc_pjrt_so || ok=1

  if [ -f "$mlir" ]; then
    # 4 regions [θ|m|v|ema] x 200 params + 2 data + 5 scalars + 24 masks = 831.
    # the driver copies the output blob back, so #out = #in − 2 with every mask passed through
    python3 scripts/gates/train_step_arity.py "$mlir" | grep -v '^✓'; [ "${PIPESTATUS[0]}" = 0 ] || ok=1
    local nargs; nargs="$(sed -n '2p' "$mlir" | grep -o '%[a-zA-Z0-9_]*: tensor<' | wc -l)"
    [ "$nargs" = "831" ] || {
      echo "⛔ $mlir has $nargs operands, not 831 — that is not the 4-region EMA layout."; ok=1; }
    # DeiT's LN ε, at all 25 LN sites of the forward and their 50 backward reads.
    local neps; neps="$(grep -c 'dense<1.0e-6>' "$mlir" || true)"
    [ "$neps" = "75" ] || {
      echo "⛔ $mlir has $neps LN ε=1e-6 constants, not 75 — not the eps0000001 render."; ok=1; }
    # ITS OWN EVAL FORWARD: without it the trainer falls back to vitbin_fwd.mlir (ε 1e-5) — the
    # driver's checkLnEpsWorld refuses that at startup, this catches it before launch.
    local fwd="verified_mlir/vitbin_${var}_fwd.mlir"
    if [ ! -f "$fwd" ]; then
      echo "⛔ missing $fwd — the run would score at LN ε 1e-5"; ok=1
    else
      local nfe; nfe="$(grep -c 'dense<1.0e-6>' "$fwd" || true)"
      [ "$nfe" = "25" ] || { echo "⛔ $fwd has $nfe LN ε=1e-6 constants, not 25."; ok=1; }
    fi
    grep -q 'EMA WEIGHT SHADOW' "$mlir" || {
      echo "⛔ $mlir carries no EMA shadow."; ok=1; }
    grep -q 'wdExcludeNormBias' "$mlir" || {
      echo "⛔ $mlir does not exclude norm/bias from weight decay."; ok=1; }
    # clip's structural signature: 200 stablehlo.minimum in every clip render, 0 otherwise.
    local nmin; nmin="$(grep -c 'stablehlo\.minimum' "$mlir" || true)"
    [ "$nmin" = "200" ] || {
      echo "⛔ $mlir has $nmin stablehlo.minimum ops, not 200 — gradient clipping is not in it."; ok=1; }
  fi

  if [ -x .lake/build/bin/vit-ema-drop-render ]; then
    .lake/build/bin/vit-ema-drop-render vitbin "$var" >/dev/null 2>&1 || {
      echo "⛔ vit-ema-drop-render vitbin $var FAILED — run it directly for the diagnosis."; ok=1; }
  else
    echo "⚠ vit-ema-drop-render not built (lake build vit-ema-drop-render) — layout gate skipped."
  fi

  grep -q 'emaDecay := 0.99996' apps/imagenette/MainViTBImagenet.lean || {
    echo "⛔ MainViTBImagenet.lean does not pass (emaDecay := 0.99996); the default 0.9999 averages 4x too fast."; ok=1; }
  # DeiT `--min-lr 1e-5`, matching the reference's `minLR`; 0 would anneal to zero.
  grep -q '(minLR := 0.00001)' apps/imagenette/MainViTBImagenet.lean || {
    echo "⛔ MainViTBImagenet.lean does not pass (minLR := 0.00001) — the cosine would anneal to 0"
    echo "   while the reference floors at 1e-5."; ok=1; }

  pc_jax_box || ok=1
  pc_shim vit_tiny_imagenet || ok=1
  local shim=jax/.lake/build/generated_vit_tiny_imagenet_shim.py
  pc_aug_call "$shim" '_randaugment(img, 2, 9.0' "RandAugment N2 m9" || ok=1
  pc_aug_call "$shim" '_random_erase(img)' "random erasing" || ok=1
  pc_aug_no_call "$shim" '_autoaugment(' "not in DeiT's recipe" || ok=1

  pc_env SHIM_WORKERS=4 "the ViT shim's measured peak" || ok=1
  pc_env LEAN_MLIR_BATCH=128 "the batch baked into the render" || ok=1
  pc_env LEAN_MLIR_EPOCHS=300 "MAX_EPOCHS cannot reach the 300-epoch cosine" || ok=1
  pc_env_absent LEAN_MLIR_BASE_LR_U "the driver already defaults to 5e-4, the DeiT batch-512 rate" || ok=1
  pc_env LEAN_MLIR_MEM_FRACTION=0.97 "the budget the 128x4 renders were probed at" || ok=1
  strings ffi/libpjrt_ffi.so 2>/dev/null | grep -q memory_fraction || {
    echo "⛔ ffi/libpjrt_ffi.so predates the allocator options; LEAN_MLIR_MEM_FRACTION would be ignored."; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
