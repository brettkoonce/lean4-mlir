# ConvNeXt-S / ImageNet-1k, VERIFIED path (Lean → StableHLO → XLA/PJRT), 4 GPUs.
# 50,222,152 parameters.
#
#     scripts/supervise.sh cnxs-default-4gpu
#
# 4 replicas × bs 32 = global 128, 10,009 steps/epoch — double every other net here, and what the
# 300-epoch schedule really costs.
#
# ⭐ MEASURED 2026-08-28, 40 steps: 367 ms/step fp32, 304 bf16 ⇒ 309 h and 257 h for 300 epochs
#   incl. 37.5 s/epoch eval + ckpt. (~2-3 % slow against the book's committed rows, so those stand.)
#
# ⭐⭐ SUPERSEDED — RE-MEASURED 2026-08-29 after the two layout fixes, same box, same 40-step probe:
#
#       adamdpwxclipdrop      (f32, WHAT THIS CONF NAMES)   345 ms/step   ~291 h / 300 ep
#       adamdpwxclipdropbf16                                192 ms/step   ~163 h / 300 ep   1.80x
#
#   bf16 went 304 -> 243 -> 192 across the pointwise fix and the shape-table fix; f32 is inert
#   (XLA keeps f32 convs in NCHW, so there are no relayouts to remove). Bare graph, one card:
#   255.2 -> 105.3 ms, 2.42x — the best bf16 ratio of the three ConvNeXt sizes.
# ▶ Flipping to the bf16 twin is worth ~128 h here. The artifact exists and is rendered.
#
# ⛔⛔ DO NOT FIX THE STEP COUNT WITH A BIGGER BATCH. ConvNeXt's block interior costs a FLAT ms per
#   IMAGE from batch 8 to 128 (1.03× across the range, bf16_renderer.md §21.5), so doubling the
#   batch halves the step count and doubles the step. Memory was never the constraint — bs64 is
#   76 % of the default arena. ▶ ViT gets the opposite answer to the same question; both measured.
#
# ⛔⛔ DO NOT SET LEAN_MLIR_MEM_FRACTION — it BREAKS this net. At 0.97 both bf16 arms die
#   CUDA_ERROR_OUT_OF_MEMORY in d2h(res) (ConvNeXt-B dumps core) where the same runs complete at
#   the default: a 97 % BFC pool starves what lives outside it. Prechecked below as a refusal.
#   ▶ Peaks at 4 replicas vs the default 11.68 GiB arena: 7.95 fp32 (68 %), 6.98 bf16 (60 %).
#   ▶ runs/2026-08-28-convnext-sb-jobs/

# ▶ §2c N1: this must equal the second dash-field of the filename. supervise.sh refuses otherwise.
# ⚠ Net token `cnxs`, not `convnext-s` — the engine splits the filename on dashes, so the exe's
#   hyphenated size (N4) cannot be the job token. Same reason as `vitb`/`vits`.
RECIPE=default
DEVS="0,2,3,4"          # the AER-clean four; idx 1 and 5 are excluded (reference_ares_pcie_aer)
EPOCHS=300              # the ConvNeXt paper's schedule length

CMD=(.lake/build/bin/convnext-s-imagenet-verified data)

ENV_EXTRA=(
  PJRT_PLUGIN=".venv/lib/python3.12/site-packages/jax_plugins/xla_cuda12/xla_cuda_plugin.so"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⚠ The DRIVER defaults to the single-device `adamwxclipdrop`, so this line is load-bearing
  # rather than a restatement: without it the run names an artifact with no collectives in it.
  LEAN_MLIR_VARIANT=adamdpwxclipdrop
  LEAN_MLIR_BATCH=32                 # PER REPLICA, and BAKED — the render has no batch marker
  PJRT_FFI_RESIDENT=1
  # ⚠⚠ REQUIRED — worth 3.8× on ConvNeXt-T. Absent, the job reads exactly like a correct one.
  # ⭐ SHIM_WORKERS=4, not 8 (changed 2026-08-31 after a measured sweep 2..16 per net).
  # ConvNeXt-S bf16 4x: w8 212.5 -> w4 191 ms/step (floor 190). 177.2 h -> 159.3 h / 300 ep.
  # ▶ Producers past ~4 add no throughput and contend with the trainer's own host thread.
  # ⛔ NOT a fleet-wide constant: EfficientNet-B0's probe is +/-30% and stayed at 8.
  SHIM_WORKERS=4
)

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

CKPT_EPOCH_FILE=".lake/build/convnextsin_adamdpwxclipdrop_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_cnxs
precheck_cnxs() {
  [ -x .venv/bin/python3 ] || { echo "missing .venv/bin/python3 (the pinned env)"; return 1; }
  [ -f verified_mlir/convnextsin_adamdpwxclipdrop_train_step.mlir ] || {
    echo "missing the 4-replica render — lake build LeanMlir.Proofs.Codegen.ConvNeXtRenderB"; return 1; }
  # ⚠ The driver opens `<slug>_fwd.mlir` BY NAME for its eval pass; `convnextsin_drop_fwd` is
  # NOT it (18 extra mask inputs an eval forward has no values for). No build-time check covers
  # an artifact NAME — this is found by running the trainer, which is too late.
  [ -f verified_mlir/convnextsin_fwd.mlir ] || {
    echo "missing verified_mlir/convnextsin_fwd.mlir — the eval forward the driver opens by name"; return 1; }
  [ -f jax/.lake/build/generated_convnext_tiny_imagenet_shim.py ] || {
    echo "missing ConvNeXt's OWN tfds shim — scripts/gen_shims.sh"; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "PJRT_FFI_RESIDENT=1 is missing from ENV_EXTRA — opt-in, defaults OFF, silent."; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'SHIM_WORKERS=4' || {
    echo "SHIM_WORKERS=4 is missing from ENV_EXTRA. ConvNeXt-S measured 2026-08-31: 8 producers give 212.5 ms/step against 4's 191 (floor 190)."; return 1; }
  # ⚠⚠ A REFUSAL, not a warning: 0.97 kills this net's bf16 arms (see the header).
  if printf '%s\n' "${ENV_EXTRA[@]}" | grep -q '^LEAN_MLIR_MEM_FRACTION='; then
    echo "LEAN_MLIR_MEM_FRACTION is set, and on this net that is not headroom — it is a crash."
    echo "At 0.97 both bf16 arms die CUDA_ERROR_OUT_OF_MEMORY in d2h(res) (B dumps core) while"
    echo "the same runs complete at the plugin's default. The graph fits either way; what runs"
    echo "out is what lives OUTSIDE the BFC pool. Remove the line."; return 1
  fi
  return 0
}
