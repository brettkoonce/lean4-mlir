# ResNet-50 RSB-A3 / ImageNet-1k, JAX REFERENCE path, the `rsb-faithful` recipe (100 epochs), 4 GPUs.
#
#     setsid nohup scripts/supervise.sh r50-a3-jax-4gpu >/dev/null 2>&1 &
#
# Recipe = `resnet50ImagenetConfigRSBFaithful`, RSB-A3: LAMB 8e-3 at an effective 2048 as 512 ×
# accum 4 (Ghost-BN over each 512), BCE with the 0.2 target threshold, RandAugment m6 mstd0.5,
# Mixup 0.1 / CutMix 1.0, no repeated aug, no drop-path, no EMA, train 160 / eval 224 at 0.95,
# zero-γ, BN decay 0.9, bf16. RECIPE is `a3` because a job-name field cannot hold the driver's
# `rsb-faithful`, and `a3` is what the verified peer `r50-a3-wxclip4x128-bf16-4gpu` calls it.
# The rerun §5.8 owes: the landed 78.26 (/home/skoonce/r50_a3_jax_100ep/, 2026-08) trained a bf16
# head at BN decay 0.99 and without the threshold timm's A3 ran at (D14).
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo, in a directory of their own: pointing CKPT_BASE at the August
# run's would resume its epoch-100 state and finish at once.
RECIPE=a3
DEVS="0,1,2,3"
EPOCHS=100
CKPT_BASE=/home/skoonce/r50_a3_jax_2610/resnet50_imagenet_rsbfaithful
PY_REL=.lake/build/generated_resnet50_imagenet_rsbfaithful.py    # relative to jax/
# The August run on this box: median 486 s an epoch, eval included (13.5 h over 100).
EPOCH_SECS=490
ETA="~13.5 h for 100 ep on 4x 4060 Ti (median 486 s/epoch incl. eval; the 2026-08 run, /home/skoonce/r50_a3_jax_100ep)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_r50_a3_jax
precheck_r50_a3_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  . scripts/lib/precheck.sh; pc_crop "jax/$PY_REL" torchvision random || ok=1   # train crop + resize kernel
  grep -q '^def _aa_warp1d' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no PIL-bicubic RandAugment geometry (C6), which A3 now trains like A2/A1"; ok=1; }
  pc_jax_trainer || ok=1
  pc_aug_call "jax/$PY_REL" '_randaugment(img, 2, 6.000000, 0.500000)' "RSB-A3 RandAugment m6 mstd0.5" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "RSB is RandAugment only" || ok=1
  grep -q 'tgt = (tgt > 0.200000)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no BCE target threshold — timm's A3 ran at 0.2 (D14); re-emit"; ok=1; }
  grep -q '^GRAD_ACCUM = 4$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not the 512 × 4 accumulation trainer"; ok=1; }
  grep -q '^LR = 0.008000$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not at RSB-A3's 8e-3 at 2048"; ok=1; }
  grep -q '^    EPOCHS = 100$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not the 100-epoch trainer"; ok=1; }
  grep -q 'x = jnp.matmul(x, params\[53\]\[0\].T)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's classifier head is not the fp32 matmul (X3) — re-emit"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
