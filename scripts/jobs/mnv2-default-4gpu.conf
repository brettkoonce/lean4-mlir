# MobileNetV2 / ImageNet-1k, VERIFIED path (Lean → StableHLO → XLA/PJRT), 4-GPU data-parallel.
#
#     scripts/supervise.sh mnv2-default-4gpu
#
# 4 replicas x bs 64 = global batch 256, 5,004 steps/epoch.
#
# ⭐ MEASURED 2026-08-05, this shape, residency + prefetch:
#
#       SHIM_WORKERS=1     201 ms/step      ← KEEP
#       SHIM_WORKERS=4     208 ms/step      ← measurably WORSE
#       LEAN_MLIR_BENCH_SYNTH (no data)  152 ms/step   — the compute-only floor
#
#   16.8 min/epoch ⇒ 300 ep ≈ 83.8 h, 350 ep ≈ 97.8 h.
#
# ⭐⭐ SUPERSEDED — RE-MEASURED 2026-08-30, 4x 4060 Ti, 40 steps, this conf's variant (rmsdp64):
#
#       rmsdp64      f32   SHIM_WORKERS=1   216 ms/step   ~109 h / 350 ep
#       rmsdp64      f32   SHIM_WORKERS=8   187 ms/step   ~ 95 h / 350 ep   ← now the setting below
#       rmsdp64bf16        SHIM_WORKERS=8   136 ms/step   ~ 70 h / 350 ep   ← the arm to RUN
#       rmsdp64bf16        SHIM_WORKERS=16  194 ms/step   — worse than f32 at 8
#
#   ⭐ `rmsdp64bf16` was RENDERED 2026-08-30. Until then this net's only bf16 artifacts were the
#   AdamW family, so the one job that trains it had no bf16 arm and paid f32 for all 350 epochs.
#   Bare graph at 4 replicas, all-reduce included: 134.4 → 68.4 ms, 1.97x. The runner only gets
#   1.38x of that, because ~68 of the 136 ms is no longer the graph.
#   ⭐ RESOLVED 2026-09-10: LEAN_MLIR_VARIANT below IS `rmsdp64bf16` now. This header used to say
#   "stays f32 as the DEFAULT ... flip it when launching", which made the shipped default the
#   wrong arm and the correct one a thing you had to remember. See the note in ENV_EXTRA.
#
# ⛔ "THIS IS THE NET THAT DOES **NOT** WANT MORE PRODUCERS" — DELETED 2026-09-10, REFUTED.
#   That claim rested on 201 ms/step at w1 against 208 at w4, and it was measured with
#   SHIM_DETERMINISM ON. The shim's determinism default went OFF on 2026-09-10 (`4a0a2781`), and
#   under the new default the ordering INVERTS: one producer is now nearly 2x worse than four.
#   Re-measured on THIS box (4x RTX 3060, 24 cores), rmsdp64bf16, 600 steps clocked from step 200,
#   runs/2026-09-10-mnv2rms-sweep.tsv — med / mean / p90 ms per step:
#
#       w1    192 / 189 / 205        ← the old "keep" setting, now the worst by 2x
#       w2     95 /  96 / 116
#       w3     94 /  96 / 116
#       w4     97 /  96 ... 104 / 99 ← TWO runs; the spread IS the noise floor
#       w6     99 / 105 / 119
#       w8    104 / 124 / 163
#       w12   105 / 108 / 130
#       synth  78 /  77 /  78        ← compute-only floor, shim removed
#
#   ▶ w2/w3's 96 sits INSIDE the two w4 runs' own 99..104 spread, so their apparent 5% edge is
#   noise, not signal. w4 stays. What is real: w1 is disastrous and w6+ degrade, the mean and the
#   tail first. The plateau is 2..4 and its floor is the shim, not the graph.
#   ⚠ RANK ON `mean`, NOT `med` — the ViT session's central finding. w8's median (104) is a
#   half-step from w4's (97) while its mean is 124 and its p90 163.
#   ⚠ The pre-2026-09-10 numbers in this header are ares' (32 cores) AND 40-step bursts, which
#   drain a prefetch queue the producers filled during compile: they are compute floors, not
#   throughputs. Do not budget from them.

# ▶ §2c N1: this must equal the second dash-field of the filename. supervise.sh refuses
#   otherwise — the job namespace drifted from the recipe namespace once already.
RECIPE=default
DEVS="0,1,2,3"          # all four cards; the two PCIe-AER cards (old idx 1 and 5) were pulled 2026-09-08
EPOCHS=350              # mobilenetv2ImagenetConfig.epochs — the reference's schedule length.
# ares: ETA re-measured 2026-09-10, runs/2026-09-10-bf16-probe-4060ti (mean, 400-step window
# from step 200).
# ⭐⭐ THIS BOX'S NUMBER IS NO LONGER AN ESTIMATE — the 350-epoch bf16 run COMPLETED 2026-09-12 in
# 54 h 13 m 32 s, one attempt, zero rests (runs/2026-09-10-mnv2-verified-350ep, 71.912 / 90.520).
# ⚠ ~3 h of that was the mimalloc RSS bug fixed upstream in `13d90e68`, which that run's binary
# predates: epochs 1-247 held a flat 527 s/epoch, then the box reached the reclaim watermark and
# the last 100 epochs ran at ~856. THE PACE TO BUDGET FROM IS 527 s/ep => 51.2 h; 54.23 h is what
# the leak cost. ⛔ Everything probed on 2026-09-10 (runs/2026-09-10-mnv2rms-sweep.tsv, and the
# SHIM_WORKERS=4 below) was measured under that bug and wants re-probing post-fix — more producers
# meant more memory pressure, so the sweep was biased AGAINST higher worker counts.
ETA="bf16 51-54 h on 4x 3060 (MEASURED end to end, 350 ep; 51.2 h at the pre-leak pace); bf16 ~59 h / f32 ~90 h on 4x 4060 Ti (114 / 177 ms/step median)"
                        # ⚠⚠ WAS 300, AND THE CONSTANT IT CITES IS 350
                        # (apps/imagenette/MainMobileNetV2Imagenet.lean:29). `EPOCHS` is
                        # supervise.sh's STOP condition (`last_epoch >= EPOCHS` ⇒ COMPLETE)
                        # while the trainer anneals over the constant, so this killed the run
                        # 50 epochs into the tail of its own LR curve and reported success.
                        # Same defect as enet-default-4gpu's EPOCHS=80; both fixed 2026-08-30.

CMD=(.lake/build/bin/mobilenetv2-imagenet-verified data)

# Box selection (copied verbatim from r50-2018-bf16-4gpu.conf, f3d89574): the repo venv's
# cuda12 plugin if it is there, else the 3060 box's cuda13.
#   * ares: the repo's pinned `.venv` with the xla_cuda12 plugin, no SHIM_PYTHON needed.
#   * the 3060 box: /home/skoonce/.venv-cuda with xla_cuda13 (driver 610.57.04 / CUDA 13.3),
#     and SHIM_PYTHON is REQUIRED because that box's .venv/bin/python3 is a WRAPPER that
#     execs the retired ROCm venv (lean4-jax/.venv), which no longer has a usable jax.
# ⛔ Before this, the conf hardcoded ares' xla_cuda12 path and carried no SHIM_PYTHON, so on
#   the 3060 box it died at step 0 with a plugin-load error. Fixing ffi/pjrt_ffi.c's default
#   search list (it knows xla_cuda12 + xla_rocm7, not xla_cuda13) would delete PJRT_PLUGIN
#   from every conf.
ARES_PLUG=".venv/lib/python3.12/site-packages/jax_plugins/xla_cuda12/xla_cuda_plugin.so"
if [ -f "$ARES_PLUG" ]; then
  BOX=ares;  BOX_PLUG="$ARES_PLUG"; BOX_PY=".venv/bin/python3"; BOX_SHIMPY=()
else
  BOX=3060;  BOX_PLUG="/home/skoonce/.venv-cuda/lib/python3.12/site-packages/jax_plugins/xla_cuda13/xla_cuda_plugin.so"
  BOX_PY="/home/skoonce/.venv-cuda/bin/python3"; BOX_SHIMPY=(SHIM_PYTHON="$BOX_PY")
fi
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⭐ bf16, NOT f32 — flipped 2026-09-10, and the reason is the same one r50-2018-bf16-4gpu
  # gives for its own net: the JAX reference this run sits beside (71.90/90.41, §6.5) is
  # ITSELF bf16, so an f32 verified run would differ from it in PRECISION as well as in
  # lowerer — and the comparison is about the lowerer. bf16 makes it apples to apples.
  # It is also ~25 h cheaper. Until now this conf shipped the f32 arm as its default with
  # only a header comment saying to flip it by hand, which is a trap, not a default.
  LEAN_MLIR_VARIANT=rmsdp64bf16      # -> verified_mlir/mobilenetv2in_rmsdp64bf16_train_step.mlir
                                     # RMSProp + exp decay, the reference optimizer for this net
  LEAN_MLIR_BATCH=64                 # PER REPLICA
  # ⚠⚠ REQUIRED and SILENT when absent — see the R34 job's note; it cost that run 10 h.
  PJRT_FFI_RESIDENT=1
  # ⭐ 4 — CONFIRMED ON THIS BOX 2026-09-10 under the new determinism-OFF default. The full
  # sweep (w1..w12, both arms) is in the header and in runs/2026-09-10-mnv2rms-sweep.tsv. Short
  # version: the plateau is w2..w4 at ~96 ms/step mean, w1 is 189, w6+ degrade. w4 was probed
  # TWICE (99 and 104 mean) and w2/w3's 96 falls inside that spread — no reason to move off 4.
  # ⚠ Every earlier number in this block was ares' (32 cores) and is superseded; this box has 24.
  # ⛔ NOT a fleet-wide constant: EfficientNet-B0's probe is +/-30% and stayed at 8.
  SHIM_WORKERS=4
)

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

# ⚠⚠ KEYED TO THE VARIANT. Checkpoints are `<slug>_<variant>_ckpt_xla.bin`, so this MUST move
# with LEAN_MLIR_VARIANT above. Left at the f32 name it would track a file the bf16 run never
# writes and supervise.sh would read epoch 0 forever — a run that never advances and never ends.
CKPT_EPOCH_FILE=".lake/build/mobilenetv2in_rmsdp64bf16_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_mnv2
# ⛔⛔ REWRITTEN 2026-09-10. The old gate was WORSE THAN ABSENT: it hardcoded the **f32** render
# path, so flipping the variant to bf16 left it passing green having validated an artifact the run
# does not execute. It asserted no variant string at all. A gate that checks the wrong arm is a
# gate that certifies the wrong run. Every assertion below names the string it is defending.
precheck_mnv2() {
  local ok=0

  # Whichever box the block above selected must actually have its plugin and its python.
  echo "box=$BOX plugin=$BOX_PLUG python=$BOX_PY"
  [ -f "$BOX_PLUG" ] || { echo "⛔ PJRT_PLUGIN not found: $BOX_PLUG"; ok=1; }
  [ -x "$BOX_PY" ] || { echo "⛔ python for the shim missing: $BOX_PY"; ok=1; }

  # ⛔ THE ARM. Both halves — the env string AND the artifact it names — or the run trains the
  # f32 twin for 350 epochs and produces a result §6 cannot pair against its bf16 reference.
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_VARIANT=rmsdp64bf16' || {
    echo "⛔ LEAN_MLIR_VARIANT is not rmsdp64bf16 — see the note in ENV_EXTRA."; ok=1; }
  [ -f verified_mlir/mobilenetv2in_rmsdp64bf16_train_step.mlir ] || {
    echo "⛔ missing the bf16 4-replica render (mobilenetv2in_rmsdp64bf16_train_step.mlir)"; ok=1; }
  # ⚠ And the checkpoint path has to have moved with it, or supervise.sh reads epoch 0 forever.
  case "$CKPT_EPOCH_FILE" in
    *mobilenetv2in_rmsdp64bf16_ckpt_xla.bin.epoch) ;;
    *) echo "⛔ CKPT_EPOCH_FILE does not match LEAN_MLIR_VARIANT: $CKPT_EPOCH_FILE"; ok=1 ;;
  esac

  # ⛔ The shim this run streams is a GENERATED artifact in gitignored .lake/build, and a warm
  # cache serves a stale one silently. That is how THIS NET's published 350ep run got
  # labelSmoothing 0.1 three weeks after its source said 0.0. Instant: a diff, no Lean, no GPU.
  [ -f jax/.lake/build/generated_mobilenet_v2_imagenet_shim.py ] || {
    echo "⛔ missing MobileNetV2's OWN tfds shim — scripts/gen_shims.sh"; ok=1; }
  scripts/regen_jax_generated.sh box >/dev/null 2>&1 || {
    echo "⛔ this box's jax/.lake/build artifacts are STALE vs committed jax/generated/:"
    scripts/regen_jax_generated.sh box 2>&1 | grep -E 'STALE|not built' | sed 's/^/   /'
    echo "   Re-emit before trusting a run off them (scripts/regen_jax_generated.sh)."; ok=1; }
  grep -q 'antialias' jax/.lake/build/generated_mobilenet_v2_imagenet_shim.py 2>/dev/null || {
    echo "⛔ the MNv2 shim has no antialiased resize — it predates C3. Run scripts/gen_shims.sh."; ok=1; }

  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "⛔ PJRT_FFI_RESIDENT=1 is missing from ENV_EXTRA — opt-in, defaults OFF, silent."; ok=1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'SHIM_WORKERS=4' || {
    echo "SHIM_WORKERS=4 is missing — see the measured sweep in ENV_EXTRA."; ok=1; }

  # ⚠ Checkpoints are per-VARIANT and outlive the artifact they trained on. An f32 rmsdp64 blob
  # is a different byte layout; resuming one into the bf16 run is not a resume, it is a corruption.
  local stray; stray="$(ls .lake/build/mobilenetv2in_*_ckpt_xla.bin 2>/dev/null \
    | grep -v 'mobilenetv2in_rmsdp64bf16_ckpt_xla.bin' || true)"
  if [ -n "$stray" ]; then
    echo "⚠ other mobilenetv2in checkpoints present — they must NOT be resumed into this run:"
    printf '   %s\n' $stray
  fi
  if [ -f "$CKPT_EPOCH_FILE" ]; then
    echo "⚠ $CKPT_EPOCH_FILE exists — this run will RESUME from it, not start fresh."
  fi

  # ⚠⚠ A stale GPU process fakes OOM and NCCL errors on this box.
  local busy; busy="$(nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader 2>/dev/null)"
  if [ -n "$busy" ]; then
    echo "⛔ GPUs are not idle — a leftover process will fake an OOM at step 0:"
    echo "$busy" | sed 's/^/   /'; ok=1
  fi

  return $ok
}
