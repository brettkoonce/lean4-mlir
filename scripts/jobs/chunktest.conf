# Engine self-test for OVERNIGHT CHUNKS (START_AT / STOP_AT): no GPU, no trainer. A fake job that
# lands one epoch every 4 s and never crashes, so only the chunk window can stop it.
#
#     RESET=1 START_AT="now + 5 sec" STOP_AT="now + 25 sec" scripts/supervise.sh chunktest
#         # expect: waits ~5 s, times epochs at ~4 s, "⏸ ... stopping on the boundary" near epoch 4
#         # with no hard stop, then "⏸ CHUNK DONE"
#     STOP_AT="now + 13 sec" scripts/supervise.sh chunktest
#         # expect: resumes from that epoch (no RESET), stops again two or three epochs on
#     EPOCH_SECS=60 STOP_AT="now + 30 sec" scripts/supervise.sh chunktest
#         # expect: a 60 s estimate does not fit, so CHUNK DONE before any launch
#
# ⚠ Relative STOP_AT/START_AT values are read once, at launch. PRECHECK clears the fake epoch file
#   only under RESET=1: the resume across chunks is the thing under test.
RUNDIR="${RUNDIR:-/tmp/supervise_chunktest}"
DEVS="0"
EPOCHS=10
EPF="/tmp/supervise_chunktest/epoch"
CMD=(bash -c 'mkdir -p /tmp/supervise_chunktest
              n=$(cat /tmp/supervise_chunktest/epoch 2>/dev/null || echo 0)
              echo "fake trainer: starting from epoch $n"
              while [ "$n" -lt 10 ]; do sleep 4; n=$((n+1)); echo "$n" > /tmp/supervise_chunktest/epoch
                echo "fake trainer: epoch $n"; done')
STALL_SECS=0
POLL_SECS=1
MAX_ATTEMPTS=4
epoch_now() { [ -f "$EPF" ] || { echo 0; return; }; local n; n="$(tr -cd '0-9' < "$EPF")"; echo "${n:-0}"; }
chunktest_reset() { [ "${RESET:-0}" = 1 ] && rm -f "$EPF"; return 0; }
PRECHECK=chunktest_reset
