# ResNet-50 RSB-A2 / ImageNet-1k, JAX REFERENCE path, the `a2-accum` recipe (300 epochs), 4 GPUs.
#
#     setsid nohup scripts/supervise.sh r50-a2accum-jax-4gpu >/dev/null 2>&1 &
#
# Recipe = `resnet50ImagenetConfigA2Accum`, RSB Table 2's A2: LAMB 5e-3 at an effective 2048
# (512 × accum 4), wd 0.02 off norm/bias, 5 warmup epochs + cosine, BCE with the 0.2 target
# threshold, mixup 0.1 / cutmix 1.0, RandAugment m7 mstd0.5 inc1, repeated augmentation ×3,
# drop-path 0.05, no EMA, eval at 224 / 0.95, bf16. The clip is timm LAMB's own max_grad_norm 1.0.
# Not `default`: that is bs512 at a linearly scaled LR, the regime that starved A3's LAMB.
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo.
RECIPE=a2accum    # the driver's `a2-accum`; a job-name field cannot hold a dash
DEVS="0,1,2,3"
EPOCHS=300
CKPT_BASE=/home/skoonce/r50_a2_300ep/resnet50_imagenet_a2accum
PY_REL=.lake/build/generated_resnet50_imagenet_a2accum.py    # relative to jax/
# Compute-only probe on 4x 4060 Ti (runs/2026-08-27-jax-sb-tier-step-probe): 1368 ms per
# optimizer step, ~14.3 min/epoch, ~71 h for 300 ep before feed stalls. The chunk planner
# replaces EPOCH_SECS with the longest epoch it times itself.
EPOCH_SECS=960
ETA="~76 h for 300 ep on 4x 4060 Ti (1,467 ms per optimizer step, flat; measured 2026-10-05, runs/2026-10-04-dimm-fan-thermal)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_r50_a2_jax
precheck_r50_a2_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  . scripts/lib/precheck.sh; pc_crop "jax/$PY_REL" torchvision random || ok=1   # train crop + resize kernel
  pc_jax_trainer || ok=1
  pc_aug_call "jax/$PY_REL" '_randaugment(img, 2, 7.000000, 0.500000)' "RSB RandAugment m7 mstd0.5" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "RSB is RandAugment only" || ok=1
  grep -q 'tgt = (tgt > 0.200000)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no BCE target threshold — re-emit (a2-accum sets bceTargetThresh 0.2)"; ok=1; }
  grep -q '^GRAD_ACCUM = 4$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not the 512 × 4 accumulation trainer"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
