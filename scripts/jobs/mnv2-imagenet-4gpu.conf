# MobileNetV2 / ImageNet-1k, VERIFIED path (Lean → StableHLO → XLA/PJRT), 4-GPU data-parallel.
#
#     scripts/supervise.sh mnv2-imagenet-4gpu
#
# 4 replicas x bs 64 = global batch 256, 5,004 steps/epoch.
#
# ⭐ MEASURED 2026-08-05, this shape, residency + prefetch:
#
#       SHIM_WORKERS=1     201 ms/step      ← KEEP
#       SHIM_WORKERS=4     208 ms/step      ← measurably WORSE
#       LEAN_MLIR_BENCH_SYNTH (no data)  152 ms/step   — the compute-only floor
#
#   16.8 min/epoch ⇒ 300 ep ≈ 83.8 h, 350 ep ≈ 97.8 h.
#
# ▶ THIS IS THE NET THAT DOES **NOT** WANT MORE PRODUCERS, and that is the measurement rather than
#   an omission. MobileNetV2's shim does flip only — no AutoAugment, no RandAugment, no erasing —
#   so one producer already outruns the step, and the depth-1 prefetch hides the read behind the
#   152 ms of compute with room to spare. Extra workers only add contention for the same cores.
#   ⚠ Do NOT copy EfficientNet's `SHIM_WORKERS=8` here on the assumption that more is free. The
#   knob is per-net because the AUGMENTATION is per-net, and the split across the five nets is
#   exactly light-shim (R34, mnv2) against heavy-shim (enet, convnextin, vitin).

DEVS="0,2,3,4"          # the AER-clean four; idx 1 and 5 are excluded (reference_ares_pcie_aer)
EPOCHS=300              # mobilenetv2ImagenetConfig.epochs — the reference's schedule length

CMD=(.lake/build/bin/mobilenetv2-imagenet-verified-xla data)

ENV_EXTRA=(
  PJRT_PLUGIN=".venv/lib/python3.12/site-packages/jax_plugins/xla_cuda12/xla_cuda_plugin.so"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  LEAN_MLIR_VARIANT=rmsdp64          # RMSProp + exp decay, the reference optimizer for this net
  LEAN_MLIR_BATCH=64                 # PER REPLICA
  # ⚠⚠ REQUIRED and SILENT when absent — see the R34 job's note; it cost that run 10 h.
  PJRT_FFI_RESIDENT=1
  # ⚠ Explicit at the DEFAULT, deliberately. Writing the value down is what makes "1 is correct
  # here" a decision with a measurement behind it rather than a line someone forgot to add.
  SHIM_WORKERS=1
)

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

CKPT_EPOCH_FILE=".lake/build/mobilenetv2in_rmsdp64_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_mnv2
precheck_mnv2() {
  [ -x .venv/bin/python3 ] || { echo "missing .venv/bin/python3 (the pinned env)"; return 1; }
  [ -f verified_mlir/mobilenetv2in_rmsdp64_train_step.mlir ] || {
    echo "missing the 4-replica render — build the MobileNetV2 renderer"; return 1; }
  [ -f jax/.lake/build/generated_mobilenet_v2_imagenet_shim.py ] || {
    echo "missing MobileNetV2's OWN tfds shim — scripts/gen_shims.sh"; return 1; }
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'PJRT_FFI_RESIDENT=1' || {
    echo "PJRT_FFI_RESIDENT=1 is missing from ENV_EXTRA — opt-in, defaults OFF, silent."; return 1; }
  return 0
}
