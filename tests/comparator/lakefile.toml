name = "comparator-tests"
version = "0.1.0"

# Two challenge/solution pairs, split by whether the statement mentions a
# neural network. `Challenge` imports Mathlib and nothing else; `ChallengeArch`
# imports the project because its theorems are statements *about* the nets.
[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "SolutionArch"

[[lean_lib]]
name = "ChallengeArch"

# Path-require to the parent lean4-jax project. lake picks up the
# parent's lake-manifest.json, so Mathlib version etc. stays in sync.
[[require]]
name = "lean4-jax"
path = "../.."
