name = "comparator-tests"
version = "0.1.0"

# Three challenge/solution pairs. `Challenge` imports Mathlib and nothing else;
# `ChallengeArch` imports the project because its theorems are statements *about*
# the nets; `ChallengeTier` is the generated tie / faithfulness / certificate tier.
[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "SolutionArch"

[[lean_lib]]
name = "ChallengeArch"

# The tie / faithfulness / certificate tier — generated by
# scripts/gates/gen_comparator_tier.py, see config-tier.json.
[[lean_lib]]
name = "SolutionTier"

[[lean_lib]]
name = "ChallengeTier"

# Path-require to the parent lean4-jax project. lake picks up the
# parent's lake-manifest.json, so Mathlib version etc. stays in sync.
[[require]]
name = "lean4-jax"
path = "../.."
